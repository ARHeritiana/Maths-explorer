:root, :root[data-theme="jour"]{

  --bg: #fff7ea; --surface: #ffffff; --sunken: #f6eedd;

  --shape: #e8492a; --sun: #ffbe2e; --on-sun: #2b1e3f; --figure: #f3eeff;
  --obj2: #6b4fc9; --obj3: #8a7da0;
  --pos: #0f7a6f; --pos-soft: #ddf2ee; --neg: #a4133c; --neg-soft: #fbe3ea;
  --mark: #ffbe2e;
  --c1: #2563eb; --c2: #e8710a; --c3: #0f9d58; --c4: #c2185b; --c5: #7b1fa2; --c6: #00838f; --c7: #b8860b; --c8: #d84315;   
}
:root[data-theme="nuit"]{
  color-scheme: dark;

  --line: #3a2f55; --line-strong: #8b7daa; --grid: #2a2145;
  --accent: #ff7a5c; --accent-ink: #1c1530; --accent-soft: #3d2233;
  --shape: #ff7a5c; --sun: #ffcb55; --on-sun: #1c1530; --figure: #231a3a;
  --obj2: #b9a2ff; --obj3: #8e83a8;

  --c1: #7aa2ff; --c2: #ffa94d; --c3: #5fd0a0; --c4: #ff7eb6; --c5: #c9a6ff; --c6: #4dd0e1; --c7: #ffd54f; --c8: #ff8a65;

:root{

}

}

}

@media (max-width: 560px){.activity{ padding: 14px; margin-left: -4px; margin-right: -4px; }
}

.sol-host{ margin: 10px 0 14px; }
.sol-svg{ width: 100%; height: auto; background: var(--sunken); border-radius: var(--r-sm); user-select: none; -webkit-user-select: none; }
.sol-cap{ min-height: 3.6em; margin: 10px 0; font-size: 1rem; line-height: 1.5; }
.sol-controls{ display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.sol-svg text{ font-family: var(--body); }

<script type="text/plain" data-path="js/challenges/handshakes/index.js">
// The handshakes challenge: card text, variations (checked answer, statement, written solution), original question and emblem.
// Everything else about this challenge is in this folder; registry.js lists the folders.
import { int, P } from "../common/helpers.js";
import { svg, dot } from "../common/icon.js";
import { handshakes } from "./maths.js";
export { activity } from "./activity.js";
export { diagram, scene } from "./solution.js";

export const card = {
  id: "handshakes",                 // = folder name, lower case and hyphens
  type: "play",                 // "play" (Maths récréatives) or "olympiad" (Esprit olympiade)
  title: P("Poignées de main", "Handshakes"),
  topic: P("Dénombrement", "Counting"),
  difficulty: 1,                // 1, 2 or 3
  minutes: 8,
  extension: P("Et si chacun ne serre la main qu’à ses deux voisins de table, autour d’une table ronde ?", "What if each person shakes hands only with their two neighbours at a round table?"),
};

export const variant = {
  
  params: [int("n", "Nombre de personnes", "Number of people", 3, 30, 10)],
  answer: (q) => handshakes(q.n),   // an integer >= 0, from maths.js
  prompt: (q) => P(
    `${q.n} personnes se retrouvent. Chacune serre une fois la main de chacune des autres. Combien de poignées de main sont échangées en tout ?`,
    `${q.n} people meet. Each one shakes hands once with each of the others. How many handshakes take place in all?`),
  // the written solution ("Version écrite"): plain high-school wording, no jargon, no URLs or citations
  solution: (q) => P(
    `Chaque personne serre ${q.n - 1} mains, ce qui fait ${q.n} × ${q.n - 1} = ${q.n * (q.n - 1)} mains serrées si l’on compte personne par personne. Mais chaque poignée de main relie deux personnes : elle a été comptée deux fois. Il y en a donc ${q.n * (q.n - 1)} ÷ 2 = ${handshakes(q.n)}.`,
    `Each person shakes ${q.n - 1} hands, which makes ${q.n} × ${q.n - 1} = ${q.n * (q.n - 1)} hands shaken when counted person by person. But each handshake joins two people: it has been counted twice. So there are ${q.n * (q.n - 1)} ÷ 2 = ${handshakes(q.n)}.`),
};

// The original open question (proof, strategy or construction). It never states the answer or the method.
export const original = (q) => P(
  `${q.n} personnes se serrent toutes la main deux à deux. Combien de poignées de main ? Trouve une formule valable pour n personnes et justifie-la.`,
  `${q.n} people all shake hands in pairs. How many handshakes? Find a formula valid for n people and justify it.`);

// 64 × 64 emblem for the card, in currentColor; classes ci-bob, ci-blink, ci-pulse, ci-cross animate a part.
export const icon = svg(`<circle cx="32" cy="32" r="20" stroke-opacity=".3"/>${[0, 1, 2, 3, 4].map((k) => { const a = -Math.PI / 2 + (k * 2 * Math.PI) / 5; return dot(32 + 20 * Math.cos(a), 32 + 20 * Math.sin(a), 4); }).join("")}<path d="M32 12L51 26M32 12L13 26" class="ci-blink"/>`);

<script type="text/plain" data-path="js/challenges/common/kit.js">
// Shared helpers for the challenge activities and the animated solutions.

import { knightInner } from "./knight-piece.js";
export const NS = "http://www.w3.org/2000/svg";

export const MINUS = "−";

export const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

export function svgEl(name, attrs = {}, parent) {
  const el = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.append(el);
  return el;
}

export function toLocal(svg, event) {
  const p = svg.createSVGPoint();
  p.x = event.clientX;
  p.y = event.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

// Eight colours that stay distinguishable in both themes (defined as --c1 .. --c8 in pages.css).
export const colour = (i) => `var(--c${(((i % 8) + 8) % 8) + 1})`;

// touch-action is ignored on SVG child elements, so a finger dragging a piece would scroll the page.
// Cancelling touchstart on the pieces (not on the empty board) keeps the page scrollable everywhere else.
export function lockTouch(svg, selector) {
  svg.addEventListener("touchstart", (e) => { if (e.target.closest?.(selector)) e.preventDefault(); }, { passive: false });
}

// Drawing helpers bound to an SVG element (or group) for the animated solutions; t picks the language.
export function makeCtx(svg, lang) {
  const t = (fr, en) => (lang === "fr" ? fr : en);
  const line = (x1, y1, x2, y2, attrs = {}) => svgEl("line", { x1, y1, x2, y2, ...attrs }, svg);
  const circ = (cx, cy, r, attrs = {}) => svgEl("circle", { cx, cy, r, ...attrs }, svg);
  const rect = (x, y, width, height, attrs = {}) => svgEl("rect", { x, y, width, height, ...attrs }, svg);
  const text = (x, y, s, attrs = {}) => { const el = svgEl("text", { x, y, ...attrs }, svg); el.textContent = s; return el; };
  const path = (d, attrs = {}) => svgEl("path", { d, ...attrs }, svg);
  // greedy word wrap into several <text> lines of at most `max` characters
  const wrap = (x, y, str, max, attrs = {}, dy = 17) => { const words = String(str).split(" "); let ln = "", k = 0; for (const w of words) { if ((ln + " " + w).trim().length > max) { text(x, y + k++ * dy, ln, attrs); ln = w; } else ln = (ln + " " + w).trim(); } if (ln) text(x, y + k * dy, ln, attrs); };
  // a drawn chess knight in a size x size square at (x, y)
  const knight = (x, y, size, fill = "var(--accent)") => { const g = svgEl("g", { transform: `translate(${x} ${y}) scale(${size / 64})`, fill, stroke: "var(--ink)", "stroke-width": Math.max(1.6, 90 / size), "stroke-linejoin": "round", "stroke-linecap": "round" }, svg); g.innerHTML = knightInner; return g; };
  return { svg, t, line, circ, rect, text, path, wrap, knight };
}

// The one-line goal at the top of an activity: a single sentence stating what to achieve, with no coaching, counter or result.
// `operate` is an optional bilingual pair [fr, en] of how to operate it (gestures, keys), kept for screen readers only.
export function goalLine(t, fr, en, opFr, opEn) {
  return `<p class="act-help goal">${t(fr, en)}${opFr ? `<span class="sr-only"> ${t(opFr, opEn)}</span>` : ""}</p>`;
}
</script>
<script type="text/plain" data-path="js/challenges/common/knight-piece.js">
// The chess knight silhouette (a horse's head on a base) shared by the knight's tour activity, its solution and its emblem.
// Drawn in a 64 x 64 box facing left; `knightPiece` returns SVG markup of the piece scaled into a size x size square.
export const KNIGHT_BODY = "M18 52C17 43 21 37 27 32C24 32 20 34 16 38C13 40 9 39 9 36C9 32 14 27 18 23L21 12L27 18C31 15 36 14 40 15C49 18 54 30 52 52Z";
export const KNIGHT_BASE = "M15 52h40v6H15z";
export const knightInner = '<path d="' + KNIGHT_BODY + '"/><path d="' + KNIGHT_BASE + '"/><circle cx="22" cy="27" r="1.8" fill="var(--ink)" stroke="none"/><path d="M13 36.5l3-1" fill="none"/>';
export const knightPiece = (x, y, size, fill = "var(--accent)", extra = "") => `<g transform="translate(${x} ${y}) scale(${size / 64})" fill="${fill}" stroke="var(--ink)" stroke-width="${Math.max(1.6, 64 / size * 1.4)}" stroke-linejoin="round" stroke-linecap="round" ${extra}>${knightInner}</g>`;

<script type="text/plain" data-path="js/challenges/common/scene-kit.js">
// Small kit for cartoon scenes inside the animated solutions: easing and the articulated soldier (the night landscape
// and the lantern of the bridge are in bridge/art.js).
// Everything is plain SVG built once; a scene is then posed by calling set() on its parts, so a frame is a pure function
// of the step and its progress (scrubbable, reproducible). Ambient motion (twinkling stars, water, flame) is CSS only
// and is switched off by prefers-reduced-motion (see the "scene kit" block of pages.css).
import { svgEl } from "./kit.js";

export const clamp01 = (x) => Math.min(1, Math.max(0, x));

export const lerp = (a, b, k) => a + (b - a) * k;

export const seg = (p, a, b) => clamp01((p - a) / (b - a));

export const easeInOut = (x) => { const k = clamp01(x); return k * k * (3 - 2 * k); };

export const easeOutBack = (x) => { const k = clamp01(x), c = 1.70158; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; };

export const TAU = Math.PI * 2;

export const el = (name, attrs, parent) => svgEl(name, attrs, parent);

/* ------------------------------------------------------------------ a soldier made of separate parts */
export const HATS = [
  // scout: red beret with a pom-pom
  () => `<path d="M-9 -43 Q-1 -57 9.5 -44 Q3 -46 -9 -43Z" fill="#d32f2f"/><circle cx="1" cy="-53" r="1.8" fill="#8f1b1b"/>`,
  // plain helmet with a brim
  () => `<path d="M-9 -41 A9 9 0 0 1 9 -41Z" fill="#6b7a4f"/><rect x="-11" y="-42" width="22" height="3" rx="1.5" fill="#55623e"/>`,
  // peaked cap
  () => `<path d="M-9 -41 A9 9 0 0 1 9 -41Z" fill="#35507a"/><rect x="2" y="-42" width="12" height="3" rx="1.5" fill="#22344f"/><circle cx="0" cy="-47" r="1.8" fill="#f3c84a"/>`,
  // tall fur hat with a plume, for the old sergeant
  () => `<rect x="-7.5" y="-61" width="15" height="19" rx="3" fill="#6d2c2c"/><rect x="-7.5" y="-45" width="15" height="2.6" fill="#f3c84a"/><path d="M0 -61 q-3 -9 4 -10 q1 6 -4 10Z" fill="#f1f1f1"/>`,
];

export function makeSoldier(parent, { uniform, hat = 0, size = 1, skin = "#f1c27d", moustache = false, label = "", top = 66 }) {
  const root = el("g", { class: "sd" }, parent);
  const shadow = el("ellipse", { cx: 0, cy: 0.5, rx: 11 * size, ry: 3.2, fill: "#000", opacity: 0.28 }, root);
  const flip = el("g", {}, root), bob = el("g", {}, flip);
  const dark = "#2b2538";
  const mk = (cls, x, y, body) => { const g = el("g", { class: cls, transform: `translate(${x} ${y})` }, bob); g.innerHTML = body; return g; };
  const legBody = `<rect x="-3" y="0" width="6" height="14" rx="3" fill="${dark}"/><ellipse cx="1.8" cy="15.5" rx="5.2" ry="2.6" fill="#1b1727"/>`;
  const armBody = `<rect x="-2.7" y="-1" width="5.4" height="15" rx="2.7" fill="${uniform}" stroke="#0003" stroke-width=".6"/><circle cy="14.5" r="2.7" fill="${skin}"/>`;
  const legB = mk("sd-leg", -3.5, -16, legBody);
  const armB = mk("sd-arm", -7, -30, armBody);
  const body = el("g", {}, bob);
  body.innerHTML = `<rect x="-8.5" y="-34" width="17" height="20" rx="6" fill="${uniform}" stroke="#0003" stroke-width=".7"/><rect x="-8.5" y="-22" width="17" height="3" fill="#2b2538" opacity=".55"/><circle cx="0" cy="-27" r="1.2" fill="#f3c84a"/><circle cx="0" cy="-17" r="1.2" fill="#f3c84a"/>`;
  const head = el("g", { class: "sd-head" }, bob);
  head.innerHTML = `<circle cx="0" cy="-40" r="8.2" fill="${skin}" stroke="#0002" stroke-width=".6"/><circle cx="3.2" cy="-41" r="1.15" fill="#222"/><circle cx="6.6" cy="-41" r="1.15" fill="#222"/><circle cx="8.3" cy="-38.6" r="1.7" fill="#d9a066"/><path d="M3.6 -36.2 q2.4 1.8 4.6 0" fill="none" stroke="#7a3b2a" stroke-width="1" stroke-linecap="round"/>${moustache ? `<path d="M2.5 -37.4 q3 -1.6 6 0 q-3 2.2 -6 0Z" fill="#eee"/>` : ""}${HATS[hat]()}`;
  const legF = mk("sd-leg", 3.5, -16, legBody);
  const armF = mk("sd-arm", 7, -30, armBody);
  const badge = el("g", { visibility: label === "" ? "hidden" : "visible" }, root);
  el("circle", { r: 9, fill: "#fff", stroke: uniform, "stroke-width": 2.4 }, badge);
  const txt = el("text", { y: 4.4, "text-anchor": "middle", style: "font:700 12px var(--math, serif);fill:#1a1a2e" }, badge);
  txt.textContent = label;

  return {
    root,
    // Pose the character. phase: walk cycle in turns; amp: stride size (0 = standing); carry: lantern arm raised;
    // cheer 0..1: both arms up; hop: height of a jump; scale: pop-in factor (0 hides it).
    set({ x, y, dir = 1, phase = 0, amp = 0, carry = false, cheer = 0, hop = 0, scale = 1 }) {
      root.setAttribute("visibility", scale <= 0.01 ? "hidden" : "visible");
      root.setAttribute("transform", `translate(${x.toFixed(2)} ${(y - hop).toFixed(2)})`);
      shadow.setAttribute("rx", (11 * size * (1 - Math.min(0.5, hop / 50))).toFixed(2));
      shadow.setAttribute("transform", `translate(0 ${hop.toFixed(2)})`);
      flip.setAttribute("transform", `scale(${(dir * size * scale).toFixed(3)} ${(size * scale).toFixed(3)})`);
      const s = Math.sin(phase * TAU), c = Math.abs(Math.cos(phase * TAU)), a = amp;
      bob.setAttribute("transform", `translate(0 ${(-a * 2.3 * c).toFixed(2)}) rotate(${(a * 3.2).toFixed(2)})`);
      legF.setAttribute("transform", `translate(3.5 -16) rotate(${(32 * a * s).toFixed(2)})`);
      legB.setAttribute("transform", `translate(-3.5 -16) rotate(${(-32 * a * s).toFixed(2)})`);
      const wave = Math.sin(phase * TAU * 2);
      armF.setAttribute("transform", `translate(7 -30) rotate(${(carry ? -66 + 4 * s : cheer ? lerp(0, -150 + 10 * wave, cheer) : -28 * a * s - 2).toFixed(2)})`);
      armB.setAttribute("transform", `translate(-7 -30) rotate(${(cheer ? lerp(0, 150 - 10 * wave, cheer) : 28 * a * s + 3).toFixed(2)})`);
      badge.setAttribute("transform", `translate(0 ${(-(top * size * scale) - a * 2).toFixed(2)}) scale(${Math.min(1, scale).toFixed(3)})`);
      root.classList.toggle("sd-idle", a === 0 && !cheer);
    },
    // Where the carried lantern hangs, in the scene's coordinates.
    hand({ x, y, dir = 1, scale = 1 }) { return [x + dir * size * scale * 19.5, y - size * scale * 24]; },
  };
}
</script>
<script type="text/plain" data-path="js/challenges/common/icon.js">
// Building blocks of the challenge emblems (challenge-icons): an SVG frame drawn in currentColor, a soft fill and a dot.

export const svg = (body) => `<svg class="ci" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>`;

export const soft = 'fill="currentColor" fill-opacity=".22"';

export const dot = (x, y, r = 3.4, cls = "") => `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;

<script type="text/plain" data-path="js/challenges/handshakes/maths.js">
// Pure mathematics of the handshakes challenge (no DOM), checked by an independent method in tests/handshakes.test.mjs.

// Number of handshakes among n people: n(n - 1) / 2.
export const handshakes = (n) => (n * (n - 1)) / 2;

// Points of the n people on a circle of radius r centred at (cx, cy), first one at the top.
export const seats = (n, cx, cy, r) => Array.from({ length: n }, (_, k) => { const a = -Math.PI / 2 + (2 * Math.PI * k) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });

// Key of an unordered pair, so that (i, j) and (j, i) are the same handshake.
export const pairKey = (i, j) => (i < j ? `${i}-${j}` : `${j}-${i}`);
</script>
<script type="text/plain" data-path="js/challenges/handshakes/activity.js">
// Hands-on activity of the handshakes challenge: the learner tries, fails and notices; it never states the answer or the method.
// Contract: activity(root, { t, q, reduced, lang }) draws into root and returns a cleanup function.
// The world is the solution's world (plan.js, common/person.js): same room, same table, same people, so the solution feels familiar.
// The people are alive: they breathe, blink, look at whoever is chosen, wave when picked, and shake hands with a hop.
import { colour, svgEl, goalLine } from "../common/kit.js";
import { PRESS, installCartoon } from "../common/cartoon.js";
import { pairKey, handshakes } from "./maths.js";
import { makePerson, posePerson } from "../common/person.js";
import { makeBubble, poseBubble } from "../common/bubble.js";
import { layout, handAt, aimAt } from "./plan.js";

const ROOM = { cx: 170, cy: 172, rx: 134, ry: 90 }, SHAKE = 900;   // SHAKE: length of a handshake, in ms

export function activity(root, { t, q, reduced: reducedPref }) {
  installCartoon();
  const reduced = () => (typeof reducedPref === "function" ? !!reducedPref() : !!reducedPref);
  const n = q.n, L = layout(n, ROOM), S = L.seats, size = L.size, T = L.table, done = new Set();
  let sel = null, shake = null, raf = 0;   // shake: { i, j, start }
  root.innerHTML = `
    ${goalLine(t, "Fais serrer la main à tout le monde.", "Get everyone to shake hands.", "Touche une personne puis une autre pour qu’elles se serrent la main.", "Tap one person then another to make them shake hands.")}
    <svg class="act-svg" viewBox="0 0 340 300" role="group" aria-label="${t("Personnes autour d’une table", "People around a table")}"></svg>
    <div class="act-controls"><button class="btn-quiet ${PRESS}" type="button" data-a="reset">${t("Recommencer", "Restart")}</button></div>
    <p class="act-readout" role="status" aria-live="polite"></p>`;
  const svg = root.querySelector("svg"), read = root.querySelector(".act-readout");
  // the scene is built once; frames only pose it
  svgEl("ellipse", { cx: ROOM.cx, cy: ROOM.cy + 4, rx: ROOM.rx + 26, ry: ROOM.ry + 22, fill: "color-mix(in srgb, var(--accent) 9%, transparent)" }, svg);
  const back = svgEl("g", {}, svg);
  svgEl("rect", { x: T.cx - 6, y: T.cy, width: 12, height: 28, fill: "#8d5f2d", stroke: "var(--ink)", "stroke-width": 1.2 }, svg);
  svgEl("ellipse", { cx: T.cx, cy: T.cy, rx: T.rx, ry: T.ry, fill: "#c58b52", stroke: "var(--ink)", "stroke-width": 1.6 }, svg);
  const lines = svgEl("g", { opacity: 0.75 }, svg), front = svgEl("g", {}, svg), over = svgEl("g", {}, svg);
  const handles = [], people = S.map(([x, y], i) => {
    const h = svgEl("g", { class: "toy-handle", tabindex: 0, role: "button", "data-i": i, "aria-label": `${t("Personne", "Person")} ${i + 1}` }, y < T.cy ? back : front);
    svgEl("ellipse", { class: "hit", cx: x, cy: y - 30 * size, rx: 16 * size, ry: 36 * size }, h);
    handles.push(h);
    return makePerson(h, { fill: `color-mix(in srgb, ${colour(i)} 70%, var(--surface))`, look: i, size });
  });
  const ring = svgEl("ellipse", { rx: 15 * size, ry: 4.5 * size, fill: "none", stroke: "var(--ink)", "stroke-width": 1.4, "stroke-dasharray": "3 3", opacity: 0 }, over);
  const hello = makeBubble(over);
  const centre = [ROOM.cx, ROOM.cy - 30];
  function drawLines() {
    lines.replaceChildren();
    for (const key of done) { const [i, j] = key.split("-").map(Number), a = handAt(S[i], size), b = handAt(S[j], size); svgEl("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "var(--accent)", "stroke-width": 1.6, "stroke-linecap": "round" }, lines); }
    read.textContent = done.size === handshakes(n) ? t("Tout le monde s’est serré la main.", "Everyone has shaken hands.") : "";   // neutral end message, no running count
  }
  // one frame, a function of the clock time `now` (ms) and the current state
  function frame(now) {
    const sec = reduced() ? 0 : now / 1000, k = shake ? Math.min(1, (now - shake.start) / SHAKE) : 0;
    S.forEach((at, i) => {
      const focus = shake ? (i === shake.i ? S[shake.j] : i === shake.j ? S[shake.i] : S[shake.i]) : sel !== null && sel !== i ? S[sel] : centre;
      const aim = aimAt(at, focus === centre ? centre : handAt(focus, size), size);
      const pose = { x: at[0], y: at[1], facing: aim.facing, gaze: [Math.sign(focus[0] - at[0]) || 0, focus[1] < at[1] ? -0.3 : 0.3], breathe: 2.2 * sec + i, blink: ((sec + i * 0.37) % 3.7) < 0.12 ? 1 : 0, mood: "smile" };
      if (sel === i) Object.assign(pose, { wave: reduced() ? 0 : (sec % 1.6) / 1.6, mood: "grin" });
      if (shake && (i === shake.i || i === shake.j)) {
        const grip = Math.min(1, k * 3) * (1 - Math.max(0, (k - 0.85) / 0.15));
        Object.assign(pose, { reach: grip, reachAngle: aim.angle, hop: Math.max(0, Math.min(1, (k - 0.35) / 0.35)), mood: k > 0.25 ? "grin" : "o" });
      }
      posePerson(people[i], pose);
      handles[i].setAttribute("aria-pressed", String(sel === i));
    });
    ring.setAttribute("opacity", sel === null ? 0 : 0.8);
    if (sel !== null) { ring.setAttribute("cx", S[sel][0]); ring.setAttribute("cy", S[sel][1]); }
    const b = shake ? handAt(S[shake.i], size) : [0, 0];
    poseBubble(hello, { x: b[0] + 4, y: Math.max(36, b[1] - 34 * size),   // never above the frame
      text: t("Enchanté !", "Nice to meet you!"), appear: shake ? Math.min(1, k * 4) * (1 - Math.max(0, (k - 0.8) / 0.2)) : 0 });
    if (shake && k >= 1) shake = null;
  }
  const loop = (now) => { frame(now); raf = reduced() ? 0 : requestAnimationFrame(loop); };
  const kick = () => { if (reduced()) { shake = null; frame(0); } else if (!raf) raf = requestAnimationFrame(loop); };
  const pick = (i) => {
    if (sel === null || sel === i) { sel = sel === i ? null : i; kick(); return; }
    done.add(pairKey(sel, i)); drawLines();
    shake = { i: sel, j: i, start: performance.now() }; sel = null; kick();
  };
  svg.addEventListener("click", (e) => { const g = e.target.closest(".toy-handle"); if (g) pick(Number(g.dataset.i)); });
  svg.addEventListener("keydown", (e) => { const g = e.target.closest?.(".toy-handle"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(Number(g.dataset.i)); } });
  root.querySelector('[data-a="reset"]').addEventListener("click", () => { done.clear(); sel = null; shake = null; drawLines(); kick(); });
  drawLines(); frame(0); kick();
  return () => { cancelAnimationFrame(raf); raf = 0; };   // the idle loop must stop when the activity is unmounted
}
</script>
<script type="text/plain" data-path="js/challenges/common/cartoon.js">
// Shared cartoon press feedback: a control squashes when pressed and pops when released. Hoisted from nails/activity.js so
// every challenge (and the shared page layer around it) can reuse it. `installCartoon()` injects the style once;
// `PRESS` is the class name to put on a control; `pop(el, reduced)` replays the pop; `cartoonPress(root, reduced)` marks the
// buttons under `root` and pops them on click. `reduced` is a boolean or a function returning one (prefers-reduced-motion
// is also honoured by the stylesheet itself).
export const PRESS = "cartoon-press";
const EASE = "cubic-bezier(.3,1.9,.5,1)";
export const CARTOON_CSS = `
.${PRESS}{transition:transform .22s ${EASE}}
.${PRESS}:active{transform:scale(.88,.8)}
.${PRESS}.is-pop{animation:cartoon-pop .35s ${EASE}}
@keyframes cartoon-pop{0%{transform:scale(1)}35%{transform:scale(.86,.78)}70%{transform:scale(1.08,1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.${PRESS}{transition:none}.${PRESS}:active{transform:none}.${PRESS}.is-pop{animation:none}}`;

export function installCartoon(doc = typeof document === "undefined" ? null : document) {
  if (!doc || doc.getElementById("cartoon-style")) return;
  const style = doc.createElement("style");
  style.id = "cartoon-style";
  style.textContent = CARTOON_CSS;
  doc.head.append(style);
}

const isReduced = (r) => (typeof r === "function" ? !!r() : !!r);

export function pop(el, reduced) {
  el.classList.remove("is-pop");
  if (isReduced(reduced)) return;
  void el.offsetWidth;
  el.classList.add("is-pop");
}

// Mark every button under root (or matching `selector`) with the press class and pop it on click; returns a cleanup function.
export function cartoonPress(root, reduced, selector = "button") {
  installCartoon();
  const mark = () => root.querySelectorAll(selector).forEach((b) => b.classList.add(PRESS));
  mark();
  const onClick = (e) => { const b = e.target.closest?.(selector); if (b && root.contains(b) && !b.disabled) pop(b, reduced); };
  root.addEventListener("click", onClick);
  return () => root.removeEventListener("click", onClick);
}
</script>
<script type="text/plain" data-path="js/challenges/common/person.js">
// Shared cartoon person for the challenges (handshakes, hiker, ...): built once with makePerson, posed every frame
// with posePerson. Every pose is a pure function of its arguments, so an animated solution stays pure.
// Speech bubbles are in bubble.js.
import { svgEl } from "./kit.js";

// Material colours are the person's own (skin, hair, trousers, shoes), not the theme's; outlines follow var(--ink).
export const SKINS = ["#f2c9a0", "#e0ac7e", "#c68b59", "#8d5a3b", "#f6d7bd", "#b97a50"];
export const HAIRS = ["#3b2a20", "#7a4a24", "#d9a441", "#1d1d1d", "#a0522d", "#5a5a5a"];
const TROUSERS = "#3d4b6b", SHOES = "#3b2a20", INK = "var(--ink)";

// One person, about 66 units tall, feet at (0, 0), facing +x. `look` picks the outfit: skin, hair, accessory.
// gear: "hiker" adds a backpack and a sun hat (and drops the look's accessory).
export function makePerson(parent, { fill, look = 0, size = 1, gear = null }) {
  const skin = SKINS[look % SKINS.length], hair = HAIRS[(look * 5 + 1) % HAIRS.length], extra = gear ? 0 : look % 4;   // 0 none, 1 cap, 2 glasses, 3 bow
  const g = (p, attrs = {}) => svgEl("g", attrs, p);
  const root = g(parent);
  const shadow = svgEl("ellipse", { cx: 0, cy: 0, rx: 14, ry: 3.4, fill: INK, opacity: 0.16 }, root);
  const fig = g(root), flip = g(fig);
  // a limb: two segments, each a <g> turning about its joint, drawn as an outlined capsule
  const limb = (p, x, y, len, colour, width, endPart) => {
    const upper = g(p), lower = g(upper);
    const seg = (q, x0) => { svgEl("line", { x1: x0, y1: y, x2: x0 + len, y2: y, stroke: INK, "stroke-width": width + 2, "stroke-linecap": "round" }, q); svgEl("line", { x1: x0, y1: y, x2: x0 + len, y2: y, stroke: colour, "stroke-width": width, "stroke-linecap": "round" }, q); };
    seg(upper, x); seg(lower, x + len); endPart(lower, x + 2 * len, y);
    return { upper, lower, x, y, len };
  };
  const hand = (q, x, y) => svgEl("circle", { cx: x, cy: y, r: 2.7, fill: skin, stroke: INK, "stroke-width": 1 }, q);
  // the shin points down when posed, so the shoe is long along the local -y axis (world forward)
  const shoe = (q, x, y) => svgEl("ellipse", { cx: x + 1.2, cy: y - 1.6, rx: 2.3, ry: 3.6, fill: SHOES, stroke: INK, "stroke-width": 1 }, q);
  const shade = `color-mix(in srgb, ${fill} 75%, #000)`;
  const backArm = limb(flip, -3, -41, 9, shade, 4.4, hand);
  const backLeg = limb(flip, -2, -21, 10, `color-mix(in srgb, ${TROUSERS} 80%, #000)`, 5, shoe);
  const frontLeg = limb(flip, 2, -21, 10, TROUSERS, 5, shoe);
  const body = g(flip);   // torso and head breathe together
  if (gear === "hiker") {   // backpack behind the torso, with a rolled mat on top
    svgEl("rect", { x: -15, y: -43, width: 9, height: 20, rx: 3, fill: "#7a5230", stroke: INK, "stroke-width": 1.3 }, body);
    svgEl("rect", { x: -14, y: -35, width: 7, height: 6, rx: 1.5, fill: "#5e3d22", stroke: INK, "stroke-width": 0.8 }, body);
    svgEl("rect", { x: -16.5, y: -47, width: 12, height: 4.6, rx: 2.3, fill: "#c0392b", stroke: INK, "stroke-width": 1 }, body);
  }
  svgEl("path", { d: "M-9 -19 Q-10.5 -37 -6.5 -43 Q0 -46.5 6.5 -43 Q10.5 -37 9 -19 Z", fill, stroke: INK, "stroke-width": 1.4, "stroke-linejoin": "round" }, body);
  svgEl("path", { d: "M-9 -19 Q-10.5 -37 -6.5 -43 Q-4 -44.6 -2 -45 Q-5 -33 -3 -19 Z", fill: shade, opacity: 0.55 }, body);   // shade on the back
  svgEl("path", { d: "M-3 -44.5 L0.5 -40.5 L4 -44.5", fill: "none", stroke: INK, "stroke-width": 1, "stroke-linejoin": "round" }, body);   // collar
  svgEl("rect", { x: -9.2, y: -22, width: 18.4, height: 3.2, rx: 1.2, fill: "#5b3a29", stroke: INK, "stroke-width": 0.8 }, body);   // belt
  svgEl("rect", { x: -2.2, y: -49, width: 5, height: 6, fill: skin, stroke: INK, "stroke-width": 1 }, body);   // neck
  const head = g(body);
  svgEl("circle", { cx: 1, cy: -56, r: 9.6, fill: skin, stroke: INK, "stroke-width": 1.4 }, head);
  svgEl("path", { d: "M-8.6 -55 Q-10 -67 1.5 -66.4 Q11.2 -66 10.8 -57.5 Q7 -62.5 2.5 -60.6 Q-1.5 -62.4 -3.6 -58 Q-6 -55.6 -8.6 -55 Z", fill: hair, stroke: INK, "stroke-width": 1.2, "stroke-linejoin": "round" }, head);
  svgEl("ellipse", { cx: -3.4, cy: -54.5, rx: 2, ry: 2.8, fill: skin, stroke: INK, "stroke-width": 1 }, head);   // ear
  svgEl("circle", { cx: 6.8, cy: -51.8, r: 1.9, fill: "#ff7b7b", opacity: 0.4 }, head);   // cheek
  svgEl("path", { d: "M9.6 -55 q2.4 1.6 0.2 3", fill: "none", stroke: INK, "stroke-width": 1, "stroke-linecap": "round" }, head);   // nose
  const eye = (cx, rx) => {
    const e = g(head);
    svgEl("ellipse", { cx, cy: -57, rx, ry: 2.9, fill: "#fff", stroke: INK, "stroke-width": 0.8 }, e);
    const pupil = svgEl("circle", { cx, cy: -57, r: 1.35, fill: "#1d1d1d" }, e);
    return { e, pupil, cx };
  };
  const eyes = [eye(1.6, 1.9), eye(6.2, 2.4)];
  const brows = svgEl("path", { fill: "none", stroke: INK, "stroke-width": 1.1, "stroke-linecap": "round" }, head);
  const mouth = svgEl("path", { stroke: INK, "stroke-width": 1, "stroke-linecap": "round", "stroke-linejoin": "round" }, head);
  if (gear === "hiker") svgEl("path", { d: "M-12 -61.5 Q-11 -60 1 -60.4 Q13 -60 14.5 -61.5 Q12 -63.5 9 -63.4 Q8.5 -70.5 1 -70.6 Q-6.5 -70.5 -7 -63.4 Q-10 -63.5 -12 -61.5 Z", fill: "#d4b26a", stroke: INK, "stroke-width": 1.2, "stroke-linejoin": "round" }, head);
  if (gear === "hiker") svgEl("path", { d: "M-6.8 -64 Q1 -65.6 8.8 -64", fill: "none", stroke: "#8b2c1f", "stroke-width": 1.6 }, head);
  if (extra === 1) svgEl("path", { d: "M-8.8 -60 Q-8 -69 2 -68.5 Q10.5 -68 10.5 -61 L16 -60.4 Q15 -58.6 10 -59.2 Z", fill: `color-mix(in srgb, ${fill} 60%, #fff)`, stroke: INK, "stroke-width": 1.1, "stroke-linejoin": "round" }, head);
  if (extra === 2) svgEl("path", { d: "M-0.6 -57 a2.5 2.5 0 1 0 5 0 a2.5 2.5 0 1 0 -5 0 M4.4 -57 h0.8 M5.2 -57 a2.8 2.8 0 1 0 5.6 0 a2.8 2.8 0 1 0 -5.6 0", fill: "none", stroke: INK, "stroke-width": 1 }, head);
  if (extra === 3) svgEl("path", { d: "M-6 -64 l-3.5 -3 v6 Z M-6 -64 l3.5 -3 v6 Z", fill: "#e2557a", stroke: INK, "stroke-width": 0.9, "stroke-linejoin": "round" }, head);
  const frontArm = limb(flip, 3, -41, 9, fill, 4.6, hand);
  return { root, shadow, fig, flip, body, head, eyes, brows, mouth, backArm, frontArm, backLeg, frontLeg, size };
}

const turn = (part, deg, x, y) => part.setAttribute("transform", `rotate(${deg.toFixed(1)} ${x} ${y})`);
const lerp = (a, b, k) => a + (b - a) * k;
const MOUTHS = {
  smile: ["M3.2 -51.2 q2.6 2.2 5.2 0", "none"],
  grin: ["M2.8 -51.6 q3 4.6 6 0 Z", "#7a2e2e"],
  o: ["M5.6 -51.6 a1.5 1.9 0 1 0 0.01 0 Z", "#7a2e2e"],
  flat: ["M3.4 -50.6 h4.6", "none"],
};

// Pose a person. All arguments are plain numbers, so a frame depends only on them:
//   x, y: feet; facing: 1 right, -1 left; gaze: [dx, dy] in -1..1 (where the pupils look, in screen directions);
//   walk: { phase, amp } (phase from distance walked, amp 0..1); reach: 0..1 front arm out to `reachAngle` (degrees,
//   0 = straight ahead, negative = up); wave: 0..1; hop: 0..1; breathe: phase in radians; blink: 0..1; mood: smile, grin, o, flat.
export function posePerson(P, { x, y, facing = 1, gaze = [0, 0], walk = { phase: 0, amp: 0 }, reach = 0, reachAngle = 0, wave = 0, hop = 0, breathe = 0, blink = 0, mood = "smile" }) {
  const lift = 5 * Math.sin(Math.PI * Math.min(1, Math.max(0, hop)));
  P.root.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${P.size})`);
  P.shadow.setAttribute("rx", (14 - lift * 1.2).toFixed(1));
  P.fig.setAttribute("transform", `translate(0 ${(-lift).toFixed(2)})`);
  P.flip.setAttribute("transform", facing < 0 ? "scale(-1 1)" : "");
  P.body.setAttribute("transform", `translate(0 ${(0.6 * Math.sin(breathe)).toFixed(2)})`);
  // legs swing in opposite phase with a knee bend on the way forward; arms counter-swing
  const s = Math.sin(walk.phase) * walk.amp;
  const leg = (L, sign) => { turn(L.upper, 90 + 24 * s * sign, L.x, L.y); turn(L.lower, Math.max(0, 30 * Math.sin(walk.phase + (sign > 0 ? 0 : Math.PI))) * walk.amp, L.x + L.len, L.y); };
  leg(P.frontLeg, 1); leg(P.backLeg, -1);
  turn(P.backArm.upper, 88 + 20 * s, P.backArm.x, P.backArm.y); turn(P.backArm.lower, -14, P.backArm.x + P.backArm.len, P.backArm.y);
  // front arm: hanging (88 deg), swinging, reaching out, or waving above the head
  const hang = 88 - 20 * s, out = reachAngle, up = -70 + 18 * Math.sin(wave * Math.PI * 6);
  const shoulder = wave > 0 ? lerp(hang, up, Math.min(1, wave * 4)) : lerp(hang, out, reach);
  turn(P.frontArm.upper, shoulder, P.frontArm.x, P.frontArm.y);
  turn(P.frontArm.lower, wave > 0 ? -40 : lerp(-16, 0, reach), P.frontArm.x + P.frontArm.len, P.frontArm.y);
  // eyes: pupils follow the gaze (mirrored with the body), lids close with blink
  const gx = Math.max(-1, Math.min(1, gaze[0])) * facing, gy = Math.max(-1, Math.min(1, gaze[1]));
  for (const E of P.eyes) {
    E.pupil.setAttribute("cx", (E.cx + 0.9 * gx).toFixed(2)); E.pupil.setAttribute("cy", (-57 + 1.1 * gy).toFixed(2));
    E.e.setAttribute("transform", `translate(0 -57) scale(1 ${(1 - 0.92 * Math.min(1, blink)).toFixed(2)}) translate(0 57)`);
  }
  const raised = mood === "o" || mood === "grin" ? -1.4 : 0;
  P.brows.setAttribute("d", `M0 ${-61.2 + raised} q1.6 -1 3.2 0 M5 ${-61.6 + raised} q1.8 -1.1 3.6 0`);
  const [d, f] = MOUTHS[mood] || MOUTHS.smile;
  P.mouth.setAttribute("d", d); P.mouth.setAttribute("fill", f);
}
</script>
<script type="text/plain" data-path="js/challenges/common/bubble.js">
// Shared speech bubble for the challenges: makeBubble once, then poseBubble every frame (pops in with an overshoot).
import { svgEl } from "./kit.js";
const INK = "var(--ink)";

// A speech bubble with a tail, anchored by its tail tip.
export function makeBubble(parent) {
  const root = svgEl("g", { "pointer-events": "none" }, parent);
  const box = svgEl("path", { fill: "var(--surface)", stroke: INK, "stroke-width": 1.3, "stroke-linejoin": "round" }, root);
  const text = svgEl("text", { "text-anchor": "middle", "font-size": 11, "font-weight": 700, fill: INK }, root);
  return { root, box, text };
}

// Pose a bubble: tail tip at (x, y), text, appear 0..1 (pops in with a small overshoot).
export function poseBubble(B, { x, y, text, appear = 1 }) {
  const k = Math.max(0, Math.min(1, appear)), pop = k <= 0 ? 0 : 1 + 0.15 * Math.sin(Math.PI * k) * (1 - k);
  B.root.setAttribute("opacity", k.toFixed(2));
  B.root.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${pop.toFixed(3)})`);
  const w = Math.max(40, text.length * 6.4 + 14), h = 20, top = -7 - h, L = -w / 2, R = w / 2, B0 = top + h;   // tail tip at (0, 0)
  B.box.setAttribute("d", `M${L + 8} ${top} H${R - 8} Q${R} ${top} ${R} ${top + 8} V${B0 - 8} Q${R} ${B0} ${R - 8} ${B0} H6 L0 0 L-2 ${B0} H${L + 8} Q${L} ${B0} ${L} ${B0 - 8} V${top + 8} Q${L} ${top} ${L + 8} ${top} Z`);
  B.text.setAttribute("x", 0); B.text.setAttribute("y", top + 14); B.text.textContent = text;
}
</script>
<script type="text/plain" data-path="js/challenges/handshakes/plan.js">
// Pure layout of the handshakes challenge: the room, the round table and where each person stands. Used by the activity
// and the solution so that both show the same scene.

// Seats on an ellipse around the table; the first person stands at the back (top), the others clockwise.
export function layout(n, { cx, cy, rx, ry }) {
  const size = n <= 6 ? 1.1 : n <= 10 ? 0.86 : n <= 16 ? 0.74 : n <= 22 ? 0.62 : 0.52;
  const seats = Array.from({ length: n }, (_, k) => { const a = -Math.PI / 2 + (2 * Math.PI * k) / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  return { seats, size, table: { cx, cy: cy - 6, rx: rx * 0.45, ry: ry * 0.42 } };
}

// Where a person's hand is, roughly, for the lines that stand for handshakes.
export const handAt = ([x, y], size) => [x, y - 34 * size];

// Facing (1 or -1) and the arm angle in the body frame (degrees, 0 ahead, negative up) to point at (tx, ty).
export function aimAt([x, y], [tx, ty], size) {
  const facing = tx >= x ? 1 : -1, dx = Math.abs(tx - x) || 1e-6, dy = ty - (y - 41 * size);
  return { facing, angle: Math.max(-45, Math.min(60, (Math.atan2(dy, dx) * 180) / Math.PI)) };
}

<script type="text/plain" data-path="js/challenges/handshakes/solution.js">
// Animated solution of the handshakes challenge. `diagram` holds the captions (steps); `scene` builds the cartoon once
// (mount) and poses it as a pure function of (step, p) (update): nothing accumulates between frames.
import { P, ez, mid } from "../common/helpers.js";
import { colour, svgEl } from "../common/kit.js";
import { seg } from "../common/scene-kit.js";
import { handshakes } from "./maths.js";
import { makePerson, posePerson } from "../common/person.js";
import { makeBubble, poseBubble } from "../common/bubble.js";
import { layout, handAt, aimAt } from "./plan.js";

const ROOM = { cx: 200, cy: 200, rx: 162, ry: 80 };

export const diagram = {
  size: [520, 300],
  dur: (step) => [3200, 6000, 4200, 3800][step],
  steps: (q) => [
    P(`${q.n} personnes se retrouvent autour d’une table.`, `${q.n} people meet around a table.`),
    P(`A serre la main de chacune des ${q.n - 1} autres : ${q.n - 1} poignées de main.`, `A shakes hands with each of the ${q.n - 1} others: ${q.n - 1} handshakes.`),
    P(`Chacune en fait autant : ${q.n} × ${q.n - 1} = ${q.n * (q.n - 1)} mains tendues.`, `Everyone does the same: ${q.n} × ${q.n - 1} = ${q.n * (q.n - 1)} hands held out.`),
    P(`Mais une poignée de main, c’est deux mains : ${q.n * (q.n - 1)} ÷ 2 = ${handshakes(q.n)}.`, `But one handshake is two hands: ${q.n * (q.n - 1)} ÷ 2 = ${handshakes(q.n)}.`),
  ],
};

export const scene = {
  mount(c, q) {
    const n = q.n, L = layout(n, ROOM), T = L.table;
    svgEl("ellipse", { cx: ROOM.cx, cy: ROOM.cy + 4, rx: ROOM.rx + 30, ry: ROOM.ry + 26, fill: "color-mix(in srgb, var(--accent) 9%, transparent)" }, c.svg);   // rug
    const back = svgEl("g", {}, c.svg);
    svgEl("rect", { x: T.cx - 6, y: T.cy, width: 12, height: 26, fill: "#8d5f2d", stroke: "var(--ink)", "stroke-width": 1.2 }, c.svg);   // table foot
    svgEl("ellipse", { cx: T.cx, cy: T.cy, rx: T.rx, ry: T.ry, fill: "#c58b52", stroke: "var(--ink)", "stroke-width": 1.6 }, c.svg);
    svgEl("ellipse", { cx: T.cx - T.rx * 0.25, cy: T.cy - T.ry * 0.3, rx: T.rx * 0.45, ry: T.ry * 0.25, fill: "#fff", opacity: 0.18 }, c.svg);   // shine
    const front = svgEl("g", {}, c.svg), lines = svgEl("g", { opacity: 0.6 }, c.svg), bubbles = svgEl("g", {}, c.svg);
    // people behind the table are drawn before it, the others after
    const people = L.seats.map(([, y], i) => makePerson(y < T.cy ? back : front, { fill: `color-mix(in srgb, ${colour(i)} 70%, var(--surface))`, look: i, size: L.size }));
    const name = svgEl("text", { "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "var(--ink)" }, front);
    const hello = makeBubble(bubbles);
    const txt = [c.text(450, 110, "", { ...mid, class: "sol-line" }), c.text(450, 150, "÷ 2", { ...mid, class: "sol-line" }), c.text(450, 200, `${handshakes(n)}`, { ...mid, class: "sol-hot" })];
    return { n, L, people, lines, hello, name, txt, lang: c.t("fr", "en") };
  },
  update(st, s, p) {
    const { n, L, people, lines, hello, name, txt, lang } = st, S = L.seats, size = L.size, centre = [ROOM.cx, ROOM.cy - 30];
    const word = lang === "fr" ? "Enchanté !" : "Nice to meet you!";
    lines.replaceChildren();
    const line = (i, j, k = 1, col = colour(i)) => { const a = handAt(S[i], size), b = handAt(S[j], size); svgEl("line", { x1: a[0], y1: a[1], x2: a[0] + (b[0] - a[0]) * k, y2: a[1] + (b[1] - a[1]) * k, stroke: col, "stroke-width": 1.6, "stroke-linecap": "round" }, lines); };
    // default pose: idle, breathing and looking at the table; the breathing and the blinks are functions of p
    const pose = S.map((at, i) => ({ x: at[0], y: at[1], ...aimAt(at, centre, size), gaze: [Math.sign(centre[0] - at[0]) * 0.5, 0.3], breathe: 6 * p + i, blink: Math.abs(Math.sin(9 * p + i * 1.7)) > 0.998 ? 1 : 0, mood: "smile" }));
    let bubble = null;
    if (s === 0) {   // hello: each one waves in turn
      S.forEach((_, i) => { const w = seg(p, (i / n) * 0.8, (i / n) * 0.8 + 0.25); if (w > 0 && w < 1) Object.assign(pose[i], { wave: w, mood: "grin" }); });
    }
    if (s === 1) {   // A meets the others one by one
      const u = Math.min(n - 1 - 1e-9, ez(p) * (n - 1)), idx = Math.floor(u), k = p >= 1 ? 1 : u - idx, j = idx + 1;
      for (let m = 1; m < j; m++) line(0, m);
      line(0, j, seg(k, 0.15, 0.45));
      const a = aimAt(S[0], handAt(S[j], size), size), b = aimAt(S[j], handAt(S[0], size), size), shake = seg(k, 0.3, 0.6) * (1 - seg(k, 0.85, 1));
      Object.assign(pose[0], { facing: a.facing, reachAngle: a.angle, reach: shake, gaze: [a.facing, 0.2], mood: shake > 0.5 ? "grin" : "smile", hop: seg(k, 0.45, 0.75) });
      Object.assign(pose[j], { facing: b.facing, reachAngle: b.angle, reach: shake, gaze: [b.facing, -0.2], mood: shake > 0.5 ? "grin" : "o", hop: seg(k, 0.45, 0.75) });
      S.forEach((_, i) => { if (i !== 0 && i !== j) pose[i].gaze = [Math.sign(S[0][0] - S[i][0]), -0.4]; });   // the others watch
      bubble = { at: handAt(S[0], size), appear: seg(k, 0.3, 0.45) * (1 - seg(k, 0.8, 0.95)) };
      txt[0].textContent = `${Math.min(j - (k < 0.45 ? 1 : 0), n - 1)}`;
    }
    if (s >= 2) {   // everyone reaches out; in step 2 the lines appear person by person
      const upto = s === 2 ? Math.ceil(ez(p) * n) : n;
      for (let i = 0; i < upto; i++) for (let j = 0; j < n; j++) if (j !== i) line(i, j, s === 2 && i === upto - 1 ? seg(ez(p) * n - (upto - 1), 0, 1) : 1);
      S.forEach((at, i) => { if (i < upto) Object.assign(pose[i], { reach: 1, reachAngle: aimAt(at, centre, size).angle, mood: "grin" }); });
      txt[0].textContent = `${n} × ${n - 1}`;
    }
    if (s === 3) S.forEach((_, i) => Object.assign(pose[i], { hop: seg(p, 0.65 + 0.2 * (i / n), 0.85 + 0.15 * (i / n)), reach: 1 - seg(p, 0.6, 0.8) }));   // the final cheer
    people.forEach((Pp, i) => posePerson(Pp, pose[i]));
    name.setAttribute("x", S[0][0]); name.setAttribute("y", S[0][1] + 14); name.textContent = "A";
    poseBubble(hello, bubble ? { x: bubble.at[0] + 6, y: Math.max(36, bubble.at[1] - 34 * size), text: word, appear: bubble.appear } : { x: 0, y: 0, text: word, appear: 0 });
    txt[0].setAttribute("opacity", s >= 1 ? 1 : 0);
    txt[1].setAttribute("opacity", s === 3 ? seg(p, 0, 0.4) : 0);
    txt[2].setAttribute("opacity", s === 3 ? seg(p, 0.3, 0.7) : 0);
  },
};
</script>
<script type="text/plain" data-path="js/challenges/common/player.js">
// Animated solutions: each challenge explains its answer as a short sequence of steps, drawn as SVG.
// A solution is { size: [w, h], steps(q): [[fr, en], ...], draw(ctx, step, p, q) } where q holds the parameters of the
// variation being solved, and draw is a pure function of the step index and the progress p in [0, 1] inside that step,
// so any frame can be reproduced and scrubbed.
// Controls: restart, previous, play or pause, next. With reduced motion nothing plays by itself: each step shows its
// finished state. The caption of the current step is announced in a polite live region.
import { makeCtx } from "./kit.js";

export const ctxFor = makeCtx;

/* ----------------------------------------------------------------- player */
export function playSolution(def, root, { lang, reduced: reducedPref, params = {} }) {
  const reduced = () => (typeof reducedPref === "function" ? reducedPref() : !!reducedPref);   // the app passes a function
  const t = (fr, en) => (lang === "fr" ? fr : en);
  const [w, h] = def.size, HOLD = 900, steps = def.steps(params), nSteps = steps.length;
  const durOf = () => (def.dur ? def.dur(step, params) : 2600);   // a solution may pace each step itself
  let step = 0, p = reduced() ? 1 : 0, auto = false, raf = 0, started = false, scene = null;
  root.innerHTML = `
    <div class="sol-anim">
      <svg class="sol-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${t("Animation de la solution", "Solution animation")}"></svg>
      <p class="sol-cap" role="status" aria-live="polite"></p>
      <div class="sol-controls">
        <button class="btn-quiet" data-a="restart" type="button" aria-label="${t("Revenir au début", "Back to the start")}">⏮</button>
        <button class="btn btn-secondary" data-a="prev" type="button">${t("Précédent", "Previous")}</button>
        <button class="btn btn-primary" data-a="play" type="button" aria-pressed="false">${t("Lecture", "Play")}</button>
        <button class="btn btn-secondary" data-a="next" type="button">${t("Suivant", "Next")}</button>
        <span class="sol-count"></span>
      </div>
    </div>`;
  const svg = root.querySelector("svg"), cap = root.querySelector(".sol-cap"), count = root.querySelector(".sol-count");
  const btn = (a) => root.querySelector(`[data-a="${a}"]`), playBtn = btn("play");
  function paint() {
    if (def.mount) { scene ||= (svg.replaceChildren(), def.mount(ctxFor(svg, lang), params)); def.update(scene, step, p, params); }   // built once, then posed
    else { svg.replaceChildren(); def.draw(ctxFor(svg, lang), step, p, params); }
    cap.textContent = steps[step][lang === "fr" ? 0 : 1];
    count.textContent = `${t("Étape", "Step")} ${step + 1} / ${nSteps}`;
    btn("prev").disabled = step === 0;
    btn("next").disabled = step === nSteps - 1 && p >= 1;
    playBtn.textContent = auto ? t("Pause", "Pause") : step === nSteps - 1 && p >= 1 ? t("Rejouer", "Replay") : t("Lecture", "Play");

  function run() {

  root.querySelector(".sol-controls").addEventListener("click", (e) => {

    else if (reduced()) show(step === nSteps - 1 ? 0 : step + 1, false);

  return { stop: halt, seek: (k, pp = 1) => { halt(); step = clamp(k, 0, nSteps - 1); p = clamp(pp, 0, 1); paint(); }, steps: nSteps, start: () => { if (!started && !reduced()) { started = true; auto = true; paint(); run(); } } };
}

export const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
</script>

export function quadratic(a, b, c) {
  if (a === 0)
    return {
      kind: b === 0 ? "constant" : "linear",
      roots: b === 0 ? [] : [-c / b],
      allReal: b === 0 && c === 0,
      vertex: null,
      discriminant: null,
    };
  const d = b * b - 4 * a * c;
  const roots =
    d < 0
      ? []
      : d === 0
        ? [-b / (2 * a)]
        : (() => {
            // Avoid cancellation when one root is much smaller than the other.
            const q = -0.5 * (b + (b < 0 ? -1 : 1) * Math.sqrt(d));
            return [q / a, c / q].sort((x, y) => x - y);
          })();
  return {
    kind: "quadratic",
    roots: roots.map(x => Object.is(x, -0) ? 0 : x),
    allReal: false,
    vertex: [-b / (2 * a), c - (b * b) / (4 * a)],
    discriminant: d,
  };
}
export function sequence(first, step, count, geometric = false) {
  return Array.from({ length: count }, (_, i) =>
    geometric ? first * step ** i : first + step * i,
  );
}
export function binomial(n, p) {
  let choose = 1;
  return Array.from({ length: n + 1 }, (_, k) => {
    if (k) choose = (choose * (n - k + 1)) / k;
    return choose * p ** k * (1 - p) ** (n - k);
  });
}
export function sampleBinomial(n, p, count, random = Math.random) {
  const bins = Array(n + 1).fill(0);
  for (let i = 0; i < count; i++) {
    let k = 0;
    for (let j = 0; j < n; j++) if (random() < p) k++;
    bins[k]++;
  }
  return bins;
}
export function statistics(values) {
  if (!values.length || values.some((v) => !Number.isFinite(v)))
    throw new Error("Invalid data");
  const sorted = [...values].sort((a, b) => a - b),
    n = values.length;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  return {
    n,
    mean,
    median:
      n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2,
    sd: Math.hypot(...values.map(x => x - mean)) / Math.sqrt(n),
    min: sorted[0],
    max: sorted[n - 1],
  };
}
export function parseData(raw) {
  const parts = raw
    .trim()
    .split(/[;\s]+/)
    .filter(Boolean);
  if (!parts.length || parts.length > 100) throw new Error("Use 1–100 values");
  const numbers = parts.map((v) =>
    /^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(v)
      ? Number(v.replace(",", "."))
      : NaN,
  );
  if (numbers.some((x) => !Number.isFinite(x) || Math.abs(x) > 10000))
    throw new Error("Invalid values");
  return numbers;
}
export function riemann(n, method = "left") {
  if (!Number.isInteger(n) || n < 1 || n > 100000 ||
      !["left", "right", "midpoint"].includes(method))
    throw new RangeError("Invalid rectangle configuration");
  const offset = method === "right" ? 1 : method === "midpoint" ? 0.5 : 0;
  let sum = 0;
  for (let i = 0; i < n; i++) sum += ((i + offset) / n) ** 2 / n;
  return sum;
}
export function squareSecant(x, h) {
  if (!Number.isFinite(x) || !Number.isFinite(h) || h === 0)
    throw new RangeError("A secant needs a finite, nonzero increment");
  return 2 * x + h;
}
export function formatNumber(n, lang = "en", digits = 3) {
  if (!Number.isFinite(n)) throw new RangeError("Expected a finite number");
  // Scientific notation preserves small nonzero values and large graph labels.
  const scientific = n !== 0 && (Math.abs(n) < Math.max(1e-4, 10 ** -digits) || Math.abs(n) >= 1e6);
  return new Intl.NumberFormat(lang, scientific
    ? { notation: "scientific", maximumSignificantDigits: 4 }

}
export function axisTicks(min, max) {
  if (!Number.isFinite(min) || !Number.isFinite(max) || !(max > min))
    throw new RangeError("Invalid axis bounds");
  const rough = (max - min) / 6;
  const power = Math.max(Number.MIN_VALUE, 10 ** Math.floor(Math.log10(rough || Number.MIN_VALUE)));
  const step = [1, 2, 5, 10].map(v => v * power).find(v => v >= rough);
  const first = Math.ceil(min / step);
  const values = [];
  // Bounded by the chosen tick count, never by an absolute epsilon in data units.
  for (let i = 0; i < 8; i++) {
    const value = (first + i) * step;
    if (value > max + step * 1e-9) break;
    const normalized = Math.abs(value) < step * 1e-8 ? 0 : value;
    if (values.at(-1) !== normalized) values.push(normalized);

}
export function gcd(a, b) {
  while (b) {
    [a, b] = [b, a % b];

}

  const clean = raw.trim().replace(",", ".");
  if (
    !/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(
      clean,
    )
  )

    value = b === undefined ? a : a / b;

}

// The handshakes challenge, pure parts: every answer recomputed by an independent method over the whole parameter range.
import test from "node:test";
import assert from "node:assert/strict";
import { variant } from "../site/js/challenges/handshakes/index.js";

test("handshakes: brute force over every pair of people gives the answer", () => {
  const p = variant.params.find((x) => x.id === "n");
  for (let n = p.min; n <= p.max; n++) {
    let count = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) count++;   // independent of the formula in maths.js
    assert.equal(variant.answer({ n }), count, `n = ${n}`);
  }
});

<script>
// Loader: each text block becomes a module (blob URL); its relative imports are rewritten to bare "mx/<path>" names,
// and an import map, added before any module runs, maps those names to the blobs. Resolution by name allows cycles.
(() => {
  const join = (base, rel) => { const parts = base.split("/").slice(0, -1); for (const s of rel.split("/")) { if (s === "..") parts.pop(); else if (s !== ".") parts.push(s); } return parts.join("/"); };
  const imports = {};
  for (const block of document.querySelectorAll('script[type="text/plain"][data-path^="js/"]')) {
    const rel = block.dataset.path, src = block.textContent.replace(/^\n/, "").replace(/<\\\/script/gi, "<\/script");
    const code = src.replace(/(\bfrom\s*|\bimport\s*\(\s*|\bimport\s+)(["'])(\.{1,2}\/[^"']+)\2/g, (m, a, q, sp) => a + q + "mx/" + join(rel, sp) + q);
    imports["mx/" + rel] = URL.createObjectURL(new Blob([code + "\n//# sourceURL=" + rel], { type: "text/javascript" }));
  }
  const map = document.createElement("script"); map.type = "importmap"; map.textContent = JSON.stringify({ imports });
  document.currentScript.after(map);
})();

<script type="module">
// the challenge is the folder whose index.js is in the blocks (so renaming the blocks renames the challenge)
const ID = [...document.querySelectorAll('script[type="text/plain"][data-path]')].map((b) => b.dataset.path.match(/^js\/challenges\/([^/]+)\/index\.js$/)?.[1]).find((x) => x && x !== "common");

}
// Same markup and classes as app.js challengeDetail, so pages.css styles it as on the site.
function render() {

    + (original ? '<details class="original-statement"><summary>' + t("Jusqu’à la preuve", "All the way to a proof") + '</summary><p class="problem original-q" id="original">' + T(original) + '</p><p class="muted">' + t("À traiter seul ou avec d’autres : le site ne vérifie pas cette partie.", "To work out alone or with others: the site does not check this part.") + '</p></details>' : "")
    + '</article></div><section class="solution-wide"><details class="solution"><summary>' + t("Voir la solution expliquée", "See the worked solution") + '</summary>'

async function selfCheck() {

  let combos = pools.reduce((acc, pool) => acc.flatMap((a) => pool.map((x) => [...a, x])), [[]]).map((c) => Object.fromEntries(v.params.map((p, i) => [p.id, c[i]])));

window.__previewReady = true;
