# One-time regeneration of tracked site outputs after a presentation-only source change.
name: Refresh curiosity preview build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-curiosity-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Refresh outputs, validate and commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            make site
            npm run check
            node --test tests/home.test.mjs tests/discovery.test.mjs
            git add -u site dist content/data/build-state.json
            if git diff --cached --quiet; then
              echo 'Generated products are already current.'
              exit 0
            fi
            git -c user.name='Build automation' -c user.email='build@users.noreply.github.com' commit -m 'Refresh generated site after curiosity preview labels'
            if git push origin HEAD:main; then
              echo 'Published refreshed site sources and build receipt.'
              exit 0
            fi
            echo "Concurrent update, retrying from latest main ($attempt/3)."
          done
          exit 1
