name: Refresh generated site receipt (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-mikajy-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.6
      - name: Regenerate committed products
        run: PYTHONPATH=build python -m mxbuild.refresh
      - name: Commit generated receipt and delete this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refresh-mikajy-once.yml
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated site receipt for Mikajy link"
            git push origin HEAD:main
          fi
