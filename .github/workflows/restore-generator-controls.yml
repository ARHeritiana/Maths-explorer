name: Restore generator controls build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.event.head_commit.message == 'Restore visible generator controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf==1.26.6
      - run: npm ci --ignore-scripts
      - name: Refresh publication, validate and test
        run: |
          PYTHONPATH=build python -m mxbuild.refresh
          npm run check
          npm test
          npm run test:dom
          make check
      - name: Commit verified generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html dist content/data/build-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify restored generator controls'
            git push origin HEAD:main
          fi
