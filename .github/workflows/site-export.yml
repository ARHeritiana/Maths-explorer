name: Site deployment export
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive deployment files only
        run: tar -czf site-dist.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site-dist.tar.gz
          retention-days: 1
