'use strict';
const $=LX.$,fmt=LX.fmt,vf=LX.vf;
const show=LX.init(T,['explore','two','negate','game','recap']);
// ---- Pure logic (language free)
const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;};
const PRED=[
{id:'even',f:n=>n%2===0},{id:'gt3',f:n=>n>3},{id:'sqgt',f:n=>n*n>n},{id:'lt5',f:n=>n<5},
{id:'lt10',f:n=>n<10},{id:'prime',f:isPrime},{id:'m3',f:n=>n%3===0},{id:'sq50',f:n=>n*n<50}
];
const predById=id=>PRED.find(x=>x.id===id);
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
// A quantified statement over a finite universe E (an array): ∀ is "every", ∃ is "some". Empty universe: ∀ true, ∃ false.
const holds=(quant,f,E)=>quant==='all'?E.every(f):E.some(f);
const roster=a=>'{'+a.join(' ; ')+'}';
const sym=quant=>quant==='all'?'∀':'∃';
// Candidate negation: quantifier cq with the property kept or negated. It is a negation of the statement exactly when, in
// EVERY non-empty universe contained in the base, the two have opposite truth values.
function universes(base){const r=[];for(let m=1;m<1<<base.length;m++)r.push(base.filter((_,i)=>m>>i&1));return r;}
const candidate=(cq,cneg,f)=>cneg?(n=>!f(n)):f;
function negationTest(st,cq,cneg,base){
 const f=predById(st.pred).f,g=candidate(cq,cneg,f);
 for(const S of universes(base)){const a=holds(st.q,f,S),b=holds(cq,g,S);if(a===b)return {valid:false,S,a,b};}
 return {valid:true};
}
const NUMS=range(0,12);

// ---- Explore
let pid='sqgt',quant='all',inE=new Set(range(1,8));
const PRESETS={all:()=>NUMS,none:()=>[],even:()=>NUMS.filter(n=>n%2===0),odd:()=>NUMS.filter(n=>n%2===1),prime:()=>NUMS.filter(isPrime),fromTwo:()=>range(2,12)};
function renderExplore(){
 const f=predById(pid).f,E=NUMS.filter(n=>inE.has(n)),vals=E.map(f),res=holds(quant,f,E);
 $('qpick').innerHTML=PRED.map(p=>`<button type="button" class="chip" data-p="${p.id}" aria-pressed="${p.id===pid}">n ${T.pred[p.id][0]}</button>`).join('');
 $('qsel').innerHTML=['all','ex'].map(k=>`<button type="button" data-q="${k}" aria-pressed="${k===quant}">${sym(k)} <span class="muted">${T.qname[k]}</span></button>`).join('');
 $('presets').innerHTML=Object.keys(PRESETS).map(k=>`<button type="button" class="chip" data-preset="${k}">${T.presets[k]}</button>`).join('');
 $('board').innerHTML=NUMS.map(n=>{const on=inE.has(n),ok=f(n);return `<button type="button" class="tile ${on?(ok?'ok':'ko'):'out'}" data-n="${n}" aria-pressed="${on}" aria-label="${n} : ${on?(ok?T.tileIn.ok:T.tileIn.ko):T.tileOut}">${n}<small>${on?(ok?'✓':'✗'):'·'}</small></button>`;}).join('');
 const sentence=fmt(T.sent[quant],T.pred[pid][0]);
 let evidence;
 if(!E.length)evidence=T.empty[quant];
 else if(quant==='all')evidence=res?T.ev.allTrue:fmt(T.ev.allFalse,E.find(n=>!f(n)));
 else evidence=res?fmt(T.ev.exTrue,E.find(f)):T.ev.exFalse;
 $('xread').innerHTML=`<div class="math">${sym(quant)}n ∈ ${roster(E)}, P(n)</div><p>${sentence.replace('{E}',roster(E))}</p><p><span class="badge ${res?'t':'f'}">${vf(res)}</span> ${evidence}</p>`+
  (E.length?`<p class="muted">${T.expand} ${vals.map(vf).join(quant==='all'?' ∧ ':' ∨ ')} = <strong>${vf(res)}</strong></p>`:'');
}
$('panel-explore').addEventListener('click',e=>{
 const b=e.target.closest('[data-p],[data-q],[data-n],[data-preset]');if(!b)return;
 if(b.dataset.p)pid=b.dataset.p;else if(b.dataset.q)quant=b.dataset.q;
 else if(b.dataset.preset)inE=new Set(PRESETS[b.dataset.preset]());
 else{const n=+b.dataset.n;inE.has(n)?inE.delete(n):inE.add(n);}
 LX.keepFocus(renderExplore);
});

// ---- Two quantifiers
const XY=[1,2,3,4];
const RELS={eq:(x,y)=>x===y,gt:(x,y)=>y>x,ge:(x,y)=>y>=x,sum:(x,y)=>x+y===5,div:(x,y)=>y%x===0,all:()=>true,none:()=>false};
let rel=XY.map(x=>XY.map(y=>RELS.eq(x,y)));
const forallExists=m=>m.every(row=>row.some(Boolean));
const existsForall=m=>XY.some((_,j)=>m.every(row=>row[j]));
const existsForallNot=m=>m.some(row=>row.every(v=>!v));
function renderTwo(){
 $('rpresets').innerHTML=Object.keys(RELS).map(k=>`<button type="button" class="chip" data-rp="${k}">${T.rels[k]}</button>`).join('');
 const wit=rel.map(row=>row.indexOf(true));
 const cols=XY.map((_,j)=>rel.every(row=>row[j]));
 $('relgrid').innerHTML=`<p class="muted">${T.relCaption}</p><table class="rel"><thead><tr><th scope="col"></th>${XY.map(y=>`<th scope="col">y = ${y}</th>`).join('')}<th scope="col">${T.witY}</th></tr></thead><tbody>${rel.map((row,i)=>`<tr><th scope="row">x = ${XY[i]}</th>${row.map((v,j)=>`<td class="${cols[j]?'mark':''}"><button type="button" class="cell" data-x="${i}" data-y="${j}" aria-pressed="${v}" aria-label="x = ${XY[i]}, y = ${XY[j]} : ${T.cellState[+v]}">${v?'✓':'✗'}</button></td>`).join('')}<td class="${wit[i]<0?'n':'y'}">${wit[i]<0?T.none:'y = '+XY[wit[i]]}</td></tr>`).join('')}</tbody><tfoot><tr><th scope="row">${T.colAll}</th>${cols.map(c=>`<td class="${c?'y':'n'}">${c?'✓':'✗'}</td>`).join('')}<td></td></tr></tfoot></table>`;
 const a=forallExists(rel),b=existsForall(rel),c=existsForallNot(rel);
 const x0=rel.findIndex(row=>row.every(v=>!v)),y0=XY.findIndex((_,j)=>cols[j]);
 $('tworead').innerHTML=`<div class="stmts">
 <div class="stmt ${a?'t':'f2'}"><div><span class="f">∀x ∃y, R(x, y)</span><div class="muted">${T.reads.ae}</div></div><span class="badge ${a?'t':'f'}">${vf(a)}</span></div>
 <div class="stmt ${b?'t':'f2'}"><div><span class="f">∃y ∀x, R(x, y)</span><div class="muted">${T.reads.ea}</div></div><span class="badge ${b?'t':'f'}">${vf(b)}</span></div>
 <div class="stmt ${c?'t':'f2'}"><div><span class="f">∃x ∀y, ¬R(x, y)</span><div class="muted">${T.reads.neg}</div></div><span class="badge ${c?'t':'f'}">${vf(c)}</span></div></div>
 <p>${a?T.res.aeTrue:fmt(T.res.aeFalse,XY[x0])}</p><p>${b?fmt(T.res.eaTrue,XY[y0]):T.res.eaFalse}</p><p class="muted">${T.res.negOf}</p>`+(b&&!a?'':'')+(b?'<p class="muted">'+T.res.implies+'</p>':'');
}
$('panel-two').addEventListener('click',e=>{
 const b=e.target.closest('[data-rp],[data-x]');if(!b)return;
 if(b.dataset.rp){const f=RELS[b.dataset.rp];rel=XY.map(x=>XY.map(y=>f(x,y)));}
 else{const i=+b.dataset.x,j=+b.dataset.y;rel[i][j]=!rel[i][j];}
 LX.keepFocus(renderTwo);
});

// ---- Negation
const BASE=[1,2,3,4,5,6];
const STATEMENTS=[{id:'s1',q:'all',pred:'even'},{id:'s2',q:'ex',pred:'m3'},{id:'s3',q:'all',pred:'sqgt'},{id:'s4',q:'ex',pred:'prime'},{id:'s5',q:'all',pred:'lt5'},{id:'s6',q:'ex',pred:'gt3'}];
let sid='s1',cq='ex',cneg=false;
const stmtText=(st,neg,q2)=>fmt(T.sent[q2||st.q],T.pred[st.pred][neg?1:0]).replace('{E}','E');
function renderNeg(){
 const st=STATEMENTS.find(s=>s.id===sid),f=predById(st.pred).f,g=candidate(cq,cneg,f);
 $('spick').innerHTML=STATEMENTS.map(s=>`<button type="button" class="pick" data-s="${s.id}" aria-current="${s.id===sid}">${sym(s.q)}n ∈ E, P(n) : ${stmtText(s,false)}</button>`).join('');
 $('sbase').innerHTML=BASE.map(n=>`<div class="tile ${f(n)?'ok':'ko'}" role="img" aria-label="${n} : ${f(n)?T.tileIn.ok:T.tileIn.ko}">${n}<small>${f(n)?'✓':'✗'}</small></div>`).join('');
 $('nstate').innerHTML=`<p><span class="muted">${T.neg.stmt}</span><br><strong>${sym(st.q)}n ∈ E, P(n)</strong> : ${stmtText(st,false)}</p>`;
 $('nq').innerHTML=['all','ex'].map(k=>`<button type="button" data-nq="${k}" aria-pressed="${k===cq}">${sym(k)} <span class="muted">${T.qname[k]}</span></button>`).join('');
 $('np').innerHTML=[false,true].map(k=>`<button type="button" data-np="${+k}" aria-pressed="${k===cneg}">${k?'¬P(n)':'P(n)'}</button>`).join('');
 const r=negationTest(st,cq,cneg,BASE),a=holds(st.q,f,BASE),b=holds(cq,g,BASE);
 const cand=`<strong>${sym(cq)}n ∈ E, ${cneg?'¬P(n)':'P(n)'}</strong> : ${stmtText(st,cneg,cq)}`;
 $('nread').innerHTML=`<p>${T.neg.cand} ${cand}</p><p class="muted">${fmt(T.neg.onBase,roster(BASE),vf(a),vf(b))}</p>`+(r.valid?`<p class="fb good"><strong>${T.neg.good}</strong> ${T.neg.goodWhy}</p>`:`<p class="fb bad"><strong>${T.neg.bad}</strong> ${fmt(T.neg.badWhy,roster(r.S),vf(r.a),vf(r.b))}</p>`);
}
$('panel-negate').addEventListener('click',e=>{
 const b=e.target.closest('[data-s],[data-nq],[data-np]');if(!b)return;
 if(b.dataset.s)sid=b.dataset.s;else if(b.dataset.nq)cq=b.dataset.nq;else cneg=b.dataset.np==='1';
 LX.keepFocus(renderNeg);
});

// ---- The counterexample game
const CLAIMS=[
{id:'g1',kind:'all',lo:1,hi:12,f:n=>n*n>n},
{id:'g2',kind:'all',lo:2,hi:15,f:n=>!isPrime(n)||n%2===1},
{id:'g3',kind:'all',lo:0,hi:39,f:n=>isPrime(n*n+n+41)},
{id:'g4',kind:'all',lo:0,hi:44,f:n=>isPrime(n*n+n+41)},
{id:'g5',kind:'ex',lo:1,hi:20,f:n=>n*n===3*n+10},
{id:'g6',kind:'ex',lo:1,hi:12,f:n=>2**n===n*n},
{id:'g7',kind:'all',lo:1,hi:12,f:n=>2**n>n*n},
{id:'g8',kind:'all',lo:1,hi:12,f:n=>(n*(n+1))%2===0},
{id:'g9',kind:'ex',lo:1,hi:15,f:n=>n*n===2*n-3},
{id:'g10',kind:'all',lo:2,hi:12,f:n=>!isPrime(n)||isPrime(2**n-1)},
{id:'g11',kind:'all',lo:1,hi:30,f:n=>!(n%4===0&&n%6===0)||n%24===0}
];
const claimTruth=g=>holds(g.kind,g.f,range(g.lo,g.hi));
function claimWhy(g){
 const dom=range(g.lo,g.hi),G=T.g[g.id],truth=claimTruth(g),G2=T.game;
 let s;
 if(g.kind==='all')s=truth?fmt(G2.allTrue,dom.length):fmt(G2.allFalse,dom.filter(n=>!g.f(n)).slice(0,5).join(', '));
 else s=truth?fmt(G2.exTrue,dom.filter(g.f).slice(0,5).join(', ')):G2.exFalse;
 return s+' '+G.x;
}
function claimItem(g){
 const dom=range(g.lo,g.hi),truth=claimTruth(g),tested=new Set(),c=T.game;
 return {hint:g.kind==='all'?c.hintAll:c.hintEx,why:claimWhy(g),
 reveal(){$('game').querySelectorAll('[data-n]').forEach(t=>{const n=+t.dataset.n;t.disabled=true;t.className='tile '+(g.f(n)?'ok':'ko');t.querySelector('small').textContent=g.f(n)?'✓':'✗';});},
 render(body,api){
  body.innerHTML=`<p class="math">${sym(g.kind)}n ∈ ⟦${g.lo} ; ${g.hi}⟧, P(n)</p><p>${T.g[g.id].s}</p><p class="muted">${c.tiles}</p><div class="tiles" role="group" aria-label="${T.ia.gtiles}">${dom.map(n=>`<button type="button" class="tile hid" data-n="${n}" aria-label="${fmt(c.testLabel,n)}">${n}<small>?</small></button>`).join('')}</div><p class="muted" id="g-count" aria-live="polite">${fmt(c.count,0)}</p><div class="row"><button type="button" class="btn" data-v="1">${c.declareTrue}</button><button type="button" class="btn alt" data-v="0">${c.declareFalse}</button></div>`;
  body.addEventListener('click',e=>{
   const t=e.target.closest('[data-n]');
   if(t&&!t.disabled){const n=+t.dataset.n,ok=g.f(n);tested.add(n);t.className='tile '+(ok?'ok':'ko');t.querySelector('small').textContent=ok?'✓':'✗';t.setAttribute('aria-label',n+' : '+(ok?T.tileIn.ok:T.tileIn.ko));$('g-count').textContent=fmt(c.count,tested.size);return;}
   const v=e.target.closest('[data-v]');if(!v)return;
   const said=v.dataset.v==='1';
   if(said!==truth){api.answer(false,(said?c.wrongTrue:c.wrongFalse)+' ');return;}
   body.querySelectorAll('[data-n],[data-v]').forEach(x=>{x.disabled=true;});
   api.answer(true,fmt(c.rightTests,tested.size)+' ');
  });
 }};
}
const makeQuiz=()=>LX.shuffle(CLAIMS).slice(0,6).map(claimItem);

// ---- Static content
$('recap-rows').innerHTML=T.recap.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
$('ideas').innerHTML=T.ideas;
renderExplore();renderTwo();renderNeg();LX.quiz('game',makeQuiz);
LX.notifySize();

</script>
</body>
