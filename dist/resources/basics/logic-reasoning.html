'use strict';
const $=LX.$,fmt=LX.fmt;
const show=LX.init(T,['explore','practice','recap']);
// ---- Pure logic (language free)
const smallestFactor=N=>{for(let d=2;d*d<=N;d++)if(N%d===0)return d;return N;};
const isPrime=N=>N>=2&&smallestFactor(N)===N;
const euler=n=>n*n+n+41;
const PRIMES=[2,3,5,7,11,13,17];
const euclid=k=>{const list=PRIMES.slice(0,k),N=list.reduce((a,b)=>a*b,1)+1,p=smallestFactor(N);return {list,N,p,isNew:!list.includes(p)};};
const sqrt2=q=>{const p=Math.round(q*Math.SQRT2);return {p,diff:p*p-2*q*q};};
const triangle=n=>n*(n+1)/2;
const NDOM=10;
// Dominoes 0..NDOM-1: domino 0 falls if the base case holds; domino k falls if domino k-1 falls and k is not stuck.
function dominoFall(n,base,stuck){if(!base)return [];const r=[0];for(let k=1;k<n;k++){if(stuck.has(k))break;r.push(k);}return r;}
const roster=a=>'{'+a.join(' ; ')+'}';
const reduced=()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch{return false;}};

// ---- A proof to assemble: the student clicks the steps in the right order.
function orderProof(host,steps){
 let placed=0;const O=T.order,bank=LX.shuffle(steps.map((s,i)=>({s,i})));
 host.innerHTML=`<h4>${O.bank}</h4><div class="bank" role="group" aria-label="${O.bankLabel}"></div><h4>${O.proof}</h4><ol class="steps placed" aria-label="${O.proofLabel}"></ol><div class="fbox" aria-live="polite"></div><div class="row"><button type="button" class="btn alt" data-reset>${O.reset}</button></div>`;
 const bankEl=host.querySelector('.bank'),list=host.querySelector('.steps'),fb=host.querySelector('.fbox');
 const draw=()=>{
  bankEl.innerHTML=bank.filter(x=>x.i>=placed).map(x=>`<button type="button" data-i="${x.i}">${x.s}</button>`).join('');
  list.innerHTML=steps.slice(0,placed).map(s=>`<li>${s}</li>`).join('');
 };
 host.addEventListener('click',e=>{
  if(e.target.closest('[data-reset]')){placed=0;fb.innerHTML='';draw();bankEl.querySelector('button')?.focus({preventScroll:true});return;}
  const b=e.target.closest('[data-i]');if(!b)return;
  if(+b.dataset.i===placed){
   placed++;draw();
   fb.innerHTML=placed===steps.length?`<div class="fb good"><strong>${O.done}</strong> ${O.doneNote}</div>`:'';
   (bankEl.querySelector('button')||host.querySelector('[data-reset]')).focus({preventScroll:true});
  }else{
   b.classList.add('shake');
   fb.innerHTML=`<div class="fb bad"><strong>${O.no}</strong> ${placed===0?O.first:O.next}</div>`;
  }
 });
 draw();
 return {placed:()=>placed,total:steps.length};
}

function demoContra(){
 const rows=Array.from({length:10},(_,i)=>i+1).map(n=>{const P=(n*n)%2===0,Q=n%2===0;return {n,a:!P||Q,b:Q||!P?true:false,P,Q};});
 const sq=n=>({a:!((n*n)%2===0)||n%2===0,b:!(n%2===1)||(n*n)%2===1});
 $('tech-demo').innerHTML=`<p class="muted">${T.d.contraIntro}</p><div class="scroll"><table class="tt"><caption class="sr">${T.d.contraCaption}</caption><thead><tr><th scope="col">n</th><th scope="col">${T.d.contraA}</th><th scope="col">${T.d.contraB}</th></tr></thead><tbody>${Array.from({length:10},(_,i)=>i+1).map(n=>{const r=sq(n);return `<tr><td>${n}</td><td class="${r.a?'y':'n'}">${LX.vf(r.a)}</td><td class="${r.b?'y':'n'}">${LX.vf(r.b)}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function demoCounter(){

 const upd=()=>{const n=+$('cn').value,N=euler(n),f=smallestFactor(N),ok=isPrime(N);if(!ok)seen.add(n);
  $('cread').innerHTML=fmt(T.d.counterValue,n,N)+' '+(ok?'<span class="badge t">'+T.d.prime+'</span>':'<span class="badge f">'+fmt(T.d.composite,f,N/f)+'</span>')+
   (seen.size?'<p class="fb bad">'+fmt(T.d.counterFound,roster([...seen].sort((a,b)=>a-b)))+'</p>':'<p class="muted">'+T.d.counterKeep+'</p>');};
 $('tech-demo').innerHTML=range('cn',0,45,0,T.d.counterLabel)+'<div id="cread" aria-live="polite"></div>';
 $('cn').addEventListener('input',upd);upd();
}
function demoCases(){
 const upd=()=>{const n=+$('sn').value,even=n%2===0;
  $('sread').innerHTML=`<div class="stmts"><div class="stmt ${even?'t':''}"><div><span class="nm">${T.d.case1}</span>${even?fmt(T.d.case1On,n,n+1,n*(n+1)):T.d.caseOff}</div></div><div class="stmt ${even?'':'t'}"><div><span class="nm">${T.d.case2}</span>${even?T.d.caseOff:fmt(T.d.case2On,n,n+1,n*(n+1))}</div></div></div>`;};
 $('tech-demo').innerHTML=range('sn',1,30,7,T.d.casesLabel)+'<div id="sread" aria-live="polite"></div>';
 $('sn').addEventListener('input',upd);upd();
}
function demoAbsurd(){
 const d=T.d,host=$('tech-demo');
 const sqrtPart=()=>{const upd=()=>{const qq=+$('aq').value,r=sqrt2(qq);$('aread').innerHTML=fmt(d.sqrtRead,qq,r.p,r.p*r.p,2*qq*qq,String(r.diff).replace('-','−'));};
  $('apart').innerHTML=range('aq',1,40,5,d.sqrtLabel)+'<p id="aread" aria-live="polite"></p><p class="muted">'+d.sqrtNote+'</p>';$('aq').addEventListener('input',upd);upd();};
 const primePart=()=>{const upd=()=>{const k=+$('ak').value,r=euclid(k);$('aread').innerHTML=fmt(d.primeRead,r.list.join(' × '),r.N,r.p,r.list.join(', '));};
  $('apart').innerHTML=range('ak',1,6,4,d.primeLabel)+'<p id="aread" aria-live="polite"></p><p class="muted">'+d.primeNote+'</p>';$('ak').addEventListener('input',upd);upd();};
 host.innerHTML=`<div class="seg" role="group" aria-label="${d.ctxLabel}"><button type="button" data-ctx="sqrt2" aria-pressed="${absurdCtx==='sqrt2'}">${d.ctxSqrt}</button><button type="button" data-ctx="primes" aria-pressed="${absurdCtx==='primes'}">${d.ctxPrimes}</button></div><div id="apart"></div>`;
 (absurdCtx==='sqrt2'?sqrtPart:primePart)();
}
function demoInduction(){
 const D=T.dom;let base=true,stuck=new Set(),fallen=[];
 const host=$('tech-demo');
 host.innerHTML=`<p class="muted">${D.intro}</p><div class="togs"><button type="button" class="tog" role="switch" aria-checked="true" id="dbase" aria-label="${D.baseLabel}"><span>${D.base}</span><span class="val" id="dbaseval"></span></button></div><div class="dominoes" id="doms" role="group" aria-label="${D.rowLabel}"></div><div class="row"><button type="button" class="btn" id="dgo">${D.go}</button><button type="button" class="btn alt" id="dreset">${D.reset}</button></div><div id="dread" aria-live="polite"></div>`;
 const draw=()=>{
  $('dbase').setAttribute('aria-checked',String(base));$('dbaseval').textContent=base?D.on:D.off;
  $('doms').innerHTML=Array.from({length:NDOM},(_,k)=>{const f=fallen.includes(k);
   return k===0?`<div class="dom${f?' fell':''}" aria-hidden="true">0</div>`:`<button type="button" class="dom${f?' fell':''}${stuck.has(k)?' gap':''}" data-k="${k}" aria-pressed="${stuck.has(k)}" aria-label="${fmt(D.domLabel,k,stuck.has(k)?D.stuck:D.free)}">${k}</button>`;}).join('');
 };
 const verdict=()=>{
  const all=dominoFall(NDOM,base,stuck);
  let msg;
  if(!base)msg=D.noBase;else if(all.length===NDOM)msg=D.allFall;else msg=fmt(D.stoppedAt,all.length-1,all.length);
  return msg;
 };
 const reset=()=>{clearTimeout(domTimer);fallen=[];$('dread').innerHTML='';draw();};
 $('dbase').addEventListener('click',()=>{base=!base;reset();});
 $('doms').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=+b.dataset.k;stuck.has(k)?stuck.delete(k):stuck.add(k);reset();$('doms').querySelector('[data-k="'+k+'"]')?.focus({preventScroll:true});});
 $('dreset').addEventListener('click',reset);
 $('dgo').addEventListener('click',()=>{
  clearTimeout(domTimer);fallen=[];
  const all=dominoFall(NDOM,base,stuck);
  const done=()=>{$('dread').innerHTML='<p class="fb '+(all.length===NDOM&&base?'good':'bad')+'">'+verdict()+'</p>';};
  if(reduced()){fallen=all;draw();done();return;}
  let i=0;const step=()=>{if(i<all.length){fallen=all.slice(0,++i);draw();domTimer=setTimeout(step,130);}else done();};step();
 });
 draw();
 // The sum formula, checked case by case.
 const S=document.createElement('div');S.className='card';S.innerHTML=`<h4>${D.sumTitle}</h4>${range('tn',1,12,5,D.sumLabel)}<p id="tread" aria-live="polite"></p>`;
 host.appendChild(S);
 const upd=()=>{const n=+$('tn').value;$('tread').innerHTML=fmt(D.sumRead,n,Array.from({length:n},(_,i)=>i+1).join(' + '),n*(n+1)/2,triangle(n));};
 $('tn').addEventListener('input',upd);upd();
}
function renderTech(){
 clearTimeout(domTimer);
 const m=method,M=T.m[m];
 $('tech').innerHTML=head(m)+'<div id="tech-demo" class="card"></div><div id="tech-proof"></div>';
 ({direct:demoDirect,contra:demoContra,counter:demoCounter,cases:demoCases,absurd:demoAbsurd,induction:demoInduction})[m]();
 const steps=m==='absurd'?M.steps[absurdCtx]:M.steps;
 if(steps){$('tech-proof').innerHTML='';orderProof($('tech-proof'),steps);}
 else $('tech-proof').innerHTML='<p class="note">'+M.noProof+'</p>';
 LX.notifySize();
}
$('methods').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;method=b.dataset.m;renderMethods();renderTech();$('tech-h').focus({preventScroll:true});});
$('tech').addEventListener('click',e=>{const b=e.target.closest('[data-ctx]');if(!b)return;absurdCtx=b.dataset.ctx;renderTech();});

// ---- Challenges: which reasoning?
const makeQuiz=()=>T.c.map(c=>LX.choice({q:c.q,opts:c.opts,correct:0,why:c.why,hint:c.hint}));

// ---- Static content
$('recap-rows').innerHTML=T.recap.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
$('ideas').innerHTML=T.ideas;
renderMethods();renderTech();LX.quiz('quiz',makeQuiz);
LX.notifySize();

</script>
</body>
