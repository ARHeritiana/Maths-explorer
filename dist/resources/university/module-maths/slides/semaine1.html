function cx(re,im){return{re:re,im:im}}
function cm(a,b){return cx(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re)}

function carg(a){return Math.atan2(a.im,a.re)}
function ctex(a){var r=nf(a.re,2),i=Math.abs(a.im);return r+(a.im<0?'-':'+')+(Math.abs(i-1)<1e-9?'':nf(i,2))+'i'}
var CPL=function(){return E.plot(G.x,G.y,G.w,G.h,-4,4,-2.94,2.94)};

  {hd:'1 · Forme algébrique',L:function(P){var z1=cx(P.a,P.b),z2=cx(P.c,P.d),pr=cm(z1,z2);return[{t:'z_1='+ctex(z1),c:BLU},{t:'z_2='+ctex(z2),c:GRN},{t:'z_1z_2=(ac-bd)+i(ad+bc)='+ctex(pr),c:AMB}]}},
  {hd:'2 · Module et argument',L:function(P){var z1=cx(P.a,P.b),z2=cx(P.c,P.d);return[{t:'|z_1|='+nf(cabs(z1),3)+',\\ \\arg z_1='+nf(carg(z1),3),c:BLU},{t:'|z_2|='+nf(cabs(z2),3)+',\\ \\arg z_2='+nf(carg(z2),3),c:GRN},{t:'z=r\\,e^{i\\theta}=r(\\cos\\theta+i\\sin\\theta)',c:MUT}]}},
  {hd:'3 · Le produit : modules multipliés, arguments ajoutés',L:function(P){var z1=cx(P.a,P.b),z2=cx(P.c,P.d),pr=cm(z1,z2);return[{t:'|z_1z_2|='+nf(cabs(z1),3)+'\\times '+nf(cabs(z2),3)+'='+nf(cabs(pr),3),c:AMB},{t:'\\arg(z_1z_2)\\equiv '+nf(carg(z1),3)+'+('+nf(carg(z2),3)+')\\pmod{2\\pi}',c:AMB},{h:1,t:'Multiplier par $z_2$ : tourner de $\\arg z_2$ et dilater de $|z_2|$.',c:MUT}]}},
  {hd:'4 · Conjugué et inverse',L:function(P){var z1=cx(P.a,P.b),m=cabs(z1)*cabs(z1);return[{t:'\\overline{z_1}='+ctex(cx(P.a,-P.b))+',\\ z_1\\overline{z_1}=|z_1|^2='+nf(m,3)},m>1e-9?{t:'\\dfrac{1}{z_1}=\\dfrac{\\overline{z_1}}{|z_1|^2}='+ctex(cx(P.a/m,-P.b/m)),c:RED}:{h:1,t:'$z_1=0$ n’a pas d’inverse.',c:RED}]}}],

var RT=function(){return E.plot(G.x,G.y,G.w,G.h,-2.2,2.2,-1.6,1.6)};

  {hd:'2 · Linéariser avec Euler',L:function(){return[{t:'\\sin x\\cos^2x=\\dfrac{e^{ix}-e^{-ix}}{2i}\\cdot\\dfrac{(e^{ix}+e^{-ix})^2}{4}'},{t:'(e^{ix}-e^{-ix})(e^{2ix}+2+e^{-2ix})'},{t:'=e^{3ix}+e^{ix}-e^{-ix}-e^{-3ix}'},{t:'\\sin x\\cos^2x=\\dfrac{\\sin x+\\sin 3x}{4}',c:GRN}]}},

  E.txt('z₀',p.X(D.R*Math.cos(D.a))+14,p.Y(D.R*Math.sin(D.a))-14,AMB,18,'left');E.frameRect(G.x,G.y,G.w,G.h)},
