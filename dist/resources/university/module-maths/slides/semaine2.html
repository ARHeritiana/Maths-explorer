 steps:[
  {hd:'1 · Poser X = x²',L:function(P){return[{t:'x^4'+sg(P.p,1)+'x^2'+sg(P.q,1)+'=0'},{t:'X=x^2\\ \\Rightarrow\\ g(X)=X^2'+sg(P.p,1)+'X'+sg(P.q,1)+'=0',c:AMB},{h:1,t:'Équation du second degré en $X$, puis retour à $x$.',c:MUT}]}},
  {hd:'2 · Résoudre en X',L:function(P){var b=biq(P);return[{t:'\\Delta='+nf(b.dl*4,2)},b.X?{t:'X_1='+nf(b.X[0],3)+',\\ X_2='+nf(b.X[1],3),c:GRN}:{h:1,t:'Pas de racine réelle en $X$.',c:RED}]}},
  {hd:'3 · Retour à x : seules les valeurs X ≥ 0 conviennent',L:function(P){var b=biq(P);return[{h:1,t:'$x^2=X$ n’a de solution réelle que si $X\\geq 0$ : alors $x=\\pm\\sqrt{X}$.'},{t:b.xr.length?'x\\in\\{'+b.xr.map(function(v){return nf(v,3)}).join(';\\ ')+'\\}':'\\text{aucune solution réelle}',c:b.xr.length?GRN:RED},{h:1,t:b.xr.length+' solution(s) réelle(s).',c:AMB}]}},
  {hd:'4 · Se ramener à une biquadratique',L:function(){return[{h:1,t:'Une équation avec un terme en $\\dfrac1x$ : on multiplie par $x$ (avec $x\\neq0$) pour obtenir un polynôme.'},{t:'x^3+px+\\dfrac{q}{x}=0\\ \\Rightarrow\\ x^4+px^2+q=0'}]}}],
 draw:function(D,P,vis){var c=C(),A=BA(),B=BB(),b=biq(D);A.bg();A.grid(1,5);A.axes();A.ticks(2,5);
  A.clip(function(){A.curve(function(X){return X*X+D.p*X+D.q},AMB,3);if(vis(2)&&b.X){A.dot(b.X[0],0,b.X[0]>=0?GRN:RED,7);A.dot(b.X[1],0,b.X[1]>=0?GRN:RED,7)}
   var xv=-D.p/2;A.dot(xv,D.q-D.p*D.p/4,AMB,9);A.rect(-2,-10,0,10,'rgba(255,122,122,.07)')});
  E.txt('g(X)',A.x+34,A.y+16,AMB,16,'left');E.txt('X<0 : exclu',A.X(-1),A.Y(8),RED,13,'center');E.frameRect(600,36,315,470);
  B.bg();B.grid(1,5);B.axes();B.ticks(1,5);B.clip(function(){B.curve(function(x){return Math.pow(x,4)+D.p*x*x+D.q},BLU,3);if(vis(3))b.xr.forEach(function(v){B.dot(v,0,GRN,8)})});
  E.txt('f(x)=g(x²)',B.x+54,B.y+16,BLU,16,'left');E.frameRect(925,36,315,470)},
 handles:function(D){var A=BA();return[{X:A.X(-D.p/2),Y:A.Y(D.q-D.p*D.p/4),r:16,cur:'move',move:function(X,Y,P){var xv=rs(A.iX(X),.5,-1,4),gv=rs(A.iY(Y),.5,-9,6);P.p=-2*xv;P.q=gv+xv*xv}}]}});

/* ---------- 2.3 Éléments simples ---------- */
var FW=function(){return E.plot(G.x,G.y,G.w,G.h,-5,5,-5,5)};
function fr(P){var r=[P.r1,P.r2,P.r3],N=function(x){return P.n2*x*x+P.n1*x+P.n0},A=r.map(function(ri,i){var o=1;r.forEach(function(rj,j){if(j!==i)o*=(ri-rj)});return N(ri)/o});
  return{r:r,N:N,A:A,f:function(x){return N(x)/((x-r[0])*(x-r[1])*(x-r[2]))},g:function(x){return A[0]/(x-r[0])+A[1]/(x-r[1])+A[2]/(x-r[2])}}}
function pn(P){return(P.n2?nf(P.n2)+'x^2':'')+(P.n1?sg(P.n1)+'x':'')+(P.n0?sg(P.n0):'')||'0'}
E.add({id:'simples',seance:'2.3',title:'Éléments simples',hint:'Glissez les trois pôles sur l’axe ; curseurs : numérateur.',
 P:{r1:-2,r2:.5,r3:2,n2:1,n1:0,n0:1},tw:[],pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'n2',lab:'n_2',min:-3,max:3,step:.5},{k:'n1',lab:'n_1',min:-4,max:4,step:.5},{k:'n0',lab:'n_0',min:-4,max:4,step:.5}],
 steps:[
  {hd:'1 · Le principe',L:function(P){return[{t:'f(x)=\\dfrac{'+pn(P)+'}{(x-r_1)(x-r_2)(x-r_3)}'},{t:'f(x)=\\dfrac{A_1}{x-r_1}+\\dfrac{A_2}{x-r_2}+\\dfrac{A_3}{x-r_3}',c:AMB},{h:1,t:'Valable si le degré du numérateur est inférieur à $3$ et si les pôles sont distincts.',c:MUT}]}},
  {hd:'2 · Méthode du recouvrement',L:function(P){var q=fr(P);return[{t:'A_i=\\dfrac{N(r_i)}{\\prod_{j\\neq i}(r_i-r_j)}'},{t:'A_1='+nf(q.A[0],3),c:BLU},{t:'A_2='+nf(q.A[1],3),c:GRN},{t:'A_3='+nf(q.A[2],3),c:VIO},{t:'A_1+A_2+A_3='+nf(q.A[0]+q.A[1]+q.A[2],3)+(P.n2?'=n_2':''),c:MUT}]}},
  {hd:'3 · Vérification numérique',L:function(P){var q=fr(P),x=-1;return[{t:'x=-1:\\quad f('+x+')='+nf(q.f(x),4)},{t:'\\sum\\dfrac{A_i}{x-r_i}='+nf(q.g(x),4),c:GRN},{h:1,t:'Les deux courbes se superposent.',c:MUT}]}},
  {hd:'4 · Autres cas',L:function(){return[{t:'\\dfrac{A}{x-a}+\\dfrac{B}{(x-a)^2}\\quad\\text{(pôle double)}'},{t:'\\dfrac{Bx+C}{x^2+1}\\quad\\text{(facteur irréductible)}'},{h:1,t:'Si le degré du numérateur est $\\geq$ celui du dénominateur : division euclidienne d’abord.',c:MUT}]}}],
 draw:function(D,P,vis){var c=C(),p=FW(),q=fr(D);p.bg();p.grid(1,1);p.axes();p.ticks(1,1);
  p.clip(function(){q.r.forEach(function(r){p.line(r,-5,r,5,'rgba(143,166,196,.4)',1.2,[5,5])});
   if(vis(2)){[BLU,GRN,VIO].forEach(function(col,i){p.curve(function(x){return q.A[i]/(x-q.r[i])},col,1.8,-5,5,400)})}
   p.curve(q.f,AMB,3.5,-5,5,600);if(vis(3))p.curve(q.g,E.WHT,1.4,-5,5,600);
   q.r.forEach(function(r,i){p.dot(r,0,[BLU,GRN,VIO][i],9)})});
  E.txt('pôles',p.X(q.r[1]),p.Y(0)+22,MUT,14,'center');E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D,P){var p=FW(),ks=['r1','r2','r3'];return ks.map(function(k){return{X:p.X(D[k]),Y:p.Y(0),r:15,cur:'ew-resize',move:function(X,Y,P){var v=rs(p.iX(X),.25,-4.5,4.5),ok=true;ks.forEach(function(o){if(o!==k&&Math.abs(P[o]-v)<.75)ok=false});if(ok)P[k]=v}}})}});

/* ---------- 2.4 Limites et continuité : jeu epsilon-delta ---------- */
var LW=function(){return E.plot(G.x,G.y,G.w,G.h,-.6,2.6,0,2.35)};
function ff(j,x){return .5*(x-1)*(x-1)+1+(x>=1?j:0)}
function eps(P){var okL=true,okR=true,n=300,i,x;for(i=1;i<=n;i++){var d=P.dl*i/n;if(Math.abs(ff(P.j,1-d)-P.l)>=P.e)okL=false;if(Math.abs(ff(P.j,1+d)-P.l)>=P.e)okR=false}return{L:okL,R:okR,ok:okL&&okR}}
E.add({id:'limite',seance:'2.4',title:'Limites',hint:'Glissez ℓ (bleu), ε (haut de la boîte), δ (bas) ; curseur : saut j.',
 P:{l:1,e:.4,dl:.5,j:0},tw:[],pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'j',lab:'j',min:0,max:1.2,step:.1,fmt:function(v){return nf(v,1)}}],
 steps:[
  {hd:'1 · Définition de la limite',L:function(P){var o=eps(P);return[{t:'\\lim_{x\\to 1}f(x)=\\ell\\iff\\forall\\varepsilon>0\\ \\exists\\delta>0:'},{t:'0<|x-1|<\\delta\\Rightarrow|f(x)-\\ell|<\\varepsilon'},{t:'\\ell='+nf(P.l,2)+',\\ \\varepsilon='+nf(P.e,2)+',\\ \\delta='+nf(P.dl,2),c:AMB},{h:1,t:o.ok?'Ce couple $(\\varepsilon,\\delta)$ convient pour ce $\\ell$.':'Ce couple ne convient pas : une partie de la courbe sort de la bande.',c:o.ok?GRN:RED}]}},
  {hd:'2 · Limites à gauche et à droite',L:function(P){var o=eps(P);return[{t:'\\lim_{x\\to1^-}f(x)=1,\\qquad \\lim_{x\\to1^+}f(x)='+nf(1+P.j,2)},{h:1,t:'Côté gauche : '+(o.L?'dans la bande.':'hors de la bande.')+' Côté droit : '+(o.R?'dans la bande.':'hors de la bande.'),c:MUT},{t:'f(1)='+nf(1+P.j,2),c:AMB}]}},
  {hd:'3 · Continuité en 1',L:function(P){var ct=P.j===0;return[{t:'f\\text{ continue en }1\\iff\\lim_{x\\to1}f(x)=f(1)'},{h:1,t:ct?'$j=0$ : la limite existe, vaut $1$, et égale $f(1)$ : $f$ est continue en $1$.':'$j>0$ : limites à gauche et à droite différentes : aucun $\\ell$ ne convient, $f$ est discontinue en $1$ (saut).',c:ct?GRN:RED},{h:1,t:'Autres situations : discontinuité éliminable, limite infinie (asymptote verticale $x=a$), limite finie en $\\pm\\infty$ (asymptote horizontale).',c:MUT}]}}],
 draw:function(D,P,vis){var c=C(),p=LW(),o=eps(D);p.bg();p.grid(.5,.5);p.axes();p.ticks(1,1);
  p.clip(function(){var col=o.ok?'rgba(95,208,160,.16)':'rgba(255,122,122,.14)';p.rect(1-D.dl,D.l-D.e,1+D.dl,D.l+D.e,col,o.ok?GRN:RED,1.5);
   p.curve(function(x){return ff(D.j,x)},AMB,3.5,-.6,.99999,160);p.curve(function(x){return ff(D.j,x)},AMB,3.5,1,2.6,160);
   var i,n=240;for(i=1;i<=n;i++){var d=D.dl*i/n;[1-d,1+d].forEach(function(x){if(Math.abs(ff(D.j,x)-D.l)>=D.e)p.dot(x,ff(D.j,x),RED,2.5)})}
   p.ring(1,ff(D.j,1),AMB,7,2.5);p.dot(1,ff(D.j,1),AMB,5);if(D.j>0){p.ring(1,1,AMB,6,2)}
   p.line(-.6,D.l,2.6,D.l,'rgba(108,180,255,.5)',1.2,[6,5]);p.dot(1,D.l,BLU,9)});
  E.txt('ℓ',G.x+14,p.Y(D.l)-12,BLU,17,'left');E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var p=LW();return[
  {X:p.X(1),Y:p.Y(D.l),r:15,cur:'ns-resize',move:function(X,Y,P){P.l=rs(p.iY(Y),.05,.3,2.2)}},
  {X:p.X(2.35),Y:p.Y(D.l+D.e),r:15,cur:'ns-resize',move:function(X,Y,P){P.e=rs(p.iY(Y)-P.l,.05,.05,.8)}},
  {X:p.X(1+D.dl),Y:p.Y(.12),r:15,cur:'ew-resize',move:function(X,Y,P){P.dl=rs(p.iX(X)-1,.05,.05,1.2)}}]}});
})();

</script>
