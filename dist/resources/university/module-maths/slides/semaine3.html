    else rows=[['x','-\\infty','',nf(q.c1,2),'',nf(q.c2,2),'','+\\infty'],['f\'','',sgn(s),'0',sgn(-s),'0',sgn(s),''],['f','',a1,nf(q.f(q.c1),2),a2,nf(q.f(q.c2),2),a1,'']];
    return[{t:'f\'(x)=3k(x-c_1)(x-c_2)'},{tb:rows,tight:1}]}},
  {hd:'2 · Nature des points critiques',L:function(P){var q=cub(P),deg=Math.abs(P.c1-P.c2)<1e-9;if(deg)return[{h:1,t:'$c_1=c_2$ : $f\'$ ne change pas de signe, donc pas d’extremum : tangente horizontale en un point d’inflexion.',c:RED}];
    var m1=P.k>0?'maximum':'minimum',m2=P.k>0?'minimum':'maximum';return[{t:'f\'\'(x)=6k\\left(x-\\tfrac{c_1+c_2}{2}\\right)'},{h:1,t:'En $c_1='+nf(q.c1,2)+'$ : '+m1+' local, $f(c_1)='+nf(q.f(q.c1),2)+'$.',c:BLU},{h:1,t:'En $c_2='+nf(q.c2,2)+'$ : '+m2+' local, $f(c_2)='+nf(q.f(q.c2),2)+'$.',c:GRN}]}},
  {hd:'3 · Inflexion',L:function(P){var q=cub(P);return[{t:'x_i=\\dfrac{c_1+c_2}{2}='+nf(q.xi,3),c:VIO},{t:'f(x_i)='+nf(q.f(q.xi),3)},{h:1,t:'La concavité change en $x_i$ : $f\'\'$ s’annule en changeant de signe.',c:MUT}]}}],
 draw:function(D,P,vis){var c=C(),p=VW(),q=cub(D);p.bg();p.grid(1,1);p.axes();p.ticks(1,1);
  p.clip(function(){p.curve(q.f,AMB,3.5,-4.8,4.8,400);
   if(vis(1)){[q.c1,q.c2].forEach(function(cc,i){p.line(cc-.9,q.f(cc),cc+.9,q.f(cc),[BLU,GRN][i],2,[6,4])})}
   if(vis(2)){p.dot(q.c1,q.f(q.c1),BLU,8);p.dot(q.c2,q.f(q.c2),GRN,8)}
   if(vis(3)){p.dot(q.xi,q.f(q.xi),VIO,9);p.line(q.xi,-3.5,q.xi,3.55,'rgba(183,156,255,.4)',1.2,[5,5])}
   p.dot(q.c1,q.f(q.c1),BLU,9);p.dot(q.c2,q.f(q.c2),GRN,9)});
  E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var p=VW(),q=cub(D);return[
  {X:p.X(q.c1),Y:p.Y(q.f(q.c1)),r:16,cur:'move',move:function(X,Y,P){var c1=rs(p.iX(X),.25,-4,P.c2);P.c1=c1;var base=P.k*(c1*c1*c1-1.5*(c1+P.c2)*c1*c1+3*c1*P.c2*c1);P.m=rs(p.iY(Y)-base,.25,-3,3)}},
  {X:p.X(q.c2),Y:p.Y(q.f(q.c2)),r:16,cur:'ew-resize',move:function(X,Y,P){P.c2=rs(p.iX(X),.25,P.c1,4)}}]}});

/* ---------- 3.4 Optimisation : durée minimale d'un trajet ---------- */
var DD=120,DL=400;
var MA=function(){return E.plot(600,36,640,230,-20,440,-15,150)},MB=function(){return E.plot(600,276,640,230,-20,440,0,26)};
function tau(P,x){return 60*((x/1000)/P.v1+(Math.sqrt(DD*DD+(DL-x)*(DL-x))/1000)/P.v2)}
function opt(P){var xs=P.v2<P.v1?DL-DD*P.v2/Math.sqrt(P.v1*P.v1-P.v2*P.v2):0;xs=Math.max(0,Math.min(DL,xs));return{x:xs,t:tau(P,xs)}}
E.add({id:'optim',seance:'3.4',title:'Optimisation',hint:'Glissez le point de sortie de la route (carte ou courbe) ; curseurs : vitesses.',
 P:{x:200,v1:5,v2:2},tw:[],pre:function(P,D){D.x=P.x;D.v1=P.v1;D.v2=P.v2},
 sliders:[{k:'v1',lab:'v_1',min:2,max:8,step:.5,fmt:function(v){return nf(v,1)+' km/h'}},{k:'v2',lab:'v_2',min:1,max:8,step:.5,fmt:function(v){return nf(v,1)+' km/h'}}],
 steps:[
  {hd:'1 · Modéliser la durée',L:function(P){return[{h:1,t:'On marche $x$ mètres sur la route (vitesse $v_1$), puis en ligne droite dans le champ (vitesse $v_2$) jusqu’à l’objet situé à $d='+DD+'$ m de la route, au point d’abscisse $D='+DL+'$ m.'},{t:'\\tau(x)=\\dfrac{x}{v_1}+\\dfrac{\\sqrt{d^2+(D-x)^2}}{v_2}',c:AMB},{t:'x='+nf(P.x,0)+'\\text{ m}:\\ \\tau='+nf(tau(P,P.x),2)+'\\text{ min}',c:BLU}]}},
  {hd:'2 · Dériver et annuler',L:function(P){return[{t:'\\tau\'(x)=\\dfrac1{v_1}-\\dfrac{D-x}{v_2\\sqrt{d^2+(D-x)^2}}'},{t:'\\tau\'(x)=0\\iff\\sin\\alpha=\\dfrac{D-x}{\\sqrt{d^2+(D-x)^2}}=\\dfrac{v_2}{v_1}',c:GRN},{h:1,t:P.v2<P.v1?'Ici $v_2/v_1='+nf(P.v2/P.v1,3)+'<1$ : un point critique existe.':'$v_2\\geq v_1$ : $\\tau\'>0$ partout, le minimum est en $x=0$ (trajet direct).',c:P.v2<P.v1?GRN:RED}]}},
  {hd:'3 · Résultat et contrôle des bornes',L:function(P){var o=opt(P);return[{t:'x^*='+nf(o.x,1)+'\\text{ m},\\ \\tau^*='+nf(o.t,2)+'\\text{ min}',c:GRN},{t:'\\tau(0)='+nf(tau(P,0),2)+',\\ \\tau(D)='+nf(tau(P,DL),2)+'\\text{ min}',c:MUT},{h:1,t:'Le minimum se cherche sur $[0\\,;D]$ : on compare toujours avec les bornes.',c:MUT}]}}],
 draw:function(D,P,vis){var c=C(),A=MA(),B=MB(),o=opt(D),x=D.x;A.bg();A.clip(function(){A.rect(-20,0,440,150,'rgba(95,208,160,.07)');A.rect(-20,-15,440,15,'rgba(143,166,196,.18)');
   A.line(-20,0,440,0,MUT,2);if(vis(3)){A.line(o.x,0,DL,DD,'rgba(95,208,160,.55)',2,[6,5]);A.dot(o.x,0,GRN,7)}
   A.line(0,0,x,0,BLU,5);A.line(x,0,DL,DD,AMB,4);A.dot(0,0,E.INK,6);A.dot(DL,DD,RED,10);A.dot(x,0,AMB,9);A.line(DL,0,DL,DD,'rgba(244,241,234,.3)',1.2,[4,4])});
  E.txt('départ',A.X(0),A.Y(0)+20,E.INK,14,'center');E.txt('objet',A.X(DL)-30,A.Y(DD)-4,RED,14,'center');E.txt('route',A.X(150),A.Y(-8),MUT,14,'center');E.txt('champ',A.X(150),A.Y(100),GRN,14,'center');E.frameRect(600,36,640,230);
  B.bg();B.grid(100,5);B.axes();B.ticks(100,5);B.clip(function(){B.curve(function(u){return tau(D,u)},AMB,3,0,DL,200);if(vis(2)||vis(3)){B.line(o.x,0,o.x,o.t,GRN,1.5,[5,4]);B.dot(o.x,o.t,GRN,8)}B.dot(x,tau(D,x),AMB,9)});
  E.txt('τ (min)',B.x+40,B.y+16,MUT,14,'left');E.txt('x (m)',B.x+B.w-30,B.Y(0)-12,MUT,14,'center');E.frameRect(600,276,640,230)},
 handles:function(D){var A=MA(),B=MB();return[{X:A.X(D.x),Y:A.Y(0),r:16,cur:'ew-resize',move:function(X,Y,P){P.x=rs(A.iX(X),5,0,DL)}},{X:B.X(D.x),Y:B.Y(tau(D,D.x)),r:16,cur:'ew-resize',move:function(X,Y,P){P.x=rs(B.iX(X),5,0,DL)}}]}});
})();
