    var zz=(q[0][2]+q[1][2]+q[2][2]+q[3][2])/4;fs.push({pts:q,f:colorfn(zz/zk),a:alpha==null?.92:alpha,s:'rgba(15,27,45,.35)',lw:.6,sh:true})}

 draw:function(D,P,vis){var c=C(),p=RW(),n=Math.round(D.n),d=(D.b-D.a)/n,i;p.bg();p.grid(1,1);p.axes();p.ticks(1,1);

 draw:function(D,P,vis){var c=C(),p=PW();p.bg();p.grid(1,1);p.axes();p.ticks(1,2);
  p.clip(function(){var N=160,i,a=D.a,b=D.b;for(i=0;i<N;i++){var x0=a+(b-a)*i/N,x1=a+(b-a)*(i+1)/N,m=f2((x0+x1)/2);c.fillStyle=m>=0?'rgba(95,208,160,.32)':'rgba(255,122,122,.32)';c.fillRect(p.X(x0),Math.min(p.Y(0),p.Y(m)),p.X(x1)-p.X(x0)+.6,Math.abs(p.Y(m)-p.Y(0)))}

var f4=function(x){return 4-x*x};
var AW=function(){return E.plot(G.x,G.y,G.w,G.h,-3,3,-.4,4.0)};
function cg(a,b){var S=simp(f4,a,b),xg=simp(function(x){return x*f4(x)},a,b)/S,yg=simp(function(x){return f4(x)*f4(x)},a,b)/(2*S);return{S:S,xg:xg,yg:yg,m:S/(b-a)}}
E.add({id:'applis',seance:'4.4',title:'Applications',hint:'Glissez les bornes a et b ; observez l’aire, la moyenne et le centre de gravité.',
 P:{a:0,b:2},tw:[],pre:function(P,D){D.a=P.a;D.b=P.b},
 steps:[
  {hd:'1 · Aire sous la courbe',L:function(P){var q=cg(P.a,P.b);return[{t:'\\mathcal{A}=\\int_a^b f(x)\\,dx\\quad(f\\geq0)'},{t:'f(x)=4-x^2,\\ a='+nf(P.a,2)+',\\ b='+nf(P.b,2),c:AMB},{t:'\\mathcal{A}='+nf(q.S,4),c:GRN},{h:1,t:'Entre deux courbes ($f\\geq g$) : $\\int_a^b(f-g)$.',c:MUT}]}},
  {hd:'2 · Valeur moyenne',L:function(P){var q=cg(P.a,P.b);return[{t:'\\bar f=\\dfrac{1}{b-a}\\int_a^b f(x)\\,dx='+nf(q.m,4),c:BLU},{h:1,t:'Le rectangle de hauteur $\\bar f$ et de base $[a\\,;b]$ a la même aire que la région.',c:MUT}]}},
  {hd:'3 · Centre de gravité (plaque homogène)',L:function(P){var q=cg(P.a,P.b);return[{t:'x_G=\\dfrac{1}{\\mathcal{A}}\\int_a^b x f(x)\\,dx='+nf(q.xg,4),c:VIO},{t:'y_G=\\dfrac{1}{2\\mathcal{A}}\\int_a^b f(x)^2\\,dx='+nf(q.yg,4),c:VIO}]}}],
 draw:function(D,P,vis){var c=C(),p=AW(),q=cg(D.a,D.b);p.bg();p.grid(1,1);p.axes();p.ticks(1,1);
  p.clip(function(){p.fillBetween(f4,function(){return 0},'rgba(95,208,160,.28)',D.a,D.b,160);
   if(vis(2)){p.rect(D.a,0,D.b,q.m,'rgba(108,180,255,.10)',BLU,2)}
   p.curve(f4,AMB,3.5);p.dot(D.a,0,AMB,9);p.dot(D.b,0,AMB,9);
   if(vis(3)){p.line(q.xg,0,q.xg,q.yg,VIO,1.2,[4,4]);p.line(D.a,q.yg,q.xg,q.yg,VIO,1.2,[4,4]);p.dot(q.xg,q.yg,VIO,10);E.txt('G',p.X(q.xg)+14,p.Y(q.yg)-12,VIO,18,'left')}});
  E.txt('a',p.X(D.a),p.Y(0)+18,E.INK,16,'center');E.txt('b',p.X(D.b),p.Y(0)+18,E.INK,16,'center');E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var p=AW();return[{X:p.X(D.a),Y:p.Y(0),r:16,cur:'ew-resize',move:function(X,Y,P){P.a=rs(p.iX(X),.1,-2,P.b-.2)}},{X:p.X(D.b),Y:p.Y(0),r:16,cur:'ew-resize',move:function(X,Y,P){P.b=rs(p.iX(X),.1,P.a+.2,2)}}]}});
})();

</script>
<script>E.start();</script>
