  P3.bg();P3.clip(function(){E.floor3(P3,-3,3,-3,3,0,1);E.axes3(P3,3.3);
   E.line3(P3,[0,0,0],[M[0],M[1],0],AMB,3);
   R=Math.min(.55,D.rho*.5);pts=[];for(i=0;i<=24;i++){var t=D.phi*i/24;pts.push([R*Math.cos(t),R*Math.sin(t),0])}arc3(P3,pts,AMB,2.2);
   E.line3(P3,[M[0],M[1],0],M,MUT,2,[5,4]);
   if(vis(2)){E.line3(P3,[0,0,0],M,VIO,3);R=.6*Math.min(1,s.r*.5)+.2;pts=[];for(i=0;i<=24;i++){var a=s.th*i/24;pts.push([R*Math.sin(a)*Math.cos(D.phi),R*Math.sin(a)*Math.sin(D.phi),R*Math.cos(a)])}arc3(P3,pts,VIO,2.2)}
   E.dot3(P3,[M[0],M[1],0],AMB,6);E.dot3(P3,M,INK,9);
   E.txt3(P3,[M[0]*.5,M[1]*.5,0],'ρ',AMB,17,'center');
   E.txt3(P3,[R*.9*Math.cos(D.phi/2),R*.9*Math.sin(D.phi/2),0],'φ',AMB,16,'center');
   E.txt3(P3,[M[0],M[1],M[2]*.5],'z',MUT,16,'right');
   E.txt3(P3,[M[0]*1.06,M[1]*1.06,M[2]+.2],'M',INK,18,'left');
   if(vis(2)){E.txt3(P3,[M[0]*.5,M[1]*.5,M[2]*.5+.12],'r',VIO,17,'right');E.txt3(P3,[.8*Math.sin(s.th/2)*Math.cos(D.phi),.8*Math.sin(s.th/2)*Math.sin(D.phi),.8*Math.cos(s.th/2)],'θ',VIO,16,'center')}});
  E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){return shHandles(P2(),D,L2)}});

/* ---------- 5.3 Produit scalaire, projection, plan de normale u ---------- */
var cam3={yaw:-.7,pitch:.5};
var P3d=function(){return E.p3(G.x,G.y,G.w,G.h,60,[0,0,.5],cam3)};
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function nrm(a){return Math.sqrt(dot(a,a))}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function sc(a,k){return[a[0]*k,a[1]*k,a[2]*k]}
function add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function vecs(P){return{u:[P.ux,P.uy,P.uz],v:[P.vx,P.vy,P.vz]}}
function fmtV(a,d){return '('+nf(a[0],d)+',\\,'+nf(a[1],d)+',\\,'+nf(a[2],d)+')'}
E.add({id:'scalaire',seance:'5.3',title:'Produit scalaire',hint:'Glissez les pointes de u et v ; curseurs : altitudes ; fond : rotation.',
 P:{ux:2,uy:.5,uz:.5,vx:.5,vy:2,vz:1.4},tw:[],cam:cam3,rot:[G.x,G.y,G.w,G.h],
 pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'uz',lab:'uz',min:-2.5,max:2.5,step:.1,fmt:function(v){return nf(v,1)}},{k:'vz',lab:'vz',min:-2.5,max:2.5,step:.1,fmt:function(v){return nf(v,1)}}],
 steps:[
  {hd:'1 · Produit scalaire et angle',L:function(P){var w=vecs(P),d=dot(w.u,w.v),a=nrm(w.u),b=nrm(w.v),g=Math.acos(Math.max(-1,Math.min(1,d/(a*b))));return[{t:'u\\cdot v=u_xv_x+u_yv_y+u_zv_z='+nf(d,3),c:GRN},{t:'u\\cdot v=\\|u\\|\\,\\|v\\|\\cos\\gamma'},{t:'\\|u\\|='+nf(a,3)+',\\ \\|v\\|='+nf(b,3),c:AMB},{t:'\\gamma='+deg(g,1)+'^\\circ',c:VIO},{h:1,t:'Cauchy–Schwarz : $|u\\cdot v|\\leq\\|u\\|\\,\\|v\\|$, avec égalité si et seulement si $u$ et $v$ sont colinéaires.',c:MUT}]}},
  {hd:'2 · Projection orthogonale',L:function(P){var w=vecs(P),k=dot(w.u,w.v)/dot(w.u,w.u),p=sc(w.u,k),o=sub(w.v,p);return[{t:'p=\\dfrac{u\\cdot v}{\\|u\\|^2}\\,u',c:GRN},{t:'p='+fmtV(p,2)},{t:'v-p\\perp u:\\ (v-p)\\cdot u='+nf(z0(dot(o,w.u)),3),c:BLU},{t:'\\|v\\|^2=\\|p\\|^2+\\|v-p\\|^2',c:MUT},{h:1,t:'La projection $p$ est le point de la droite $\\mathbb{R}u$ le plus proche de $v$.',c:MUT}]}},
  {hd:'3 · Plan de normale u',L:function(P){var w=vecs(P),d=Math.abs(dot(w.u,w.v))/nrm(w.u);return[{t:'\\Pi:\\ u_xx+u_yy+u_zz=0',c:VIO},{t:'\\text{vecteur normal : }u'},{t:'d(v,\\Pi)=\\dfrac{|u\\cdot v|}{\\|u\\|}='+nf(d,3),c:GRN},{h:1,t:'La distance de $v$ au plan est la longueur de sa projection $p$ sur la normale.',c:MUT}]}}],
 draw:function(D,P,vis){var P3=P3d(),w=vecs(D),u=w.u,v=w.v,d=dot(u,v),a=nrm(u),b=nrm(v),k=d/(a*a),p=sc(u,k),q=sub(v,p),i,j,fs=[];
  var A=Math.abs(u[2])/a>.9?[1,0,0]:[0,0,1],e1=cross(u,A),n1=nrm(e1);e1=sc(e1,1/n1);var e2=sc(cross(u,e1),1/a);
  P3.bg();P3.clip(function(){E.floor3(P3,-3,3,-3,3,-2.5,1);E.axes3(P3,2.8);
   if(vis(3)){var N=6,S=2.3,Q=function(s,t){return add(sc(e1,s),sc(e2,t))};
    for(i=0;i<N;i++)for(j=0;j<N;j++){var s0=-S+2*S*i/N,s1=-S+2*S*(i+1)/N,t0=-S+2*S*j/N,t1=-S+2*S*(j+1)/N;
     fs.push({pts:[Q(s0,t0),Q(s1,t0),Q(s1,t1),Q(s0,t1)],f:'#9b7bd6',a:.16,s:'rgba(155,123,214,.35)',lw:.8})}
    E.flush(P3,fs)}
   var g=Math.acos(Math.max(-1,Math.min(1,d/(a*b)))),sg=Math.sin(g);
   if(sg>1e-3){var pts=[],R=.9,ua=sc(u,1/a),vb=sc(v,1/b);for(i=0;i<=20;i++){var t=i/20,dir=add(sc(ua,Math.sin((1-t)*g)/sg),sc(vb,Math.sin(t*g)/sg));pts.push(sc(dir,R))}arc3(P3,pts,VIO,2.2);
    var mid=add(ua,vb),mn=nrm(mid);if(mn>1e-6)E.txt3(P3,sc(mid,1.25/mn),'γ',VIO,17,'center')}
   if(vis(2)){E.line3(P3,v,p,MUT,2,[5,4]);E.arrow3(P3,[0,0,0],p,GRN,3.5);E.dot3(P3,p,GRN,6)}
   if(vis(3)){E.line3(P3,v,q,RED,2,[5,4]);E.dot3(P3,q,'#9b7bd6',6);E.txt3(P3,sc(add(v,q),.5),'d',RED,16,'left')}
   E.arrow3(P3,[0,0,0],u,AMB,3.5);E.arrow3(P3,[0,0,0],v,BLU,3.5);
   E.txt3(P3,sc(u,1.08),'u',AMB,19,'left');E.txt3(P3,sc(v,1.08),'v',BLU,19,'left');
   if(vis(2))E.txt3(P3,sc(p,1.0),'p',GRN,17,'right')});
  E.txt('u·v = '+nf(d,2).replace('{,}',','),G.x+16,G.y+22,GRN,19,'left');E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var P3=P3d(),w=vecs(D),a=P3.pr(w.u[0],w.u[1],w.u[2]),b=P3.pr(w.v[0],w.v[1],w.v[2]);
  function mk(key,zk,A){return{X:A.X,Y:A.Y,r:17,cur:'move',move:function(X,Y,P){var q=P3.un(X,Y,P[zk]),nx=rs(q.x,.1,-2.5,2.5),ny=rs(q.y,.1,-2.5,2.5);
    if(Math.hypot(nx,ny,P[zk])>=.3){P[key+'x']=nx;P[key+'y']=ny}}}}
  return[mk('u','uz',a),mk('v','vz',b)]}});

/* ---------- 5.4 Cellules élémentaires et volumes ---------- */
var cam4={yaw:-.7,pitch:.5};
var PA=function(){return E.p3(600,36,315,470,52,[0,0,1],cam4)},PB=function(){return E.p3(925,36,315,470,52,[0,0,1],cam4)};
var mapC=function(r,f,z){return[r*Math.cos(f),r*Math.sin(f),z]},mapS=function(r,t,f){return[r*Math.sin(t)*Math.cos(f),r*Math.sin(t)*Math.sin(f),r*Math.cos(t)]};
var CF=[AMB,BLU,GRN];
function cell(map,a,b){var fs=[],k,sd,n=4,i,j;
 for(k=0;k<3;k++)for(sd=0;sd<2;sd++){var o=[(k+1)%3,(k+2)%3];
  for(i=0;i<n;i++)for(j=0;j<n;j++){
   var q=function(ii,jj){var v=[0,0,0];v[k]=sd?b[k]:a[k];v[o[0]]=a[o[0]]+(b[o[0]]-a[o[0]])*ii/n;v[o[1]]=a[o[1]]+(b[o[1]]-a[o[1]])*jj/n;return map(v[0],v[1],v[2])};
   fs.push({pts:[q(i,j),q(i+1,j),q(i+1,j+1),q(i,j+1)],f:CF[k],a:.5,s:'rgba(15,27,45,.45)',lw:.7})}}
 return fs}
function vol(P){var h=P.h,s=sph(P),cy=((P.rho+h)*(P.rho+h)-P.rho*P.rho)/2*h*h,cya=P.rho*h*h*h,
  sp=((s.r+h)*(s.r+h)*(s.r+h)-s.r*s.r*s.r)/3*(Math.cos(s.th)-Math.cos(s.th+h))*h,spa=s.r*s.r*Math.sin(s.th)*h*h*h;return{cy:cy,cya:cya,sp:sp,spa:spa,s:s}}
var L4=[.4,2,.3,2.4];
E.add({id:'cellules',seance:'5.4',title:'Volumes élémentaires',hint:'Glissez M ou son ombre (dans l’un ou l’autre panneau) ; h : pas ; fond : rotation.',
 P:{rho:1.2,phi:.6,z:1,h:.6},tw:[],cam:cam4,rot:[600,36,640,470],
 pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'h',lab:'h',min:.15,max:.9,step:.05,fmt:function(v){return nf(v,2)}}],
 steps:[
  {hd:'1 · Cellule cylindrique',L:function(P){var v=vol(P);return[{t:'dV=\\rho\\,d\\rho\\,d\\varphi\\,dz',c:AMB},{t:'d\\rho=d\\varphi=dz=h='+nf(P.h,2)},{t:'\\text{base : }d\\rho\\ \\times\\ \\rho\\,d\\varphi\\,;\\ \\text{hauteur : }dz',c:MUT},{t:'V_{\\text{exact}}='+nf(v.cy,4)+',\\ \\rho\\,h^3='+nf(v.cya,4)}]}},
  {hd:'2 · Cellule sphérique',L:function(P){var v=vol(P);return[{t:'dV=r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\varphi',c:BLU},{t:'\\text{arêtes : }dr,\\ r\\,d\\theta,\\ r\\sin\\theta\\,d\\varphi'},{t:'r='+nf(v.s.r,2)+',\\ \\theta='+deg(v.s.th,0)+'^\\circ',c:VIO},{t:'V_{\\text{exact}}='+nf(v.sp,4)+',\\ r^2\\sin\\theta\\,h^3='+nf(v.spa,4)}]}},
  {hd:'3 · Contrôle et corps usuels',L:function(P){var v=vol(P);return[{t:'\\dfrac{\\rho h^3}{V_{\\text{exact}}}='+nf(v.cya/v.cy,3),c:AMB},{t:'\\dfrac{r^2\\sin\\theta\\,h^3}{V_{\\text{exact}}}='+nf(v.spa/v.sp,3),c:BLU},{h:1,t:'Les rapports tendent vers 1 quand $h\\to0$ : la cellule est un parallélépipède à l’ordre dominant.',c:MUT},{t:'\\text{cylindre : }\\pi R^2H\\,;\\ \\text{boule : }\\dfrac{4}{3}\\pi R^3',c:GRN}]}}],
 draw:function(D,P,vis){var pA=PA(),pB=PB(),M=pt(D),s=sph(D),h=D.h,pn=[[pA,'Cylindriques'],[pB,'Sphériques']];
  pn.forEach(function(q,idx){var P3=q[0];P3.bg();P3.clip(function(){E.floor3(P3,-2,2,-2,2,0,1);E.axes3(P3,2.4);
    var fs=idx===0?cell(mapC,[D.rho,D.phi,D.z],[D.rho+h,D.phi+h,D.z+h]):cell(mapS,[s.r,s.th,D.phi],[s.r+h,s.th+h,D.phi+h]);
    E.line3(P3,[M[0],M[1],0],M,MUT,1.5,[5,4]);E.flush(P3,fs);
    if(vis(2)){var C0,e;
     if(idx===0){C0=mapC(D.rho,D.phi,D.z);e=[[mapC(D.rho+h,D.phi,D.z),'dρ'],[mapC(D.rho,D.phi+h,D.z),'ρ dφ'],[mapC(D.rho,D.phi,D.z+h),'dz']]}
     else{C0=mapS(s.r,s.th,D.phi);e=[[mapS(s.r+h,s.th,D.phi),'dr'],[mapS(s.r,s.th+h,D.phi),'r dθ'],[mapS(s.r,s.th,D.phi+h),'r sinθ dφ']]}
     e.forEach(function(x,i){E.arrow3(P3,C0,x[0],['#ffffff',INK,'#ffffff'][i],2.5);E.txt3(P3,[(C0[0]+x[0][0])/2,(C0[1]+x[0][1])/2,(C0[2]+x[0][2])/2],x[1],INK,13,'center')})}
    E.dot3(P3,[M[0],M[1],0],AMB,5);E.dot3(P3,M,INK,7)});
   E.txt(q[1],P3.x0+10,P3.y0+18,idx?BLU:AMB,16,'left');E.frameRect(P3.x0,P3.y0,P3.w,P3.h)});
  if(vis(3)){var v=vol(D);E.txt('dV ≈ ρ h³',pA.x0+pA.w-10,pA.y0+pA.h-16,AMB,15,'right');E.txt('dV ≈ r² sinθ h³',pB.x0+pB.w-10,pB.y0+pB.h-16,BLU,15,'right')}},
 handles:function(D){return shHandles(PA(),D,L4,15).concat(shHandles(PB(),D,L4,15))}});
})();

</script>
