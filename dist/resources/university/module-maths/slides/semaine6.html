 handles:function(D){var P3=P3a(),w=V3(D);
  function mk(key,zk,v){var A=P3.pr(v[0],v[1],v[2]);return{X:A.X,Y:A.Y,r:17,cur:'move',move:function(X,Y,P){var q=P3.un(X,Y,P[zk]);P[key+'x']=rs(q.x,.1,-2.5,2.5);P[key+'y']=rs(q.y,.1,-2.5,2.5)}}}
  return[mk('a','az',w.a),mk('b','bz',w.b),mk('c','cz',w.c)]}});

/* ---------- 6.3 Systèmes 3×3 : trois plans ---------- */
var cam3={yaw:-.7,pitch:.5};
var P3b=function(){return E.p3(G.x,G.y,G.w,G.h,66,[0,0,.4],cam3)};
function M3(t){return[[1,1,0],[0,1,1],[t,0,1]]}
function mv(M,x){return[dot(M[0],x),dot(M[1],x),dot(M[2],x)]}
function planeFs(n,b,col,N,S){var nn=nrm(n),u=sc(n,1/nn),f=sc(u,b/nn),A=Math.abs(u[2])>.9?[1,0,0]:[0,0,1],e1=cross(u,A);e1=sc(e1,1/nrm(e1));var e2=cross(u,e1),fs=[],i,j,Q=function(s,t){return add(f,add(sc(e1,s),sc(e2,t)))};
 for(i=0;i<N;i++)for(j=0;j<N;j++){var s0=-S+2*S*i/N,s1=-S+2*S*(i+1)/N,t0=-S+2*S*j/N,t1=-S+2*S*(j+1)/N;fs.push({pts:[Q(s0,t0),Q(s1,t0),Q(s1,t1),Q(s0,t1)],f:col,a:.17,s:'rgba(244,241,234,.18)',lw:.6})}
 return fs}
E.add({id:'systeme',seance:'6.3',title:'Systèmes linéaires',hint:'Glissez X (ou son ombre) ; t incline le 3e plan ; t = −1 : dégénéré.',
 P:{x:1,y:.6,z:.8,t:.4},tw:[],cam:cam3,rot:[G.x,G.y,G.w,G.h],
 pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'t',lab:'t',min:-1.5,max:1,step:.05,fmt:function(v){return nf(v,2)}}],
 steps:[
  {hd:'1 · Écriture matricielle',L:function(P){var M=M3(P.t),b=mv(M,[P.x,P.y,P.z]);return[{t:'AX=b,\\quad A=\\begin{pmatrix}1&1&0\\\\0&1&1\\\\t&0&1\\end{pmatrix}',c:AMB},{t:'t='+nf(P.t,2)+',\\ b=('+nf(b[0],2)+',\\,'+nf(b[1],2)+',\\,'+nf(b[2],2)+')'},{h:1,t:'Chaque ligne de $AX=b$ est l’équation d’un plan ; la ligne $i$ est un vecteur normal.',c:MUT}]}},
  {hd:'2 · Solution unique',L:function(P){var d=1+P.t;return[{t:'\\det A=1+t='+nf(d,2),c:Math.abs(d)<1e-6?RED:GRN},{t:'\\det A\\neq0\\Rightarrow X=A^{-1}b',c:BLU},{t:'A^{-1}=\\dfrac{1}{\\det A}\\,{}^t\\mathrm{com}(A)'},{t:Math.abs(d)<1e-6?'\\text{rien à inverser}':'X=('+nf(P.x,2)+',\\,'+nf(P.y,2)+',\\,'+nf(P.z,2)+')',c:GRN}]}},
  {hd:'3 · Cas dégénéré',L:function(P){var d=1+P.t;return[{t:'t=-1:\\ \\text{ligne}_3=-(\\text{ligne}_1-\\text{ligne}_2)',c:AMB},{t:'\\det A=0\\Rightarrow\\text{rang}\\ A=2',c:RED},{h:1,t:Math.abs(d)<1e-6?'Les trois plans contiennent une même droite : il y a une infinité de solutions, car le second membre a été construit à partir d’une solution.':'Pour un second membre quelconque, les plans formeraient alors un prisme : aucune solution.',c:MUT}]}}],
 draw:function(D,P,vis){var P3=P3b(),M=M3(D.t),X=[D.x,D.y,D.z],b=mv(M,X),fs=[],cols=[AMB,BLU,GRN];P3.bg();
  P3.clip(function(){E.floor3(P3,-3,3,-3,3,-2.2,1);E.axes3(P3,2.6);
   for(var i=0;i<3;i++)fs=fs.concat(planeFs(M[i],b[i],cols[i].length===7?cols[i]:AMB,5,2.2));
   E.flush(P3,fs);
   if(Math.abs(1+D.t)<1e-6){var k=cross(M[0],M[1]);k=sc(k,1/nrm(k));E.line3(P3,sub(X,sc(k,2.8)),add(X,sc(k,2.8)),RED,3.5)}
   E.line3(P3,[X[0],X[1],-2.2],[X[0],X[1],X[2]],MUT,1.5,[5,4]);
   E.dot3(P3,[X[0],X[1],-2.2],AMB,5);E.dot3(P3,X,INK,9);E.txt3(P3,add(X,[.1,.1,.25]),'X',INK,18,'left')});
  E.txt('plan 1',G.x+14,G.y+20,AMB,15,'left');E.txt('plan 2',G.x+14,G.y+40,BLU,15,'left');E.txt('plan 3',G.x+14,G.y+60,GRN,15,'left');
  if(Math.abs(1+D.t)<1e-6)E.txt('det A = 0 : droite de solutions',G.x+G.w-14,G.y+22,RED,17,'right');
  E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var P3=P3b(),a=P3.pr(D.x,D.y,-2.2),b=P3.pr(D.x,D.y,D.z);return[
  {X:b.X,Y:b.Y,r:16,cur:'ns-resize',move:function(X,Y,P){P.z=rs(P3.unz(X,Y,P.x,P.y),.1,-2,2)}},
  {X:a.X,Y:a.Y,r:16,cur:'move',move:function(X,Y,P){var q=P3.un(X,Y,-2.2);P.x=rs(q.x,.1,-2,2);P.y=rs(q.y,.1,-2,2)}}]}});

/* ---------- 6.4 Vecteurs propres (matrice symétrique) — ouverture hors programme ---------- */
function eig(a,b,d){var m=(a+d)/2,r=Math.sqrt(((a-d)/2)*((a-d)/2)+b*b),l1=m+r,l2=m-r,v1,v2;
 if(Math.abs(b)>1e-9){v1=[b,l1-a];v2=[b,l2-a]}else if(a>=d){v1=[1,0];v2=[0,1]}else{v1=[0,1];v2=[1,0]}
 var n1=Math.hypot(v1[0],v1[1]),n2=Math.hypot(v2[0],v2[1]);return[{l:l1,v:[v1[0]/n1,v1[1]/n1]},{l:l2,v:[v2[0]/n2,v2[1]/n2]}]}
E.add({id:'propres',seance:'6.4',title:'Vecteurs propres',hint:'Glissez x sur le cercle unité ; curseurs : coefficients de la matrice symétrique A.',
 P:{a:2,b:1,d:1,th:.5},tw:[],pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'a',lab:'a',min:-1,max:3,step:.1,fmt:function(v){return nf(v,1)}},{k:'b',lab:'b',min:-2,max:2,step:.1,fmt:function(v){return nf(v,1)}},{k:'d',lab:'d',min:-1,max:3,step:.1,fmt:function(v){return nf(v,1)}}],
 steps:[
  {hd:'1 · Image du cercle unité',L:function(P){return[{t:'A='+pm(P.a,P.b,P.b,P.d,1)+'\\ \\text{(symétrique)}',c:AMB},{t:'\\{Ax:\\ \\|x\\|=1\\}\\ \\text{est une ellipse}',c:BLU},{h:1,t:'Ouverture : cette section dépasse le cadre du module (diagonalisation hors programme) — à traiter comme prolongement.',c:MUT}]}},
  {hd:'2 · Vecteurs propres',L:function(P){var x=[Math.cos(P.th),Math.sin(P.th)],y=[P.a*x[0]+P.b*x[1],P.b*x[0]+P.d*x[1]],cr=x[0]*y[1]-x[1]*y[0];return[{t:'Ax=\\lambda x,\\ x\\neq0',c:GRN},{t:'x\\parallel Ax\\iff\\ x_1(Ax)_2-x_2(Ax)_1=0'},{t:'\\text{valeur courante : }'+nf(z0(cr),3),c:Math.abs(cr)<.03?GRN:AMB}]}},
  {hd:'3 · Valeurs propres',L:function(P){var e=eig(P.a,P.b,P.d),tr=P.a+P.d,de=P.a*P.d-P.b*P.b;return[{t:'\\lambda^2-\\mathrm{tr}(A)\\,\\lambda+\\det A=0',c:VIO},{t:'\\mathrm{tr}='+nf(tr,2)+',\\ \\det='+nf(de,2)},{t:'\\lambda_1='+nf(e[0].l,3)+',\\ \\lambda_2='+nf(e[1].l,3),c:GRN},{h:1,t:'Matrice symétrique réelle : les deux valeurs propres sont réelles et les vecteurs propres associés à deux valeurs propres distinctes sont orthogonaux. Pour une valeur propre double, on peut choisir une base propre orthonormée.',c:MUT}]}}],
 draw:function(D,P,vis){var c=C(),p=P2(),e=eig(D.a,D.b,D.d),x=[Math.cos(D.th),Math.sin(D.th)],y=[D.a*x[0]+D.b*x[1],D.b*x[0]+D.d*x[1]],cr=x[0]*y[1]-x[1]*y[0],on=Math.abs(cr)<.03*Math.max(1,Math.hypot(y[0],y[1])),i;p.bg();
  p.clip(function(){p.grid(1,1);p.axes();
   p.curveXY(function(t){return Math.cos(t)},function(t){return Math.sin(t)},MUT,1.8,0,2*PI,120);
   p.curveXY(function(t){return D.a*Math.cos(t)+D.b*Math.sin(t)},function(t){return D.b*Math.cos(t)+D.d*Math.sin(t)},BLU,3,0,2*PI,200);
   if(vis(2)||vis(3))e.forEach(function(q){p.line(-5*q.v[0],-5*q.v[1],5*q.v[0],5*q.v[1],VIO,1.6,[6,5])});
   p.arrow(0,0,x[0],x[1],AMB,4);p.arrow(0,0,y[0],y[1],GRN,4);p.dot(x[0],x[1],AMB,8);p.dot(y[0],y[1],GRN,6);
   p.line(x[0],x[1],y[0],y[1],MUT,1.2,[3,4]);
   if(vis(2)&&on)p.ring(x[0],x[1],GRN,16,3)});
  p.ticks(1,1);E.txt('x',p.X(x[0])+12,p.Y(x[1])-12,AMB,17,'left');E.txt('Ax',p.X(y[0])+12,p.Y(y[1])-12,GRN,17,'left');
  if(vis(2)&&on)E.txt('x est propre : Ax ∥ x',G.x+G.w-14,G.y+22,GRN,17,'right');
  if(vis(3)){E.txt('λ₁ = '+nf(e[0].l,2).replace('{,}',','),G.x+14,G.y+20,VIO,16,'left');E.txt('λ₂ = '+nf(e[1].l,2).replace('{,}',','),G.x+14,G.y+40,VIO,16,'left')}
  E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var p=P2();return[{X:p.X(Math.cos(D.th)),Y:p.Y(Math.sin(D.th)),r:17,cur:'move',move:function(X,Y,P){var th=Math.atan2(p.iY(Y),p.iX(X));if(th<0)th+=2*PI;P.th=rs(th,.02,0,6.28)}}]}});
})();
