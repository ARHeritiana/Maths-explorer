/* ---------- 7.3 Intégrale double en polaires : colonnes et jacobien r ---------- */
var cam3={yaw:-.7,pitch:.5},ZK=.6;
var P3c=function(){return E.p3(G.x,G.y,G.w,G.h,90,[0,0,1],cam3)};
var g3=function(r){return 4-r*r};
function cols(R,Th,m){var na=Math.max(2,Math.round(m*1.5)),dr=R/m,dt=Th/na,i,j,fs=[],S=0,Pp=function(r,t,z){return[r*Math.cos(t),r*Math.sin(t),z*ZK]};
 for(i=0;i<m;i++)for(j=0;j<na;j++){var r0=i*dr,r1=r0+dr,t0=j*dt,t1=t0+dt,rm=(r0+r1)/2,h=g3(rm),col=(i+j)%2?'#6cb4ff':'#5fd0a0';
  S+=h*rm*dr*dt;
  var A=Pp(r0,t0,0),B=Pp(r1,t0,0),Cc=Pp(r1,t1,0),Dd=Pp(r0,t1,0),A2=Pp(r0,t0,h),B2=Pp(r1,t0,h),C2=Pp(r1,t1,h),D2=Pp(r0,t1,h),st='rgba(15,27,45,.5)';
  fs.push({pts:[A,B,B2,A2],f:col,a:.6,s:st,lw:.5},{pts:[B,Cc,C2,B2],f:col,a:.6,s:st,lw:.5},{pts:[Cc,Dd,D2,C2],f:col,a:.6,s:st,lw:.5},{pts:[Dd,A,A2,D2],f:col,a:.6,s:st,lw:.5},{pts:[A2,B2,C2,D2],f:col,a:.8,s:st,lw:.5})}
 return{fs:fs,S:S,na:na}}
E.add({id:'polairesint',seance:'7.3',title:'Intégrale double',hint:'Glissez le point au sol (R, Θ) ; curseur m : finesse du découpage ; fond : rotation.',
 P:{R:1.8,Th:3.6,m:4},tw:[],cam:cam3,rot:[G.x,G.y,G.w,G.h],pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'m',lab:'m',min:1,max:7,step:1,fmt:function(v){return String(v)}},{k:'R',lab:'R',min:.6,max:2,step:.1,fmt:function(v){return nf(v,1)}},{k:'Th',lab:'Θ',min:.6,max:6.25,step:.05,fmt:degFmt}],
 steps:[
  {hd:'1 · Somme sur des cellules polaires',L:function(P){var c=cols(P.R,P.Th,Math.round(P.m));return[{t:'V\\approx\\sum_{i,j}f(r_i,\\theta_j)\\,\\Delta A_{ij}',c:AMB},{t:'f(x,y)=4-x^2-y^2=4-r^2'},{t:'m='+Math.round(P.m)+'\\ \\text{couronnes},\\ '+c.na+'\\ \\text{secteurs}',c:MUT},{t:'S='+nf(c.S,4),c:BLU}]}},
  {hd:'2 · Le jacobien vaut r',L:function(P){return[{t:'x=r\\cos\\theta,\\ y=r\\sin\\theta'},{t:'\\dfrac{\\partial(x,y)}{\\partial(r,\\theta)}=\\begin{vmatrix}\\cos\\theta&-r\\sin\\theta\\\\\\sin\\theta&r\\cos\\theta\\end{vmatrix}=r',c:GRN},{t:'dA=r\\,dr\\,d\\theta',c:AMB},{h:1,t:'Une cellule polaire est presque un rectangle $dr\\times r\\,d\\theta$.',c:MUT}]}},
  {hd:'3 · Valeur exacte (Fubini)',L:function(P){var c=cols(P.R,P.Th,Math.round(P.m)),V=P.Th*(2*P.R*P.R-Math.pow(P.R,4)/4);return[{t:'V=\\int_0^{\\Theta}\\!\\!\\int_0^{R}(4-r^2)\\,r\\,dr\\,d\\theta',c:AMB},{t:'V=\\Theta\\Big(2R^2-\\dfrac{R^4}{4}\\Big)='+nf(V,4),c:GRN},{t:'\\text{écart }|V-S|='+nf(Math.abs(V-c.S),4),c:BLU}]}}],
 draw:function(D,P,vis){var P3=P3c(),c=cols(D.R,D.Th,Math.round(D.m)),i,pts;P3.bg();
  P3.clip(function(){E.floor3(P3,-2.2,2.2,-2.2,2.2,0,1);E.axes3(P3,2.5);
   if(vis(1))E.flush(P3,c.fs);
   pts=[];for(i=0;i<=40;i++){var t=D.Th*i/40;pts.push([D.R*Math.cos(t),D.R*Math.sin(t),0])}E.poly3(P3,[[0,0,0]].concat(pts,[[0,0,0]]),AMB,2.5,false);
   [0,D.Th].forEach(function(t){var q=[];for(i=0;i<=16;i++){var r=D.R*i/16;q.push([r*Math.cos(t),r*Math.sin(t),g3(r)*ZK])}E.poly3(P3,q,'rgba(244,241,234,.55)',1.5,false)});
   pts=[];for(i=0;i<=40;i++){var t2=D.Th*i/40;pts.push([D.R*Math.cos(t2),D.R*Math.sin(t2),g3(D.R)*ZK])}E.poly3(P3,pts,'rgba(244,241,234,.7)',2,false);
   E.dot3(P3,[D.R*Math.cos(D.Th),D.R*Math.sin(D.Th),0],AMB,7)});
  E.txt('z = 4 − r²  (échelle verticale réduite)',G.x+14,G.y+20,MUT,14,'left');
  E.txt('S = '+nf(c.S,3).replace('{,}',','),G.x+G.w-14,G.y+22,BLU,18,'right');E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var P3=P3c(),a=P3.pr(D.R*Math.cos(D.Th),D.R*Math.sin(D.Th),0);return[{X:a.X,Y:a.Y,r:17,cur:'move',move:function(X,Y,P){var q=P3.un(X,Y,0),th=mod2(Math.atan2(q.y,q.x)),d=th-P.Th;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;
   P.R=rs(Math.hypot(q.x,q.y),.1,.6,2);P.Th=rs(P.Th+d,.05,.6,6.25)}}]}});

/* ---------- 7.4 EDO du premier ordre : champ de pentes ---------- */
var SP=function(){return E.plot(G.x,G.y,G.w,G.h,-1,6,-4,4)};
function sol1(P,t){return Math.abs(P.a)<1e-9?P.y0+P.b*t:P.b/P.a+(P.y0-P.b/P.a)*Math.exp(-P.a*t)}
E.add({id:'edo1',seance:'7.4',title:'EDO d’ordre 1',hint:'Glissez la condition initiale (t=0) et le niveau d’équilibre ; curseurs a, b.',
 P:{a:.8,b:1.6,y0:-2.5},tw:[],pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'a',lab:'a',min:-1.5,max:1.5,step:.1,fmt:function(v){return nf(v,1)}},{k:'b',lab:'b',min:-3,max:3,step:.1,fmt:function(v){return nf(v,1)}},{k:'y0',lab:'y₀',min:-3.8,max:3.8,step:.1,fmt:function(v){return nf(v,1)}}],
 steps:[
  {hd:'1 · Champ de pentes',L:function(P){return[{t:'y\'(t)=-a\\,y(t)+b',c:AMB},{t:'a='+nf(P.a,1)+',\\ b='+nf(P.b,1)},{h:1,t:'En chaque point $(t,y)$ la pente de la solution est imposée : le champ de pentes.',c:MUT}]}},
  {hd:'2 · Solution générale',L:function(P){var a=P.a;return[{t:'y_h(t)=Ce^{-at}',c:BLU},{t:Math.abs(a)<1e-9?'a=0:\\ y(t)=y_0+bt':'y_p=\\dfrac{b}{a}='+nf(P.b/a,2)+'\\ \\text{(équilibre)}',c:GRN},{t:'y(t)=\\dfrac{b}{a}+\\Big(y_0-\\dfrac{b}{a}\\Big)e^{-at}'}]}},
  {hd:'3 · Condition initiale, stabilité',L:function(P){return[{t:'y(0)=y_0='+nf(P.y0,1),c:AMB},{h:1,t:Math.abs(P.a)<1e-9?'$a=0$ : pas d’équilibre, croissance affine.':(P.a>0?'$a>0$ : toutes les solutions convergent vers l’équilibre (stable).':'$a<0$ : les solutions s’éloignent de l’équilibre (instable).'),c:P.a>0?GRN:RED}]}}],
 draw:function(D,P,vis){var c=C(),p=SP(),sx=p.X(1)-p.X(0),sy=p.Y(0)-p.Y(1),t,y;p.bg();p.grid(1,1);p.axes();p.ticks(1,1);
  p.clip(function(){
   c.strokeStyle='rgba(143,166,196,.55)';c.lineWidth=1.6;c.beginPath();
   for(t=-.75;t<=6;t+=.5)for(y=-3.75;y<=4;y+=.5){var s=-D.a*y+D.b,vx=1*sx/sx,vy=s*sy/sx,n=Math.sqrt(1+vy*vy),dx=9*vx/n,dy=9*vy/n,X=p.X(t),Y=p.Y(y);c.moveTo(X-dx,Y+dy);c.lineTo(X+dx,Y-dy)}c.stroke();
   if(Math.abs(D.a)>1e-9&&vis(2))p.line(-1,D.b/D.a,6,D.b/D.a,GRN,2,[7,5]);
   if(vis(2)){p.curve(function(t){return sol1(D,t)},AMB,3.5,-1,6,260)}
   p.dot(0,D.y0,AMB,9)});
  if(vis(2)&&Math.abs(D.a)>1e-9)E.txt('y = b/a',G.x+G.w-12,p.Y(D.b/D.a)-12,GRN,15,'right');
  E.frameRect(G.x,G.y,G.w,G.h)},
 handles:function(D){var p=SP(),h=[{X:p.X(0),Y:p.Y(D.y0),r:17,cur:'ns-resize',move:function(X,Y,P){P.y0=rs(p.iY(Y),.1,-3.8,3.8)}}];
  if(Math.abs(D.a)>1e-9)h.push({X:p.X(5.5),Y:p.Y(D.b/D.a),r:15,cur:'ns-resize',move:function(X,Y,P){P.b=rs(P.a*p.iY(Y),.1,-3,3)}});return h}});

/* ---------- 7.5 EDO du second ordre : racines caractéristiques ---------- */
var MP=function(){return E.plot(600,36,400,470,-.5,8,-4,4)},CP=function(){return E.plot(1010,36,230,470,-3,1,-4.1,4.1)};
function rts(P){var d=P.p*P.p-4*P.q;if(d>1e-9){var s=Math.sqrt(d);return{k:'r',r1:(-P.p+s)/2,r2:(-P.p-s)/2,d:d}}if(d>=-1e-9)return{k:'d',r1:-P.p/2,r2:-P.p/2,d:0};return{k:'c',al:-P.p/2,be:Math.sqrt(-d)/2,d:d}}
function sol2(P,t){var R=rts(P),y0=P.y0,v0=P.v0;
 if(R.k==='r'){var C1=(v0-R.r2*y0)/(R.r1-R.r2);return C1*Math.exp(R.r1*t)+(y0-C1)*Math.exp(R.r2*t)}
 if(R.k==='d')return(y0+(v0-R.r1*y0)*t)*Math.exp(R.r1*t);
 return Math.exp(R.al*t)*(y0*Math.cos(R.be*t)+(v0-R.al*y0)/R.be*Math.sin(R.be*t))}
function fromRoots(P,a,b){P.p=rs(-(a+b),.1,-1,4);P.q=rs(a*b,.1,-1,6)}
E.add({id:'edo2',seance:'7.5',title:'EDO d’ordre 2',hint:'Glissez y(0) et la pente initiale (à gauche) ; glissez les racines dans le plan à droite.',
 P:{p:1,q:2.3,y0:2,v0:0},tw:[],pre:function(P,D){for(var k in P)D[k]=P[k]},
 sliders:[{k:'p',lab:'p',min:-1,max:4,step:.1,fmt:function(v){return nf(v,1)}},{k:'q',lab:'q',min:-1,max:6,step:.1,fmt:function(v){return nf(v,1)}}],
 steps:[
  {hd:'1 · Équation caractéristique',L:function(P){var d=P.p*P.p-4*P.q;return[{t:'y\'\'+p\\,y\'+q\\,y=0',c:AMB},{t:'y=e^{rt}\\Rightarrow r^2+pr+q=0',c:BLU},{t:'\\Delta=p^2-4q='+nf(d,2),c:d>1e-9?GRN:(d<-1e-9?VIO:AMB)}]}},
  {hd:'2 · Les trois cas',L:function(P){var R=rts(P);return[{t:'\\Delta>0:\\ y=C_1e^{r_1t}+C_2e^{r_2t}',c:R.k==='r'?GRN:MUT},{t:'\\Delta=0:\\ y=(C_1+C_2t)\\,e^{rt}',c:R.k==='d'?AMB:MUT},{t:'\\Delta<0:\\ y=e^{\\alpha t}(C_1\\cos\\beta t+C_2\\sin\\beta t)',c:R.k==='c'?VIO:MUT},{t:R.k==='c'?'r='+nf(R.al,2)+'\\pm i\\,'+nf(R.be,2):'r_1='+nf(R.r1,2)+',\\ r_2='+nf(R.r2,2)}]}},
  {hd:'3 · Conditions initiales',L:function(P){var R=rts(P);return[{t:'y(0)='+nf(P.y0,1)+',\\ y\'(0)='+nf(P.v0,1),c:AMB},{h:1,t:R.k==='c'?(R.al<-1e-9?'Partie réelle $<0$ : oscillations amorties.':(R.al>1e-9?'Partie réelle $>0$ : oscillations qui croissent.':'Partie réelle nulle : oscillations entretenues.')):'Racines réelles : pas d’oscillation, au plus un changement de signe.',c:MUT}]}}],
 draw:function(D,P,vis){var c=C(),p=MP(),q=CP(),R=rts(D),y0=D.y0,v0=D.v0;p.bg();p.grid(1,1);p.axes();p.ticks(1,1);
  p.clip(function(){p.line(0,y0,1.2,y0+1.2*v0,MUT,1.8,[5,4]);p.curve(function(t){return sol2(D,t)},AMB,3.5,0,8,320);p.dot(0,y0,AMB,9);p.dot(1,y0+v0,GRN,7)});
  E.txt('t ↦ y(t)',p.x+12,p.y+18,MUT,15,'left');E.frameRect(600,36,400,470);
  q.bg();q.grid(1,1);q.axes();q.ticks(1,1);
  q.clip(function(){if(R.k==='c'){q.dot(R.al,R.be,VIO,8);q.dot(R.al,-R.be,VIO,8);q.line(R.al,-R.be,R.al,R.be,VIO,1.2,[4,4])}else{q.dot(R.r1,0,R.k==='d'?AMB:GRN,8);q.dot(R.r2,0,R.k==='d'?AMB:GRN,8)}});
  E.txt('racines (Re ; Im)',q.x+10,q.y+18,MUT,14,'left');E.frameRect(1010,36,230,470)},
 handles:function(D){var p=MP(),q=CP(),R=rts(D),h=[{X:p.X(0),Y:p.Y(D.y0),r:17,cur:'ns-resize',move:function(X,Y,P){P.y0=rs(p.iY(Y),.1,-3.5,3.5)}},
  {X:p.X(1),Y:p.Y(D.y0+D.v0),r:15,cur:'ns-resize',move:function(X,Y,P){P.v0=rs(p.iY(Y)-P.y0,.1,-4,4)}}];
  if(R.k==='c')h.push({X:q.X(R.al),Y:q.Y(R.be),r:16,cur:'move',move:function(X,Y,P){var a=q.iX(X),b=q.iY(Y);if(b<.15)fromRoots(P,a,a);else{P.p=rs(-2*a,.1,-1,4);P.q=rs(a*a+b*b,.1,-1,6)}}});
  else[R.r1,R.r2].forEach(function(r,i){h.push({X:q.X(r),Y:q.Y(0),r:16,cur:'move',move:function(X,Y,P){var Rr=rts(P),o=i?Rr.r1:Rr.r2,a=q.iX(X),b=Math.abs(q.iY(Y));if(Rr.k==='c')return;if(b>.35){var al=(a+o)/2;P.p=rs(-2*al,.1,-1,4);P.q=rs(al*al+b*b,.1,-1,6)}else fromRoots(P,a,o)}})});
  return h}});
})();

</script>
<script>E.start();</script>
