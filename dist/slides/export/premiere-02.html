<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Première spécialité","Première · Mathematics specialism"],"id":"premiere-02","course":"premiere","number":2,"title":["Second degré : formes et choix de méthode","Quadratics: forms and methods"],"slides":[{"k":"title","t":["Second degré : formes et choix de méthode","Quadratics: forms and methods"],"b":["",""]},{"k":"goals","t":["Le parcours du chapitre","Chapter path"],"b":["<b>Objectifs.<\/b> Choisir une forme adaptée à une question ; passer entre des formes dans des cas simples ; démontrer et utiliser la formule des racines ; justifier un signe et résoudre une inéquation ; optimiser en tenant compte du domaine.<br><br><b>Prérequis.<\/b> Développer et factoriser, identités remarquables, produit nul, signe d’un produit, racines carrées et lecture d’une courbe.","<b>Objectives.<\/b> Choose a form suited to a question; switch forms in simple cases; prove and use the root formula; justify signs and solve inequalities; optimise while respecting the domain.<br><br><b>Prerequisites.<\/b> Expansion, factorisation, special products, zero-product property, signs of products, square roots and reading graphs."]},{"k":"try","t":["Avant le second degré","Before quadratics"],"b":["Développer \\((x-2)^2\\). Résoudre \\((x-3)(x+1)=0\\). Pourquoi \\(u^2\\) est-il positif ou nul pour tout réel \\(u\\) ?","Expand \\((x-2)^2\\), solve \\((x-3)(x+1)=0\\), and explain why a real square is nonnegative."],"stage":"diagnostic","difficulty":1,"a":["\\((x-2)^2=x^2-4x+4\\) : le terme en \\(x\\) ne doit pas être oublié. Un produit est nul si et seulement si un facteur est nul : \\(x=3\\) ou \\(x=-1\\). Le produit de deux réels de même signe est positif, et \\(0^2=0\\).","\\((x-2)^2=x^2-4x+4\\). A product is zero exactly when one factor is zero: \\(x=3\\) or \\(x=-1\\). Two real numbers with the same sign have positive product, and \\(0^2=0\\)."]},{"k":"activity","t":["Un rectangle à explorer","Explore a rectangle"],"b":["On construit un rectangle de périmètre 24 unités. Choisis plusieurs largeurs strictement positives donnant un rectangle. Calcule la longueur et l’aire correspondantes. Quelle largeur semble donner la plus grande aire ? Formule une conjecture, puis cherche une justification valable pour toutes les largeurs.","Build a rectangle of perimeter 24 units. Choose several positive widths that give a rectangle. Calculate the matching length and area. Which width seems to give the largest area? State a conjecture, then seek a justification valid for every width."],"hints":[["Le périmètre fixe impose une relation entre longueur et largeur.","The fixed perimeter imposes a relation between length and width."],["Si la largeur vaut x, exprime d’abord la longueur, puis le produit des deux dimensions.","For width x, first express the length, then their product."]],"a":["La longueur vaut \\(12-x\\), avec \\(0&lt;x&lt;12\\). L’aire est \\(A(x)=x(12-x)=36-(x-6)^2\\). Le carré est positif ou nul, donc \\(A(x)\\le36\\), avec égalité en \\(x=6\\). La longueur vaut aussi \\(6\\) : le rectangle maximal est carré. Les essais suggèrent le résultat ; la forme canonique le démontre pour toutes les largeurs admissibles.","The length is \\(12-x\\), with \\(0&lt;x&lt;12\\). Thus \\(A(x)=36-(x-6)^2\\le36\\), with equality at \\(x=6\\). The length is also \\(6\\), so the maximum-area rectangle is a square. Experiments suggest the result; the completed square proves it for every admissible width."]},{"k":"concept","t":["Trois formes, trois lectures","Three forms, three readings"],"b":["<p>Une fonction polynôme du second degré a la forme \\(f(x)=ax^2+bx+c\\), avec \\(a\\ne0\\). Le mot « second degré » vient du terme \\(x^2\\). Si \\(a=0\\), le problème change de nature et les formules de ce chapitre ne s'appliquent plus.<\/p><table><caption>Choisir une forme selon la question<\/caption><tr><th>Forme<\/th><th>Ce qu’elle rend visible<\/th><\/tr><tr><td>\\(ax^2+bx+c\\)<\/td><td>L’image de zéro est \\(c\\).<\/td><\/tr><tr><td>\\(a(x-\\alpha)^2+\\beta\\)<\/td><td>Le sommet est \\((\\alpha;\\beta)\\) ; \\(\\beta\\) est l’extrémum sur \\(\\R\\).<\/td><\/tr><tr><td>\\(a(x-r_1)(x-r_2)\\)<\/td><td>Les racines et le signe, lorsqu’une factorisation réelle existe.<\/td><\/tr><\/table><p>Ces écritures représentent la même fonction, pas trois fonctions différentes. On choisit celle qui rend la question la plus courte à résoudre.<\/p>","<p>A quadratic polynomial has the form \\(f(x)=ax^2+bx+c\\), with \\(a\\ne0\\). If \\(a=0\\), the equation changes type and this chapter’s formulas do not apply.<\/p><table><caption>Choose a form for the question<\/caption><tr><th>Form<\/th><th>What it reveals<\/th><\/tr><tr><td>\\(ax^2+bx+c\\)<\/td><td>The value at zero is \\(c\\).<\/td><\/tr><tr><td>\\(a(x-\\alpha)^2+\\beta\\)<\/td><td>The vertex is \\((\\alpha,\\beta)\\); \\(\\beta\\) is the extremum on \\(\\R\\).<\/td><\/tr><tr><td>\\(a(x-r_1)(x-r_2)\\)<\/td><td>The roots and sign, when real factorisation is possible.<\/td><\/tr><\/table><p>These expressions describe the same function. Choose the one that makes the question easiest to answer.<\/p>"],"h":["Définition et résultats","Definition and results"]},{"k":"example","t":["Trois formes, trois lectures","Three forms, three readings"],"b":["<p>Pour \\(f(x)=x^2-6x+5\\), complète un carré : \\(x^2-6x=(x-3)^2-9\\). Donc \\(f(x)=(x-3)^2-4\\). Comme un carré est positif ou nul, \\(f(x)\\ge-4\\), avec égalité seulement en \\(x=3\\).<\/p><p>Pour les zéros, utilise une différence de carrés : \\((x-3)^2-2^2=(x-5)(x-1)\\). Le produit est nul exactement en \\(1\\) ou \\(5\\). Enfin, la forme développée donne directement \\(f(0)=5\\). Vérifie chaque transformation en développant.<\/p>","<p>For \\(f(x)=x^2-6x+5\\), complete the square: \\(x^2-6x=(x-3)^2-9\\). Thus \\(f(x)=(x-3)^2-4\\). A square is nonnegative, so \\(f(x)\\ge-4\\), with equality only at \\(x=3\\).<\/p><p>For the zeros, use a difference of squares: \\((x-3)^2-2^2=(x-5)(x-1)\\). The product vanishes exactly at \\(1\\) or \\(5\\). The expanded form gives \\(f(0)=5\\). Check every transformation by expanding.<\/p>"],"f":[[1,1]]},{"k":"error","t":["Trois formes, trois lectures","Three forms, three readings"],"b":["Une expression factorisée ne s’obtient pas en mettant séparément chacun des termes entre parenthèses.","A factorised expression is not obtained by putting each term separately in brackets."]},{"k":"try","t":["Trois formes, trois lectures","Three forms, three readings"],"b":["Donner trois formes de \\(g(x)=x^2+2x-3\\). Lire ses racines et son minimum.","Give three forms of \\(g(x)=x^2+2x-3\\). Read off its roots and its minimum."],"a":["<ol><li>Complète le carré : \\(x^2+2x-3=(x+1)^2-4\\).<\/li><li>Factorise la différence de carrés : \\((x+1-2)(x+1+2)=(x-1)(x+3)\\).<\/li><li>Les racines sont \\(-3\\) et \\(1\\). Le minimum sur \\(\\R\\) est \\(-4\\), atteint en \\(-1\\).<\/li><li>Le développement de chaque forme redonne \\(x^2+2x-3\\).<\/li><\/ol>","<ol><li>Complete the square: \\(x^2+2x-3=(x+1)^2-4\\).<\/li><li>Factorise the difference of squares to obtain \\((x-1)(x+3)\\).<\/li><li>The roots are \\(-3\\) and \\(1\\); the minimum is \\(-4\\), attained at \\(-1\\).<\/li><li>Expanding either form gives \\(x^2+2x-3\\).<\/li><\/ol>"],"hints":[["Pour le carré, cherche le nombre dont le double est le coefficient de x.","To complete the square, find the number whose double is the coefficient of x."],["Après avoir complété le carré, utilise U² − V² = (U − V)(U + V).","After completing the square, use U² − V² = (U − V)(U + V)."]],"difficulty":1},{"k":"concept","t":["Discriminant et résolution","Discriminant and solving"],"b":["Pour \\(ax^2+bx+c=0\\) avec \\(a\\ne0\\), on pose \\(\\Delta=b^2-4ac\\). Si \\(\\Delta&lt;0\\), aucune racine réelle ; si \\(\\Delta=0\\), une racine \\(-\\dfrac{b}{2a}\\) ; si \\(\\Delta&gt;0\\), deux racines \\(\\dfrac{-b-\\sqrt\\Delta}{2a}\\) et \\(\\dfrac{-b+\\sqrt\\Delta}{2a}\\). Pour ordonner les racines, tenir compte du signe de a.","For \\(ax^2+bx+c=0\\) with \\(a\\ne0\\), let \\(\\Delta=b^2-4ac\\). If \\(\\Delta&lt;0\\), there is no real root; if \\(\\Delta=0\\), there is one root \\(-\\dfrac{b}{2a}\\); if \\(\\Delta&gt;0\\), there are two roots \\(\\dfrac{-b-\\sqrt\\Delta}{2a}\\) and \\(\\dfrac{-b+\\sqrt\\Delta}{2a}\\). To order the roots, take the sign of a into account."],"h":["Définition et résultats","Definition and results"]},{"k":"proof","t":["Discriminant et résolution","Discriminant and solving"],"b":["<p><b>Démonstration.<\/b> Pour \\(a\\ne0\\), multiplier \\(ax^2+bx+c=0\\) par \\(4a\\) est réversible. On obtient \\(4a^2x^2+4abx+4ac=0\\), puis \\((2ax+b)^2=b^2-4ac=\\Delta\\).<\/p><ul><li>Si \\(\\Delta&lt;0\\), aucun carré réel ne convient.<\/li><li>Si \\(\\Delta=0\\), \\(2ax+b=0\\) donne \\(x=-\\dfrac b{2a}\\).<\/li><li>Si \\(\\Delta&gt;0\\), \\(2ax+b=\\sqrt\\Delta\\) ou \\(2ax+b=-\\sqrt\\Delta\\). En isolant \\(x\\), on trouve \\(\\dfrac{-b+\\sqrt\\Delta}{2a}\\) et \\(\\dfrac{-b-\\sqrt\\Delta}{2a}\\).<\/li><\/ul><p>Chaque étape est une équivalence : les solutions obtenues sont donc toutes les solutions. Les deux expressions doivent être ordonnées avant de construire un tableau de signes.<\/p>","<p><b>Proof.<\/b> For \\(a\\ne0\\), multiply the equation by \\(4a\\). This is reversible and gives \\(4a^2x^2+4abx+4ac=0\\), hence \\((2ax+b)^2=b^2-4ac=\\Delta\\).<\/p><ul><li>If \\(\\Delta&lt;0\\), no real square works.<\/li><li>If \\(\\Delta=0\\), \\(2ax+b=0\\), giving \\(x=-\\dfrac b{2a}\\).<\/li><li>If \\(\\Delta&gt;0\\), \\(2ax+b=\\pm\\sqrt\\Delta\\); solving for \\(x\\) gives the two usual roots.<\/li><\/ul><p>Every step is an equivalence, so all solutions have been found. Order the two roots before building a sign table.<\/p>"]},{"k":"widget","t":["Trinôme : forme canonique","Quadratic: canonical form"],"b":["Déplace le sommet S et le point orange pour changer l’orientation. Les zéros sont les abscisses des intersections avec l’axe horizontal. Compare ensuite leur existence au signe du discriminant, maintenant défini.","Drag the vertex S and orange point to change the orientation. Zeros are the x-coordinates of intersections with the horizontal axis. Compare their existence with the sign of the discriminant, now defined."],"w":{"type":"quad"}},{"k":"example","t":["Discriminant et résolution","Discriminant and solving"],"b":["\\(2x^2+x-3=0\\) : \\(\\Delta=1+24=25\\) ; \\(x=\\dfrac{-1\\pm5}{4}\\), soit \\(1\\) et \\(-\\dfrac{3}{2}\\). Vérification : \\((x-1)(2x+3)=2x^2+x-3\\).","\\(2x^2+x-3=0\\): \\(\\Delta=1+24=25\\); \\(x=\\dfrac{-1\\pm5}{4}\\), that is \\(1\\) and \\(-\\dfrac{3}{2}\\). Check: \\((x-1)(2x+3)=2x^2+x-3\\)."]},{"k":"error","t":["Discriminant et résolution","Discriminant and solving"],"b":["Le dénominateur est \\(2a\\), pas 2 ; le signe de b est pris avec ses parenthèses dans \\(b^2\\).","The denominator is \\(2a\\), not 2; the sign of b is kept with its brackets in \\(b^2\\)."]},{"k":"try","t":["Discriminant et résolution","Discriminant and solving"],"b":["Résoudre \\(3x^2-6x+3=0\\) et \\(x^2+2x+5=0\\).","Solve \\(3x^2-6x+3=0\\) and \\(x^2+2x+5=0\\)."],"a":["\\(3x^2-6x+3=3(x-1)^2\\), donc l’unique racine est \\(1\\) ; le discriminant vaut \\(0\\). Pour \\(x^2+2x+5\\), le discriminant vaut \\(-16\\), donc il n’y a pas de racine réelle. Autre justification : \\(x^2+2x+5=(x+1)^2+4\\ge4\\), ce qui empêche la fonction de s’annuler.","\\(3x^2-6x+3=3(x-1)^2\\), so the only root is \\(1\\); its discriminant is \\(0\\). For \\(x^2+2x+5\\), the discriminant is \\(-16\\), so there is no real root. Independently, \\((x+1)^2+4\\ge4\\), ruling out a zero."],"hints":[["Dans la première équation, commence par mettre trois en facteur.","In the first equation, factor out three."],["Pour la seconde, compare le discriminant avec une écriture sous forme d’un carré plus une constante.","For the second, compare the discriminant with a square plus a constant."]],"difficulty":2},{"k":"concept","t":["Factoriser sans automatiser le discriminant","Factorising without automating the discriminant"],"b":["Si deux racines réelles existent, leur somme vaut \\(-\\dfrac{b}{a}\\) et leur produit \\(\\dfrac{c}{a}\\). Une racine apparente ou une identité remarquable permet souvent une factorisation plus courte. Les polynômes de degré 2 s’annulant en deux réels distincts r et s sont exactement \\(a(x-r)(x-s)\\) avec \\(a\\ne0\\).","If two real roots exist, their sum is \\(-\\dfrac{b}{a}\\) and their product is \\(\\dfrac{c}{a}\\). An obvious root or a special product often allows a shorter factorisation. The polynomials of degree 2 that vanish at two distinct reals r and s are exactly \\(a(x-r)(x-s)\\) with \\(a\\ne0\\)."],"h":["Définition et résultats","Definition and results"]},{"k":"example","t":["Factoriser sans automatiser le discriminant","Factorising without automating the discriminant"],"b":["Posons \\(P(x)=x^2-7x+12\\). Les nombres \\(3\\) et \\(4\\) ont pour somme \\(7\\) et pour produit \\(12\\), donc \\(P(x)=(x-3)(x-4)\\). <b>Autre question :<\/b> chercher une fonction \\(f\\) dont les racines sont \\(3\\) et \\(4\\), et telle que \\(f(0)=24\\). Écrivons \\(f(x)=a(x-3)(x-4)\\). Alors \\(f(0)=12a=24\\), donc \\(a=2\\) et \\(f(x)=2(x-3)(x-4)\\). Cette fonction \\(f\\) est différente de \\(P\\).","Let \\(P(x)=x^2-7x+12\\). The numbers \\(3\\) and \\(4\\) have sum \\(7\\) and product \\(12\\), hence \\(P(x)=(x-3)(x-4)\\). <b>A separate question:<\/b> find \\(f\\) with roots \\(3\\) and \\(4\\) and \\(f(0)=24\\). Write \\(f(x)=a(x-3)(x-4)\\). Then \\(12a=24\\), giving \\(f(x)=2(x-3)(x-4)\\). This \\(f\\) is a different function from \\(P\\)."]},{"k":"error","t":["Factoriser sans automatiser le discriminant","Factorising without automating the discriminant"],"b":["La somme des racines vaut \\(-\\dfrac{b}{a}\\) ; ne pas oublier le signe moins. Une seule racine ne suffit pas à déterminer a.","The sum of the roots is \\(-\\dfrac{b}{a}\\); do not forget the minus sign. A single root is not enough to determine a."]},{"k":"try","t":["Factoriser sans automatiser le discriminant","Factorising without automating the discriminant"],"b":["Déterminer le polynôme f de degré 2 tel que \\(f(1)=f(4)=0\\) et \\(f(0)=-8\\).","Determine the polynomial f of degree 2 such that \\(f(1)=f(4)=0\\) and \\(f(0)=-8\\)."],"a":["Les racines distinctes \\(1\\) et \\(4\\) imposent \\(f(x)=a(x-1)(x-4)\\), avec \\(a\\ne0\\). Puis \\(f(0)=4a=-8\\), donc \\(a=-2\\). Ainsi \\(f(x)=-2(x-1)(x-4)=-2x^2+10x-8\\). Les trois données sont vérifiées par substitution.","The distinct roots \\(1\\) and \\(4\\) give \\(f(x)=a(x-1)(x-4)\\). Then \\(f(0)=4a=-8\\), giving \\(a=-2\\). Thus \\(f(x)=-2(x-1)(x-4)=-2x^2+10x-8\\). Substitution verifies all three conditions."],"hints":[["Une forme factorisée contient directement les deux racines.","A factorised form contains the two roots directly."],["Substitue zéro pour déterminer le facteur a restant.","Substitute zero to find the remaining coefficient a."]],"difficulty":2},{"k":"concept","t":["Sommet, variations et domaine","Vertex, monotonicity and domain"],"b":["<p>Dans \\(a(x-\\alpha)^2+\\beta\\), le carré mesure l’éloignement de \\(x\\) par rapport à \\(\\alpha\\). Il diminue lorsqu’on approche de \\(\\alpha\\), puis augmente quand on s’en éloigne.<\/p><p>Si \\(a&gt;0\\), \\(f\\) est décroissante sur \\(]-\\infty;\\alpha]\\), puis croissante sur \\([\\alpha;+\\infty[\\). Le minimum est \\(\\beta\\). Si \\(a&lt;0\\), multiplier par \\(a\\) inverse l’ordre : \\(f\\) est croissante puis décroissante, et \\(\\beta\\) est un maximum.<\/p><p>Sur un intervalle imposé, vérifie d’abord si \\(\\alpha\\) est autorisé. Sinon, compare les valeurs admissibles à l’aide des variations. Un extrémum sur \\(\\R\\) n’est pas automatiquement atteint sur le domaine du problème.<\/p>","<p>In \\(a(x-\\alpha)^2+\\beta\\), the square measures how far \\(x\\) lies from \\(\\alpha\\). It decreases as \\(x\\) approaches \\(\\alpha\\), then increases.<\/p><p>For \\(a&gt;0\\), \\(f\\) decreases on \\((-\\infty,\\alpha]\\) and increases on \\([\\alpha,+\\infty)\\); the minimum is \\(\\beta\\). For \\(a&lt;0\\), multiplying by \\(a\\) reverses the order, giving increasing then decreasing behaviour and a maximum \\(\\beta\\).<\/p><p>On a restricted interval, first check whether \\(\\alpha\\) is allowed. Otherwise use monotonicity to compare admissible values. An extremum on \\(\\R\\) need not be attained on the problem’s domain.<\/p>"]},{"k":"concept","t":["Signe, inéquations et optimisation","Sign, inequalities and optimisation"],"b":["Pour deux racines distinctes \\(r&lt;s\\), le trinôme a le signe de a en dehors de \\([r;s]\\) et le signe opposé entre les racines. Il est nul aux racines. Sans racine réelle, il garde le signe de a. Avec une racine double, il garde le signe de a hors de celle-ci. L’optimisation se fait sur le domaine du problème, qui peut limiter l’accès au sommet.","For two distinct roots \\(r&lt;s\\), the quadratic has the sign of a outside \\([r,s]\\) and the opposite sign between the roots. It is zero at the roots. With no real root, it keeps the sign of a. With a double root, it keeps the sign of a away from that root. Optimisation is done on the domain of the problem, which may limit access to the vertex."],"h":["Définition et résultats","Definition and results"]},{"k":"method","t":["Signe, inéquations et optimisation","Sign, inequalities and optimisation"],"b":["<p>Si \\(r&lt;s\\), \\(x-r\\) et \\(x-s\\) sont tous deux négatifs avant \\(r\\), de signes opposés entre \\(r\\) et \\(s\\), puis tous deux positifs après \\(s\\). Leur produit est donc positif à l’extérieur et négatif à l’intérieur. Multiplier par \\(a\\) donne le signe du trinôme.<\/p><p>Au lieu de retenir une règle sans raison, refais ce raisonnement avec les deux facteurs. Pour \\(f(x)&gt;0\\), les racines sont exclues ; pour \\(f(x)\\ge0\\), elles peuvent être incluses. Intersecte ensuite l’ensemble obtenu avec le domaine du problème.<\/p>","<p>For \\(r&lt;s\\), the factors \\(x-r\\) and \\(x-s\\) are both negative before \\(r\\), opposite in sign between the roots, and both positive after \\(s\\). Their product is positive outside and negative inside; multiplying by \\(a\\) gives the quadratic’s sign.<\/p><p>Rebuild this argument from the factors rather than memorising a rule. Strict inequalities exclude roots; non-strict inequalities may include them. Intersect the solution set with the problem’s domain.<\/p>"]},{"k":"example","t":["Signe, inéquations et optimisation","Sign, inequalities and optimisation"],"b":["\\(-2(x-1)(x-5)\\geq0\\) équivaut à \\(x\\in[1;5]\\). Pour \\(A(x)=x(12-x)\\) sur \\(]0;12[\\), \\(A(x)=36-(x-6)^2\\leq36\\), avec égalité en 6. Un rectangle de périmètre 24 m a donc une aire maximale de 36 m\\(^2\\) lorsqu’il est carré.","\\(-2(x-1)(x-5)\\geq0\\) is equivalent to \\(x\\in[1,5]\\). For \\(A(x)=x(12-x)\\) on \\((0,12)\\), \\(A(x)=36-(x-6)^2\\leq36\\), with equality at 6. A rectangle with perimeter 24 m therefore has a maximum area of 36 m\\(^2\\) when it is a square."]},{"k":"error","t":["Signe, inéquations et optimisation","Sign, inequalities and optimisation"],"b":["Dans une inéquation stricte, les racines sont exclues. Vérifier les bornes géométriques avant de conclure.","In a strict inequality, the roots are excluded. Check the geometric bounds before concluding."]},{"k":"try","t":["Signe, inéquations et optimisation","Sign, inequalities and optimisation"],"b":["Résoudre \\(x^2-4x-5&lt;0\\) puis maximiser \\(x(8-x)\\) sur \\([0;3]\\).","Solve \\(x^2-4x-5&lt;0\\), then maximise \\(x(8-x)\\) on \\([0,3]\\)."],"f":[[2,2]],"a":["\\(x^2-4x-5=(x+1)(x-5)\\). Entre \\(-1\\) et \\(5\\), les facteurs sont de signes opposés ; en dehors, ils ont le même signe. L’inégalité stricte a donc pour solution \\(]-1;5[\\), sans les bornes. Pour \\(A(x)=x(8-x)=16-(x-4)^2\\), le sommet \\(4\\) est hors de \\([0;3]\\). Sur cet intervalle, la distance à \\(4\\) diminue jusqu’à \\(x=3\\) : le maximum vaut \\(A(3)=15\\), et non \\(16\\).","\\(x^2-4x-5=(x+1)(x-5)\\). Between \\(-1\\) and \\(5\\) the factors have opposite signs, so the strict inequality holds on \\((-1,5)\\), excluding endpoints. For \\(A(x)=16-(x-4)^2\\), the vertex \\(4\\) is outside \\([0,3]\\). The distance to \\(4\\) decreases up to \\(3\\), so the maximum is \\(A(3)=15\\), not \\(16\\)."],"hints":[["Construis séparément le signe de chacun des deux facteurs.","Find the sign of each factor separately."],["Un sommet n’est admissible que si son abscisse appartient au domaine imposé.","A vertex is admissible only when its x-coordinate belongs to the allowed domain."]],"difficulty":3},{"k":"try","t":["Bilan : choisir et justifier","Review: choose and justify"],"b":["1. Résoudre \\(x^2-9=0\\) avec une méthode courte. 2. Pour \\(h(x)=-2(x-1)^2+8\\), donner le maximum sur \\(\\R\\) et les racines. 3. L’inégalité \\((x-1)^2&lt;0\\) peut-elle avoir une solution réelle ? Justifier.","1. Solve \\(x^2-9=0\\) with a short method. 2. For \\(h(x)=-2(x-1)^2+8\\), find the maximum on \\(\\R\\) and its roots. 3. Can \\((x-1)^2&lt;0\\) have a real solution? Justify."],"stage":"check","difficulty":3,"a":["1. \\(x^2-9=(x-3)(x+3)\\) donne \\(x=-3\\) ou \\(x=3\\). 2. Le carré est positif ou nul, donc \\(h(x)\\le8\\), atteint en \\(x=1\\). Pour les racines, \\((x-1)^2=4\\) donne \\(x=-1\\) ou \\(x=3\\). 3. Aucun réel : un carré ne peut pas être négatif.","1. Factor to get roots \\(-3\\) and \\(3\\). 2. Since a square is nonnegative, \\(h(x)\\le8\\), attained at \\(1\\). Its zeros satisfy \\((x-1)^2=4\\), giving \\(-1\\) and \\(3\\). 3. There is no real solution because a square cannot be negative."]}],"figureVersion":"4ebb361ae4c71a57"},"figs":{"premiere-02-1.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiB4bWxuczppbmtzY2FwZT0iaHR0cDovL3d3dy5pbmtzY2FwZS5vcmcvbmFtZXNwYWNlcy9pbmtzY2FwZSIgdmVyc2lvbj0iMS4xIiB3aWR0aD0iMzQ0Ljc2OSIgaGVpZ2h0PSIxNTAuOTIyIiB2aWV3Qm94PSIwID // A camera is independent of the mathematical parameters. Moving an object never changes it.
function camera2D() {
  const c = { scale: 1, x: 0, y: 0 };
  c.project = ([x,y]) => [c.x+c.scale*x,c.y+c.scale*y];
  c.unproject = ([x,y]) => [(x-c.x)/c.scale,(y-c.y)/c.scale];

  c.reset=()=>{c.scale=1;c.x=c.y=0;};return c;
}
function navigationButtons(host,action,lang='fr') {

  // Quadratic equation with real coefficients, built from its roots: drag z1; off the real axis its conjugate is the

  // Residues modulo n on a clock: drag a around the clock, set n. Mode powers: the successive powers of a (period, and

  modclock(o) {

{

function sizeClass(html) {

const SUB = "₀₁₂₃₄₅₆₇₈₉", SUP = { "²": "2", "³": "3" };

const arrayTable = (spec, body) => {

  const rows = []; let top = false;
  for (let row of body.split(/\\\\/)) {
    let line = false; row = row.replace(/\\hline/g, () => { line = true; return ""; });
    if (!row.trim()) { if (line) top = true; continue; }
    rows.push({ cells: row.split("&amp;").map(c => c.trim()), top: top || line }); top = false;
  }
  const tr = rows.map((r, i) => `<tr${r.top && i ? ' class="rule"' : ""}>${r.cells.map((c, j) => `<td${cols[j]?.l ? ' class="l"' : ""}${cols[j]?.r ? ' class="r"' : ""}>${c ? `\\(${c}\\)` : ""}</td>`).join("")}</tr>`).join("");

  for (const node of template.content.childNodes) {

const blocks = () => [...document.querySelectorAll("#flow [data-reveal]")];
function paintSteps() {

  const widgets = deck.slides.filter(x => x.k === "widget"), shared = widgets[0];
  const ans = s.a ? tex(s.a[lang]) : "";
  const figs = (s.f || []).map(p => `<figure class="fig"><img src="${figSrc(deckId, p[lang])}" alt="${esc(plain(s.t[lang]))}"></figure>`).join("");
  const mode = k === "title" || k === "code" ? "none" : k === "widget" ? "widget" : figs ? "fig" : shared && k !== "goals" ? "explore" : "none";
  const col = $("#col"), flow = $("#flow"), rt = $("#rt");
  col.dataset.kind = k;
  $("#live").hidden = true; $("#readout").innerHTML = "";

  if (k === "title") {
    flow.innerHTML = `<div class="title-slide"><span class="chip">${esc(deck.courseTitle?.[lang] || COURSE[deck.course] || "")}</span><h1>${title}</h1><div class="meta">${deck.slides.length} ${t("slides")}</div><div class="hint">${t("hint")}</div></div>`;
  } else if (k === "code") {
    flow.innerHTML = `<div class="hd">${esc(label)}</div><h2 class="tt">${title}</h2><pre>${s.b[lang]}</pre>`;
  } else {
    const cls = sizeClass(rawBody + ans);
    flow.innerHTML = `<div class="hd ${k === "error" ? "red" : ""}"><span>${esc(label)}</span><span class="deckname">${esc(deck.title[lang])}</span></div><h2 class="tt">${title}</h2>${s.h?.[lang] ? `<div class="sub">${esc(s.h[lang])}</div>` : ""}<div class="steps text ${cls}">${revealMarkup(rawBody)}</div>${ans ? `<div class="answer text ${cls}" id="ans" ${revealed ? "" : "hidden"}><div class="hd green">${t("answerLab")}</div>${ans}</div>` : ""}`;
  }

  if (mode === "fig") rt.innerHTML = `<div class="figcol">${figs}</div>`;
  else if (mode === "widget" || mode === "explore") {
    rt.innerHTML = `<div class="hint-line" id="whint"></div><div class="canvas-wrap" id="wcanvas"></div>${mode === "explore" ? `${widgets.length > 1 ? `<label class="explore-label">${t("explore")}<select id="explore-choice">${widgets.map((w, i) => `<option value="${i}">${esc(plain(w.t[lang]))}</option>`).join("")}</select></label>` : ""}<p class="note">${t("free")}</p>` : ""}<div class="wctl" id="wctl"></div>`;
  } else rt.innerHTML = "";

  chrome();
  figHidden = false; layout(mode);
  try { history.replaceState(null, "", EXPORT ? `#${index}` : `?deck=${encodeURIComponent(deckId)}&lang=${lang ? "en" : "fr"}#${index}`); } catch {}
  // Formulas first: the widget readouts are typeset as they are written, so MathJax must be ready before they mount.
  let ready = true;
  try {
    if (typeof MathJax === "undefined") throw new Error("MathJax");
    await MathJax.startup.promise; await document.fonts.load('400 25px "STIX Two Text"');
  } catch (e) { ready = false; console.warn(e); if (renderId === generation) toast(t("noMath")); }
  if (renderId !== generation) return;
  const defined = deck.slides.findIndex(x => x.k === "concept" && /Discriminant/.test(x.t[0]));
  if (mode === "widget") companion(s.w, true);
  else if (mode === "explore") {
    companion(shared.w, defined < 0 || index >= defined);
    if ($("#explore-choice")) $("#explore-choice").onchange = e => companion(widgets[+e.target.value].w, true);
  }
  paintSteps(); flow.scrollTop = 0;
  if (ready) {
    try { await MathJax.typesetPromise([$("#stage")]); $("#stage").querySelectorAll("mjx-assistive-mml").forEach(x => x.remove()); } catch (e) { console.warn(e); }
    if (renderId !== generation) return;
    fitMath();
    // A figure that is only an exploration aid gives way when an equation needs the whole width.
    if (mode === "explore" && needsWidth()) { figHidden = true; layout(mode); fitMath(); }
  }
}

// ---- layout: the flow column is 520 px wide beside a figure, 1200 px without one
let figHidden = false;
function layout(mode) {
  const wide = mode === "none" || (mode === "explore" && figHidden);
  $("#col").className = wide ? "wide" : ""; $("#rt").hidden = wide;
  const tg = $("#tg"); tg.hidden = mode !== "explore"; tg.setAttribute("aria-pressed", String(!figHidden)); tg.textContent = t("figure");
}
// Shrink any formula wider than the column so that nothing is cut off or needs sideways scrolling (never below MIN_SCALE).
const MIN_SCALE = .5;
function fitMath() {
  const flow = $("#flow"), avail = flow.clientWidth - 4;
  flow.querySelectorAll("mjx-container").forEach(m => { m.style.fontSize = ""; });
  flow.querySelectorAll("mjx-container").forEach(m => {
    if (!m.offsetParent) return;
    const svg = m.querySelector("svg"); if (!svg) return;
    const room = m.getAttribute("display") === "true" ? Math.min(avail, m.parentElement.clientWidth || avail) : avail;
    const w = svg.getBoundingClientRect().width / (flow.getBoundingClientRect().width / flow.offsetWidth);
    if (w > room) m.style.fontSize = Math.max(MIN_SCALE, room / w) * 100 + "%";
  });
}
function needsWidth() {
  return [...$("#flow").querySelectorAll("mjx-container")].some(m => m.offsetParent && m.querySelector("svg") && m.scrollWidth > m.clientWidth + 2 || m.offsetParent && m.style.fontSize && parseFloat(m.style.fontSize) <= MIN_SCALE * 100 + 1);
}

function chrome() {
  const s = deck.slides[index], n = deck.slides.length;
  $("#count").textContent = `${index + 1} / ${n}`;
  $("#pv").disabled = index === 0; $("#nx").disabled = index === n - 1;
  $("#pv").setAttribute("aria-label", t("prev")); $("#nx").setAttribute("aria-label", t("next"));
  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));

  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}


function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
</html>
