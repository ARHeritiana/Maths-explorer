<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"id":"seconde-02","course":"seconde","number":2,"title":["Vecteurs du plan","Vectors in the plane"],"slides":[{"k":"title","t":["Vecteurs du plan","Vectors in the plane"],"b":["",""]},{"k":"concept","t":["Translation et vecteurs","Translation and vectors"],"b":["La translation qui transforme \\(A\\) en \\(B\\) associe à tout point \\(M\\) l'unique point \\(M'\\) tel que \\(ABM'M\\) soit un parallélogramme, éventuellement aplati. Elle est appelée translation de vecteur \\(\\vect{AB}\\).\nUn vecteur non nul possède une direction, un sens et une norme. \\(\\|\\vect{AB}\\|=AB\\). Le vecteur \\(\\vect{AA}\\) est le vecteur nul, noté \\(\\vec0\\) ; il n'a ni direction ni sens.","The translation that transforms \\(A\\) into \\(B\\) associates with every point \\(M\\) the unique point \\(M'\\) such that \\(ABM'M\\) is a parallelogram, possibly flat. It is called the translation by the vector \\(\\vect{AB}\\).\nA nonzero vector has a direction, a sense and a norm. \\(\\|\\vect{AB}\\|=AB\\). The vector \\(\\vect{AA}\\) is the zero vector, written \\(\\vec0\\); it has neither direction nor sense."],"h":["Définition","Definition"],"f":[[1,1]]},{"k":"concept","t":["Translation et vecteurs","Translation and vectors"],"b":["\\(\\vect{AB}=\\vect{CD}\\) lorsque la translation de vecteur \\(\\vect{AB}\\) transforme \\(C\\) en \\(D\\). Deux vecteurs non nuls sont égaux si et seulement s'ils ont même direction, même sens et même norme.\nLe vecteur opposé de \\(\\vect{AB}\\) est \\(\\vect{BA}\\) : \\(\\vect{BA}=-\\vect{AB}\\).","\\(\\vect{AB}=\\vect{CD}\\) when the translation by the vector \\(\\vect{AB}\\) transforms \\(C\\) into \\(D\\). Two nonzero vectors are equal if and only if they have the same direction, the same sense and the same norm.\nThe opposite vector of \\(\\vect{AB}\\) is \\(\\vect{BA}\\): \\(\\vect{BA}=-\\vect{AB}\\)."],"h":["Vecteurs égaux et opposés","Equal and opposite vectors"]},{"k":"example","t":["Translation et vecteurs","Translation and vectors"],"b":["Tracer un segment \\([AB]\\) et placer un point \\(C\\) hors de \\((AB)\\). Construire \\(D\\) tel que \\(\\vect{AB}=\\vect{CD}\\). Nommer le parallélogramme obtenu. Construire \\(E\\) tel que \\(\\vect{CE}=-\\vect{AB}\\).","Draw a segment \\([AB]\\) and place a point \\(C\\) outside \\((AB)\\). Construct \\(D\\) such that \\(\\vect{AB}=\\vect{CD}\\). Name the parallelogram obtained. Construct \\(E\\) such that \\(\\vect{CE}=-\\vect{AB}\\)."],"a":["\\(D\\) se construit en reportant depuis \\(C\\) la direction, le sens et la longueur de \\(\\vect{AB}\\). Le parallélogramme est \\(ABDC\\), dans cet ordre. \\(E\\) est le symétrique de \\(D\\) par rapport à \\(C\\), car \\(\\vect{CE}=-\\vect{CD}\\).","\\(D\\) is constructed by carrying over from \\(C\\) the direction, sense and length of \\(\\vect{AB}\\). The parallelogram is \\(ABDC\\), in that order. \\(E\\) is the reflection of \\(D\\) in the point \\(C\\), because \\(\\vect{CE}=-\\vect{CD}\\)."]},{"k":"concept","t":["Somme, différence et relation de Chasles","Sum, difference and Chasles's relation"],"b":["La somme \\(\\vec u+\\vec v\\) correspond à l'enchaînement des translations de vecteurs \\(\\vec u\\) et \\(\\vec v\\). Pour tous points \\(A,B,C\\) :\n\\[\\boxed{\\vect{AB}+\\vect{BC}=\\vect{AC}}\\qquad\\text{(relation de Chasles).}\\]\nOn a \\(\\vec u-\\vec v=\\vec u+(-\\vec v)\\) et \\(\\vect{AB}+\\vect{BA}=\\vec0\\).","The sum \\(\\vec u+\\vec v\\) corresponds to carrying out the translations by the vectors \\(\\vec u\\) and \\(\\vec v\\) one after the other. For all points \\(A,B,C\\):\n\\[\\boxed{\\vect{AB}+\\vect{BC}=\\vect{AC}}\\qquad\\text{(Chasles's relation).}\\]\nWe have \\(\\vec u-\\vec v=\\vec u+(-\\vec v)\\) and \\(\\vect{AB}+\\vect{BA}=\\vec0\\)."],"h":["Somme de vecteurs","Sum of vectors"],"f":[[2,2]]},{"k":"concept","t":["Somme, différence et relation de Chasles","Sum, difference and Chasles's relation"],"b":["\\(ABDC\\) est un parallélogramme si et seulement si \\(\\vect{AD}=\\vect{AB}+\\vect{AC}\\).","\\(ABDC\\) is a parallelogram if and only if \\(\\vect{AD}=\\vect{AB}+\\vect{AC}\\)."],"h":["Règle du parallélogramme","Parallelogram rule"]},{"k":"example","t":["Somme, différence et relation de Chasles","Sum, difference and Chasles's relation"],"b":["Simplifier : \\(\\vect{AB}+\\vect{BC}\\) ; \\(\\vect{AB}+\\vect{CA}\\) ; \\(\\vect{AB}+\\vect{BC}+\\vect{CD}\\) ; \\(\\vect{AB}-\\vect{AC}\\).","Simplify: \\(\\vect{AB}+\\vect{BC}\\); \\(\\vect{AB}+\\vect{CA}\\); \\(\\vect{AB}+\\vect{BC}+\\vect{CD}\\); \\(\\vect{AB}-\\vect{AC}\\)."],"a":["\\(\\vect{AC}\\) ; \\(\\vect{CA}+\\vect{AB}=\\vect{CB}\\) ; \\(\\vect{AD}\\) ; \\(\\vect{AB}+\\vect{CA}=\\vect{CB}\\). La commutativité de l'addition permet de réordonner les vecteurs.","\\(\\vect{AC}\\); \\(\\vect{CA}+\\vect{AB}=\\vect{CB}\\); \\(\\vect{AD}\\); \\(\\vect{AB}+\\vect{CA}=\\vect{CB}\\). The commutativity of addition allows us to reorder the vectors."]},{"k":"example","t":["Somme, différence et relation de Chasles","Sum, difference and Chasles's relation"],"b":["Dans un parallélogramme \\(ABCD\\), justifier que \\(\\vect{AB}+\\vect{AD}=\\vect{AC}\\).","In a parallelogram \\(ABCD\\), justify that \\(\\vect{AB}+\\vect{AD}=\\vect{AC}\\)."],"a":["Dans \\(ABCD\\), \\(\\vect{AD}=\\vect{BC}\\). Donc \\(\\vect{AB}+\\vect{AD}=\\vect{AB}+\\vect{BC}=\\vect{AC}\\).","In \\(ABCD\\), \\(\\vect{AD}=\\vect{BC}\\). So \\(\\vect{AB}+\\vect{AD}=\\vect{AB}+\\vect{BC}=\\vect{AC}\\)."]},{"k":"concept","t":["Produit d'un vecteur par un réel","Product of a vector by a real number"],"b":["Pour \\(k\\in\\R\\), \\(k\\vec u=\\vec0\\) si \\(k=0\\) ou \\(\\vec u=\\vec0\\). Sinon, \\(k\\vec u\\) a la même direction que \\(\\vec u\\), le même sens si \\(k&gt;0\\), le sens opposé si \\(k&lt;0\\), et sa norme vaut \\(|k|\\|\\vec u\\|\\).\n\\[(k+\\ell)\\vec u=k\\vec u+\\ell\\vec u,\\quad k(\\vec u+\\vec v)=k\\vec u+k\\vec v,\\quad k(\\ell\\vec u)=(k\\ell)\\vec u.\\]","For \\(k\\in\\R\\), \\(k\\vec u=\\vec0\\) if \\(k=0\\) or \\(\\vec u=\\vec0\\). Otherwise, \\(k\\vec u\\) has the same direction as \\(\\vec u\\), the same sense if \\(k&gt;0\\), the opposite sense if \\(k&lt;0\\), and its norm is \\(|k|\\|\\vec u\\|\\).\n\\[(k+\\ell)\\vec u=k\\vec u+\\ell\\vec u,\\quad k(\\vec u+\\vec v)=k\\vec u+k\\vec v,\\quad k(\\ell\\vec u)=(k\\ell)\\vec u.\\]"],"h":["Définition et règles de calcul","Definition and calculation rules"]},{"k":"example","t":["Produit d'un vecteur par un réel","Product of a vector by a real number"],"b":["Pour un vecteur \\(\\vec u\\) de norme \\(4\\) cm, représenter \\(2\\vec u\\), \\(-\\vec u\\) et \\(\\frac12\\vec u\\) à partir d'une même origine. Préciser leurs normes.","For a vector \\(\\vec u\\) of norm \\(4\\) cm, represent \\(2\\vec u\\), \\(-\\vec u\\) and \\(\\frac12\\vec u\\) from the same origin. State their norms."],"a":["Les normes sont \\(8\\) cm, \\(4\\) cm, \\(2\\) cm. Les vecteurs \\(2\\vec u\\) et \\(\\frac12\\vec u\\) ont le sens de \\(\\vec u\\) ; \\(-\\vec u\\) a le sens opposé.","The norms are \\(8\\) cm, \\(4\\) cm, \\(2\\) cm. The vectors \\(2\\vec u\\) and \\(\\frac12\\vec u\\) have the sense of \\(\\vec u\\); \\(-\\vec u\\) has the opposite sense."]},{"k":"concept","t":["Produit d'un vecteur par un réel","Product of a vector by a real number"],"b":["\\(I\\) est le milieu de \\([AB]\\) si et seulement si \\(\\vect{AI}=\\vect{IB}\\), ou encore \\(\\vect{AI}=\\frac12\\vect{AB}\\), ou \\(\\vect{IA}+\\vect{IB}=\\vec0\\).","\\(I\\) is the midpoint of \\([AB]\\) if and only if \\(\\vect{AI}=\\vect{IB}\\), or equivalently \\(\\vect{AI}=\\frac12\\vect{AB}\\), or \\(\\vect{IA}+\\vect{IB}=\\vec0\\)."],"h":["Caractérisations du milieu","Characterisations of the midpoint"]},{"k":"example","t":["Produit d'un vecteur par un réel","Product of a vector by a real number"],"b":["Dans un triangle \\(ABC\\), \\(I\\) est le milieu de \\([AB]\\) et \\(J\\) celui de \\([AC]\\). Montrer que \\(\\vect{IJ}=\\frac12\\vect{BC}\\).","In a triangle \\(ABC\\), \\(I\\) is the midpoint of \\([AB]\\) and \\(J\\) that of \\([AC]\\). Show that \\(\\vect{IJ}=\\frac12\\vect{BC}\\)."],"a":["Par Chasles, \\(\\vect{IJ}=\\vect{IA}+\\vect{AJ}=-\\frac12\\vect{AB}+\\frac12\\vect{AC}=\\frac12(\\vect{BA}+\\vect{AC})=\\frac12\\vect{BC}\\). On retrouve le parallélisme des droites \\((IJ)\\) et \\((BC)\\) lorsque le triangle n'est pas aplati.","By Chasles, \\(\\vect{IJ}=\\vect{IA}+\\vect{AJ}=-\\frac12\\vect{AB}+\\frac12\\vect{AC}=\\frac12(\\vect{BA}+\\vect{AC})=\\frac12\\vect{BC}\\). We recover the parallelism of the lines \\((IJ)\\) and \\((BC)\\) when the triangle is not flat."]},{"k":"concept","t":["Repères, bases et coordonnées","Frames, bases and coordinates"],"b":["Deux vecteurs non colinéaires \\(\\vec i,\\vec j\\) forment une base du plan. Tout vecteur \\(\\vec u\\) s'écrit de manière unique \\(\\vec u=x\\vec i+y\\vec j\\) ; ses coordonnées sont \\((x;y)\\) ou \\(\\vc{x}{y}\\).\nUn repère \\((O;\\vec i,\\vec j)\\) associe au point \\(M\\) les coordonnées de \\(\\vect{OM}\\). Il est <b>orthonormé<\/b> si les vecteurs de base sont perpendiculaires et de norme \\(1\\).","Two non-collinear vectors \\(\\vec i,\\vec j\\) form a basis of the plane. Every vector \\(\\vec u\\) can be written uniquely as \\(\\vec u=x\\vec i+y\\vec j\\); its coordinates are \\((x,y)\\) or \\(\\vc{x}{y}\\).\nA frame \\((O,\\vec i,\\vec j)\\) associates with the point \\(M\\) the coordinates of \\(\\vect{OM}\\). It is <b>orthonormal<\/b> if the basis vectors are perpendicular and of norm \\(1\\)."],"h":["Définitions","Definitions"],"f":[[3,3]]},{"k":"concept","t":["Repères, bases et coordonnées","Frames, bases and coordinates"],"b":["Si \\(A(x_A;y_A)\\), \\(B(x_B;y_B)\\), \\(\\vec u(x;y)\\) et \\(\\vec v(x';y')\\) :\n\\[\\vect{AB}=\\vc{x_B-x_A}{y_B-y_A},\\quad \\vec u+\\vec v=\\vc{x+x'}{y+y'},\\quad k\\vec u=\\vc{kx}{ky}.\\]\nDeux vecteurs sont égaux si et seulement si leurs coordonnées respectives sont égales.","If \\(A(x_A,y_A)\\), \\(B(x_B,y_B)\\), \\(\\vec u(x,y)\\) and \\(\\vec v(x',y')\\):\n\\[\\vect{AB}=\\vc{x_B-x_A}{y_B-y_A},\\quad \\vec u+\\vec v=\\vc{x+x'}{y+y'},\\quad k\\vec u=\\vc{kx}{ky}.\\]\nTwo vectors are equal if and only if their respective coordinates are equal."],"h":["Calculs avec les coordonnées","Calculations with coordinates"]},{"k":"example","t":["Repères, bases et coordonnées","Frames, bases and coordinates"],"b":["Pour \\(\\vec u(3;2)\\) et \\(\\vec v(-1;4)\\), calculer \\(\\vec u+\\vec v\\) et \\(2\\vec u-\\vec v\\). Écrire \\(\\vec w(5;-3)\\) dans la base \\((\\vec i;\\vec j)\\).","For \\(\\vec u(3,2)\\) and \\(\\vec v(-1,4)\\), calculate \\(\\vec u+\\vec v\\) and \\(2\\vec u-\\vec v\\). Write \\(\\vec w(5,-3)\\) in the basis \\((\\vec i,\\vec j)\\)."],"a":["\\(\\vec u+\\vec v=(2;6)\\) ; \\(2\\vec u-\\vec v=(7;0)\\) ; \\(\\vec w=5\\vec i-3\\vec j\\).","\\(\\vec u+\\vec v=(2,6)\\) ; \\(2\\vec u-\\vec v=(7,0)\\) ; \\(\\vec w=5\\vec i-3\\vec j\\)."]},{"k":"concept","t":["Norme, distance et milieu","Norm, distance and midpoint"],"b":["Dans un repère <b>orthonormé<\/b>, pour \\(\\vec u(x;y)\\) et deux points \\(A,B\\) :\n\\[\\|\\vec u\\|=\\sqrt{x^2+y^2},\\qquad AB=\\sqrt{(x_B-x_A)^2+(y_B-y_A)^2}.\\]\nDans tout repère, le milieu de \\([AB]\\) est \\(I\\left(\\frac{x_A+x_B}{2};\\frac{y_A+y_B}{2}\\right)\\).","In an <b>orthonormal<\/b> frame, for \\(\\vec u(x,y)\\) and two points \\(A,B\\):\n\\[\\|\\vec u\\|=\\sqrt{x^2+y^2},\\qquad AB=\\sqrt{(x_B-x_A)^2+(y_B-y_A)^2}.\\]\nIn any frame, the midpoint of \\([AB]\\) is \\(I\\left(\\frac{x_A+x_B}{2};\\frac{y_A+y_B}{2}\\right)\\)."],"h":["Propriétés","Properties"]},{"k":"proof","t":["Norme, distance et milieu","Norm, distance and midpoint"],"b":["La formule de distance découle du théorème de Pythagore appliqué aux déplacements horizontal et vertical. Pour le milieu, \\(\\vect{AI}=\\frac12\\vect{AB}\\) donne \\(x_I-x_A=\\frac{x_B-x_A}{2}\\) et \\(y_I-y_A=\\frac{y_B-y_A}{2}\\) ; on isole \\(x_I,y_I\\).","The distance formula follows from Pythagoras's theorem applied to the horizontal and vertical displacements. For the midpoint, \\(\\vect{AI}=\\frac12\\vect{AB}\\) gives \\(x_I-x_A=\\frac{x_B-x_A}{2}\\) and \\(y_I-y_A=\\frac{y_B-y_A}{2}\\); we isolate \\(x_I,y_I\\)."]},{"k":"example","t":["Norme, distance et milieu","Norm, distance and midpoint"],"b":["Dans un repère orthonormé, \\(A(3;0)\\), \\(B(5;3)\\), \\(C(4;0)\\) et \\(D(6;4)\\).\n<ol>\n<li>Calculer \\(\\vect{AB}\\), \\(\\vect{CD}\\), puis \\(3\\vect{AB}-5\\vect{CD}\\).\n<li>Déterminer \\(U\\) tel que \\(\\vect{BU}=2\\vect{AB}-\\vect{CD}\\).\n<li>Déterminer \\(E\\) tel que \\(ABCE\\) soit un parallélogramme, puis son centre \\(I\\).\n<li>Calculer \\(AB\\) et \\(CD\\).\n<\/ol>","In an orthonormal frame, \\(A(3,0)\\), \\(B(5,3)\\), \\(C(4,0)\\) and \\(D(6,4)\\).\n<ol>\n<li>Calculate \\(\\vect{AB}\\), \\(\\vect{CD}\\), then \\(3\\vect{AB}-5\\vect{CD}\\).\n<li>Determine \\(U\\) such that \\(\\vect{BU}=2\\vect{AB}-\\vect{CD}\\).\n<li>Determine \\(E\\) such that \\(ABCE\\) is a parallelogram, then its centre \\(I\\).\n<li>Calculate \\(AB\\) and \\(CD\\).\n<\/ol>"],"a":["1. \\(\\vect{AB}=(2;3)\\) et \\(\\vect{CD}=(2;4)\\), donc \\(3\\vect{AB}-5\\vect{CD}=(-4;-11)\\).<br>\n2. \\(\\vect{BU}=(2;2)\\), donc \\(U=B+(2;2)=(7;5)\\).<br>\n3. \\(E=A+C-B=(2;-3)\\). Le centre est le milieu de \\([AC]\\) : \\(I(7/2;0)\\). Le milieu de \\([BE]\\) donne le même résultat.<br>\n4. \\(AB=\\sqrt{13}\\) et \\(CD=\\sqrt{20}=2\\sqrt5\\).","1. \\(\\vect{AB}=(2,3)\\) and \\(\\vect{CD}=(2,4)\\), so \\(3\\vect{AB}-5\\vect{CD}=(-4,-11)\\).<br>\n2. \\(\\vect{BU}=(2,2)\\), so \\(U=B+(2,2)=(7,5)\\).<br>\n3. \\(E=A+C-B=(2,-3)\\). The centre is the midpoint of \\([AC]\\): \\(I(7/2,0)\\). The midpoint of \\([BE]\\) gives the same result.<br>\n4. \\(AB=\\sqrt{13}\\) and \\(CD=\\sqrt{20}=2\\sqrt5\\)."]},{"k":"concept","t":["Colinéarité et déterminant","Collinearity and determinant"],"b":["Deux vecteurs non nuls sont colinéaires s'ils ont la même direction. Le vecteur nul est colinéaire à tout vecteur. Si \\(\\vec v\\ne\\vec0\\), \\(\\vec u\\) et \\(\\vec v\\) sont colinéaires si et seulement s'il existe un réel \\(k\\) tel que \\(\\vec u=k\\vec v\\).","Two nonzero vectors are collinear if they have the same direction. The zero vector is collinear with every vector. If \\(\\vec v\\ne\\vec0\\), \\(\\vec u\\) and \\(\\vec v\\) are collinear if and only if there exists a real number \\(k\\) such that \\(\\vec u=k\\vec v\\)."],"h":["Définition","Definition"]},{"k":"error","t":["Colinéarité et déterminant","Collinearity and determinant"],"b":["Dans la dernière caractérisation, la condition \\(\\vec v\\ne\\vec0\\) est nécessaire : un vecteur non nul ne peut pas être un multiple du vecteur nul.","In the last characterisation, the condition \\(\\vec v\\ne\\vec0\\) is necessary: a nonzero vector cannot be a multiple of the zero vector."]},{"k":"concept","t":["Colinéarité et déterminant","Collinearity and determinant"],"b":["Pour \\(\\vec u(x;y)\\), \\(\\vec v(x';y')\\), \\(\\det(\\vec u,\\vec v)=xy'-yx'\\).\n\\[\\vec u,\\vec v\\text{ colinéaires}\\quad\\Longleftrightarrow\\quad\\det(\\vec u,\\vec v)=0.\\]","For \\(\\vec u(x,y)\\), \\(\\vec v(x',y')\\), \\(\\det(\\vec u,\\vec v)=xy'-yx'\\).\n\\[\\vec u,\\vec v\\text{ collinear}\\quad\\Longleftrightarrow\\quad\\det(\\vec u,\\vec v)=0.\\]"],"h":["Déterminant et critère de colinéarité","Determinant and collinearity criterion"]},{"k":"proof","t":["Colinéarité et déterminant","Collinearity and determinant"],"b":["Si \\(\\vec u=k\\vec v\\), alors \\(xy'-yx'=kx'y'-ky'x'=0\\). Le cas où un vecteur est nul est immédiat.\nRéciproquement, supposons \\(\\vec v\\ne\\vec0\\) et \\(xy'-yx'=0\\). Si \\(x'\\ne0\\), posons \\(k=x/x'\\). L'égalité donne \\(y=ky'\\), donc \\(\\vec u=k\\vec v\\). Si \\(x'=0\\), alors \\(y'\\ne0\\), d'où \\(x=0\\) ; avec \\(k=y/y'\\), on obtient encore \\(\\vec u=k\\vec v\\).","If \\(\\vec u=k\\vec v\\), then \\(xy'-yx'=kx'y'-ky'x'=0\\). The case where a vector is zero is immediate.\nConversely, suppose \\(\\vec v\\ne\\vec0\\) and \\(xy'-yx'=0\\). If \\(x'\\ne0\\), let \\(k=x/x'\\). The equality gives \\(y=ky'\\), so \\(\\vec u=k\\vec v\\). If \\(x'=0\\), then \\(y'\\ne0\\), hence \\(x=0\\); with \\(k=y/y'\\), we again obtain \\(\\vec u=k\\vec v\\)."]},{"k":"example","t":["Colinéarité et déterminant","Collinearity and determinant"],"b":["Étudier la colinéarité : (a) \\(\\vec u(3;2)\\) et \\(\\vec v(-6;-5)\\) ; (b) \\(\\vec w(4;1)\\) et \\(\\vec t(3;3/4)\\). Si \\(\\vect{AB}=2\\vect{CD}\\) et \\(\\vect{BD}=-5\\vect{CD}\\), relier \\(\\vect{AB}\\) et \\(\\vect{BD}\\).","Study the collinearity of: (a) \\(\\vec u(3,2)\\) and \\(\\vec v(-6,-5)\\); (b) \\(\\vec w(4,1)\\) and \\(\\vec t(3,3/4)\\). If \\(\\vect{AB}=2\\vect{CD}\\) and \\(\\vect{BD}=-5\\vect{CD}\\), relate \\(\\vect{AB}\\) and \\(\\vect{BD}\\)."],"a":["(a) \\(\\det(\\vec u,\\vec v)=-15+12=-3\\ne0\\) : non colinéaires. (b) \\(\\vec t=\\frac34\\vec w\\) : colinéaires ; le déterminant vaut \\(4\\times\\frac34-3=0\\). Enfin \\(\\vect{AB}=-\\frac25\\vect{BD}\\), y compris si les vecteurs sont nuls.","(a) \\(\\det(\\vec u,\\vec v)=-15+12=-3\\ne0\\): not collinear. (b) \\(\\vec t=\\frac34\\vec w\\): collinear; the determinant is \\(4\\times\\frac34-3=0\\). Finally \\(\\vect{AB}=-\\frac25\\vect{BD}\\), including if the vectors are zero."]},{"k":"widget","t":["Vecteurs : trois points","Vectors: three points"],"b":["Déplacez A, B, C. Testez colinéarité et orthogonalité.","Drag A, B, C. Test collinearity and orthogonality."],"w":{"type":"vec","noDot":true}},{"k":"concept","t":["Alignement et parallélisme","Alignment and parallelism"],"b":["Pour \\(A\\ne B\\) et \\(C\\ne D\\), les droites \\((AB)\\) et \\((CD)\\) sont parallèles (éventuellement confondues) si et seulement si \\(\\det(\\vect{AB},\\vect{CD})=0\\).\nLes points \\(A,B,C\\) sont alignés si et seulement si \\(\\det(\\vect{AB},\\vect{AC})=0\\).","For \\(A\\ne B\\) and \\(C\\ne D\\), the lines \\((AB)\\) and \\((CD)\\) are parallel (possibly coincident) if and only if \\(\\det(\\vect{AB},\\vect{CD})=0\\).\nThe points \\(A,B,C\\) are collinear if and only if \\(\\det(\\vect{AB},\\vect{AC})=0\\)."],"h":["Applications","Applications"]},{"k":"example","t":["Alignement et parallélisme","Alignment and parallelism"],"b":["Montrer que \\((AB)\\) et \\((CD)\\) sont parallèles avec \\(A(2;-4)\\), \\(B(10;-2)\\), \\(C(-16;-4)\\) et \\(D(12;3)\\).","Show that \\((AB)\\) and \\((CD)\\) are parallel with \\(A(2,-4)\\), \\(B(10,-2)\\), \\(C(-16,-4)\\) and \\(D(12,3)\\)."],"a":["\\(\\vect{AB}=(8;2)\\) et \\(\\vect{CD}=(28;7)\\). Leur déterminant vaut \\(8\\times7-2\\times28=0\\). Les points de chaque paire sont distincts : les deux droites existent et sont parallèles.","\\(\\vect{AB}=(8,2)\\) and \\(\\vect{CD}=(28,7)\\). Their determinant is \\(8\\times7-2\\times28=0\\). The points of each pair are distinct: both lines exist and are parallel."]},{"k":"example","t":["Alignement et parallélisme","Alignment and parallelism"],"b":["Montrer que \\(E(0;1/2)\\), \\(F(2;1)\\) et \\(G(6;2)\\) sont alignés.","Show that \\(E(0,1/2)\\), \\(F(2,1)\\) and \\(G(6,2)\\) are collinear."],"a":["\\(\\vect{EF}=(2;1/2)\\) et \\(\\vect{EG}=(6;3/2)=3\\vect{EF}\\). Le déterminant vaut \\(2\\times3/2-(1/2)\\times6=0\\) ; donc les points sont alignés.","\\(\\vect{EF}=(2,1/2)\\) and \\(\\vect{EG}=(6,3/2)=3\\vect{EF}\\). The determinant is \\(2\\times3/2-(1/2)\\times6=0\\); so the points are collinear."]},{"k":"example","t":["Alignement et parallélisme","Alignment and parallelism"],"b":["Avec \\(A(-1;1)\\), \\(B(3;2)\\), \\(C(-2;-3)\\), \\(D(6;-1)\\), \\(E(5;0)\\), montrer que \\((AB)\\parallel(CD)\\) et que \\(E,B,D\\) sont alignés.","With \\(A(-1,1)\\), \\(B(3,2)\\), \\(C(-2,-3)\\), \\(D(6,-1)\\), \\(E(5,0)\\), show that \\((AB)\\parallel(CD)\\) and that \\(E,B,D\\) are collinear."],"a":["\\(\\vect{AB}=(4;1)\\) et \\(\\vect{CD}=(8;2)=2\\vect{AB}\\). Puis \\(\\vect{EB}=(-2;2)\\) et \\(\\vect{ED}=(1;-1)=-\\frac12\\vect{EB}\\). Les deux résultats suivent.","\\(\\vect{AB}=(4,1)\\) and \ (function(){
"use strict";
/* ---- ../js/canvas-navigation.js ---- */
// A camera is independent of the mathematical parameters. Moving an object never changes it.
function camera2D() {
  const c = { scale: 1, x: 0, y: 0 };
  c.project = ([x,y]) => [c.x+c.scale*x,c.y+c.scale*y];
  c.unproject = ([x,y]) => [(x-c.x)/c.scale,(y-c.y)/c.scale];
  c.zoomAt = (factor,[x,y]) => { const p=c.unproject([x,y]); c.scale=Math.max(.2,Math.min(12,c.scale*factor)); c.x=x-p[0]*c.scale;c.y=y-p[1]*c.scale; };
  c.reset=()=>{c.scale=1;c.x=c.y=0;};return c;
}
function navigationButtons(host,action,lang='fr') {
  const en=lang==='en',bar=document.createElement('div');bar.className='canvas-navigation';bar.setAttribute('role','group');bar.setAttribute('aria-label',en?'View controls':'Commandes de la vue');
  for(const [id,text,fr,english] of [['in','+','Agrandir','Zoom in'],['out','−','Réduire','Zoom out'],['reset','↺','Vue initiale','Reset view'],['left','←','Vue vers la gauche','Pan left'],['right','→','Vue vers la droite','Pan right'],['up','↑','Vue vers le haut','Pan up'],['down','↓','Vue vers le bas','Pan down']]) {
    const b=document.createElement('button');b.type='button';b.textContent=text;b.dataset.view=id;b.title=en?english:fr;b.setAttribute('aria-label',b.title);b.addEventListener('click',()=>action(id));bar.append(b);
  }
  const label=document.createElement('output');label.setAttribute('aria-live','polite');bar.append(label);host.append(bar);bar.update=scale=>{label.textContent=`${Math.round(scale*100)} %`;};bar.update(1);return bar;
}
function canvasNavigation(c,g,size,redraw,{host=c.parentElement,lang=document.documentElement.lang}={}) {
  const camera=camera2D(),rawClear=g.clearRect.bind(g);let last=null,gesture=null;

const blocks = () => [...document.querySelectorAll("#flow [data-reveal]")];

// ---- layout: the flow column is 520 px wide beside a figure, 1200 px without one
let figHidden = false;

// Shrink any formula wider than the column so that nothing is cut off or needs sideways scrolling (never below MIN_SCALE).

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}
function setLang(v) { lang = v; try { localStorage.setItem("me-slides-lang", lang ? "en" : "fr"); } catch {} buildDrawer(); render(); }

function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lng").onclick = () => setLang(lang ? 0 : 1);
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "l" || k === "L") setLang(lang ? 0 : 1);
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
</html>
