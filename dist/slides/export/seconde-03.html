<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Seconde","Seconde · French curriculum"],"id":"seconde-03","course":"seconde","number":3,"title":["Droites du plan","Straight lines in the plane"],"slides":[{"k":"title","t":["Droites du plan","Straight lines in the plane"],"b":["",""]},{"k":"concept","t":["Vecteur directeur et équation cartésienne","Direction vector and Cartesian equation"],"b":["Un vecteur directeur d'une droite est un vecteur <b>non nul<\/b> ayant la direction de cette droite. Si \\(A\\ne B\\), \\(\\vect{AB}\\) dirige \\((AB)\\).\nToute droite admet une équation \\(ax+by+c=0\\) avec \\((a;b)\\ne(0;0)\\). Un vecteur directeur est \\(\\vc{-b}{a}\\).","A direction vector of a line is a <b>nonzero<\/b> vector having the direction of that line. If \\(A\\ne B\\), \\(\\vect{AB}\\) directs \\((AB)\\).\nEvery line has an equation \\(ax+by+c=0\\) with \\((a,b)\\ne(0,0)\\). A direction vector is \\(\\vc{-b}{a}\\)."],"h":["Définition","Definition"]},{"k":"example","t":["Vecteur directeur et équation cartésienne","Direction vector and Cartesian equation"],"b":["Pour \\(A(-2;4)\\) et \\(B(6;2)\\), calculer \\(\\vect{AB}\\) puis vérifier que \\(\\vec u(4;-1)\\) dirige \\((AB)\\).","For \\(A(-2,4)\\) and \\(B(6,2)\\), calculate \\(\\vect{AB}\\) then check that \\(\\vec u(4,-1)\\) directs \\((AB)\\)."],"a":["\\(\\vect{AB}=(8;-2)=2\\vec u\\). Le vecteur \\(\\vec u\\) est non nul et colinéaire à \\(\\vect{AB}\\) ; il dirige donc \\((AB)\\).","\\(\\vect{AB}=(8,-2)=2\\vec u\\). The vector \\(\\vec u\\) is nonzero and collinear with \\(\\vect{AB}\\); it therefore directs \\((AB)\\)."]},{"k":"concept","t":["Vecteur directeur et équation cartésienne","Direction vector and Cartesian equation"],"b":["La droite passant par \\(A(x_A;y_A)\\) et dirigée par \\(\\vec u(\\alpha;\\beta)\\ne\\vec0\\) a pour équation\n\\[\\beta(x-x_A)-\\alpha(y-y_A)=0.\\]","The line through \\(A(x_A,y_A)\\) with direction vector \\(\\vec u(\\alpha,\\beta)\\ne\\vec0\\) has equation\n\\[\\beta(x-x_A)-\\alpha(y-y_A)=0.\\]"],"h":["Établir une équation à l'aide du déterminant","Establishing an equation with the determinant"]},{"k":"proof","t":["Vecteur directeur et équation cartésienne","Direction vector and Cartesian equation"],"b":["Un point \\(M(x;y)\\) appartient à la droite si et seulement si \\(\\vect{AM}\\) est colinéaire à \\(\\vec u\\), y compris pour \\(M=A\\). Or\n\\[\\det(\\vect{AM},\\vec u)=(x-x_A)\\beta-(y-y_A)\\alpha.\\]\nL'annulation du déterminant donne l'équation annoncée. En développant, \\(a=\\beta\\), \\(b=-\\alpha\\) et \\(c=-\\beta x_A+\\alpha y_A\\) ; comme \\(\\vec u\\ne\\vec0\\), \\((a;b)\\ne(0;0)\\).","A point \\(M(x,y)\\) belongs to the line if and only if \\(\\vect{AM}\\) is collinear with \\(\\vec u\\), including for \\(M=A\\). Now\n\\[\\det(\\vect{AM},\\vec u)=(x-x_A)\\beta-(y-y_A)\\alpha.\\]\nSetting the determinant to zero gives the stated equation. Expanding, \\(a=\\beta\\), \\(b=-\\alpha\\) and \\(c=-\\beta x_A+\\alpha y_A\\); since \\(\\vec u\\ne\\vec0\\), \\((a,b)\\ne(0,0)\\)."]},{"k":"error","t":["Vecteur directeur et équation cartésienne","Direction vector and Cartesian equation"],"b":["Le vecteur nul ne dirige aucune droite. Le signe du déterminant dépend de l'ordre des vecteurs, mais son annulation n'en dépend pas.","The zero vector directs no line. The sign of the determinant depends on the order of the vectors, but whether it vanishes does not."]},{"k":"method","t":["Déterminer une équation de droite","Determining the equation of a line"],"b":["À partir d'un point et d'un vecteur directeur : choisir \\(a,b\\) puis remplacer \\(x,y\\) par les coordonnées du point pour trouver \\(c\\). À partir de deux points distincts : calculer d'abord un vecteur directeur.","From a point and a direction vector: choose \\(a,b\\) then replace \\(x,y\\) by the coordinates of the point to find \\(c\\). From two distinct points: first calculate a direction vector."]},{"k":"example","t":["Déterminer une équation de droite","Determining the equation of a line"],"b":["Déterminer une équation cartésienne de la droite passant par \\(A(2;-1)\\) et dirigée par \\(\\vec u(3;2)\\).","Determine a Cartesian equation of the line through \\(A(2,-1)\\) with direction vector \\(\\vec u(3,2)\\)."],"a":["\\(a=2\\), \\(b=-3\\) conviennent. La droite a donc une équation \\(2x-3y+c=0\\). Comme \\(A\\) lui appartient, \\(4+3+c=0\\), d'où \\(c=-7\\). Une équation est \\(2x-3y-7=0\\). Vérification : \\(2\\times2-3\\times(-1)-7=0\\) et \\((3;2)\\) est bien directeur.","\\(a=2\\), \\(b=-3\\) will do. The line therefore has an equation \\(2x-3y+c=0\\). Since \\(A\\) belongs to it, \\(4+3+c=0\\), so \\(c=-7\\). An equation is \\(2x-3y-7=0\\). Check: \\(2\\times2-3\\times(-1)-7=0\\) and \\((3,2)\\) is indeed a direction vector."]},{"k":"example","t":["Déterminer une équation de droite","Determining the equation of a line"],"b":["Déterminer une équation cartésienne de \\((AB)\\) pour \\(A(3;3)\\) et \\(B(2;-2)\\).","Determine a Cartesian equation of \\((AB)\\) for \\(A(3,3)\\) and \\(B(2,-2)\\)."],"a":["\\(\\vect{AB}=(-1;-5)\\) dirige la droite. On peut choisir \\((a;b)=(5;-1)\\). Avec \\(A\\), \\(15-3+c=0\\), donc \\(c=-12\\). Ainsi \\(5x-y-12=0\\). Pour \\(B\\), \\(10+2-12=0\\), ce qui confirme le résultat.","\\(\\vect{AB}=(-1,-5)\\) directs the line. We can choose \\((a,b)=(5,-1)\\). With \\(A\\), \\(15-3+c=0\\), so \\(c=-12\\). Thus \\(5x-y-12=0\\). For \\(B\\), \\(10+2-12=0\\), which confirms the result."]},{"k":"example","t":["Déterminer une équation de droite","Determining the equation of a line"],"b":["Le point \\(P(1;2)\\) appartient-il à \\(d:2x-3y+4=0\\) ? Le point \\(Q(2;1)\\) lui appartient-il ?","Does the point \\(P(1,2)\\) belong to \\(d:2x-3y+4=0\\)? Does the point \\(Q(2,1)\\) belong to it?"],"a":["Pour \\(P\\), \\(2-6+4=0\\) : oui. Pour \\(Q\\), \\(4-3+4=5\\ne0\\) : non.","For \\(P\\), \\(2-6+4=0\\): yes. For \\(Q\\), \\(4-3+4=5\\ne0\\): no."]},{"k":"concept","t":["Équation réduite, pente et fonction affine","Slope-intercept equation, slope and affine function"],"b":["Une droite non verticale a une unique équation réduite \\(y=mx+p\\). \\(m\\) est la pente (coefficient directeur), \\(p\\) l'ordonnée à l'origine. Elle représente la fonction affine \\(x\\mapsto mx+p\\) ; \\((1;m)\\) est un vecteur directeur.\nUne droite verticale a une équation \\(x=k\\) ; elle n'est pas la courbe d'une fonction de \\(x\\). Une droite horizontale a une équation \\(y=k\\).","A non-vertical line has a unique slope-intercept equation \\(y=mx+p\\). \\(m\\) is the slope, \\(p\\) the y-intercept. It represents the affine function \\(x\\mapsto mx+p\\); \\((1,m)\\) is a direction vector.\nA vertical line has an equation \\(x=k\\); it is not the graph of a function of \\(x\\). A horizontal line has an equation \\(y=k\\)."],"h":["Définitions","Definitions"]},{"k":"concept","t":["Équation réduite, pente et fonction affine","Slope-intercept equation, slope and affine function"],"b":["Si \\(x_A\\ne x_B\\), la pente de \\((AB)\\) vaut \\(m=\\dfrac{y_B-y_A}{x_B-x_A}\\). Pour trouver \\(p\\), on utilise ensuite \\(y_A=mx_A+p\\).","If \\(x_A\\ne x_B\\), the slope of \\((AB)\\) is \\(m=\\dfrac{y_B-y_A}{x_B-x_A}\\). To find \\(p\\), we then use \\(y_A=mx_A+p\\)."],"h":["Calcul de pente","Calculating a slope"]},{"k":"example","t":["Équation réduite, pente et fonction affine","Slope-intercept equation, slope and affine function"],"b":["Déterminer l'équation réduite de \\(2x+3y-1=0\\), puis tracer \\(d:y=-2x+3\\).","Determine the slope-intercept equation of \\(2x+3y-1=0\\), then draw \\(d:y=-2x+3\\)."],"a":["\\(3y=-2x+1\\), donc \\(y=-\\frac23x+\\frac13\\). Pour \\(d\\), placer \\((0;3)\\) et \\((1;1)\\), puis tracer la droite ; un déplacement de \\(1\\) en abscisse correspond à \\(-2\\) en ordonnée.","\\(3y=-2x+1\\), so \\(y=-\\frac23x+\\frac13\\). For \\(d\\), plot \\((0,3)\\) and \\((1,1)\\), then draw the line; a move of \\(1\\) along the x-axis corresponds to \\(-2\\) on the y-axis."],"f":[[1,1]]},{"k":"example","t":["Équation réduite, pente et fonction affine","Slope-intercept equation, slope and affine function"],"b":["Trouver la fonction affine \\(f\\) telle que \\(f(0)=3\\) et \\(f(-1)=5\\), puis la fonction affine \\(g\\) dont la courbe passe par \\(C(-1;2)\\) et \\(E(5;-2)\\).","Find the affine function \\(f\\) such that \\(f(0)=3\\) and \\(f(-1)=5\\), then the affine function \\(g\\) whose graph passes through \\(C(-1,2)\\) and \\(E(5,-2)\\)."],"a":["\\(f(x)=-2x+3\\), car \\(m=(3-5)/(0+1)=-2\\). Pour \\(g\\), \\(m=(-2-2)/(5+1)=-2/3\\) et \\(p=2-2/3=4/3\\), donc \\(g(x)=-\\frac23x+\\frac43\\).","\\(f(x)=-2x+3\\), since \\(m=(3-5)/(0+1)=-2\\). For \\(g\\), \\(m=(-2-2)/(5+1)=-2/3\\) and \\(p=2-2/3=4/3\\), so \\(g(x)=-\\frac23x+\\frac43\\)."]},{"k":"widget","t":["Droites : deux points","Lines from two points"],"b":["Déplacez A et B. Observez le vecteur directeur, la pente et les équations.","Drag A and B. Watch the direction vector, the slope and the equations."],"w":{"type":"line"}},{"k":"concept","t":["Positions relatives de deux droites","Relative positions of two lines"],"b":["Deux droites sont sécantes, strictement parallèles ou confondues. Pour \\(y=mx+p\\) et \\(y=m'x+p'\\) :\n<ul><li>si \\(m\\ne m'\\), elles sont sécantes ;<li>si \\(m=m'\\) et \\(p\\ne p'\\), elles sont strictement parallèles ;<li>si \\(m=m'\\) et \\(p=p'\\), elles sont confondues.<\/ul>\nPour des équations cartésiennes, on compare les directions avec le déterminant. Si les directions sont colinéaires, on teste ensuite l'appartenance d'un point pour distinguer droites confondues et strictement parallèles.","Two lines are either intersecting, strictly parallel or coincident. For \\(y=mx+p\\) and \\(y=m'x+p'\\):\n<ul><li>if \\(m\\ne m'\\), they intersect;<li>if \\(m=m'\\) and \\(p\\ne p'\\), they are strictly parallel;<li>if \\(m=m'\\) and \\(p=p'\\), they coincide.<\/ul>\nFor Cartesian equations, we compare the directions with the determinant. If the directions are collinear, we then test the membership of a point to distinguish coincident lines from strictly parallel ones."],"h":["Propriétés","Properties"]},{"k":"example","t":["Positions relatives de deux droites","Relative positions of two lines"],"b":["Déterminer une équation de \\(d\\) passant par \\(A(2;3)\\) et parallèle à \\(d':x-3y-3=0\\).","Determine an equation of \\(d\\) through \\(A(2,3)\\) and parallel to \\(d':x-3y-3=0\\)."],"a":["\\(d'\\) a pour vecteur directeur \\((3;1)\\). On cherche \\(d:x-3y+c=0\\). Comme \\(A\\in d\\), \\(2-9+c=0\\), donc \\(c=7\\). Ainsi \\(d:x-3y+7=0\\). Les deux droites sont strictement parallèles, car les constantes diffèrent pour les mêmes coefficients de \\(x,y\\).","\\(d'\\) has direction vector \\((3,1)\\). We look for \\(d:x-3y+c=0\\). Since \\(A\\in d\\), \\(2-9+c=0\\), so \\(c=7\\). Thus \\(d:x-3y+7=0\\). The two lines are strictly parallel, because the constants differ for the same coefficients of \\(x,y\\)."]},{"k":"example","t":["Positions relatives de deux droites","Relative positions of two lines"],"b":["Étudier les positions relatives :\n<ol><li>\\(2x-y+1=0\\) et \\(4x-2y+2=0\\) ;<li>\\(x=2\\) et \\(x=-1\\) ;<li>\\(y=2x-3\\) et \\(y=-x+3\\).<\/ol>","Study the relative positions:\n<ol><li>\\(2x-y+1=0\\) and \\(4x-2y+2=0\\);<li>\\(x=2\\) and \\(x=-1\\);<li>\\(y=2x-3\\) and \\(y=-x+3\\).<\/ol>"],"a":["1. La deuxième équation est le double de la première : droites confondues. 2. Deux verticales distinctes : strictement parallèles. 3. Les pentes \\(2\\) et \\(-1\\) diffèrent : sécantes. Leur intersection vérifie \\(2x-3=-x+3\\), donc \\(x=2\\) et \\(y=1\\).","1. The second equation is twice the first: coincident lines. 2. Two distinct vertical lines: strictly parallel. 3. The slopes \\(2\\) and \\(-1\\) differ: intersecting. Their intersection satisfies \\(2x-3=-x+3\\), so \\(x=2\\) and \\(y=1\\)."]},{"k":"concept","t":["Intersection : résolution par substitution","Intersection: solving by substitution"],"b":["Résoudre un système de deux équations en \\(x,y\\), c'est trouver tous les couples \\((x;y)\\) vérifiant simultanément les deux équations. Pour deux équations de droites : une intersection donne un couple solution ; des droites strictement parallèles donnent aucune solution ; des droites confondues donnent une infinité de solutions.","Solving a system of two equations in \\(x,y\\) means finding all the pairs \\((x,y)\\) satisfying both equations simultaneously. For two equations of lines: an intersection gives one solution pair; strictly parallel lines give no solution; coincident lines give infinitely many solutions."],"h":["Définition","Definition"]},{"k":"method","t":["Intersection : résolution par substitution","Intersection: solving by substitution"],"b":["Isoler une inconnue dans une équation, remplacer son expression dans l'autre, résoudre puis retrouver la seconde inconnue. Vérifier le couple dans les deux équations initiales.","Isolate one unknown in one equation, substitute its expression into the other, solve, then find the second unknown. Check the pair in both original equations."],"h":["Substitution","Substitution"]},{"k":"example","t":["Intersection : résolution par substitution","Intersection: solving by substitution"],"b":["Résoudre \\(\\begin{cases}-2x+y+3=0,\\\\3x-5y-2=0.\\end{cases}\\)","Solve \\(\\begin{cases}-2x+y+3=0,\\\\3x-5y-2=0.\\end{cases}\\)"],"a":["La première équation donne \\(y=2x-3\\). En remplaçant dans la seconde : \\(3x-5(2x-3)-2=0\\), soit \\(-7x+13=0\\). Ainsi \\(x=13/7\\) puis \\(y=5/7\\). L'ensemble solution est \\(S=\\{(13/7;5/7)\\}\\). Les substitutions donnent \\((-26+5+21)/7=0\\) et \\((39-25-14)/7=0\\).","The first equation gives \\(y=2x-3\\). Substituting into the second: \\(3x-5(2x-3)-2=0\\), that is \\(-7x+13=0\\). Thus \\(x=13/7\\) then \\(y=5/7\\). The solution set is \\(S=\\{(13/7,5/7)\\}\\). The substitutions give \\((-26+5+21)/7=0\\) and \\((39-25-14)/7=0\\)."]},{"k":"example","t":["Intersection : résolution par substitution","Intersection: solving by substitution"],"b":["Résoudre par substitution :\n\\[\\text{(a) }\\begin{cases}-2x+y+3=0\\\\x-4y+5=0\\end{cases}\\qquad\n\\text{(b) }\\begin{cases}2x+3y-10=0\\\\4x+5y-16=0.\\end{cases}\\]","Solve by substitution:\n\\[\\text{(a) }\\begin{cases}-2x+y+3=0\\\\x-4y+5=0\\end{cases}\\qquad\n\\text{(b) }\\begin{cases}2x+3y-10=0\\\\4x+5y-16=0.\\end{cases}\\]"],"a":["(a) \\(y=2x-3\\) puis \\(x-4(2x-3)+5=0\\), d'où \\(x=17/7\\), \\(y=13/7\\).<br>(b) \\(x=(10-3y)/2\\) ; \\(2(10-3y)+5y-16=0\\), donc \\(y=4\\), puis \\(x=-1\\).","(a) \\(y=2x-3\\) then \\(x-4(2x-3)+5=0\\), so \\(x=17/7\\), \\(y=13/7\\).<br>(b) \\(x=(10-3y)/2\\); \\(2(10-3y)+5y-16=0\\), so \\(y=4\\), then \\(x=-1\\)."]},{"k":"method","t":["Combinaison linéaire et Python","Linear combination and Python"],"b":["Multiplier les équations par des nombres non nuls pour obtenir des coefficients opposés d'une inconnue ; les additionner pour éliminer cette inconnue. Conserver une équation du système pour calculer l'autre inconnue.","Multiply the equations by nonzero numbers to obtain opposite coefficients for one unknown; add them to eliminate that unknown. Keep one equation of the system to calculate the other unknown."],"h":["Combinaison linéaire","Linear combination"]},{"k":"example","t":["Combinaison linéaire et Python","Linear combination and Python"],"b":["Résoudre \\(\\begin{cases}2x+3y+1=0\\\\3x-4y-2=0.\\end{cases}\\) Reprendre ensuite les deux systèmes de l'exemple précédent par combinaison.","Solve \\(\\begin{cases}2x+3y+1=0\\\\3x-4y-2=0.\\end{cases}\\) Then redo the two systems of the previous example by linear combination."],"a":["Multiplier la première équation par \\(3\\) et la seconde par \\(-2\\) donne \\(6x+9y+3=0\\) et \\(-6x+8y+4=0\\). La somme donne \\(17y+7=0\\), d'où \\(y=-7/17\\). Puis \\(2x-21/17+1=0\\), donc \\(x=2/17\\).\nPour (a), ajouter quatre fois la première équation à la seconde : \\(-7x+17=0\\), donc \\((x;y)=(17/7;13/7)\\). Pour (b), soustraire deux fois la première à la seconde : \\(-y+4=0\\), donc \\((x;y)=(-1;4)\\).","Multiplying the first equation by \\(3\\) and the second by \\(-2\\) gives \\(6x+9y+3=0\\) and \\(-6x+8y+4=0\\). The sum gives \\(17y+7=0\\), so \\(y=-7/17\\). Then \\(2x-21/17+1=0\\), so \\(x=2/17\\).\nFor (a), add four times the first equation to the second: \\(-7x+17=0\\), so \\((x,y)=(17/7,13/7)\\). For (b), subtract twice the first from the second: \\(-y+4=0\\), so \\((x,y)=(-1,4)\\)."]},{"k":"code","t":["Python","Python"],"b":["def determinant(u, v):\n    return u[0]*v[1] - u[1]*v[0]\n\ndef alignes(A, B, C):\n    AB = (B[0]-A[0], B[1]-A[1])\n    AC = (C[0]-A[0], C[1]-A[1])\n    return determinant(AB, AC) == 0","def determinant(u, v):\n    return u[0]*v[1] - u[1]*v[0]\n\ndef alignes(A, B, C):\n    AB = (B[0]-A[0], B[1]-A[1])\n    AC = (C[0]-A[0], C[1]-A[1])\n    return determinant(AB, AC) == 0"]},{"k":"example","t":["Combinaison linéaire et Python","Linear combination and Python"],"b":["Prévoir <code>alignes((0,0), (2,1), (6,3))<\/code> puis <code>alignes((0,0), (2,1), (6,4))<\/code>.","Predict <code>alignes((0,0), (2,1), (6,3))<\/code> then <code>alignes((0,0), (2,1), (6,4))<\/code>."],"a":["<code>True<\/code>, puis <code>False<\/code> : les déterminants sont \\(0\\) et \\(2\\). Le test exact convient ici aux coordonnées entières ; les approximations flottantes demandent de tenir compte des erreurs numériques.","<code>True<\/code>, then <code>False<\/code>: the determinants are \\(0\\) and \\(2\\). The exact test is suitable here for integer coordinates; floating-point approximations require taking numerical errors into account."]}],"figureVersion":"acbb810551bff0f1"},"figs":{"seconde-03-1.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiB4bWxuczppbmtzY2FwZT0iaHR0cDovL3d3dy5pbmtzY2FwZS5vcmcvbmFtZXNwYWNlcy9pbmtzY2FwZSIgdmVyc2lvbj0iMS4xIiB3aWR0aD0iMjY1LjAwNSIgaGVpZ2h0PSIxNDkuODg1IiB2aWV3Qm94PSIwIDAgMjY1LjAwNSAxNDkuODg1Ij4KPGRlZn // A camera is independent of the mathematical parameters. Moving an object never changes it.
function camera2D() {
  const c = { scale: 1, x: 0, y: 0 };
  c.project = ([x,y]) => [c.x+c.scale*x,c.y+c.scale*y];
  c.unproject = ([x,y]) => [(x-c.x)/c.scale,(y-c.y)/c.scale];
  c.zoomAt = (factor,[x,y]) => { const p=c.unproject([x,y]); c.scale=Math.max(.2,Math.min(12,c.scale*factor)); c.x=x-p[0]*c.scale;c.y=y-p[1]*c.scale; };
  c.reset=()=>{c.scale=1;c.x=c.y=0;};return c;
}
function navigationButtons(host,action,lang='fr') {

  bar.setAttribute('aria-live','polite');host.append(bar);
  bar.update=scale=>{bar.textContent=`${Math.round(scale*100)} %`;};bar.update(1);return bar;
}

{

async function load() {

function sizeClass(html) {

const arrayTable = (spec, body) => {

  }

  s = s.replace(/\\\[\s*\\begin\{array\}\{([^}]*)\}([\s\S]*?)\\end\{array\}\s*\\\]/g, (_, spec, body) => arrayTable(spec, fixTeX(body)));

const blocks = () => [...document.querySelectorAll("#flow [data-reveal]")];
function paintSteps() {

  const n = Math.max(all.length, 1);
  $("#step-count").textContent = all.length ? `${t("step")} ${Math.min(step, n)} / ${n}` : "";
  $("#step-prev").disabled = step <= 1 && index === 0; $("#step-next").disabled = step >= n && index === deck.slides.length - 1;

function advance(direction) {

  else if (direction < 0 && step > 1) { step--; paintSteps(); }

  if (live) { live.destroy?.(); live = null; }
  $("#live").hidden = false; $("#live-lab").textContent = t("liveLab");

}

  flow.querySelectorAll("mjx-container").forEach(m => {
    if (!m.offsetParent) return;
    const svg = m.querySelector("svg"); if (!svg) return;
    const room = m.getAttribute("display") === "true" ? Math.min(avail, m.parentElement.clientWidth || avail) : avail;
    const w = svg.getBoundingClientRect().width / (flow.getBoundingClientRect().width / flow.offsetWidth);
    if (w > room) m.style.fontSize = Math.max(MIN_SCALE, room / w) * 100 + "%";
  });
}
function needsWidth() {
  return [...$("#flow").querySelectorAll("mjx-container")].some(m => m.offsetParent && m.querySelector("svg") && m.scrollWidth > m.clientWidth + 2 || m.offsetParent && m.style.fontSize && parseFloat(m.style.fontSize) <= MIN_SCALE * 100 + 1);
}

function chrome() {
  const s = deck.slides[index], n = deck.slides.length;
  $("#count").textContent = `${index + 1} / ${n}`;
  $("#pv").disabled = index === 0; $("#nx").disabled = index === n - 1;
  $("#pv").setAttribute("aria-label", t("prev")); $("#nx").setAttribute("aria-label", t("next"));
  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));

  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}


function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
