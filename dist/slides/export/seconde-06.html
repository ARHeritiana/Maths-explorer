<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}

/* laboratory experiments in a slide ({type:"lab"}, site/js/lab/shell.js mode "slide"): the canvas fills the widget host, the
   controls, the answer area and the mission stepper sit in #wctl, the formula and the readout in #readout, the prompt in the hint line */
.canvas-wrap.lab2-canvas-host{height:340px}
.lab2-stage{position:absolute;inset:0}
.lab2-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.lab2-handle{position:absolute;left:0;top:0;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;pointer-events:none}
.lab2-handle:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
.hint-line.lab2-hint{height:auto;min-height:22px;max-height:84px;overflow:auto;white-space:normal;font-size:18px;line-height:1.3;outline:0}
.lab2-slide{width:100%}
.lab2-slide .lab2-card{display:flex;flex-direction:column;gap:8px;width:100%}
.lab2-stepper{display:flex;align-items:center;gap:10px}
.lab2-step-label{font:600 18px system-ui,sans-serif;color:var(--muted)}
.lab2-kind{color:var(--amber);margin-left:4px}
.lab2-controls{display:grid;gap:8px}
.lab2-ctl{display:grid;gap:4px}
.lab2-ctl.is-locked{opacity:.45}
.lab2-ctl-label{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.lab2-ctl input[type=range]{width:100%}
.lab2-segments,.lab2-variants{display:flex;flex-wrap:wrap;gap:6px}
.lab2-segment.is-on,.lab2-variant[aria-pressed=true]{background:var(--amber)!important}
.lab2-options,.lab2-answer{display:grid;gap:6px}
.wctl .lab2-option,.wctl .lab2-variant{height:auto;min-height:38px;padding:6px 12px;text-align:left;white-space:normal;font-size:17px}
.lab2-option[aria-pressed=true]{background:var(--amber)!important}
.lab2-check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab2-check input[type=text]{height:38px;width:130px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:0 8px;font:600 17px system-ui,sans-serif}
.lab2-check label{font-size:17px}
.lab2-feedback{margin:0;font:600 17px/1.3 system-ui,sans-serif}.lab2-feedback:empty{display:none}
.lab2-feedback[data-tone=good]{color:var(--green)}.lab2-feedback[data-tone=warn]{color:var(--red)}
.lab2-reveal{border-left:4px solid var(--green);padding:4px 0 4px 12px;font-size:17px;line-height:1.35}
.lab2-recall,.lab2-note{margin:0;color:var(--muted);font-size:16px}
.lab2-hintbox summary{cursor:pointer;color:var(--amber);font:600 16px system-ui,sans-serif}.lab2-hintbox p{margin:4px 0 0;font-size:16px}
.wctl .lab2-restart{height:30px;background:transparent;color:var(--muted);text-decoration:underline;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab2-formula{margin:0 0 6px;font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.lab2-readout{display:grid;gap:3px;margin:0}
.lab2-readout>div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lab2-readout dt{color:var(--muted);font-size:16px}
.lab2-readout dd{margin:0;font-size:21px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Seconde","Seconde · French curriculum"],"id":"seconde-06","course":"seconde","number":6,"title":["Fonctions : représentations et fonctions de référence","Functions: representations and reference functions"],"slides":[{"k":"title","t":["Fonctions : représentations et fonctions de référence","Functions: representations and reference functions"],"b":["",""]},{"k":"concept","t":["Fonction, image et antécédent","Function, image and preimage"],"b":["Une fonction à valeurs réelles associe à chaque réel \\(x\\) de son ensemble de définition \\(D_f\\) un unique réel \\(f(x)\\), appelé image de \\(x\\). Un antécédent de \\(y\\) est un réel \\(x\\in D_f\\) tel que \\(f(x)=y\\). On note \\(f:x\\mapsto f(x)\\). Un nombre peut avoir aucun, un ou plusieurs antécédents.","A real-valued function associates to each real number \\(x\\) of its domain \\(D_f\\) a unique real number \\(f(x)\\), called the image of \\(x\\). A preimage of \\(y\\) is a real number \\(x\\in D_f\\) such that \\(f(x)=y\\). We write \\(f:x\\mapsto f(x)\\). A number may have no preimage, one, or several."],"h":["Définition","Definition"]},{"k":"example","t":["Fonction, image et antécédent","Function, image and preimage"],"b":["Soit \\(g(x)=x^2-4x+32\\) sur \\(\\R\\). Calculer \\(g(-5)\\). Soit \\(h(x)=3x+5\\) ; déterminer l'antécédent de \\(6\\) par \\(h\\).","Let \\(g(x)=x^2-4x+32\\) on \\(\\R\\). Calculate \\(g(-5)\\). Let \\(h(x)=3x+5\\); determine the preimage of \\(6\\) under \\(h\\)."],"a":["\\(g(-5)=25+20+32=77\\) : \\(77\\) est l'image de \\(-5\\), et \\(-5\\) est un antécédent de \\(77\\). Pour \\(h\\), \\(3x+5=6\\iff x=1/3\\). L'unique antécédent est \\(1/3\\).","\\(g(-5)=25+20+32=77\\): \\(77\\) is the image of \\(-5\\), and \\(-5\\) is a preimage of \\(77\\). For \\(h\\), \\(3x+5=6\\iff x=1/3\\). The only preimage is \\(1/3\\)."]},{"k":"example","t":["Fonction, image et antécédent","Function, image and preimage"],"b":["Pour la fonction carré, calculer les images de \\(-3\\) et \\(3\\), puis les antécédents de \\(9\\), \\(0\\) et \\(-1\\).","For the square function, calculate the images of \\(-3\\) and \\(3\\), then the preimages of \\(9\\), \\(0\\) and \\(-1\\)."],"a":["\\(f(-3)=f(3)=9\\). Les antécédents de \\(9\\) sont \\(-3,3\\) ; \\(0\\) a un seul antécédent, \\(0\\) ; \\(-1\\) n'en a aucun dans \\(\\R\\).","\\(f(-3)=f(3)=9\\). The preimages of \\(9\\) are \\(-3,3\\); \\(0\\) has a single preimage, \\(0\\); \\(-1\\) has none in \\(\\R\\)."]},{"k":"code","t":["Python","Python"],"b":["def g(x):\n    return x*x - 4*x + 32","def g(x):\n    return x*x - 4*x + 32"]},{"k":"example","t":["Fonction, image et antécédent","Function, image and preimage"],"b":["Distinguer <code>g(-5)<\/code> de <code>x = -5<\/code>.","Distinguish <code>g(-5)<\/code> from <code>x = -5<\/code>."],"a":["Le premier appelle la fonction et renvoie \\(77\\). Le second affecte \\(-5\\) à la variable <code>x<\/code>, sans calculer l'image par \\(g\\).","The first calls the function and returns \\(77\\). The second assigns \\(-5\\) to the variable <code>x<\/code>, without calculating the image under \\(g\\)."]},{"k":"concept","t":["Ensemble de définition","Domain of definition"],"b":["\\(D_f\\) contient les valeurs pour lesquelles le procédé définissant \\(f\\) a un sens. Un dénominateur doit être non nul ; un nombre placé sous une racine carrée doit être positif ou nul. Respecter aussi tout domaine imposé par l'énoncé ou le contexte.","\\(D_f\\) contains the values for which the process defining \\(f\\) makes sense. A denominator must be nonzero; a number under a square root must be positive or zero. Also respect any domain imposed by the statement or the context."],"h":["Conditions d'existence","Conditions for existence"]},{"k":"example","t":["Ensemble de définition","Domain of definition"],"b":["Déterminer les ensembles de définition :\n\\[f(x)=3x^2-5x+2,\\quad g(x)=\\frac{2x+1}{x-4},\\quad h(x)=\\frac{x}{x^2-9},\\quad k(x)=\\sqrt{2x-6}.\\]","Determine the domains of definition:\n\\[f(x)=3x^2-5x+2,\\quad g(x)=\\frac{2x+1}{x-4},\\quad h(x)=\\frac{x}{x^2-9},\\quad k(x)=\\sqrt{2x-6}.\\]"],"a":["\\(D_f=\\R\\). \\(D_g=]-\\infty;4[\\cup]4;+\\infty[\\) car \\(x-4\\ne0\\). \\(D_h=]-\\infty;-3[\\cup]-3;3[\\cup]3;+\\infty[\\) car \\(x^2-9\\ne0\\). \\(D_k=[3;+\\infty[\\) car \\(2x-6\\geq0\\).","\\(D_f=\\R\\). \\(D_g=(-\\infty,4)\\cup(4,+\\infty)\\) since \\(x-4\\ne0\\). \\(D_h=(-\\infty,-3)\\cup(-3,3)\\cup(3,+\\infty)\\) since \\(x^2-9\\ne0\\). \\(D_k=[3,+\\infty)\\) since \\(2x-6\\geq0\\)."]},{"k":"error","t":["Ensemble de définition","Domain of definition"],"b":["La racine carrée d'un nombre négatif n'existe pas dans \\(\\R\\) ; ce n'est pas « une racine carrée négative » que l'on exclut.","The square root of a negative number does not exist in \\(\\R\\); it is not “a negative square root” that is excluded."]},{"k":"example","t":["Ensemble de définition","Domain of definition"],"b":["Un rectangle de périmètre \\(20\\) m a pour largeur \\(x\\) m. Exprimer son aire et préciser le domaine si les deux dimensions doivent être strictement positives.","A rectangle of perimeter \\(20\\) m has width \\(x\\) m. Express its area and state the domain if both dimensions must be strictly positive."],"a":["La longueur vaut \\(10-x\\), donc \\(A(x)=x(10-x)\\) en m\\(^2\\). \\(x&gt;0\\) et \\(10-x&gt;0\\) donnent \\(D_A=]0;10[\\). Si les rectangles dégénérés étaient autorisés, on pourrait prendre \\([0;10]\\).","The length is \\(10-x\\), so \\(A(x)=x(10-x)\\) in m\\(^2\\). \\(x&gt;0\\) and \\(10-x&gt;0\\) give \\(D_A=(0,10)\\). If degenerate rectangles were allowed, we could take \\([0,10]\\)."],"h":["Modéliser","Modelling"]},{"k":"concept","t":["Tableau de valeurs et courbe représentative","Table of values and representative curve"],"b":["\\(\\mathcal C_f\\) est l'ensemble des points \\((x;f(x))\\), avec \\(x\\in D_f\\). Ainsi \\(M(a;b)\\in\\mathcal C_f\\iff a\\in D_f\\) et \\(b=f(a)\\).","\\(\\mathcal C_f\\) is the set of points \\((x,f(x))\\), with \\(x\\in D_f\\). Thus \\(M(a,b)\\in\\mathcal C_f\\iff a\\in D_f\\) and \\(b=f(a)\\)."],"h":["Définition","Definition"]},{"k":"example","t":["Tableau de valeurs et courbe représentative","Table of values and representative curve"],"b":["Sur \\([-1;4]\\), \\(f(x)=x^2-2x-1\\). Compléter le tableau, puis tracer la courbe sur tout l'intervalle.","On \\([-1,4]\\), \\(f(x)=x^2-2x-1\\). Complete the table, then draw the curve over the whole interval."],"a":["Images : \\(2\\) ; \\(0{,}25\\) ; \\(-1\\) ; \\(-2\\) ; \\(-1{,}75\\) ; \\(-1\\) ; \\(2\\) ; \\(7\\). Placer les points puis tracer la parabole. Des segments reliant ces seuls points ne donneraient qu'une approximation.","Images: \\(2\\); \\(0.25\\); \\(-1\\); \\(-2\\); \\(-1.75\\); \\(-1\\); \\(2\\); \\(7\\). Plot the points then draw the parabola. Segments joining only these points would give just an approximation."],"f":[[1,1]]},{"k":"concept","t":["Résolution graphique d'équations et d'inéquations","Graphical solving of equations and inequalities"],"b":["Les solutions de \\(f(x)=k\\) sont les abscisses des intersections de \\(\\mathcal C_f\\) avec \\(y=k\\). Pour \\(f(x)\\leq k\\), lire les abscisses où la courbe est en dessous de cette droite, intersections comprises ; avec \\(&lt;\\), les intersections sont exclues.","The solutions of \\(f(x)=k\\) are the abscissae of the intersections of \\(\\mathcal C_f\\) with \\(y=k\\). For \\(f(x)\\leq k\\), read the abscissae where the curve is below this line, intersections included; with \\(&lt;\\), the intersections are excluded."],"h":["Méthode","Method"]},{"k":"example","t":["Résolution graphique d'équations et d'inéquations","Graphical solving of equations and inequalities"],"b":["La courbe représente \\(f(x)=1+\\frac14(x+3)(x+1)(x-2)\\) sur \\([-4;3]\\). Résoudre graphiquement \\(f(x)=1\\), \\(f(x)\\leq1\\) et \\(f(x)&gt;1\\).","The curve represents \\(f(x)=1+\\frac14(x+3)(x+1)(x-2)\\) on \\([-4,3]\\). Solve graphically \\(f(x)=1\\), \\(f(x)\\leq1\\) and \\(f(x)&gt;1\\)."],"a":["\\(f(x)=1\\) : \\(-3,-1,2\\). \\(f(x)\\leq1\\) : \\([-4;-3]\\cup[-1;2]\\). \\(f(x)&gt;1\\) : \\(]-3;-1[\\cup]2;3]\\). Les bornes \\(-4,3\\) viennent du domaine. La factorisation vérifie exactement les intersections ; l'étude algébrique du signe sera consolidée en séquence 8.","\\(f(x)=1\\): \\(-3,-1,2\\). \\(f(x)\\leq1\\): \\([-4,-3]\\cup[-1,2]\\). \\(f(x)&gt;1\\): \\((-3,-1)\\cup(2,3]\\). The endpoints \\(-4,3\\) come from the domain. The factorisation checks the intersections exactly; the algebraic study of the sign will be consolidated in sequence 8."],"f":[[2,2]]},{"k":"concept","t":["Comparer deux fonctions ; lire un signe","Comparing two functions; reading a sign"],"b":["\\(f(x)=g(x)\\) se lit aux intersections des courbes. Pour \\(f(x)&lt;g(x)\\), \\(\\mathcal C_f\\) est strictement en dessous de \\(\\mathcal C_g\\) à la même abscisse. Le signe de \\(f(x)\\) se lit par rapport à l'axe des abscisses.","\\(f(x)=g(x)\\) is read at the intersections of the curves. For \\(f(x)&lt;g(x)\\), \\(\\mathcal C_f\\) is strictly below \\(\\mathcal C_g\\) at the same abscissa. The sign of \\(f(x)\\) is read relative to the x-axis."],"h":["Méthode","Method"]},{"k":"example","t":["Comparer deux fonctions ; lire un signe","Comparing two functions; reading a sign"],"b":["Sur \\([-3;3]\\), \\(f(x)=x^2\\) et \\(g(x)=x+2\\). Résoudre \\(f=g\\), \\(f&lt;g\\), \\(f\\geq g\\) et déterminer le signe de \\(g\\).","On \\([-3,3]\\), \\(f(x)=x^2\\) and \\(g(x)=x+2\\). Solve \\(f=g\\), \\(f&lt;g\\), \\(f\\geq g\\) and determine the sign of \\(g\\)."],"a":["\\(f=g\\) pour \\(x=-1,2\\) ; \\(f&lt;g\\) sur \\(]-1;2[\\) ; \\(f\\geq g\\) sur \\([-3;-1]\\cup[2;3]\\). \\(g\\) est strictement négative sur \\([-3;-2[\\), nulle en \\(-2\\), strictement positive sur \\(]-2;3]\\). Signe et variations sont des informations différentes.","\\(f=g\\) for \\(x=-1,2\\); \\(f&lt;g\\) on \\((-1,2)\\); \\(f\\geq g\\) on \\([-3,-1]\\cup[2,3]\\). \\(g\\) is strictly negative on \\([-3,-2)\\), zero at \\(-2\\), strictly positive on \\((-2,3]\\). Sign and variations are different pieces of information."],"f":[[3,3]]},{"k":"concept","t":["Fonctions affines et valeur absolue","Affine functions and absolute value"],"b":["Une fonction affine est \\(f(x)=mx+p\\) sur \\(\\R\\). Elle est linéaire si \\(p=0\\), constante si \\(m=0\\). Pour \\(m\\ne0\\), elle s'annule en \\(-p/m\\) ; son signe est celui de \\(m\\) à droite de ce nombre.\nLa fonction \\(x\\mapsto|x|\\) est définie sur \\(\\R\\), positive ou nulle, et s'annule uniquement en \\(0\\).","An affine function is \\(f(x)=mx+p\\) on \\(\\R\\). It is linear if \\(p=0\\), constant if \\(m=0\\). For \\(m\\ne0\\), it vanishes at \\(-p/m\\); its sign is that of \\(m\\) to the right of this number.\nThe function \\(x\\mapsto|x|\\) is defined on \\(\\R\\), positive or zero, and vanishes only at \\(0\\)."],"h":["Définitions","Definitions"]},{"k":"example","t":["Fonctions affines et valeur absolue","Affine functions and absolute value"],"b":["Classer (plusieurs réponses possibles) en affine, linéaire, constante : \\(5x+2\\) ; \\(5x\\) ; \\(7+2x-7\\) ; \\(6\\) ; \\(6(4x-2)\\) ; \\(6x+5-6x\\).","Classify (several answers possible) as affine, linear, constant: \\(5x+2\\); \\(5x\\); \\(7+2x-7\\); \\(6\\); \\(6(4x-2)\\); \\(6x+5-6x\\)."],"a":["Toutes sont affines. \\(5x\\) et \\(2x\\) sont linéaires ; \\(6\\) et \\(5\\) sont constantes ; \\(24x-12\\) n'est ni linéaire ni constante.","All are affine. \\(5x\\) and \\(2x\\) are linear; \\(6\\) and \\(5\\) are constant; \\(24x-12\\) is neither linear nor constant."],"f":[[4,4]]},{"k":"concept","t":["Fonctions affines et valeur absolue","Affine functions and absolute value"],"b":["Si \\(k&lt;0\\), \\(|x|=k\\) et \\(|x|\\leq k\\) n'ont aucune solution, et \\(|x|\\geq k\\) est vraie sur \\(\\R\\). Si \\(k=0\\), les deux premières donnent \\(x=0\\), la troisième est vraie sur \\(\\R\\). Pour \\(k&gt;0\\) :\n\\[|x|=k\\iff x\\in\\{-k;k\\},\\quad |x|\\leq k\\iff x\\in[-k;k],\\]\n\\[|x|\\geq k\\iff x\\in]-\\infty;-k]\\cup[k;+\\infty[.\\]","If \\(k&lt;0\\), \\(|x|=k\\) and \\(|x|\\leq k\\) have no solution, and \\(|x|\\geq k\\) is true on \\(\\R\\). If \\(k=0\\), the first two give \\(x=0\\), the third is true on \\(\\R\\). For \\(k&gt;0\\):\n\\[|x|=k\\iff x\\in\\{-k,k\\},\\quad |x|\\leq k\\iff x\\in[-k,k],\\]\n\\[|x|\\geq k\\iff x\\in(-\\infty,-k]\\cup[k,+\\infty).\\]"],"h":["Équations et inéquations","Equations and inequalities"]},{"k":"example","t":["Fonctions affines et valeur absolue","Affine functions and absolute value"],"b":["Résoudre \\(|x|=5\\), \\(|x|=-3\\), \\(|x|\\leq3\\), \\(|x|\\geq4\\).","Solve \\(|x|=5\\), \\(|x|=-3\\), \\(|x|\\leq3\\), \\(|x|\\geq4\\)."],"a":["\\(\\{-5;5\\}\\) ; \\(\\varnothing\\) ; \\([-3;3]\\) ; \\(]-\\infty;-4]\\cup[4;+\\infty[\\).","\\(\\{-5,5\\}\\); \\(\\varnothing\\); \\([-3,3]\\); \\((-\\infty,-4]\\cup[4,+\\infty)\\)."]},{"k":"concept","t":["Fonctions carré et inverse","Square and inverse functions"],"b":["\\(x\\mapsto x^2\\) est définie sur \\(\\R\\) ; sa courbe est une parabole. \\(x^2\\geq0\\), avec égalité seulement en \\(0\\).\n\\(x\\mapsto1/x\\) est définie sur \\(\\R^*\\) ; sa courbe est une hyperbole. \\(1/x\\) a le signe de \\(x\\) et ne s'annule jamais.","\\(x\\mapsto x^2\\) is defined on \\(\\R\\); its curve is a parabola. \\(x^2\\geq0\\), with equality only at \\(0\\).\n\\(x\\mapsto1/x\\) is defined on \\(\\R^*\\); its curve is a hyperbola. \\(1/x\\) has the sign of \\(x\\) and never vanishes."],"h":["Définitions et signe","Definitions and sign"],"f":[[5,5],[6,6]]},{"k":"concept","t":["Fonctions carré et inverse","Square and inverse functions"],"b":["Si \\(k&lt;0\\), \\(x^2=k\\) et \\(x^2\\leq k\\) n'ont pas de solution ; \\(x^2\\geq k\\) est vraie sur \\(\\R\\). Si \\(k=0\\), les deux premières donnent \\(x=0\\), la troisième est vraie sur \\(\\R\\). Pour \\(k&gt;0\\) :\n\\[x^2=k\\iff x\\in\\{-\\sqrt k;\\sqrt k\\},\\quad x^2\\leq k\\iff x\\in[-\\sqrt k;\\sqrt k],\\]\n\\[x^2\\geq k\\iff x\\in]-\\infty;-\\sqrt k]\\cup[\\sqrt k;+\\infty[.\\]","If \\(k&lt;0\\), \\(x^2=k\\) and \\(x^2\\leq k\\) have no solution; \\(x^2\\geq k\\) is true on \\(\\R\\). If \\(k=0\\), the first two give \\(x=0\\), the third is true on \\(\\R\\). For \\(k&gt;0\\):\n\\[x^2=k\\iff x\\in\\{-\\sqrt k,\\sqrt k\\},\\quad x^2\\leq k\\iff x\\in[-\\sqrt k,\\sqrt k],\\]\n\\[x^2\\geq k\\iff x\\in(-\\infty,-\\sqrt k]\\cup[\\sqrt k,+\\infty).\\]"],"h":["Équations et inéquations avec \\(x^2\\)","Equations and inequalities with \\(x^2\\)"]},{"k":"example","t":["Fonctions carré et inverse","Square and inverse functions"],"b":["Résoudre \\(x^2=4\\), \\(x^2=-1\\), \\(x^2\\geq4\\), \\(x^2\\geq-1\\), \\(1/x=4\\), \\(1/x=0\\).","Solve \\(x^2=4\\), \\(x^2=-1\\), \\(x^2\\geq4\\), \\(x^2\\geq-1\\), \\(1/x=4\\), \\(1/x=0\\)."],"a":["\\(\\{-2;2\\}\\) ; \\(\\varnothing\\) ; \\(]-\\infty;-2]\\cup[2;+\\infty[\\) ; \\(\\R\\) ; \\(\\{1/4\\}\\) ; \\(\\varnothing\\). Plus généralement, \\(1/x=k\\) a l'unique solution \\(1/k\\) si \\(k\\ne0\\), aucune si \\(k=0\\).","\\(\\{-2,2\\}\\); \\(\\varnothing\\); \\((-\\infty,-2]\\cup[2,+\\infty)\\); \\(\\R\\); \\(\\{1/4\\}\\); \\(\\varnothing\\). More generally, \\(1/x=k\\) has the unique solution \\(1/k\\) if \\(k\\ne0\\), none if \\(k=0\\)."]},{"k":"widget","t":["Fonctions de référence","Reference functions"],"b":["Choisissez une fonction, déplacez M : image et antécédents.","Choose a function, drag M: image and preimages."],"w":{"type":"ref"}},{"k":"method","t":["Inéquations avec la fonction inverse","Inequalities with the inverse function"],"b":["Respecter \\(x\\ne0\\) et lire les deux branches de l'hyperbole. Ne pas multiplier une inéquation par \\(x\\) sans connaître son signe.","Respect \\(x\\ne0\\) and read both branches of the hyperbola. Do not multiply an inequality by \\(x\\) without knowing its sign."]},{"k":"example","t":["Inéquations avec la fonction inverse","Inequalities with the inverse function"],"b":["Résoudre \\(1/x\\geq2\\), \\(1/x\\leq-1\\), \\(1/x&lt;1/2\\) et \\(1/x&gt;-2\\).","Solve \\(1/x\\geq2\\), \\(1/x\\leq-1\\), \\(1/x&lt;1/2\\) and \\(1/x&gt;-2\\)."],"a":["\\(]0;1/2]\\) ; \\([-1;0[\\) ; \\(]-\\infty;0[\\cup]2;+\\infty[\\) ; \\(]-\\infty;-1/2[\\cup]0;+\\infty[\\). Une inégalité stricte exclut l'intersection avec \\(y=k\\) ; \\(0\\) est toujours interdit.","\\((0,1/2]\\); \\([-1,0)\\); \\((-\\infty,0)\\cup(2,+\\infty)\\); \\((-\\infty,-1/2)\\cup(0,+\\infty)\\). A strict inequality excludes the intersection with \\(y=k\\); \\(0\\) is always forbidden."]},{"k":"example","t":["Inéquations avec la fonction inverse","Inequalities with the inverse function"],"b":["Un élève écrit : « \\(1/x\\leq2\\iff1\\leq2x\\), donc \\(x\\geq1/2\\) ». Que manque-t-il ?","A student writes: “\\(1/x\\leq2\\iff1\\leq2x\\), so \\(x\\geq1/2\\)”. What is missing?"],"a":["Il a supposé implicitement \\(x&gt;0\\). Pour \\(x&lt;0\\), \\(1/x&lt;0&lt;2\\) : ces valeurs conviennent aussi. L'ensemble correct est \\(]-\\infty;0[\\cup[1/2;+\\infty[\\). Le nombre \\(-1\\) réfute son équivalence.","They implicitly assumed \\(x&gt;0\\). For \\(x&lt;0\\), \\(1/x&lt;0&lt;2\\): these values also work. The correct set is \\((-\\infty,0)\\cup[1/2,+\\infty)\\). The number \\(-1\\) refutes their equivalence."]},{"k":"concept","t":["Mobiliser racine carrée et cube","Using square root and cube"],"b":["\\(x\\mapsto\\sqrt x\\) est définie sur \\([0;+\\infty[\\) et à valeurs positives ou nulles. Pour \\(k\\geq0\\), \\(\\sqrt x=k\\iff x=k^2\\) ; pour \\(k&lt;0\\), aucune solution.\n\\(x\\mapsto x^3\\) est définie sur \\(\\R\\). Chaque réel \\(k\\) possède un unique antécédent, noté \\(\\sqrt[3]{k}\\).","\\(x\\mapsto\\sqrt x\\) is defined on \\([0,+\\infty)\\) and takes values that are positive or zero. For \\(k\\geq0\\), \\(\\sqrt x=k\\iff x=k^2\\); for \\(k&lt;0\\), no solution.\n\\(x\\mapsto x^3\\) is defined on \\(\\R\\). Every real number \\(k\\) has a unique preimage, written \\(\\sqrt[3]{k}\\)."],"h":["Définitions","Definitions"],"f":[[7,7],[8,8]]},{"k":"example","t":["Mobiliser racine carrée et cube","Using square root and cube"],"b":["Résoudre \\(\\sqrt x=3\\) ; \\(\\sqrt x=-2\\) ; \\(\\sqrt x\\leq2\\) ; \\(\\sqrt x&gt;3\\) ; \\(x^3=-8\\) ; \\(x^3\\leq27\\).","Solve \\(\\sqrt x=3\\); \\(\\sqrt x=-2\\); \\(\\sqrt x\\leq2\\); \\(\\sqrt x&gt;3\\); \\(x^3=-8\\); \\(x^3\\leq27\\)."],"a":["\\(\\{9\\}\\) ; \\(\\varnothing\\) ; \\([0;4]\\) ; \\(]9;+\\infty[\\) ; \\(\\{-2\\}\\) ; \\(]-\\infty;3]\\). Respecter le domaine pour les racines carrées. La fonction cube conserve l'ordre.","\\(\\{9\\}\\); \\(\\varnothing\\); \\([0,4]\\); \\((9,+\\infty)\\); \\(\\{-2\\}\\); \\((-\\infty,3]\\). Respect the domain for square roots. The cube function preserves order."]},{"k":"example","t":["Mobiliser racine carrée et cube","Using square root and cube"],"b":["Comparer \\(x^2\\) et \\(x\\) pour \\(x=1/2\\), puis \\(x=2\\). Le carré d'un positif est-il toujours plus grand que lui ?","Compare \\(x^2\\) and \\(x\\) for \\(x=1/2\\), then \\(x=2\\). Is the square of a positive number always greater than the number itself?"],"a":["\\(1/4&lt;1/2\\) mais \\(4&gt;2\\). L'affirmation est fausse ; \\(1/2\\) est un contre-exemple. Étude générale en séquence 10.","\\(1/4&lt;1/2\\) but \\(4&gt;2\\). The claim is false; \\(1/2\\) is a counterexample. General study in sequence 10."]}],"figureVersion":"f074097d076318e2"},"figs":{"seconde-06-1.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiB4bWxuczppbmtzY2FwZT0iaHR0cDovL3d3dy5pbmtzY2FwZS5vcmcvbmFtZXNwYWNlcy9pbmtzY2FwZSIgdmVyc2lvbj0iMS4xIiB3aWR0aD0iMzIxLjY5MSIgaGVpZ2h0PSIyMzQuODI2IiB2aWV3Qm94PSIwIDAgMzIxLjY5MSAyMzQuODI2Ij4KPGRlZnM+CjxwYXRoIGlkPSJmb250XzFfMSIgZD0iTS42NTg5OTY2IC4yMzA0Njg3NUMuNjc1OTk0OSAuMjMwNDY4NzUgLjY5NDAwMDI3IC4yMzA0Njg3NSAuNjk0MDAwMjcgLjI1MDQ1Nzc3IC42OTQwMDAyNyAuMjcwNDYyMDUgLjY3NTk5NDkgLjI3MDQ2MjA1IC42NTg5OTY2IC4yNzA0NjIwNUguMTE3OTk2MjE5Qy4xMDA5OTc5MjggLjI3           : o.pair(`${inl("\\Delta>0")} : deux racines réelles ${inl(`${N(Math.min(x, x2))}`)} et ${inl(`${N(Math.max(x, x2))}`)}`, `${inl("\\Delta>0")}: two real roots ${inl(`${N(Math.min(x, x2))}`)} and ${inl(`${N(Math.max(x, x2))}`)}`);
        set(o, lines(eqn, o.pair(`Discriminant ${inl(`\\Delta=${tpar(N, -S)}^2-4\\times${tpar(N, P)}=${N(D)}`)}`, `Discriminant ${inl(`\\Delta=${tpar(N, -S)}^2-4\\times${tpar(N, P)}=${N(D)}`)}`), roots,
          o.pair(`Somme ${inl(`z_1+z_2=${N(S)}`)}, produit ${inl(`z_1z_2=${N(P)}`)}`, `Sum ${inl(`z_1+z_2=${N(S)}`)}, product ${inl(`z_1z_2=${N(P)}`)}`)));
      },
    };
  },

  // n-th roots of a complex number a: drag a (modulus and argument snap), choose n. The roots form a regular polygon
  // on the circle of radius |a|^(1/n); their sum is zero.
  roots(o) {
    const a = [1, 0]; let n = o.spec.n || 6; const v = () => iso(o, 4.4);
    slider(o, inl("n"), 2, 12, 1, n, q => { n = q; o.redraw(); });
    return {
      handles() { const V = v(); return [{ x: V.X(a[0]), y: V.Y(a[1]), cur: "grab", move(X, Y) { const q = polarSnap(V.iX(X), V.iY(Y), .25, 4); a[0] = q[0]; a[1] = q[1]; } }]; },
      draw(g) {
        const V = v(), N = o.tn, r = Math.hypot(...a), t = Math.atan2(a[1], a[0]), rho = r ** (1 / n); axes(g, V, { lang: o.L });
        const z = Array.from({ length: n }, (_, k) => [rho * Math.cos((t + 2 * k * Math.PI) / n), rho * Math.sin((t + 2 * k * Math.PI) / n)]);
        ring(g, V, rho, C.muted); g.save(); g.strokeStyle = C.blue; g.fillStyle = "rgba(143,183,255,.14)"; g.lineWidth = 2; g.beginPath(); z.forEach((p, k) => (k ? g.lineTo(V.X(p[0]), V.Y(p[1])) : g.moveTo(V.X(p[0]), V.Y(p[1])))); g.closePath(); g.fill(); g.stroke(); g.restore();
        z.forEach((p, k) => dot(o, V.X(p[0]), V.Y(p[1]), C.blue, k ? "" : inl("z_0"), "default", false));
        arrowTo(g, V, [0, 0], a, C.acc); dot(o, V.X(a[0]), V.Y(a[1]), C.acc, inl("a"));
        const s = angTeX(t, N), ks = o.L ? `k\\in\\{0,\\ldots,${n - 1}\\}` : `k\\in\\llbracket 0\\,;${n - 1}\\rrbracket`;
        set(o, lines(o.pair(`${inl(`a=${Math.abs(r - 1) < 1e-9 ? "" : N(r) + "\\,"}\\mathrm{e}^{i\\theta}`)} avec ${inl(`\\theta=${s}`)}`, `${inl(`a=${Math.abs(r - 1) < 1e-9 ? "" : N(r) + "\\,"}\\mathrm{e}^{i\\theta}`)} with ${inl(`\\theta=${s}`)}`),
          o.pair(`Solutions de ${inl(`z^{${n}}=a`)} : ${inl(`z_k=\\sqrt[${n}]{${N(r)}}\\,\\mathrm{e}^{i\\frac{\\theta+2k\\pi}{${n}}}`)}, ${inl(ks)}`, `Solutions of ${inl(`z^{${n}}=a`)}: ${inl(`z_k=\\sqrt[${n}]{${N(r)}}\\,\\mathrm{e}^{i\\frac{\\theta+2k\\pi}{${n}}}`)}, ${inl(ks)}`),
          o.pair(`Module commun ${inl(`|z_k|\\approx${N(rho, 3)}`)} ; polygone régulier à ${inl(String(n))} sommets`, `Common modulus ${inl(`|z_k|\\approx${N(rho, 3)}`)}; regular polygon with ${inl(String(n))} vertices`),
          inl(`z_0+z_1+\\cdots+z_{${n - 1}}=0`)));
      },
    };
  },

  // Residues modulo n on a clock: drag a around the clock, set n. Mode powers: the successive powers of a (period, and
  // Fermat's little theorem when n is prime). Mode inverse: multiplication by a, inverse of a when gcd(a, n) = 1.
  modclock(o) {
    const mode = o.spec.mode || "powers"; let n = o.spec.n || 7, a = o.spec.a || 3;
    slider(o, inl("n"), 2, 30, 1, n, q => { n = q; a = Math.min(a, n - 1); o.redraw(); });
    const geo = () => { const cx = o.W / 2, cy = o.H / 2 + 6, R = Math.min(o.W, o.H) / 2 - 46; return { cx, cy, R, at: k => [cx + R * Math.sin(2 * Math.PI * k / n), cy - R * Math.cos(2 * Math.PI * k / n)] }; };
    return {
      handles() { const G = geo(), [x, y] = G.at(a); return [{ x, y, cur: "grab", move(X, Y) { const t = Math.atan2(X - G.cx, -(Y - G.cy)); a = ((Math.round(t / (2 * Math.PI / n)) % n) + n) % n; } }]; },
      draw(g) {
        const G = geo(), N = o.tn, d = igcd(a, n), name = o.L ? "\\gcd" : "\\operatorname{PGCD}";
        g.save(); g.strokeStyle = C.grid; g.lineWidth = 2; g.beginPath(); g.arc(G.cx, G.cy, G.R, 0, 7); g.stroke(); g.restore();
        for (let k = 0; k < n; k++) { const [x, y] = G.at(k), [lx, ly] = [G.cx + (G.R + 24) * Math.sin(2 * Math.PI * k / n), G.cy - (G.R + 24) * Math.cos(2 * Math.PI * k / n)]; g.save(); g.fillStyle = C.muted; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.restore(); text(g, String(k), lx, ly + 6, C.muted, 14, "center"); }
        const chord = (i, j, col) => { const P = G.at(i), Q = G.at(j); arrowTo(g, { X: s => s, Y: s => s }, P, Q, col, 2.5); };
        if (mode === "powers") {
          const seen = new Map(), seq = []; let x = 1 % n; while (!seen.has(x)) { seen.set(x, seq.length); seq.push(x); x = x * a % n; }
          for (let k = 0; k + 1 < seq.length; k++) chord(seq[k], seq[k + 1], C.acc); if (seq.length > 1 || x !== seq[0]) chord(seq[seq.length - 1], x, C.acc);
          seq.forEach(k => { const [px, py] = G.at(k); g.save(); g.fillStyle = C.acc; g.beginPath(); g.arc(px, py, 6, 0, 7); g.fill(); g.restore(); });
          dot(o, ...G.at(a), C.warn, inl("a"));
          const shown = seq.slice(0, 8).map((r, k) => `${a}^{${k}}\\equiv${r}`).join(",\\ ") + (seq.length > 8 ? ",\\ \\ldots" : "");
          const isPrime = n > 1 && Array.from({ length: n - 2 }, (_, i) => i + 2).every(p => n % p);
          const period = d === 1 ? o.pair(`Retour à 1 : plus petit ${inl("m\\geqslant1")} tel que ${inl(`${a}^m\\equiv1\\pmod{${n}}`)} : ${inl(`m=${seq.length}`)}`, `Back to 1: least ${inl("m\\geqslant1")} with ${inl(`${a}^m\\equiv1\\pmod{${n}}`)}: ${inl(`m=${seq.length}`)}`)
            : o.pair(`${inl(`${name}(${a},${n})=${d}`)} : aucune puissance ${inl(`${a}^m`)}, ${inl("m\\geqslant1")}, n'est congrue à 1`, `${inl(`${name}(${a},${n})=${d}`)}: no power ${inl(`${a}^m`)}, ${inl("m\\geqslant1")}, is congruent to 1`);
          const fermat = isPrime && a % n ? o.pair(`${inl(String(n))} est premier : ${inl(`${a}^{${n - 1}}\\equiv${powmod(a, n - 1, n)}\\pmod{${n}}`)} (petit théorème de Fermat)`, `${inl(String(n))} is prime: ${inl(`${a}^{${n - 1}}\\equiv${powmod(a, n - 1, n)}\\pmod{${n}}`)} (Fermat's little theorem)`) : "";
          set(o, lines(o.pair(`Puissances de ${inl(String(a))} modulo ${inl(String(n))} :`, `Powers of ${inl(String(a))} modulo ${inl(String(n))}:`), inl(shown), period, fermat));
        } else {
          for (let k = 1; k < n; k++) if (k * a % n !== k) chord(k, k * a % n, d === 1 ? "rgba(232,163,61,.55)" : "rgba(255,122,122,.55)");
          dot(o, ...G.at(a), C.warn, inl("a"));
          let r0 = n, r1 = a, u0 = 0, u1 = 1; while (r1) { const q = Math.floor(r0 / r1); [r0, r1] = [r1, r0 - q * r1]; [u0, u1] = [u1, u0 - q * u1]; }
          const u = ((u0 % n) + n) % n, vco = (1 - a * u) / n;
          const inv = d === 1 ? lines(o.pair(`Bézout : ${inl(`${a}\\times${tpar(N, u)}${vco < 0 ? "-" : "+"}${n}\\times${Math.abs(vco)}=1`)}`, `Bézout: ${inl(`${a}\\times${tpar(N, u)}${vco < 0 ? "-" : "+"}${n}\\times${Math.abs(vco)}=1`)}`),
            o.pair(`Inverse de ${inl(String(a))} modulo ${inl(String(n))} : ${inl(`${u}`)}, car ${inl(`${a}\\times${u}=${a * u}\\equiv1\\pmod{${n}}`)}`, `Inverse of ${inl(String(a))} modulo ${inl(String(n))}: ${inl(`${u}`)}, since ${inl(`${a}\\times${u}=${a * u}\\equiv1\\pmod{${n}}`)}`),
            o.pair("La multiplication par a permute les restes.", "Multiplication by a permutes the remainders."))
            : o.pair(`Pas d'inverse : ${inl(`${a}x\\equiv1\\pmod{${n}}`)} n'a pas de solution, ${inl(`${a}x`)} reste multiple de ${inl(String(d))}.`, `No inverse: ${inl(`${a}x\\equiv1\\pmod{${n}}`)} has no solution, since ${inl(`${a}x`)} stays a multiple of ${inl(String(d))}.`);
          set(o, lines(inl(`${name}(${a},${n})=${d}`), inv));
        }
      },
    };
  },

  // Walks in the bush-taxi graph of the activity (A-B, A-C, A-D, B-C, C-D, D-E): drag the start and end markers onto
  // vertices and choose the length k; the entry of M^k counts the walks, as the adjacency-matrix theorem states.
  walks(o) {
    const names = ["A", "B", "C", "D", "E"], pos = [[.22, .3], [.5, .12], [.5, .55], [.22, .78], [.82, .78]], E = [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 4]];
    let i = 0, j = 2, k = 2; slider(o, inl("k"), 1, 6, 1, k, q => { k = q; o.redraw(); });
    const M = names.map((_, r) => names.map((_, c) => (E.some(([p, q]) => (p === r && q === c) || (p === c && q === r)) ? 1 : 0)));
    const mul = (A, B) => A.map(row => B[0].map((_, c) => row.reduce((s, x, t) => s + x * B[t][c], 0)));
    const at = q => [40 + pos[q][0] * (o.W - 80), 30 + pos[q][1] * (o.H - 60)];
    const near = (X, Y) => pos.map((_, q) => [Math.hypot(at(q)[0] - X, at(q)[1] - Y), q]).sort((u, w) => u[0] - w[0])[0][1];
    return {
      handles() { const [xi, yi] = at(i), [xj, yj] = at(j); return [{ x: xi - 18, y: yi - 18, r: 24, cur: "grab", move(X, Y) { i = near(X + 18, Y + 18); } }, { x: xj + 18, y: yj + 18, r: 24, cur: "grab", move(X, Y) { j = near(X - 18, Y - 18); } }]; },
      draw(g) {
        let P = M; for (let t = 1; t < k; t++) P = mul(P, M);
        g.save(); g.strokeStyle = C.axis; g.lineWidth = 3; E.forEach(([p, q]) => { g.beginPath(); g.moveTo(...at(p)); g.lineTo(...at(q)); g.stroke(); }); g.restore();
        names.forEach((s, q) => { const [x, y] = at(q); g.save(); g.fillStyle = q === i || q === j ? C.ink : C.grid; g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 17, 0, 7); g.fill(); g.stroke(); g.restore(); text(g, inl(s), x, y + 8, q === i || q === j ? C.bg : C.ink, 18, "center"); });
        const [xi, yi] = at(i), [xj, yj] = at(j); dot(o, xi - 18, yi - 18, C.acc, o.pair("départ", "start"), "grab", true, -1); dot(o, xj + 18, yj + 18, C.warn, o.pair("arrivée", "end"));
        const row = P[i].map(x => String(x)).join("&"), I = names[i], J = names[j], n = P[i][j];
        set(o, lines(o.pair(`Chaînes de longueur ${inl(String(k))} de ${inl(I)} à ${inl(J)} : ${inl(String(n))}`, `Walks of length ${inl(String(k))} from ${inl(I)} to ${inl(J)}: ${inl(String(n))}`),
          o.pair(`C'est le coefficient ${inl(`\\left(M^{${k}}\\right)_{${I}${J}}=${n}`)} de la matrice d'adjacence.`, `It is the entry ${inl(`\\left(M^{${k}}\\right)_{${I}${J}}=${n}`)} of the adjacency matrix.`),
          o.pair(`Ligne ${inl(I)} de ${inl(`M^{${k}}`)} : ${inl(`\\begin{pmatrix}${row}\\end{pmatrix}`)}`, `Row ${inl(I)} of ${inl(`M^{${k}}`)}: ${inl(`\\begin{pmatrix}${row}\\end{pmatrix}`)}`)));
      },
    };
  },

  // Two-state Markov chain: drag the initial probability a0 = P(X0 = 1) and the transition probabilities p (1 to 2) and
  // q (2 to 1). The plot shows a_n = P(Xn = 1), which tends to q/(p+q) since a_n - l = (1-p-q)^n (a_0 - l).
  markov(o) {
    let a0 = .9, p = .3, q = .2; const bx = 70, rows = [[34, "a_0"], [86, "p"], [138, "q"]];
    const vplot = () => ({ x0: 70, x1: o.W - 30, y0: 190, y1: o.H - 34 }), bw = () => o.W - 100;
    return {
      handles() { return rows.map(([y], k) => ({ x: bx + [a0, p, q][k] * bw(), y: y + 13, cur: "ew-resize", move(X) { const val = clamp(snap((X - bx) / bw(), .05), k ? .05 : 0, 1); if (k === 0) a0 = val; else if (k === 1) p = val; else q = val; } })); },
      draw(g) {
        const N = o.tn, l = q / (p + q), B = bw(), F = vplot(), n = 15, X = t => F.x0 + t / n * (F.x1 - F.x0), Y = y => F.y1 - y * (F.y1 - F.y0);
        rows.forEach(([y, s], k) => { const val = [a0, p, q][k]; g.fillStyle = C.grid; g.fillRect(bx, y, B, 26); g.fillStyle = C.acc; g.fillRect(bx, y, val * B, 26); text(g, inl(`${s}=${N(val)}`), 12, y + 20, C.ink, 16); dot(o, bx + val * B, y + 13, C.warn); });
        g.save(); g.strokeStyle = C.axis; g.lineWidth = 1.5; g.beginPath(); g.moveTo(F.x0, F.y0); g.lineTo(F.x0, F.y1); g.lineTo(F.x1, F.y1); g.stroke(); g.setLineDash([6, 5]); g.strokeStyle = C.blue; g.beginPath(); g.moveTo(F.x0, Y(l)); g.lineTo(F.x1, Y(l)); g.stroke(); g.restore();
        text(g, "1", F.x0 - 8, Y(1) + 6, C.muted, 14, "right"); text(g, "0", F.x0 - 8, Y(0) + 6, C.muted, 14, "right"); text(g, inl("\\ell"), F.x1 - 4, Y(l) - 8, C.blue, 16, "right"); text(g, inl("n"), F.x1, F.y1 + 24, C.muted, 16, "right");
        let a = a0; g.save(); g.fillStyle = C.acc; for (let t = 0; t <= n; t++) { g.beginPath(); g.arc(X(t), Y(a), 5, 0, 7); g.fill(); a = a * (1 - p) + (1 - a) * q; } g.restore();
        const an = l + (1 - p - q) ** n * (a0 - l), osc = Math.abs(p + q - 2) < 1e-9; // p = q = 1: T swaps the states, no limit
        set(o, lines(inl(`T=\\begin{pmatrix}${N(1 - p)}&${N(p)}\\\\${N(q)}&${N(1 - q)}\\end{pmatrix},\\quad \\pi_{n+1}=\\pi_nT`),
          o.pair(`Avec ${inl("\\pi_n=\\begin{pmatrix}a_n&1-a_n\\end{pmatrix}")} : ${inl(`a_{n+1}=${N(1 - p - q)}\\,a_n+${N(q)}`)}`, `With ${inl("\\pi_n=\\begin{pmatrix}a_n&1-a_n\\end{pmatrix}")}: ${inl(`a_{n+1}=${N(1 - p - q)}\\,a_n+${N(q)}`)}`),
          osc ? o.pair(`${inl("p+q=2")} : ${inl("(a_n)")} alterne entre ${inl(N(a0))} et ${inl(N(1 - a0))}, elle n'a pas de limite (sauf si ${inl("a_0=0{,}5")}). La loi ${inl("\\pi=\\begin{pmatrix}0{,}5&0{,}5\\end{pmatrix}")} reste invariante.`, `${inl("p+q=2")}: ${inl("(a_n)")} alternates between ${inl(N(a0))} and ${inl(N(1 - a0))}; it has no limit (unless ${inl("a_0=0.5")}). The distribution ${inl("\\pi=\\begin{pmatrix}0.5&0.5\\end{pmatrix}")} stays invariant.`) :
          o.pair(`Limite ${inl(`\\ell=\\dfrac{q}{p+q}=${N(l, 3)}`)} ; état stable ${inl(`\\pi=\\begin{pmatrix}${N(l, 3)}&${N(1 - l, 3)}\\end{pmatrix}`)}`, `Limit ${inl(`\\ell=\\dfrac{q}{p+q}=${N(l, 3)}`)}; stable state ${inl(`\\pi=\\begin{pmatrix}${N(l, 3)}&${N(1 - l, 3)}\\end{pmatrix}`)}`),
          inl(`a_{${n}}=\\ell+(${N(1 - p - q)})^{${n}}(a_0-\\ell)\\approx${N(an, 4)}`)));
      },
    };
  },
};
}

/* ---- widgets-3d.js ---- */
{
// True 3D with the 2D canvas: orthographic camera, z up, painter's algorithm. Dragging empty space rotates (pitch clamped).
// the one camera of the site (also the laboratory template `space`)

const set = (o, html) => rich(o.readout, html);
const lines = (...a) => a.filter(Boolean).join("<br>");

function cam(o, s = 38, c = [0, 0, 1]) {
  const k = { yaw: -.7, pitch: .55 };
  o.rotate = {
    active: false, last: null,
    start(e, pt) { this.active = true; this.last = pt(e); },
    move(e, pt) { const p = pt(e); cam3Turn(k, (p[0] - this.last[0]) * .008, (p[1] - this.last[1]) * .006); this.last = p; o.redraw(); },
    end() { this.active = false; },
  };
  const P = (x, y, z) => { const q = cam3Project(k.yaw, k.pitch, x - c[0], y - c[1], z - c[2]); return { X: o.W / 2 + s * q.u, Y: o.H / 2 - s * q.v, d: q.d }; };
  const un = (X, Y, zf) => { const q = cam3Unproject(k.yaw, k.pitch, (X - o.W / 2) / s, -(Y - o.H / 2) / s, zf - c[2]); return { x: q.x + c[0], y: q.y + c[1] }; };
  return { k, P, un };
}
function poly(g, pts, fill, alpha, stroke) { g.save(); g.globalAlpha = alpha; g.fillStyle = fill; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p.X, p.Y) : g.moveTo(p.X, p.Y))); g.closePath(); g.fill(); g.globalAlpha = 1; if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); } g.restore(); }
function seg(g, a, b, col, w = 2.5, dash) { g.save(); g.strokeStyle = col; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.moveTo(a.X, a.Y); g.lineTo(b.X, b.Y); g.stroke(); g.restore(); }
function floor(g, V, half = 4) { const f = []; for (let i = -half; i <= half; i++) { seg(g, V(i, -half, 0), V(i, half, 0), C.grid, 1); seg(g, V(-half, i, 0), V(half, i, 0), C.grid, 1); } }
function axes3(g, V, L = 4.5) { [["x", [L, 0, 0]], ["y", [0, L, 0]], ["z", [0, 0, L]]].forEach(([n, p]) => { const a = V(0, 0, 0), b = V(...p); seg(g, a, b, C.axis, 1.6); text(g, inl(n), b.X + 6, b.Y - 6, C.muted, 16); }); }



var W3 = {
  // Surface z = f(x, y) patch with a draggable point on the floor (integration / level curves): painter's algorithm.
  surface3d(o) {
    let px = 1, py = 1; const f = (x, y) => 3 - (x * x + y * y) / 3; const { k, P, un } = cam(o, 36, [0, 0, 1.5]); const n = 18, h = 3;
    return {
      handles() { const s = P(px, py, 0); return [{ x: s.X, y: s.Y, cur: "move", move(X, Y) { const q = un(X, Y, 0); px = clamp(snap(q.x, .25), -h, h); py = clamp(snap(q.y, .25), -h, h); } }]; },
      draw(g) {
        floor(g, P, 3); axes3(g, P, 3.5); const facets = [];
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
          const x0 = -h + 2 * h * i / n, x1 = -h + 2 * h * (i + 1) / n, y0 = -h + 2 * h * j / n, y1 = -h + 2 * h * (j + 1) / n;
          const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([x, y]) => P(x, y, f(x, y))), z = f((x0 + x1) / 2, (y0 + y1) / 2);
          facets.push({ pts, d: pts.reduce((s, p) => s + p.d, 0) / 4, z });
        }
        facets.sort((a, b) => b.d - a.d).forEach(F => { const sh = .45 + .1 * Math.min(1, F.z / 3); poly(g, F.pts, `rgb(${Math.round(60 + 60 * sh)},${Math.round(150 + 80 * sh)},${Math.round(130 + 60 * sh)})`, .95, "rgba(20,32,36,.6)"); });
        const s = P(px, py, 0), t = P(px, py, f(px, py)); seg(g, s, t, C.warn, 2, [4, 4]); dot(o, t.X, t.Y, C.warn, "", "default", false); dot(o, s.X, s.Y, C.acc, o.L ? "(x, y)" : "(x ; y)");
        set(o, lines(inl("z=3-\\dfrac{x^2+y^2}{3}"), inl(`f${tpt(o, px, py)}=${o.tn(f(px, py), 3)}`), o.pair("Glissez le fond pour tourner.", "Drag the background to rotate.")));
      },
    };
  },
};
}

/* ---- player.js ---- */
// Classroom slide player, modelled on the interactive maths slide skill (Presenter + Explore):
// fixed 1280x720 stage, flow column of step blocks on the left, live figure with controls on the right,
// ◀ ▶ steps and "Tout" at the bottom left. The same file is bundled by scripts/export-slides.py into a
// self-contained HTML export of each deck (window.__MX_EXPORT__ then carries the deck and its figures).

const $ = (s, r = document) => r.querySelector(s);
const EXPORT = typeof window !== "undefined" && window.__MX_EXPORT__ ? window.__MX_EXPORT__ : null;
const params = new URLSearchParams(location.search);
const deckId = EXPORT ? EXPORT.deck.id : params.get("deck") || "premiere-01";
const stored = () => { try { return JSON.parse(localStorage.getItem("maths-explorer-v1") || "{}").lang === "en" ? 1 : 0; } catch { return 0; } };
let lang = params.get("lang") === "en" ? 1 : params.get("lang") === "fr" ? 0 : stored();
let deck, index = 0, revealed = false, live = null, step = 1, generation = 0, toastTimer = 0;

const KIND = {
  title: ["Titre", "Title"], goals: ["Objectifs", "Goals"], concept: ["À retenir", "Key idea"], method: ["Méthode", "Method"],
  example: ["Exemple", "Example"], error: ["Attention", "Watch out"], try: ["À vous", "Your turn"], proof: ["Démonstration", "Proof"],
  activity: ["Activité", "Activity"], code: ["Python", "Python"], widget: ["Explorer", "Explore"],
};
const UI = {
  stepPrev: ["Étape précédente", "Previous step"], stepNext: ["Étape suivante", "Next step"], all: ["Tout", "All"],
  step: ["Étape", "Step"], prev: ["Diapositive précédente", "Previous slide"], next: ["Diapositive suivante", "Next slide"],
  answer: ["Voir la réponse", "Show the answer"], hide: ["Masquer la réponse", "Hide the answer"], answerLab: ["Réponse", "Answer"],
  lang: ["English", "Français"], list: ["Plan", "Outline"], full: ["Plein écran", "Full screen"],
  download: ["Télécharger HTML", "Download HTML"], downloadTip: ["Télécharger ce diaporama en un seul fichier HTML", "Download this deck as a single HTML file"],
  home: ["Toutes les séries", "All decks"], loadErr: ["Série introuvable.", "Deck not found."],
  hint: ["Flèches : étapes et diapositives · R réponse · G plan · F plein écran", "Arrows: steps and slides · R answer · G outline · F full screen"],
  slides: ["diapositives", "slides"], liveLab: ["Valeurs en direct", "Live values"],
  explore: ["Explorer le chapitre", "Explore the chapter"], figure: ["Figure", "Figure"],
  free: ["La figure est réglable librement ; ses valeurs peuvent différer de celles de l’exemple.", "The figure is freely adjustable; its values may differ from the worked example."],
  blocked: ["Plein écran bloqué par l’application. Ouvrez le lien dans le navigateur, puis touchez ⛶.", "Full screen is blocked here. Open the page in the browser, then tap ⛶."],
  noMath: ["Les formules n’ont pas pu se charger : une connexion internet est nécessaire.", "Formulas could not load: an internet connection is required."],
};
const t = k => UI[k][lang];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const COURSE = { stmg: "Terminale STMG", premiere: "Première", seconde: "Seconde", terminale: "Terminale", expertes: "Maths expertes" };
const SIZE_NARROW = 1500;

function fit() {
  const wrap = $("#wrap"), stage = $("#stage");
  if (matchMedia("(max-width:760px) and (orientation:portrait)").matches) { wrap.style.width = ""; wrap.style.height = ""; stage.style.transform = ""; return; }
  const k = Math.min(innerWidth / 1280, innerHeight / 720);
  wrap.style.width = 1280 * k + "px"; wrap.style.height = 720 * k + "px"; stage.style.transform = `scale(${k})`;
}

function toast(message) {
  const el = $("#toast"); el.textContent = message; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

function shell() {
  $("#stage").innerHTML = `<div id="col"><div id="flow" tabindex="-1"></div><div id="live" hidden><div class="hd" id="live-lab"></div><div id="readout"></div></div></div>
<div id="rt"></div>
<div id="r1"><button class="b" id="step-prev">◀</button><span id="step-count"></span><button class="b" id="step-next">▶</button><button class="b" id="all-steps">Tout</button><span class="gap"></span><button class="b" id="pv">‹</button><span class="count" id="count"></span><button class="b" id="nx">›</button></div>
<div id="r2"><button class="b" id="tg" hidden></button><button class="b" id="rev" hidden></button><button class="b" id="lst" aria-pressed="false"></button><button class="b" id="fs" title="Plein écran">⛶</button></div>
<div id="prog"><i></i></div><nav id="drawer" hidden></nav><div id="toast" hidden></div>`;
}

async function load() {
  if (EXPORT) deck = EXPORT.deck;
  else {
    try {
      const r = await fetch(`./data/${encodeURIComponent(deckId)}.json`, {cache:"no-store"});
      if (!r.ok) throw new Error(r.status);
      deck = await r.json();
    } catch {
      $("#stage").innerHTML = `<div id="col" class="wide"><h2 class="tt">${t("loadErr")}</h2><p><a class="b" href="../index.html#slides">${t("home")}</a></p></div>`;
      return;
    }
  }
  if (deck.language) lang = deck.language === "en" ? 1 : 0;
  shell(); bind();
  const h = parseInt(location.hash.slice(1), 10);
  index = Number.isFinite(h) ? Math.min(Math.max(h, 0), deck.slides.length - 1) : 0;
  buildDrawer(); render();
}

function sizeClass(html) {
  const n = html.replace(/<[^>]+>/g, "").length + (html.match(/\\[(\[]/g) || []).length * 25 + (html.match(/<li>/g) || []).length * 70 + (html.match(/\\\\/g) || []).length * 45;
  return n > SIZE_NARROW ? "s4" : n > 1100 ? "s3" : n > 750 ? "s2" : n > 420 ? "s1" : "";
}
// ---- mathematics: normalise the deck TeX to the skill's rules before MathJax sees it
const SUB = "₀₁₂₃₄₅₆₇₈₉", SUP = { "²": "2", "³": "3" };
const MATH_ANY = /\\\((.*?)\\\)|\\\[(.*?)\\\]/gs;
// Fractions are always \dfrac; French intervals and lists take a thin space before ";" (entities such as &lt; are left alone).
const fixTeX = t => {
  t = t.replace(/\\frac(?![A-Za-z])/g, "\\dfrac");
  if (!lang) t = t.replace(/(\\[,;]|\\text\{[^}]*\}|&[a-z]+;)|;/g, (m, keep) => keep || "\\,;");
  return t;
};
// Unicode sub/superscripts in prose become TeX: x₁ -> \(x_1\).
const uniMath = h => h.replace(/([A-Za-z])([₀-₉]+|[²³])/g, (_, v, u) => `\\(${v}${SUP[u] ? "^" + SUP[u] : "_{" + [...u].map(c => SUB.indexOf(c)).join("") + "}"}\\)`);
// \begin{array}{c|c} ... \hline ... \end{array} is an HTML <table> with CSS rules (MathJax array rules do not render reliably).
const arrayTable = (spec, body) => {
  const cols = []; let rule = false;
  for (const c of spec) { if (c === "|") { if (cols.length) cols[cols.length - 1].r = true; else rule = true; } else cols.push({ l: rule, r: false }), rule = false; }
  const rows = []; let top = false;
  for (let row of body.split(/\\\\/)) {
    let line = false; row = row.replace(/\\hline/g, () => { line = true; return ""; });
    if (!row.trim()) { if (line) top = true; continue; }
    rows.push({ cells: row.split("&amp;").map(c => c.trim()), top: top || line }); top = false;
  }
  const tr = rows.map((r, i) => `<tr${r.top && i ? ' class="rule"' : ""}>${r.cells.map((c, j) => `<td${cols[j]?.l ? ' class="l"' : ""}${cols[j]?.r ? ' class="r"' : ""}>${c ? `\\(${c}\\)` : ""}</td>`).join("")}</tr>`).join("");
  return `<table class="sg">${tr}</table>`;
};
const tex = s => {
  s = s.replace(/\\\[\s*\\begin\{array\}\{([^}]*)\}([\s\S]*?)\\end\{array\}\s*\\\]/g, (_, spec, body) => arrayTable(spec, fixTeX(body)));
  s = s.replace(MATH_ANY, (m, a, b) => (a !== undefined ? `\\(${fixTeX(a)}\\)` : `\\[${fixTeX(b)}\\]`));
  s = s.split(/(\\\(.*?\\\)|\\\[.*?\\\]|<table[\s\S]*?<\/table>)/gs).map((part, i) => (i % 2 ? part : uniMath(part))).join("");
  return lang ? s.replace(/\\pgcd/g, "\\gcd").replace(/\\ppcm/g, "\\operatorname{lcm}") : s;
};
const plain = s => String(s).replace(/\\\((.*?)\\\)/g, (_, t) => t.replace(/\\[a-zA-Z]+\s?/g, "").replace(/[{}]/g, ""));

// Text nodes come back from the DOM decoded ("<" for &lt;): escape them again before they are re-parsed.
const escText = x => x.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Cumulative reveal: one block per sentence, list item, paragraph or table, shown step by step.
function revealMarkup(html) {
  const template = document.createElement("template"); template.innerHTML = html;
  const parts = []; let pending = "";
  const flush = () => { if (pending.trim()) parts.push(pending); pending = ""; };
  for (const node of template.content.childNodes) {
    if (node.nodeType === 1 && ["UL", "OL"].includes(node.tagName)) {
      flush(); [...node.children].forEach((li, i) => parts.push(`<${node.tagName.toLowerCase()} ${node.tagName === "OL" ? `start="${i + 1}"` : ""}>${li.outerHTML}</${node.tagName.toLowerCase()}>`));
    } else if (node.nodeType === 3) {
      const text = node.textContent; let start = 0, math = false;
      for (let i = 0; i < text.length; i++) {
        if (text.slice(i, i + 2) === "\\(" || text.slice(i, i + 2) === "\\[") math = true;
        if (text.slice(i, i + 2) === "\\)" || text.slice(i, i + 2) === "\\]") math = false;
        if (!math && text[i] === "." && /^\s+[A-ZÀ-Ý]/.test(text.slice(i + 1))) { pending += escText(text.slice(start, i + 1)); flush(); start = i + 1; }
      }
      pending += escText(text.slice(start));
    } else if (node.nodeType === 1) {
      if (node.tagName === "BR") flush(); else if (["P", "DIV", "TABLE", "PRE"].includes(node.tagName)) { flush(); parts.push(node.outerHTML); } else pending += node.outerHTML;
    }
  }
  flush(); return (parts.length ? parts : [html]).map((part, i) => `<div class="reveal-block" data-reveal="${i + 1}">${part}</div>`).join("");
}

const blocks = () => [...document.querySelectorAll("#flow [data-reveal]")];
function paintSteps() {
  const all = blocks();
  all.forEach((b, i) => { b.hidden = i >= step; });
  const n = Math.max(all.length, 1);
  $("#step-count").textContent = all.length ? `${t("step")} ${Math.min(step, n)} / ${n}` : "";
  $("#step-prev").disabled = step <= 1 && index === 0; $("#step-next").disabled = step >= n && index === deck.slides.length - 1;
  $("#all-steps").classList.toggle("on", all.length > 0 && step >= all.length && all.length > 1);
  $("#all-steps").hidden = all.length < 2;
  if (typeof MathJax !== "undefined" && $("#flow").querySelector("mjx-container")) fitMath();
}
function advance(direction) {
  const n = blocks().length;
  if (direction > 0 && step < n) { step++; paintSteps(); const b = blocks()[step - 1]; b?.scrollIntoView({ block: "nearest", behavior: "instant" }); }
  else if (direction < 0 && step > 1) { step--; paintSteps(); }
  else go(index + direction, direction < 0);
}

function companion(spec, showDelta) {
  if (live) { live.destroy?.(); live = null; }
  $("#live").hidden = false; $("#live-lab").textContent = t("liveLab");
  live = mount({ ...spec, showDelta }, { host: $("#wcanvas"), controls: $("#wctl"), readout: $("#readout"), hint: $("#whint"), lang });
}

function figSrc(deckKey, name) { const file = `${deckKey}-${name}${lang ? "-en" : ""}.svg`; return EXPORT ? EXPORT.figs[file] || "" : `./fig/${encodeURIComponent(file)}?v=${deck.figureVersion || ""}`; }

async function render() {
  const renderId = ++generation;
  if (live) { live.destroy?.(); live = null; }
  const s = deck.slides[index], k = s.k, label = KIND[k]?.[lang] || k;
  document.documentElement.lang = lang ? "en" : "fr";
  document.title = `${plain(deck.title[lang])} · Maths Explorer`;
  const title = esc(s.t[lang]), rawBody = tex(s.b[lang] || "");
  const widgets = deck.slides.filter(x => x.k === "widget"), shared = widgets[0];
  const ans = s.a ? tex(s.a[lang]) : "";
  const figs = (s.f || []).map(p => `<figure class="fig"><img src="${figSrc(deckId, p[lang])}" alt="${esc(plain(s.t[lang]))}"></figure>`).join("");
  const mode = k === "title" || k === "code" ? "none" : k === "widget" ? "widget" : figs ? "fig" : shared && k !== "goals" ? "explore" : "none";
  const col = $("#col"), flow = $("#flow"), rt = $("#rt");
  col.dataset.kind = k;
  $("#live").hidden = true; $("#readout").innerHTML = "";

  if (k === "title") {
    flow.innerHTML = `<div class="title-slide"><span class="chip">${esc(deck.courseTitle?.[lang] || COURSE[deck.course] || "")}</span><h1>${title}</h1><div class="meta">${deck.slides.length} ${t("slides")}</div><div class="hint">${t("hint")}</div></div>`;
  } else if (k === "code") {
    flow.innerHTML = `<div class="hd">${esc(label)}</div><h2 class="tt">${title}</h2><pre>${s.b[lang]}</pre>`;
  } else {
    const cls = sizeClass(rawBody + ans);
    flow.innerHTML = `<div class="hd ${k === "error" ? "red" : ""}"><span>${esc(label)}</span><span class="deckname">${esc(deck.title[lang])}</span></div><h2 class="tt">${title}</h2>${s.h?.[lang] ? `<div class="sub">${esc(s.h[lang])}</div>` : ""}<div class="steps text ${cls}">${revealMarkup(rawBody)}</div>${ans ? `<div class="answer text ${cls}" id="ans" ${revealed ? "" : "hidden"}><div class="hd green">${t("answerLab")}</div>${ans}</div>` : ""}`;
  }

  if (mode === "fig") rt.innerHTML = `<div class="figcol">${figs}</div>`;
  else if (mode === "widget" || mode === "explore") {
    rt.innerHTML = `<div class="hint-line" id="whint"></div><div class="canvas-wrap" id="wcanvas"></div>${mode === "explore" ? `${widgets.length > 1 ? `<label class="explore-label">${t("explore")}<select id="explore-choice">${widgets.map((w, i) => `<option value="${i}">${esc(plain(w.t[lang]))}</option>`).join("")}</select></label>` : ""}<p class="note">${t("free")}</p>` : ""}<div class="wctl" id="wctl"></div>`;
  } else rt.innerHTML = "";

  chrome();
  figHidden = false; layout(mode);
  try { history.replaceState(null, "", EXPORT ? `#${index}` : `?deck=${encodeURIComponent(deckId)}&lang=${lang ? "en" : "fr"}#${index}`); } catch {}
  // Formulas first: the widget readouts are typeset as they are written, so MathJax must be ready before they mount.
  let ready = true;
  try {
    if (typeof MathJax === "undefined") throw new Error("MathJax");
    await MathJax.startup.promise; await document.fonts.load('400 25px "STIX Two Text"');
  } catch (e) { ready = false; console.warn(e); if (renderId === generation) toast(t("noMath")); }
  if (renderId !== generation) return;
  const defined = deck.slides.findIndex(x => x.k === "concept" && /Discriminant/.test(x.t[0]));
  if (mode === "widget") companion(s.w, true);
  else if (mode === "explore") {
    companion(shared.w, defined < 0 || index >= defined);
    if ($("#explore-choice")) $("#explore-choice").onchange = e => companion(widgets[+e.target.value].w, true);
  }
  paintSteps(); flow.scrollTop = 0;
  if (ready) {
    try { await MathJax.typesetPromise([$("#stage")]); $("#stage").querySelectorAll("mjx-assistive-mml").forEach(x => x.remove()); } catch (e) { console.warn(e); }
    if (renderId !== generation) return;
    fitMath();
    // A figure that is only an exploration aid gives way when an equation needs the whole width.
    if (mode === "explore" && needsWidth()) { figHidden = true; layout(mode); fitMath(); }
  }
}

// ---- layout: the flow column is 520 px wide beside a figure, 1200 px without one
let figHidden = false;
function layout(mode) {
  const wide = mode === "none" || (mode === "explore" && figHidden);
  $("#col").className = wide ? "wide" : ""; $("#rt").hidden = wide;
  const tg = $("#tg"); tg.hidden = mode !== "explore"; tg.setAttribute("aria-pressed", String(!figHidden)); tg.textContent = t("figure");
}
// Shrink any formula wider than the column so that nothing is cut off or needs sideways scrolling (never below MIN_SCALE).
const MIN_SCALE = .5;
function fitMath() {
  const flow = $("#flow"), avail = flow.clientWidth - 4;
  flow.querySelectorAll("mjx-container").forEach(m => { m.style.fontSize = ""; });
  flow.querySelectorAll("mjx-container").forEach(m => {
    if (!m.offsetParent) return;
    const svg = m.querySelector("svg"); if (!svg) return;
    const room = m.getAttribute("display") === "true" ? Math.min(avail, m.parentElement.clientWidth || avail) : avail;
    const w = svg.getBoundingClientRect().width / (flow.getBoundingClientRect().width / flow.offsetWidth);
    if (w > room) m.style.fontSize = Math.max(MIN_SCALE, room / w) * 100 + "%";
  });
}
function needsWidth() {
  return [...$("#flow").querySelectorAll("mjx-container")].some(m => m.offsetParent && m.querySelector("svg") && m.scrollWidth > m.clientWidth + 2 || m.offsetParent && m.style.fontSize && parseFloat(m.style.fontSize) <= MIN_SCALE * 100 + 1);
}

function chrome() {
  const s = deck.slides[index], n = deck.slides.length;
  $("#count").textContent = `${index + 1} / ${n}`;
  $("#pv").disabled = index === 0; $("#nx").disabled = index === n - 1;
  $("#pv").setAttribute("aria-label", t("prev")); $("#nx").setAttribute("aria-label", t("next"));
  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));

  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}


function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
</html>
