<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Statistiques descriptives à une variable</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
/* Dense lists of observations keep each value intact inside the text column. */
.sg:has(tr > td:nth-child(12)) td{padding-inline:4px;white-space:nowrap}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  .sg:has(tr > td:nth-child(12)) td{min-width:0;padding-inline:1px;font-size:16px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}

/* laboratory experiments in a slide ({type:"lab"}, site/js/lab/shell.js mode "slide"): the canvas fills the widget host, the
   controls, the answer area and the mission stepper sit in #wctl, the formula and the readout in #readout, the prompt in the hint line */
.canvas-wrap.lab2-canvas-host{height:340px}
.lab2-stage{position:absolute;inset:0}
.lab2-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.lab2-handle{position:absolute;left:0;top:0;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;pointer-events:none}
.lab2-handle:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
.hint-line.lab2-hint{height:auto;min-height:22px;max-height:84px;overflow:auto;white-space:normal;font-size:18px;line-height:1.3;outline:0}
.lab2-slide{width:100%}
.lab2-slide .lab2-card{display:flex;flex-direction:column;gap:8px;width:100%}
.lab2-stepper{display:flex;align-items:center;gap:10px}
.lab2-step-label{font:600 18px system-ui,sans-serif;color:var(--muted)}
.lab2-kind{color:var(--amber);margin-left:4px}
.lab2-controls{display:grid;gap:8px}
.lab2-ctl{display:grid;gap:4px}
.lab2-ctl.is-locked{opacity:.45}
.lab2-ctl-label{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.lab2-ctl input[type=range]{width:100%}
.lab2-segments,.lab2-variants{display:flex;flex-wrap:wrap;gap:6px}
.lab2-segment.is-on,.lab2-variant[aria-pressed=true]{background:var(--amber)!important}
.lab2-options,.lab2-answer{display:grid;gap:6px}
.wctl .lab2-option,.wctl .lab2-variant{height:auto;min-height:38px;padding:6px 12px;text-align:left;white-space:normal;font-size:17px}
.lab2-option[aria-pressed=true]{background:var(--amber)!important}
.lab2-check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab2-check input[type=text]{height:38px;width:130px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:0 8px;font:600 17px system-ui,sans-serif}
.lab2-check label{font-size:17px}
.lab2-feedback{margin:0;font:600 17px/1.3 system-ui,sans-serif}.lab2-feedback:empty{display:none}
.lab2-feedback[data-tone=good]{color:var(--green)}.lab2-feedback[data-tone=warn]{color:var(--red)}
.lab2-reveal{border-left:4px solid var(--green);padding:4px 0 4px 12px;font-size:17px;line-height:1.35}
.lab2-recall,.lab2-note{margin:0;color:var(--muted);font-size:16px}
.lab2-hintbox summary{cursor:pointer;color:var(--amber);font:600 16px system-ui,sans-serif}.lab2-hintbox p{margin:4px 0 0;font-size:16px}
.wctl .lab2-restart{height:30px;background:transparent;color:var(--muted);text-decoration:underline;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab2-formula{margin:0 0 6px;font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.lab2-readout{display:grid;gap:3px;margin:0}
.lab2-readout>div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lab2-readout dt{color:var(--muted);font-size:16px}
.lab2-readout dd{margin:0;font-size:21px}

/* Keep the complete mission readable while the parameter controls scroll below the fixed figure. */
.hint-line.lab2-hint{flex:0 0 auto;max-height:none;overflow:visible}
.lab2-slide[data-experiment="quadratic"] .lab2-controls{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.lab2-slide[data-experiment="quadratic"] [data-control="form"]{grid-column:1 / -1}
@media(max-width:760px) and (orientation:portrait){
  .lab2-slide[data-experiment="quadratic"] .lab2-controls{grid-template-columns:1fr}
}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Seconde","Seconde · French curriculum"],"id":"seconde-07","course":"seconde","number":7,"title":["Statistiques descriptives à une variable","Descriptive statistics"],"slides":[{"k":"title","t":["Statistiques descriptives à une variable","Descriptive statistics"],"b":["",""]},{"k":"concept","t":["Effectifs, fréquences et moyenne","Frequencies, relative frequencies and mean"],"b":["Une série décrit un caractère sur une population. Si la valeur \\(x_i\\) apparaît \\(n_i\\) fois, \\(n_i\\) est son effectif. L'effectif total non nul est \\(N=\\sum_{i=1}^{p}n_i\\) ; sa fréquence est \\(f_i=n_i/N\\). La moyenne est\n\\[\\overline x=\\frac{\\sum_{i=1}^{p}n_ix_i}{N}=\\sum_{i=1}^{p}f_ix_i.\\]\nL'étendue est \\(x_{\\max}-x_{\\min}\\).","A data set describes a characteristic over a population. If the value \\(x_i\\) appears \\(n_i\\) times, \\(n_i\\) is its frequency count. The nonzero total count is \\(N=\\sum_{i=1}^{p}n_i\\); its relative frequency is \\(f_i=n_i/N\\). The mean is\n\\[\\overline x=\\frac{\\sum_{i=1}^{p}n_ix_i}{N}=\\sum_{i=1}^{p}f_ix_i.\\]\nThe range is \\(x_{\\max}-x_{\\min}\\)."],"h":["Définitions","Definitions"]},{"k":"example","t":["Effectifs, fréquences et moyenne","Frequencies, relative frequencies and mean"],"b":["On étudie les pointures de \\(30\\) élèves :\n  <table class=\"sg\"><tr><td>36<\/td><td>42<\/td><td>40<\/td><td>41<\/td><td>41<\/td><td>38<\/td><td>39<\/td><td>43<\/td><td>42<\/td><td>42<\/td><td>42<\/td><td>40<\/td><td>36<\/td><td>40<\/td><td>39<\/td><\/tr><tr><td>41<\/td><td>40<\/td><td>38<\/td><td>44<\/td><td>42<\/td><td>40<\/td><td>42<\/td><td>43<\/td><td>38<\/td><td>43<\/td><td>36<\/td><td>41<\/td><td>41<\/td><td>44<\/td><td>43<\/td><\/tr><\/table> \nCompléter les effectifs, calculer les fréquences, la moyenne et l'étendue.","We study the shoe sizes of \\(30\\) students:\n  <table class=\"sg\"><tr><td>36<\/td><td>42<\/td><td>40<\/td><td>41<\/td><td>41<\/td><td>38<\/td><td>39<\/td><td>43<\/td><td>42<\/td><td>42<\/td><td>42<\/td><td>40<\/td><td>36<\/td><td>40<\/td><td>39<\/td><\/tr><tr><td>41<\/td><td>40<\/td><td>38<\/td><td>44<\/td><td>42<\/td><td>40<\/td><td>42<\/td><td>43<\/td><td>38<\/td><td>43<\/td><td>36<\/td><td>41<\/td><td>41<\/td><td>44<\/td><td>43<\/td><\/tr><\/table> \nComplete the counts, calculate the relative frequencies, the mean and the range."],"a":["Effectifs : \\(3,0,3,2,5,5,6,4,2\\), de somme \\(30\\). Les fréquences sont ces effectifs divisés par \\(30\\), soit en pourcentage \\(10\\) ; \\(0\\) ; \\(10\\) ; environ \\(6{,}67\\) ; \\(16{,}67\\) ; \\(16{,}67\\) ; \\(20\\) ; \\(13{,}33\\) ; \\(6{,}67\\).\n\\(\\sum n_ix_i=1217\\), donc \\(\\overline x=1217/30\\approx40{,}57\\). L'étendue vaut \\(8\\). La moyenne n'est pas forcément une valeur de la série. La somme des pourcentages arrondis peut différer légèrement de \\(100\\).","Counts: \\(3,0,3,2,5,5,6,4,2\\), with sum \\(30\\). The relative frequencies are these counts divided by \\(30\\), that is as percentages \\(10\\); \\(0\\); \\(10\\); about \\(6.67\\); \\(16.67\\); \\(16.67\\); \\(20\\); \\(13.33\\); \\(6.67\\).\n\\(\\sum n_ix_i=1217\\), so \\(\\overline x=1217/30\\approx40.57\\). The range is \\(8\\). The mean is not necessarily a value of the data set. The sum of the rounded percentages may differ slightly from \\(100\\)."],"h":["Pointures – données du livret","Shoe sizes – booklet data"]},{"k":"concept","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Une médiane est un nombre tel qu'au moins la moitié des valeurs lui soient inférieures ou égales, et au moins la moitié supérieures ou égales.\nDans la série ordonnée de \\(N\\) valeurs, si \\(N\\) est impair, prendre le rang \\((N+1)/2\\) ; si \\(N\\) est pair, choisir la moyenne des valeurs de rangs \\(N/2\\) et \\(N/2+1\\).","A median is a number such that at least half of the values are less than or equal to it, and at least half are greater than or equal to it.\nIn the ordered data set of \\(N\\) values, if \\(N\\) is odd, take the value of rank \\((N+1)/2\\); if \\(N\\) is even, choose the mean of the values of ranks \\(N/2\\) and \\(N/2+1\\)."],"h":["Définition et convention","Definition and convention"]},{"k":"error","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Avec des répétitions, plus de \\(50\\,\\%\\) des valeurs peuvent être inférieures ou égales à la médiane.","With repeated values, more than \\(50\\%\\) of the values can be less than or equal to the median."]},{"k":"example","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Compléter les effectifs cumulés croissants (ECC) des pointures et déterminer la médiane.","Complete the ascending cumulative counts (ACC) of the shoe sizes and determine the median."],"a":["Les rangs centraux sont \\(15\\) et \\(16\\). Les ECC passent de \\(13\\) pour \\(40\\) à \\(18\\) pour \\(41\\) : les deux valeurs centrales valent \\(41\\), donc \\(M_e=41\\). Au moins la moitié des pointures sont inférieures ou égales à \\(41\\), et au moins la moitié supérieures ou égales à \\(41\\).","The central ranks are \\(15\\) and \\(16\\). The ACC goes from \\(13\\) for \\(40\\) to \\(18\\) for \\(41\\): both central values equal \\(41\\), so \\(M_e=41\\). At least half of the sizes are less than or equal to \\(41\\), and at least half are greater than or equal to \\(41\\)."]},{"k":"example","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Calculer les médianes de \\(1;2;2;8;9\\) et de \\(1;2;8;9\\).","Calculate the medians of \\(1;2;2;8;9\\) and of \\(1;2;8;9\\)."],"a":["La troisième valeur de la première série vaut \\(2\\). Dans la seconde, \\((2+8)/2=5\\) ; la médiane choisie n'est pas une valeur de la série.","The third value of the first data set is \\(2\\). In the second, \\((2+8)/2=5\\); the chosen median is not a value of the data set."]},{"k":"concept","t":["Quartiles et diagramme en boîte","Quartiles and box plot"],"b":["Le premier quartile \\(Q_1\\) est la valeur de rang \\(\\lceil N/4\\rceil\\) : la plus petite valeur de la série telle qu'au moins \\(25\\,\\%\\) des valeurs lui soient inférieures ou égales. \\(Q_3\\) est la valeur de rang \\(\\lceil3N/4\\rceil\\).\nL'écart interquartile est \\(Q_3-Q_1\\). Le diagramme en boîte indique minimum, \\(Q_1\\), médiane, \\(Q_3\\), maximum.","The first quartile \\(Q_1\\) is the value of rank \\(\\lceil N/4\\rceil\\): the smallest value of the data set such that at least \\(25\\%\\) of the values are less than or equal to it. \\(Q_3\\) is the value of rank \\(\\lceil3N/4\\rceil\\).\nThe interquartile range is \\(Q_3-Q_1\\). The box plot shows the minimum, \\(Q_1\\), the median, \\(Q_3\\) and the maximum."],"h":["Définitions","Definitions"]},{"k":"example","t":["Quartiles et diagramme en boîte","Quartiles and box plot"],"b":["Déterminer \\(Q_1\\), \\(Q_3\\) et l'écart interquartile des pointures, puis tracer le diagramme en boîte.","Determine \\(Q_1\\), \\(Q_3\\) and the interquartile range of the shoe sizes, then draw the box plot."],"a":["\\(N/4=7{,}5\\) : rang \\(8\\), donc \\(Q_1=39\\). \\(3N/4=22{,}5\\) : rang \\(23\\), donc \\(Q_3=42\\). Écart interquartile \\(3\\). Le diagramme utilise \\((36;39;41;42;44)\\).","\\(N/4=7.5\\): rank \\(8\\), so \\(Q_1=39\\). \\(3N/4=22.5\\): rank \\(23\\), so \\(Q_3=42\\). Interquartile range \\(3\\). The plot uses \\((36;39;41;42;44)\\)."],"f":[[1,1]]},{"k":"example","t":["Quartiles et diagramme en boîte","Quartiles and box plot"],"b":["Déterminer les quartiles de \\(1;2;2;3;4;4;4;5\\). Y a-t-il exactement \\(25\\,\\%\\) des valeurs inférieures ou égales à \\(Q_1\\) ?","Determine the quartiles of \\(1;2;2;3;4;4;4;5\\). Are exactly \\(25\\%\\) of the values less than or equal to \\(Q_1\\)?"],"a":["\\(Q_1=2\\) (rang \\(2\\)), \\(Q_3=4\\) (rang \\(6\\)). Ici \\(3/8=37{,}5\\,\\%\\) des valeurs sont inférieures ou égales à \\(Q_1\\). Il faut dire « au moins ».","\\(Q_1=2\\) (rank \\(2\\)), \\(Q_3=4\\) (rank \\(6\\)). Here \\(3/8=37.5\\%\\) of the values are less than or equal to \\(Q_1\\). One must say “at least”."]},{"k":"widget","t":["Que raconte une moyenne ?","What does an average tell us?"],"b":["Une expérience guidée du laboratoire : lisez la mission, manipulez la figure, passez à la suivante avec ◀ ▶ (ou N et P quand la figure a le focus).","A guided experiment from the laboratory: read the mission, handle the figure, move to the next one with ◀ ▶ (or N and P while the figure has focus)."],"w":{"type":"lab","ref":"statistics/box"}},{"k":"concept","t":["Ajout ou suppression d'une valeur","Adding or removing a value"],"b":["Ajouter \\(a\\) à une série de taille \\(N\\) donne \\(\\overline x'=(N\\overline x+a)/(N+1)\\).\nRetirer une occurrence de \\(a\\), pour \\(N&gt;1\\), donne \\(\\overline x'=(N\\overline x-a)/(N-1)\\). Utiliser la somme exacte, sans arrondi intermédiaire. Réexaminer la médiane dans la nouvelle série ordonnée.","Adding \\(a\\) to a data set of size \\(N\\) gives \\(\\overline x'=(N\\overline x+a)/(N+1)\\).\nRemoving one occurrence of \\(a\\), for \\(N&gt;1\\), gives \\(\\overline x'=(N\\overline x-a)/(N-1)\\). Use the exact sum, with no intermediate rounding. Re-examine the median in the new ordered data set."],"h":["Propriétés","Properties"]},{"k":"example","t":["Ajout ou suppression d'une valeur","Adding or removing a value"],"b":["Dans la série des pointures, la somme vaut \\(1217\\), la médiane \\(41\\).\n<ol><li>Ajouter une pointure \\(36\\) et calculer les nouveaux indicateurs.<li>Repartir de la série initiale, retirer une pointure \\(44\\) et recommencer.<\/ol>","In the shoe-size data, the sum is \\(1217\\) and the median \\(41\\).\n<ol><li>Add a size \\(36\\) and calculate the new statistics.<li>Starting again from the initial data, remove a size \\(44\\) and repeat.<\/ol>"],"a":["1. Somme \\(1253\\), effectif \\(31\\) : \\(\\overline x'=1253/31\\approx40{,}42\\). Le rang central \\(16\\) donne toujours \\(41\\). 2. Somme \\(1173\\), effectif \\(29\\) : \\(\\overline x''=1173/29\\approx40{,}45\\). Le rang central \\(15\\) donne \\(41\\). La moyenne diminue dans les deux cas ; la médiane reste inchangée. Les situations sont indépendantes.","1. Sum \\(1253\\), count \\(31\\): \\(\\overline x'=1253/31\\approx40.42\\). The central rank \\(16\\) still gives \\(41\\). 2. Sum \\(1173\\), count \\(29\\): \\(\\overline x''=1173/29\\approx40.45\\). The central rank \\(15\\) gives \\(41\\). The mean decreases in both cases; the median is unchanged. The situations are independent."]},{"k":"example","t":["Ajout ou suppression d'une valeur","Adding or removing a value"],"b":["Justifier qu'ajouter la moyenne ne change pas la moyenne. L'étendue peut-elle diminuer lors d'un ajout ?","Justify that adding the mean does not change the mean. Can the range decrease when a value is added?"],"a":["Si \\(a=\\overline x\\), \\((N\\overline x+\\overline x)/(N+1)=\\overline x\\). Lors d'un ajout, le minimum ne peut qu'être conservé ou diminuer, le maximum être conservé ou augmenter : l'étendue ne diminue pas. Lors d'une suppression, elle n'augmente pas.","If \\(a=\\overline x\\), \\((N\\overline x+\\overline x)/(N+1)=\\overline x\\). When adding, the minimum can only stay the same or decrease, the maximum stay the same or increase: the range does not decrease. When removing, it does not increase."]},{"k":"concept","t":["Variance et écart type","Variance and standard deviation"],"b":["\\(V=\\dfrac{\\sum n_i(x_i-\\overline x)^2}{N}\\) est la variance ; \\(\\sigma=\\sqrt V\\) est l'écart type. Il mesure la dispersion autour de la moyenne et a la même unité que les données. On peut aussi calculer \\(V=\\dfrac{\\sum n_ix_i^2}{N}-\\overline x^{\\,2}\\).","\\(V=\\dfrac{\\sum n_i(x_i-\\overline x)^2}{N}\\) is the variance; \\(\\sigma=\\sqrt V\\) is the standard deviation. It measures the spread around the mean and has the same unit as the data. One can also compute \\(V=\\dfrac{\\sum n_ix_i^2}{N}-\\overline x^{\\,2}\\)."],"h":["Définitions","Definitions"]},{"k":"example","t":["Variance et écart type","Variance and standard deviation"],"b":["Calculer la variance et l'écart type des pointures.","Calculate the variance and the standard deviation of the shoe sizes."],"a":["\\(\\sum n_ix_i^2=49519\\), donc\n\\[V=\\frac{49519}{30}-\\left(\\frac{1217}{30}\\right)^2=\\frac{4481}{900}\\approx4{,}979.\\]\n\\(\\sigma=\\sqrt{4481}/30\\approx2{,}23\\). L'écart type n'est pas la distance maximale à la moyenne.","\\(\\sum n_ix_i^2=49519\\), so\n\\[V=\\frac{49519}{30}-\\left(\\frac{1217}{30}\\right)^2=\\frac{4481}{900}\\approx4.979.\\]\n\\(\\sigma=\\sqrt{4481}/30\\approx2.23\\). The standard deviation is not the maximum distance from the mean."]},{"k":"example","t":["Variance et écart type","Variance and standard deviation"],"b":["Comparer \\(A:8;10;12\\) et \\(B:0;10;20\\) avec les couples moyenne–écart type et médiane–écart interquartile.","Compare \\(A:8;10;12\\) and \\(B:0;10;20\\) using the mean–standard deviation pair and the median–interquartile range pair."],"a":["Les moyennes et médianes valent toutes \\(10\\). \\(V_A=8/3\\), \\(\\sigma_A\\approx1{,}63\\) ; \\(V_B=200/3\\), \\(\\sigma_B\\approx8{,}16\\). Quartiles : \\(8,12\\) pour \\(A\\) ; \\(0,20\\) pour \\(B\\). Écarts interquartiles \\(4\\) et \\(20\\). \\(B\\) est beaucoup plus dispersée malgré des centres identiques.","The means and medians are all \\(10\\). \\(V_A=8/3\\), \\(\\sigma_A\\approx1.63\\); \\(V_B=200/3\\), \\(\\sigma_B\\approx8.16\\). Quartiles: \\(8,12\\) for \\(A\\); \\(0,20\\) for \\(B\\). Interquartile ranges \\(4\\) and \\(20\\). \\(B\\) is much more spread out despite identical centres."]},{"k":"concept","t":["Linéarité de la moyenne","Linearity of the mean"],"b":["Remplacer chaque \\(x_i\\) par \\(kx_i+c\\) donne une moyenne \\(k\\overline x+c\\), un écart type \\(|k|\\sigma\\) et une variance \\(k^2V\\). Ajouter une constante ne change ni variance ni écart type.","Replacing each \\(x_i\\) by \\(kx_i+c\\) gives a mean \\(k\\overline x+c\\), a standard deviation \\(|k|\\sigma\\) and a variance \\(k^2V\\). Adding a constant changes neither variance nor standard deviation."],"h":["Propriété","Property"]},{"k":"example","t":["Linéarité de la moyenne","Linearity of the mean"],"b":["Moyenne initiale \\(12/20\\), écart type \\(3\\). Calculer les nouveaux indicateurs pour trois modifications indépendantes, sans plafonnement des notes : ajouter \\(1{,}5\\) ; multiplier par \\(0{,}8\\) ; multiplier par \\(1{,}1\\) puis ajouter \\(0{,}5\\).","Initial mean \\(12/20\\), standard deviation \\(3\\). Calculate the new statistics for three independent modifications, with no capping of marks: add \\(1.5\\); multiply by \\(0.8\\); multiply by \\(1.1\\) then add \\(0.5\\)."],"a":["Moyennes : \\(13{,}5\\), \\(9{,}6\\), \\(13{,}7\\). Écarts types : \\(3\\), \\(2{,}4\\), \\(3{,}3\\). Multiplier les notes par \\(1{,}1\\) les augmente ; cela ne signifie pas augmenter la difficulté de l'évaluation. Avec un plafonnement à \\(20\\), la transformation ne serait plus affine sur toutes les données.","Means: \\(13.5\\), \\(9.6\\), \\(13.7\\). Standard deviations: \\(3\\), \\(2.4\\), \\(3.3\\). Multiplying the marks by \\(1.1\\) raises them; this does not mean making the assessment harder. With a cap at \\(20\\), the transformation would no longer be affine on all the data."]},{"k":"code","t":["Python","Python"],"b":["from math import sqrt\n\ndef moyenne_ecart_type(valeurs):\n    n = len(valeurs)\n    if n == 0:\n        raise ValueError(\"liste vide\")\n    m = sum(valeurs)/n\n    v = sum((x-m)**2 for x in valeurs)/n\n    return m, sqrt(v)","from math import sqrt\n\ndef moyenne_ecart_type(valeurs):\n    n = len(valeurs)\n    if n == 0:\n        raise ValueError(\"liste vide\")\n    m = sum(valeurs)/n\n    v = sum((x-m)**2 for x in valeurs)/n\n    return m, sqrt(v)"]},{"k":"example","t":["Linéarité de la moyenne","Linearity of the mean"],"b":["Expliquer le programme ; prévoir son résultat pour <code>[8, 10, 12]<\/code>.","Explain the program; predict its result for <code>[8, 10, 12]<\/code>."],"a":["Il vérifie que la liste est non vide, calcule la moyenne, la moyenne des carrés des écarts, puis sa racine. Résultat : \\((10;\\sqrt{8/3})\\approx(10;1{,}633)\\).","It checks that the list is nonempty, calculates the mean, the mean of the squared deviations, then its root. Result: \\((10,\\sqrt{8/3})\\approx(10,1.633)\\)."]},{"k":"concept","t":["Séries continues regroupées en classes","Continuous data grouped into classes"],"b":["Une variable quantitative continue peut prendre toutes les valeurs d'un intervalle. Ici, les observations sont regroupées en classes de même amplitude ; le centre de \\([a;b[\\) vaut \\((a+b)/2\\).\nSi les moyennes \\(m_i\\) des classes sont connues, la moyenne globale exacte est \\(\\sum n_im_i/N\\). À défaut, les remplacer par les centres donne une estimation justifiée par un modèle uniforme dans chaque classe.","A continuous quantitative variable can take every value in an interval. Here, the observations are grouped into classes of equal width; the centre of \\([a,b)\\) is \\((a+b)/2\\).\nIf the class means \\(m_i\\) are known, the exact overall mean is \\(\\sum n_im_i/N\\). Otherwise, replacing them by the centres gives an estimate justified by a uniform model within each class."],"h":["Définitions et perte d'information","Definitions and loss of information"]},{"k":"example","t":["Séries continues regroupées en classes","Continuous data grouped into classes"],"b":["Compléter, estimer la moyenne à partir des centres et déterminer la classe médiane.","Complete, estimate the mean from the centres and determine the median class."],"a":["Amplitude \\(10\\) cm, effectif total \\(100\\). Fréquences en pourcentage : \\(8,22,35,28,7\\). Centres : \\(155,165,175,185,195\\) cm. La somme pondérée des centres vaut \\(17540\\), donc la moyenne estimée est \\(175{,}4\\) cm. Les rangs centraux \\(50,51\\) se trouvent dans \\([170;180[\\), classe médiane.","Width \\(10\\) cm, total count \\(100\\). Relative frequencies as percentages: \\(8,22,35,28,7\\). Centres: \\(155,165,175,185,195\\) cm. The weighted sum of the centres is \\(17540\\), so the estimated mean is \\(175.4\\) cm. The central ranks \\(50,51\\) lie in \\([170,180)\\), the median class."],"h":["Tailles – données du livret","Heights – booklet data"]},{"k":"example","t":["Séries continues regroupées en classes","Continuous data grouped into classes"],"b":["Si les moyennes exactes des classes étaient \\(154;166;174;184;196\\) cm, quelle serait la moyenne globale ?","If the exact class means were \\(154;166;174;184;196\\) cm, what would the overall mean be?"],"a":["\\((8\\times154+22\\times166+35\\times174+28\\times184+7\\times196)/100=174{,}98\\) cm.","\\((8\\times154+22\\times166+35\\times174+28\\times184+7\\times196)/100=174.98\\) cm."]},{"k":"concept","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["L'aire de chaque rectangle d'un histogramme est proportionnelle à l'effectif. À amplitudes égales, les hauteurs peuvent être les effectifs. Le polygone des fréquences cumulées joint les points (borne supérieure ; fréquence cumulée), en commençant à la première borne inférieure avec \\(0\\).","The area of each rectangle of a histogram is proportional to the count. For equal widths, the heights can be the counts. The cumulative frequency polygon joins the points (upper bound; cumulative frequency), starting at the first lower bound with \\(0\\)."],"h":["Représentations","Representations"]},{"k":"example","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["Construire les deux graphiques pour les tailles de l'exemple précédent.","Construct both graphs for the heights of the previous example."],"f":[[2,2],[3,3]]},{"k":"method","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["Sous l'hypothèse d'uniformité dans \\([170;180[\\), la fréquence cumulée passe linéairement de \\(30\\,\\%\\) à \\(65\\,\\%\\). Rechercher l'abscisse correspondant à \\(50\\,\\%\\).","Under the assumption of uniformity in \\([170,180)\\), the cumulative frequency rises linearly from \\(30\\%\\) to \\(65\\%\\). Look for the abscissa corresponding to \\(50\\%\\)."],"h":["Estimer la médiane","Estimating the median"]},{"k":"example","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["Calculer cette estimation et préciser sa portée.","Calculate this estimate and state its scope."],"a":["On résout \\((m-170)/10=(50-30)/(65-30)\\), d'où \\(m=170+10\\times20/35\\approx175{,}71\\) cm. Il s'agit d'une estimation sous hypothèse d'uniformité, pas de la médiane exacte des données individuelles. Les effectifs des classes seuls ne déterminent pas cette dernière.","Solve \\((m-170)/10=(50-30)/(65-30)\\), giving \\(m=170+10\\times20/35\\approx175.71\\) cm. This is an estimate under an assumption of uniformity, not the exact median of the individual data. The class counts alone do not determine the latter."]}],"editions":{"fr":{},"en":{}},"languages":["fr","en"],"figureVersion":"f0254d006cc74092"},"figs":{"seconde-07-1.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5L3hsaW5rIiB4bWxuczppbmtzY2FwZT0iaHR0cDovL3d3dy5pbmtzY2FwZS5vcmcvbmFtZXNwYWNlcy9pbmtzY2FwZSIgdmVyc2lvbj0iMS4xIiB3aWR0aD0iMzkzLjAzOCIgaGVpZ2h0PSI2OC4yOTUiIHZpZXdCb3g9IjAgMCAzOTMuMDM4IDY4LjI5NSI+CjxkZWZzPgo8cGF0aCBpZD0iZm9udF8xXzE4IiBkPSJNLjA0Mjk5OTI2OSAuNDk4MzA2MjhILjA3Mzk4OTg3TC4wOTE5OTUyNCAuNTU0MzY3MDlDLjEwMjk5NjgyOSAuNTg4NDA5NCAuMTY1OTg1MSAuNjIyNDUxOCAuMjE3OTg3MDYgLjYyMjQ1MTggLjI4Mjk4OTUgLjYyMjQ1MTggLjMzNTk5ODU1IC41NjkzODE3IC4zMzU5OTg1NSAuNTA2MzE3MTYgLjMzNTk5ODU1IC40MzEyMjg2NSAuMjc2OTkyOCAuMzY4MTY0MDcgLjIwNTk5MzY1IC4zNjgxNjQwNyAuMTk3OTk4MDUgLjM2ODE2NDA3IC4xODY5OTY0NiAuMzY5MTU1ODkgLjE3Mzk5NTk3IC4zNzAxNjI5N0wuMTU4OTk2NTggLjM3MTE1NDggLjE0Njk4NzkyIC4zMTgxNzYyOCAuMTUzOTkxNyAuMzEyMTc5NThDLjE5MTk4NjA5 // A camera is independent of the mathematical parameters. Moving an object never changes it.
function camera2D() {
  const c = { scale: 1, x: 0, y: 0 };
  c.project = ([x,y]) => [c.x+c.scale*x,c.y+c.scale*y];
  c.unproject = ([x,y]) => [(x-c.x)/c.scale,(y-c.y)/c.scale];
  c.zoomAt = (factor,[x,y]) => { const p=c.unproject([x,y]); c.scale=Math.max(.2,Math.min(12,c.scale*factor)); c.x=x-p[0]*c.scale;c.y=y-p[1]*c.scale; };

}
function navigationButtons(host,action,lang='fr') {

  // Complex plane, same scale on both axes. Modes: alg (drag z: parts, conjugate, z times its conjugate), polar (drag z:

  // Quadratic equation with real coefficients, built from its roots: drag z1; off the real axis its conjugate is the
  // other root, on the axis a second real root z2 appears. Readout: equation, discriminant, roots, sum and product.
  cquad(o) {
    const z1 = [1, 2]; let x2 = -1; const v = () => iso(o, 4);
    return {
      handles() {
        const V = v(), h = [{ x: V.X(z1[0]), y: V.Y(z1[1]), cur: "grab", move(X, Y) { z1[0] = clamp(snap(V.iX(X), .25), -3.5, 3.5); const y = clamp(snap(V.iY(Y), .25), -3.5, 3.5); z1[1] = Math.abs(y) < .15 ? 0 : y; } }];
        if (z1[1] === 0) h.push({ x: V.X(x2), y: V.Y(0), cur: "ew-resize", move(X) { x2 = clamp(snap(V.iX(X), .25), -3.5, 3.5); } });

      draw(g) {

        else dot(o, V.X(x2), V.Y(0), C.blue, inl("z_2"), "ew-resize", true, x2 < x ? -1 : 1);
        dot(o, V.X(x), V.Y(y), C.acc, inl("z_1"), "grab", true, y || x2 >= x ? 1 : -1);

  },

  // n-th roots of a complex number a: drag a (modulus and argument snap), choose n. The roots form a regular polygon

      handles() { const V = v(); return [{ x: V.X(a[0]), y: V.Y(a[1]), cur: "grab", move(X, Y) { const q = polarSnap(V.iX(X), V.iY(Y), .25, 4); a[0] = q[0]; a[1] = q[1]; } }]; },
      draw(g) {

  // Residues modulo n on a clock: drag a around the clock, set n. Mode powers: the successive powers of a (period, and
  // Fermat's little theorem when n is prime). Mode inverse: multiplication by a, inverse of a when gcd(a, n) = 1.
  modclock(o) {
    const mode = o.spec.mode || "powers"; let n = o.spec.n || 7, a = o.spec.a || 3;
    slider(o, inl("n"), 2, 30, 1, n, q => { n = q; a = Math.min(a, n - 1); o.redraw(); });
    const geo = () => { const cx = o.W / 2, cy = o.H / 2 + 6, R = Math.min(o.W, o.H) / 2 - 46; return { cx, cy, R, at: k => [cx + R * Math.sin(2 * Math.PI * k / n), cy - R * Math.cos(2 * Math.PI * k / n)] }; };
    return {
      handles() { const G = geo(), [x, y] = G.at(a); return [{ x, y, cur: "grab", move(X, Y) { const t = Math.atan2(X - G.cx, -(Y - G.cy)); a = ((Math.round(t / (2 * Math.PI / n)) % n) + n) % n; } }]; },
      draw(g) {

        const chord = (i, j, col) => { const P = G.at(i), Q = G.at(j); arrowTo(g, { X: s => s, Y: s => s }, P, Q, col, 2.5); };
        if (mode === "powers") {
          const seen = new Map(), seq = []; let x = 1 % n; while (!seen.has(x)) { seen.set(x, seq.length); seq.push(x); x = x * a % n; }
          for (let k = 0; k + 1 < seq.length; k++) chord(seq[k], seq[k + 1], C.acc); if (seq.length > 1 || x !== seq[0]) chord(seq[seq.length - 1], x, C.acc);
          seq.forEach(k => { const [px, py] = G.at(k); g.save(); g.fillStyle = C.acc; g.beginPath(); g.arc(px, py, 6, 0, 7); g.fill(); g.restore(); });

            : o.pair(`${inl(`${name}(${a},${n})=${d}`)} : aucune puissance ${inl(`${a}^m`)}, ${inl("m\\geqslant1")}, n'est congrue à 1`, `${inl(`${name}(${a},${n})=${d}`)}: no power ${inl(`${a}^m`)}, ${inl("m\\geqslant1")}, is congruent to 1`);

          const inv = d === 1 ? lines(o.pair(`Bézout : ${inl(`${a}\\times${tpar(N, u)}${vco < 0 ? "-" : "+"}${n}\\times${Math.abs(vco)}=1`)}`, `Bézout: ${inl(`${a}\\times${tpar(N, u)}${vco < 0 ? "-" : "+"}${n}\\times${Math.abs(vco)}=1`)}`),
            o.pair(`Inverse de ${inl(String(a))} modulo ${inl(String(n))} : ${inl(`${u}`)}, car ${inl(`${a}\\times${u}=${a * u}\\equiv1\\pmod{${n}}`)}`, `Inverse of ${inl(String(a))} modulo ${inl(String(n))}: ${inl(`${u}`)}, since ${inl(`${a}\\times${u}=${a * u}\\equiv1\\pmod{${n}}`)}`),
            o.pair("La multiplication par a permute les restes.", "Multiplication by a permutes the remainders."))
            : o.pair(`Pas d'inverse : ${inl(`${a}x\\equiv1\\pmod{${n}}`)} n'a pas de solution, ${inl(`${a}x`)} reste multiple de ${inl(String(d))}.`, `No inverse: ${inl(`${a}x\\equiv1\\pmod{${n}}`)} has no solution, since ${inl(`${a}x`)} stays a multiple of ${inl(String(d))}.`);
          set(o, lines(inl(`${name}(${a},${n})=${d}`), inv));
        }

  },

  // Walks in the bush-taxi graph of the activity (A-B, A-C, A-D, B-C, C-D, D-E): drag the start and end markers onto
  // vertices and choose the length k; the entry of M^k counts the walks, as the adjacency-matrix theorem states.
  walks(o) {
    const names = ["A", "B", "C", "D", "E"], pos = [[.22, .3], [.5, .12], [.5, .55], [.22, .78], [.82, .78]], E = [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 4]];
    let i = 0, j = 2, k = 2; slider(o, inl("k"), 1, 6, 1, k, q => { k = q; o.redraw(); });
    const M = names.map((_, r) => names.map((_, c) => (E.some(([p, q]) => (p === r && q === c) || (p === c && q === r)) ? 1 : 0)));
    const mul = (A, B) => A.map(row => B[0].map((_, c) => row.reduce((s, x, t) => s + x * B[t][c], 0)));
    const at = q => [40 + pos[q][0] * (o.W - 80), 30 + pos[q][1] * (o.H - 60)];
    const near = (X, Y) => pos.map((_, q) => [Math.hypot(at(q)[0] - X, at(q)[1] - Y), q]).sort((u, w) => u[0] - w[0])[0][1];
    return {
      handles() { const [xi, yi] = at(i), [xj, yj] = at(j); return [{ x: xi - 18, y: yi - 18, r: 24, cur: "grab", move(X, Y) { i = near(X + 18, Y + 18); } }, { x: xj + 18, y: yj + 18, r: 24, cur: "grab", move(X, Y) { j = near(X - 18, Y - 18); } }]; },
      draw(g) {
