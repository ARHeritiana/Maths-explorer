<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Seconde","Seconde · French curriculum"],"id":"seconde-07","course":"seconde","number":7,"title":["Statistiques descriptives à une variable","Descriptive statistics"],"slides":[{"k":"title","t":["Statistiques descriptives à une variable","Descriptive statistics"],"b":["",""]},{"k":"concept","t":["Effectifs, fréquences et moyenne","Frequencies, relative frequencies and mean"],"b":["Une série décrit un caractère sur une population. Si la valeur \\(x_i\\) apparaît \\(n_i\\) fois, \\(n_i\\) est son effectif. L'effectif total non nul est \\(N=\\sum_{i=1}^{p}n_i\\) ; sa fréquence est \\(f_i=n_i/N\\). La moyenne est\n\\[\\overline x=\\frac{\\sum_{i=1}^{p}n_ix_i}{N}=\\sum_{i=1}^{p}f_ix_i.\\]\nL'étendue est \\(x_{\\max}-x_{\\min}\\).","A data set describes a characteristic over a population. If the value \\(x_i\\) appears \\(n_i\\) times, \\(n_i\\) is its frequency count. The nonzero total count is \\(N=\\sum_{i=1}^{p}n_i\\); its relative frequency is \\(f_i=n_i/N\\). The mean is\n\\[\\overline x=\\frac{\\sum_{i=1}^{p}n_ix_i}{N}=\\sum_{i=1}^{p}f_ix_i.\\]\nThe range is \\(x_{\\max}-x_{\\min}\\)."],"h":["Définitions","Definitions"]},{"k":"example","t":["Effectifs, fréquences et moyenne","Frequencies, relative frequencies and mean"],"b":["On étudie les pointures de \\(30\\) élèves :\ncenter tabularrrrrrrrrrrrrrrr\n36&amp;42&amp;40&amp;41&amp;41&amp;38&amp;39&amp;43&amp;42&amp;42&amp;42&amp;40&amp;36&amp;40&amp;39<br>\n41&amp;40&amp;38&amp;44&amp;42&amp;40&amp;42&amp;43&amp;38&amp;43&amp;36&amp;41&amp;41&amp;44&amp;43\ntabularcenter\nCompléter les effectifs, calculer les fréquences, la moyenne et l'étendue.","We study the shoe sizes of \\(30\\) students:\ncenter tabularrrrrrrrrrrrrrrr\n36&amp;42&amp;40&amp;41&amp;41&amp;38&amp;39&amp;43&amp;42&amp;42&amp;42&amp;40&amp;36&amp;40&amp;39<br>\n41&amp;40&amp;38&amp;44&amp;42&amp;40&amp;42&amp;43&amp;38&amp;43&amp;36&amp;41&amp;41&amp;44&amp;43\ntabularcenter\nComplete the counts, calculate the relative frequencies, the mean and the range."],"a":["Effectifs : \\(3,0,3,2,5,5,6,4,2\\), de somme \\(30\\). Les fréquences sont ces effectifs divisés par \\(30\\), soit en pourcentage \\(10\\) ; \\(0\\) ; \\(10\\) ; environ \\(6{,}67\\) ; \\(16{,}67\\) ; \\(16{,}67\\) ; \\(20\\) ; \\(13{,}33\\) ; \\(6{,}67\\).\n\\(\\sum n_ix_i=1217\\), donc \\(\\overline x=1217/30\\approx40{,}57\\). L'étendue vaut \\(8\\). La moyenne n'est pas forcément une valeur de la série. La somme des pourcentages arrondis peut différer légèrement de \\(100\\).","Counts: \\(3,0,3,2,5,5,6,4,2\\), with sum \\(30\\). The relative frequencies are these counts divided by \\(30\\), that is as percentages \\(10\\); \\(0\\); \\(10\\); about \\(6.67\\); \\(16.67\\); \\(16.67\\); \\(20\\); \\(13.33\\); \\(6.67\\).\n\\(\\sum n_ix_i=1217\\), so \\(\\overline x=1217/30\\approx40.57\\). The range is \\(8\\). The mean is not necessarily a value of the data set. The sum of the rounded percentages may differ slightly from \\(100\\)."],"h":["Pointures – données du livret","Shoe sizes – booklet data"]},{"k":"concept","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Une médiane est un nombre tel qu'au moins la moitié des valeurs lui soient inférieures ou égales, et au moins la moitié supérieures ou égales.\nDans la série ordonnée de \\(N\\) valeurs, si \\(N\\) est impair, prendre le rang \\((N+1)/2\\) ; si \\(N\\) est pair, choisir la moyenne des valeurs de rangs \\(N/2\\) et \\(N/2+1\\).","A median is a number such that at least half of the values are less than or equal to it, and at least half are greater than or equal to it.\nIn the ordered data set of \\(N\\) values, if \\(N\\) is odd, take the value of rank \\((N+1)/2\\); if \\(N\\) is even, choose the mean of the values of ranks \\(N/2\\) and \\(N/2+1\\)."],"h":["Définition et convention","Definition and convention"]},{"k":"error","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Avec des répétitions, plus de \\(50\\,\\%\\) des valeurs peuvent être inférieures ou égales à la médiane.","With repeated values, more than \\(50\\%\\) of the values can be less than or equal to the median."]},{"k":"example","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Compléter les effectifs cumulés croissants (ECC) des pointures et déterminer la médiane.","Complete the ascending cumulative counts (ACC) of the shoe sizes and determine the median."],"a":["Les rangs centraux sont \\(15\\) et \\(16\\). Les ECC passent de \\(13\\) pour \\(40\\) à \\(18\\) pour \\(41\\) : les deux valeurs centrales valent \\(41\\), donc \\(M_e=41\\). Au moins la moitié des pointures sont inférieures ou égales à \\(41\\), et au moins la moitié supérieures ou égales à \\(41\\).","The central ranks are \\(15\\) and \\(16\\). The ACC goes from \\(13\\) for \\(40\\) to \\(18\\) for \\(41\\): both central values equal \\(41\\), so \\(M_e=41\\). At least half of the sizes are less than or equal to \\(41\\), and at least half are greater than or equal to \\(41\\)."]},{"k":"example","t":["Médiane et effectifs cumulés","Median and cumulative counts"],"b":["Calculer les médianes de \\(1;2;2;8;9\\) et de \\(1;2;8;9\\).","Calculate the medians of \\(1;2;2;8;9\\) and of \\(1;2;8;9\\)."],"a":["La troisième valeur de la première série vaut \\(2\\). Dans la seconde, \\((2+8)/2=5\\) ; la médiane choisie n'est pas une valeur de la série.","The third value of the first data set is \\(2\\). In the second, \\((2+8)/2=5\\); the chosen median is not a value of the data set."]},{"k":"concept","t":["Quartiles et diagramme en boîte","Quartiles and box plot"],"b":["Le premier quartile \\(Q_1\\) est la valeur de rang \\(\\lceil N/4\\rceil\\) : la plus petite valeur de la série telle qu'au moins \\(25\\,\\%\\) des valeurs lui soient inférieures ou égales. \\(Q_3\\) est la valeur de rang \\(\\lceil3N/4\\rceil\\).\nL'écart interquartile est \\(Q_3-Q_1\\). Le diagramme en boîte indique minimum, \\(Q_1\\), médiane, \\(Q_3\\), maximum.","The first quartile \\(Q_1\\) is the value of rank \\(\\lceil N/4\\rceil\\): the smallest value of the data set such that at least \\(25\\%\\) of the values are less than or equal to it. \\(Q_3\\) is the value of rank \\(\\lceil3N/4\\rceil\\).\nThe interquartile range is \\(Q_3-Q_1\\). The box plot shows the minimum, \\(Q_1\\), the median, \\(Q_3\\) and the maximum."],"h":["Définitions","Definitions"]},{"k":"example","t":["Quartiles et diagramme en boîte","Quartiles and box plot"],"b":["Déterminer \\(Q_1\\), \\(Q_3\\) et l'écart interquartile des pointures, puis tracer le diagramme en boîte.","Determine \\(Q_1\\), \\(Q_3\\) and the interquartile range of the shoe sizes, then draw the box plot."],"a":["\\(N/4=7{,}5\\) : rang \\(8\\), donc \\(Q_1=39\\). \\(3N/4=22{,}5\\) : rang \\(23\\), donc \\(Q_3=42\\). Écart interquartile \\(3\\). Le diagramme utilise \\((36;39;41;42;44)\\).","\\(N/4=7.5\\): rank \\(8\\), so \\(Q_1=39\\). \\(3N/4=22.5\\): rank \\(23\\), so \\(Q_3=42\\). Interquartile range \\(3\\). The plot uses \\((36;39;41;42;44)\\)."],"f":[[1,1]]},{"k":"example","t":["Quartiles et diagramme en boîte","Quartiles and box plot"],"b":["Déterminer les quartiles de \\(1;2;2;3;4;4;4;5\\). Y a-t-il exactement \\(25\\,\\%\\) des valeurs inférieures ou égales à \\(Q_1\\) ?","Determine the quartiles of \\(1;2;2;3;4;4;4;5\\). Are exactly \\(25\\%\\) of the values less than or equal to \\(Q_1\\)?"],"a":["\\(Q_1=2\\) (rang \\(2\\)), \\(Q_3=4\\) (rang \\(6\\)). Ici \\(3/8=37{,}5\\,\\%\\) des valeurs sont inférieures ou égales à \\(Q_1\\). Il faut dire « au moins ».","\\(Q_1=2\\) (rank \\(2\\)), \\(Q_3=4\\) (rank \\(6\\)). Here \\(3/8=37.5\\%\\) of the values are less than or equal to \\(Q_1\\). One must say “at least”."]},{"k":"widget","t":["Série statistique","A data set"],"b":["Déplacez les valeurs : moyenne, médiane et quartiles réagissent.","Drag the values: mean, median and quartiles react."],"w":{"type":"stats"}},{"k":"concept","t":["Ajout ou suppression d'une valeur","Adding or removing a value"],"b":["Ajouter \\(a\\) à une série de taille \\(N\\) donne \\(\\overline x'=(N\\overline x+a)/(N+1)\\).\nRetirer une occurrence de \\(a\\), pour \\(N&gt;1\\), donne \\(\\overline x'=(N\\overline x-a)/(N-1)\\). Utiliser la somme exacte, sans arrondi intermédiaire. Réexaminer la médiane dans la nouvelle série ordonnée.","Adding \\(a\\) to a data set of size \\(N\\) gives \\(\\overline x'=(N\\overline x+a)/(N+1)\\).\nRemoving one occurrence of \\(a\\), for \\(N&gt;1\\), gives \\(\\overline x'=(N\\overline x-a)/(N-1)\\). Use the exact sum, with no intermediate rounding. Re-examine the median in the new ordered data set."],"h":["Propriétés","Properties"]},{"k":"example","t":["Ajout ou suppression d'une valeur","Adding or removing a value"],"b":["Dans la série des pointures, la somme vaut \\(1217\\), la médiane \\(41\\).\n<ol><li>Ajouter une pointure \\(36\\) et calculer les nouveaux indicateurs.<li>Repartir de la série initiale, retirer une pointure \\(44\\) et recommencer.<\/ol>","In the shoe-size data, the sum is \\(1217\\) and the median \\(41\\).\n<ol><li>Add a size \\(36\\) and calculate the new statistics.<li>Starting again from the initial data, remove a size \\(44\\) and repeat.<\/ol>"],"a":["1. Somme \\(1253\\), effectif \\(31\\) : \\(\\overline x'=1253/31\\approx40{,}42\\). Le rang central \\(16\\) donne toujours \\(41\\). 2. Somme \\(1173\\), effectif \\(29\\) : \\(\\overline x''=1173/29\\approx40{,}45\\). Le rang central \\(15\\) donne \\(41\\). La moyenne diminue dans les deux cas ; la médiane reste inchangée. Les situations sont indépendantes.","1. Sum \\(1253\\), count \\(31\\): \\(\\overline x'=1253/31\\approx40.42\\). The central rank \\(16\\) still gives \\(41\\). 2. Sum \\(1173\\), count \\(29\\): \\(\\overline x''=1173/29\\approx40.45\\). The central rank \\(15\\) gives \\(41\\). The mean decreases in both cases; the median is unchanged. The situations are independent."]},{"k":"example","t":["Ajout ou suppression d'une valeur","Adding or removing a value"],"b":["Justifier qu'ajouter la moyenne ne change pas la moyenne. L'étendue peut-elle diminuer lors d'un ajout ?","Justify that adding the mean does not change the mean. Can the range decrease when a value is added?"],"a":["Si \\(a=\\overline x\\), \\((N\\overline x+\\overline x)/(N+1)=\\overline x\\). Lors d'un ajout, le minimum ne peut qu'être conservé ou diminuer, le maximum être conservé ou augmenter : l'étendue ne diminue pas. Lors d'une suppression, elle n'augmente pas.","If \\(a=\\overline x\\), \\((N\\overline x+\\overline x)/(N+1)=\\overline x\\). When adding, the minimum can only stay the same or decrease, the maximum stay the same or increase: the range does not decrease. When removing, it does not increase."]},{"k":"concept","t":["Variance et écart type","Variance and standard deviation"],"b":["\\(V=\\dfrac{\\sum n_i(x_i-\\overline x)^2}{N}\\) est la variance ; \\(\\sigma=\\sqrt V\\) est l'écart type. Il mesure la dispersion autour de la moyenne et a la même unité que les données. On peut aussi calculer \\(V=\\dfrac{\\sum n_ix_i^2}{N}-\\overline x^{\\,2}\\).","\\(V=\\dfrac{\\sum n_i(x_i-\\overline x)^2}{N}\\) is the variance; \\(\\sigma=\\sqrt V\\) is the standard deviation. It measures the spread around the mean and has the same unit as the data. One can also compute \\(V=\\dfrac{\\sum n_ix_i^2}{N}-\\overline x^{\\,2}\\)."],"h":["Définitions","Definitions"]},{"k":"example","t":["Variance et écart type","Variance and standard deviation"],"b":["Calculer la variance et l'écart type des pointures.","Calculate the variance and the standard deviation of the shoe sizes."],"a":["\\(\\sum n_ix_i^2=49519\\), donc\n\\[V=\\frac{49519}{30}-\\left(\\frac{1217}{30}\\right)^2=\\frac{4481}{900}\\approx4{,}979.\\]\n\\(\\sigma=\\sqrt{4481}/30\\approx2{,}23\\). L'écart type n'est pas la distance maximale à la moyenne.","\\(\\sum n_ix_i^2=49519\\), so\n\\[V=\\frac{49519}{30}-\\left(\\frac{1217}{30}\\right)^2=\\frac{4481}{900}\\approx4.979.\\]\n\\(\\sigma=\\sqrt{4481}/30\\approx2.23\\). The standard deviation is not the maximum distance from the mean."]},{"k":"example","t":["Variance et écart type","Variance and standard deviation"],"b":["Comparer \\(A:8;10;12\\) et \\(B:0;10;20\\) avec les couples moyenne–écart type et médiane–écart interquartile.","Compare \\(A:8;10;12\\) and \\(B:0;10;20\\) using the mean–standard deviation pair and the median–interquartile range pair."],"a":["Les moyennes et médianes valent toutes \\(10\\). \\(V_A=8/3\\), \\(\\sigma_A\\approx1{,}63\\) ; \\(V_B=200/3\\), \\(\\sigma_B\\approx8{,}16\\). Quartiles : \\(8,12\\) pour \\(A\\) ; \\(0,20\\) pour \\(B\\). Écarts interquartiles \\(4\\) et \\(20\\). \\(B\\) est beaucoup plus dispersée malgré des centres identiques.","The means and medians are all \\(10\\). \\(V_A=8/3\\), \\(\\sigma_A\\approx1.63\\); \\(V_B=200/3\\), \\(\\sigma_B\\approx8.16\\). Quartiles: \\(8,12\\) for \\(A\\); \\(0,20\\) for \\(B\\). Interquartile ranges \\(4\\) and \\(20\\). \\(B\\) is much more spread out despite identical centres."]},{"k":"concept","t":["Linéarité de la moyenne","Linearity of the mean"],"b":["Remplacer chaque \\(x_i\\) par \\(kx_i+c\\) donne une moyenne \\(k\\overline x+c\\), un écart type \\(|k|\\sigma\\) et une variance \\(k^2V\\). Ajouter une constante ne change ni variance ni écart type.","Replacing each \\(x_i\\) by \\(kx_i+c\\) gives a mean \\(k\\overline x+c\\), a standard deviation \\(|k|\\sigma\\) and a variance \\(k^2V\\). Adding a constant changes neither variance nor standard deviation."],"h":["Propriété","Property"]},{"k":"example","t":["Linéarité de la moyenne","Linearity of the mean"],"b":["Moyenne initiale \\(12/20\\), écart type \\(3\\). Calculer les nouveaux indicateurs pour trois modifications indépendantes, sans plafonnement des notes : ajouter \\(1{,}5\\) ; multiplier par \\(0{,}8\\) ; multiplier par \\(1{,}1\\) puis ajouter \\(0{,}5\\).","Initial mean \\(12/20\\), standard deviation \\(3\\). Calculate the new statistics for three independent modifications, with no capping of marks: add \\(1.5\\); multiply by \\(0.8\\); multiply by \\(1.1\\) then add \\(0.5\\)."],"a":["Moyennes : \\(13{,}5\\), \\(9{,}6\\), \\(13{,}7\\). Écarts types : \\(3\\), \\(2{,}4\\), \\(3{,}3\\). Multiplier les notes par \\(1{,}1\\) les augmente ; cela ne signifie pas augmenter la difficulté de l'évaluation. Avec un plafonnement à \\(20\\), la transformation ne serait plus affine sur toutes les données.","Means: \\(13.5\\), \\(9.6\\), \\(13.7\\). Standard deviations: \\(3\\), \\(2.4\\), \\(3.3\\). Multiplying the marks by \\(1.1\\) raises them; this does not mean making the assessment harder. With a cap at \\(20\\), the transformation would no longer be affine on all the data."]},{"k":"code","t":["Python","Python"],"b":["from math import sqrt\n\ndef moyenne_ecart_type(valeurs):\n    n = len(valeurs)\n    if n == 0:\n        raise ValueError(\"liste vide\")\n    m = sum(valeurs)/n\n    v = sum((x-m)**2 for x in valeurs)/n\n    return m, sqrt(v)","from math import sqrt\n\ndef moyenne_ecart_type(valeurs):\n    n = len(valeurs)\n    if n == 0:\n        raise ValueError(\"liste vide\")\n    m = sum(valeurs)/n\n    v = sum((x-m)**2 for x in valeurs)/n\n    return m, sqrt(v)"]},{"k":"example","t":["Linéarité de la moyenne","Linearity of the mean"],"b":["Expliquer le programme ; prévoir son résultat pour <code>[8, 10, 12]<\/code>.","Explain the program; predict its result for <code>[8, 10, 12]<\/code>."],"a":["Il vérifie que la liste est non vide, calcule la moyenne, la moyenne des carrés des écarts, puis sa racine. Résultat : \\((10;\\sqrt{8/3})\\approx(10;1{,}633)\\).","It checks that the list is nonempty, calculates the mean, the mean of the squared deviations, then its root. Result: \\((10,\\sqrt{8/3})\\approx(10,1.633)\\)."]},{"k":"concept","t":["Séries continues regroupées en classes","Continuous data grouped into classes"],"b":["Une variable quantitative continue peut prendre toutes les valeurs d'un intervalle. Ici, les observations sont regroupées en classes de même amplitude ; le centre de \\([a;b[\\) vaut \\((a+b)/2\\).\nSi les moyennes \\(m_i\\) des classes sont connues, la moyenne globale exacte est \\(\\sum n_im_i/N\\). À défaut, les remplacer par les centres donne une estimation justifiée par un modèle uniforme dans chaque classe.","A continuous quantitative variable can take every value in an interval. Here, the observations are grouped into classes of equal width; the centre of \\([a,b)\\) is \\((a+b)/2\\).\nIf the class means \\(m_i\\) are known, the exact overall mean is \\(\\sum n_im_i/N\\). Otherwise, replacing them by the centres gives an estimate justified by a uniform model within each class."],"h":["Définitions et perte d'information","Definitions and loss of information"]},{"k":"example","t":["Séries continues regroupées en classes","Continuous data grouped into classes"],"b":["Compléter, estimer la moyenne à partir des centres et déterminer la classe médiane.","Complete, estimate the mean from the centres and determine the median class."],"a":["Amplitude \\(10\\) cm, effectif total \\(100\\). Fréquences en pourcentage : \\(8,22,35,28,7\\). Centres : \\(155,165,175,185,195\\) cm. La somme pondérée des centres vaut \\(17540\\), donc la moyenne estimée est \\(175{,}4\\) cm. Les rangs centraux \\(50,51\\) se trouvent dans \\([170;180[\\), classe médiane.","Width \\(10\\) cm, total count \\(100\\). Relative frequencies as percentages: \\(8,22,35,28,7\\). Centres: \\(155,165,175,185,195\\) cm. The weighted sum of the centres is \\(17540\\), so the estimated mean is \\(175.4\\) cm. The central ranks \\(50,51\\) lie in \\([170,180)\\), the median class."],"h":["Tailles – données du livret","Heights – booklet data"]},{"k":"example","t":["Séries continues regroupées en classes","Continuous data grouped into classes"],"b":["Si les moyennes exactes des classes étaient \\(154;166;174;184;196\\) cm, quelle serait la moyenne globale ?","If the exact class means were \\(154;166;174;184;196\\) cm, what would the overall mean be?"],"a":["\\((8\\times154+22\\times166+35\\times174+28\\times184+7\\times196)/100=174{,}98\\) cm.","\\((8\\times154+22\\times166+35\\times174+28\\times184+7\\times196)/100=174.98\\) cm."]},{"k":"concept","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["L'aire de chaque rectangle d'un histogramme est proportionnelle à l'effectif. À amplitudes égales, les hauteurs peuvent être les effectifs. Le polygone des fréquences cumulées joint les points (borne supérieure ; fréquence cumulée), en commençant à la première borne inférieure avec \\(0\\).","The area of each rectangle of a histogram is proportional to the count. For equal widths, the heights can be the counts. The cumulative frequency polygon joins the points (upper bound; cumulative frequency), starting at the first lower bound with \\(0\\)."],"h":["Représentations","Representations"]},{"k":"example","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["Construire les deux graphiques pour les tailles de l'exemple précédent.","Construct both graphs for the heights of the previous example."],"f":[[2,2],[3,3]]},{"k":"method","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["Sous l'hypothèse d'uniformité dans \\([170;180[\\), la fréquence cumulée passe linéairement de \\(30\\,\\%\\) à \\(65\\,\\%\\). Rechercher l'abscisse correspondant à \\(50\\,\\%\\).","Under the assumption of uniformity in \\([170,180)\\), the cumulative frequency rises linearly from \\(30\\%\\) to \\(65\\%\\). Look for the abscissa corresponding to \\(50\\%\\)."],"h":["Estimer la médiane","Estimating the median"]},{"k":"example","t":["Histogramme et fréquences cumulées","Histogram and cumulative frequencies"],"b":["Calculer cette estimation et préciser sa portée.","Calculate this estimate and state its scope."],"a":["On résout \\((m-1 <script>
(function(){
"use strict";
/* ---- ../js/canvas-navigation.js ---- */
// A camera is independent of the mathematical parameters. Moving an object never changes it.
function camera2D() {
  const c = { scale: 1, x: 0, y: 0 };
  c.project = ([x,y]) => [c.x+c.scale*x,c.y+c.scale*y];
  c.unproject = ([x,y]) => [(x-c.x)/c.scale,(y-c.y)/c.scale];
  c.zoomAt = (factor,[x,y]) => { const p=c.unproject([x,y]); c.scale=Math.max(.2,Math.min(12,c.scale*factor)); c.x=x-p[0]*c.scale;c.y=y-p[1]*c.scale; };
  c.reset=()=>{c.scale=1;c.x=c.y=0;};return c;
}
function navigationButtons(host,action,lang='fr') {
  const bar=document.createElement('output');bar.className='canvas-navigation';bar.hidden=true;
  bar.setAttribute('aria-live','polite');host.append(bar);
  bar.update=scale=>{bar.textContent=`${Math.round(scale*100)} %`;};bar.update(1);return bar;
}
function canvasNavigation(c,g,size,redraw,{host=c.parentElement,lang=document.documentElement.lang,canPan=()=>false}={}) {
  const camera=camera2D(),rawClear=g.clearRect.bind(g);let last=null,gesture=null;
  const pointers=new Map(),point=e=>{const r=c.getBoundingClientRect(),[w,h]=size();return [(e.clientX-r.left)/r.width*w,(e.clientY-r.top)/r.height*h];};
  const apply=()=>{const [w]=size(),d=c.width/w;g.setTransform(d*camera.scale,0,0,d*camera.scale,d*camera.x,d*camera.y);};
  g.clearRect=()=>{g.save();g.setTransform(1,0,0,1,0,0);rawClear(0,0,c.width,c.height);g.restore();apply();};
  const refresh=()=>{apply();bar.update(camera.scale);redraw();};
  const action=id=>{const [w,h]=size();if(id==='reset')camera.reset();else if(id==='in'||id==='out')camera.zoomAt(id==='in'?1.25:.8,[w/2,h/2]);else{const d={left:[40,0],right:[-40,0],up:[0,40],down:[0,-40]}[id];camera.x+=d[0];camera.y+=d[1];}refresh();};

  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));

  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}


function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
