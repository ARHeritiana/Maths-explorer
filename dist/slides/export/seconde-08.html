<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Seconde","Seconde · French curriculum"],"id":"seconde-08","course":"seconde","number":8,"title":["Calcul algébrique, équations et inéquations","Algebra, equations and inequalities"],"slides":[{"k":"title","t":["Calcul algébrique, équations et inéquations","Algebra, equations and inequalities"],"b":["",""]},{"k":"method","t":["Parenthèses et distributivité","Brackets and distributivity"],"b":["Après un signe \\(+\\), supprimer les parenthèses conserve les signes des termes. Après un signe \\(-\\), chaque terme à l'intérieur change de signe. Cette règle concerne une somme ou une différence de termes.","After a \\(+\\) sign, removing the brackets keeps the signs of the terms. After a \\(-\\) sign, every term inside changes sign. This rule applies to a sum or a difference of terms."],"h":["Supprimer des parenthèses","Removing brackets"]},{"k":"example","t":["Parenthèses et distributivité","Brackets and distributivity"],"b":["Supprimer les parenthèses et réduire : \\(A=x+(2+3x)\\) ; \\(B=x-(2+3x)\\) ; \\(C=-2x+(-4+5x)\\) ; \\(D=-2x-(-4+5x)\\).","Remove the brackets and simplify: \\(A=x+(2+3x)\\); \\(B=x-(2+3x)\\); \\(C=-2x+(-4+5x)\\); \\(D=-2x-(-4+5x)\\)."],"a":["\\(A=4x+2\\) ; \\(B=-2x-2\\) ; \\(C=3x-4\\) ; \\(D=-7x+4\\).","\\(A=4x+2\\) ; \\(B=-2x-2\\) ; \\(C=3x-4\\) ; \\(D=-7x+4\\)."]},{"k":"concept","t":["Parenthèses et distributivité","Brackets and distributivity"],"b":["Pour tous réels \\(a,b,c,d\\) :\n\\[b(c+d)=bc+bd,\\qquad(a+b)(c+d)=ac+ad+bc+bd.\\]","For all real numbers \\(a,b,c,d\\):\n\\[b(c+d)=bc+bd,\\qquad(a+b)(c+d)=ac+ad+bc+bd.\\]"],"h":["Distributivité","Distributivity"]},{"k":"example","t":["Parenthèses et distributivité","Brackets and distributivity"],"b":["Développer et réduire :\n\\[\\begin{aligned}\nA&amp;=-4(8x+7)+(-8x+5)(5x+9),\\\\\nB&amp;=(6x+9)(-x+7)+(3x+5)(-9x+6),\\\\\nC&amp;=-9(-x-7)-(-x+3)(-8x-8),\\\\\nD&amp;=-5(-6x-7)+(x-7)(5x+8).\n\\end{aligned}\\]","Expand and simplify:\n\\[\\begin{aligned}\nA&amp;=-4(8x+7)+(-8x+5)(5x+9),\\\\\nB&amp;=(6x+9)(-x+7)+(3x+5)(-9x+6),\\\\\nC&amp;=-9(-x-7)-(-x+3)(-8x-8),\\\\\nD&amp;=-5(-6x-7)+(x-7)(5x+8).\n\\end{aligned}\\]"],"a":["On développe chaque produit, puis on regroupe les termes de même degré :\n\\[\\begin{aligned}\nA&amp;=-32x-28-40x^2-72x+25x+45=-40x^2-79x+17,\\\\\nB&amp;=-6x^2+33x+63-27x^2-27x+30=-33x^2+6x+93,\\\\\nC&amp;=9x+63-(8x^2-16x-24)=-8x^2+25x+87,\\\\\nD&amp;=30x+35+5x^2-27x-56=5x^2+3x-21.\n\\end{aligned}\\]","Expand each product, then collect terms of the same degree:\n\\[\\begin{aligned}\nA&amp;=-32x-28-40x^2-72x+25x+45=-40x^2-79x+17,\\\\\nB&amp;=-6x^2+33x+63-27x^2-27x+30=-33x^2+6x+93,\\\\\nC&amp;=9x+63-(8x^2-16x-24)=-8x^2+25x+87,\\\\\nD&amp;=30x+35+5x^2-27x-56=5x^2+3x-21.\n\\end{aligned}\\]"]},{"k":"concept","t":["Factoriser avec un facteur commun","Factorising with a common factor"],"b":["\\(ka+kb=k(a+b)\\) et \\(ka-kb=k(a-b)\\). Factoriser transforme une somme en un produit ; développer fait l'opération inverse.","\\(ka+kb=k(a+b)\\) and \\(ka-kb=k(a-b)\\). Factorising turns a sum into a product; expanding does the reverse."],"h":["Propriété","Property"]},{"k":"example","t":["Factoriser avec un facteur commun","Factorising with a common factor"],"b":["Factoriser :\n\\[\\begin{aligned}\nA&amp;=15x^2-21x,\\\\B&amp;=3(2+3x)-(5+2x)(2+3x),\\\\\nC&amp;=(4x-1)(x+6)+(4x-1),\\\\D&amp;=(1-6x)^2-(1-6x)(2+5x).\n\\end{aligned}\\]","Factorise:\n\\[\\begin{aligned}\nA&amp;=15x^2-21x,\\\\B&amp;=3(2+3x)-(5+2x)(2+3x),\\\\\nC&amp;=(4x-1)(x+6)+(4x-1),\\\\D&amp;=(1-6x)^2-(1-6x)(2+5x).\n\\end{aligned}\\]"],"a":["\\(A=3x(5x-7)\\).<br>\n\\(B=(2+3x)[3-(5+2x)]=(2+3x)(-2-2x)=-2(2+3x)(1+x)\\).<br>\n\\(C=(4x-1)[(x+6)+1]=(4x-1)(x+7)\\).<br>\n\\(D=(1-6x)[(1-6x)-(2+5x)]=(1-6x)(-1-11x)=(6x-1)(11x+1)\\).\nVérifier les facteurs en redéveloppant.","\\(A=3x(5x-7)\\).<br>\n\\(B=(2+3x)[3-(5+2x)]=(2+3x)(-2-2x)=-2(2+3x)(1+x)\\).<br>\n\\(C=(4x-1)[(x+6)+1]=(4x-1)(x+7)\\).<br>\n\\(D=(1-6x)[(1-6x)-(2+5x)]=(1-6x)(-1-11x)=(6x-1)(11x+1)\\).\nCheck the factors by expanding again."]},{"k":"example","t":["Factoriser avec un facteur commun","Factorising with a common factor"],"b":["Choisir une forme utile de \\(f(x)=(x-2)(x+3)\\) pour calculer \\(f(2)\\), \\(f(0)\\) et chercher ses zéros.","Choose a useful form of \\(f(x)=(x-2)(x+3)\\) to calculate \\(f(2)\\), \\(f(0)\\) and find its zeros."],"a":["La forme factorisée donne immédiatement \\(f(2)=0\\) et les zéros \\(2,-3\\). En \\(0\\), \\(f(0)=(-2)\\times3=-6\\) ; la forme développée \\(x^2+x-6\\) donne aussi ce résultat. Le choix dépend de la question.","The factorised form immediately gives \\(f(2)=0\\) and the zeros \\(2,-3\\). At \\(0\\), \\(f(0)=(-2)\\times3=-6\\); the expanded form \\(x^2+x-6\\) also gives this result. The choice depends on the question."]},{"k":"concept","t":["Identités remarquables : développer","Special identities: expanding"],"b":["\\[(a+b)^2=a^2+2ab+b^2,\\qquad(a-b)^2=a^2-2ab+b^2,\\]\n\\[(a+b)(a-b)=a^2-b^2.\\]","\\[(a+b)^2=a^2+2ab+b^2,\\qquad(a-b)^2=a^2-2ab+b^2,\\]\n\\[(a+b)(a-b)=a^2-b^2.\\]"],"h":["Identités","Identities"]},{"k":"proof","t":["Identités remarquables : développer","Special identities: expanding"],"b":["Développer \\((a+b)(a+b)\\) : \\(a^2+ab+ba+b^2=a^2+2ab+b^2\\). Remplacer \\(b\\) par \\(-b\\) donne la deuxième identité. Enfin \\((a+b)(a-b)=a^2-ab+ab-b^2=a^2-b^2\\).","Expand \\((a+b)(a+b)\\): \\(a^2+ab+ba+b^2=a^2+2ab+b^2\\). Replacing \\(b\\) by \\(-b\\) gives the second identity. Finally \\((a+b)(a-b)=a^2-ab+ab-b^2=a^2-b^2\\)."]},{"k":"example","t":["Identités remarquables : développer","Special identities: expanding"],"b":["Développer \\((x+3)^2\\), \\((3x-4)^2\\), \\((x-3)(x+3)\\), \\((2x+3)(2x-3)\\), \\((4-3x)(3x+4)\\).","Expand \\((x+3)^2\\), \\((3x-4)^2\\), \\((x-3)(x+3)\\), \\((2x+3)(2x-3)\\), \\((4-3x)(3x+4)\\)."],"a":["\\(x^2+6x+9\\) ; \\(9x^2-24x+16\\) ; \\(x^2-9\\) ; \\(4x^2-9\\) ; \\(16-9x^2\\). Dans le dernier produit, réordonner \\(3x+4\\) en \\(4+3x\\).","\\(x^2+6x+9\\); \\(9x^2-24x+16\\); \\(x^2-9\\); \\(4x^2-9\\); \\(16-9x^2\\). In the last product, reorder \\(3x+4\\) as \\(4+3x\\)."]},{"k":"example","t":["Identités remarquables : développer","Special identities: expanding"],"b":["Développer et réduire \\(A=(2x-3)^2+(x+5)(3-x)\\) et \\(B=2(x+3)+(2x+3)(2x-3)\\).","Expand and simplify \\(A=(2x-3)^2+(x+5)(3-x)\\) and \\(B=2(x+3)+(2x+3)(2x-3)\\)."],"a":["\\(A=4x^2-12x+9-x^2-2x+15=3x^2-14x+24\\). \\(B=2x+6+4x^2-9=4x^2+2x-3\\).","\\(A=4x^2-12x+9-x^2-2x+15=3x^2-14x+24\\). \\(B=2x+6+4x^2-9=4x^2+2x-3\\)."]},{"k":"method","t":["Identités remarquables : factoriser","Special identities: factorising"],"b":["Repérer les deux carrés ; pour les formes à trois termes, vérifier le double produit \\(2ab\\). Pour une différence de deux carrés, utiliser \\(a^2-b^2=(a-b)(a+b)\\).","Spot the two squares; for three-term forms, check the double product \\(2ab\\). For a difference of two squares, use \\(a^2-b^2=(a-b)(a+b)\\)."]},{"k":"example","t":["Identités remarquables : factoriser","Special identities: factorising"],"b":["Factoriser :\n\\[A=x^2-2x+1,\\quad B=25+16x^2-40x,\\quad C=4x^2+12x+9,\\]\n\\[D=1-49x^2,\\quad E=9x^2-4,\\quad F=(2x+3)^2-64.\\]","Factorise:\n\\[A=x^2-2x+1,\\quad B=25+16x^2-40x,\\quad C=4x^2+12x+9,\\]\n\\[D=1-49x^2,\\quad E=9x^2-4,\\quad F=(2x+3)^2-64.\\]"],"a":["\\(A=(x-1)^2\\). \\(B=(4x-5)^2\\). \\(C=(2x+3)^2\\).<br>\n\\(D=(1-7x)(1+7x)\\). \\(E=(3x-2)(3x+2)\\).<br>\n\\(F=[(2x+3)-8][(2x+3)+8]=(2x-5)(2x+11)\\).\nPour les trois premiers, vérifier le terme intermédiaire ; pour \\(F\\), traiter \\(2x+3\\) comme un seul bloc.","\\(A=(x-1)^2\\). \\(B=(4x-5)^2\\). \\(C=(2x+3)^2\\).<br>\n\\(D=(1-7x)(1+7x)\\). \\(E=(3x-2)(3x+2)\\).<br>\n\\(F=[(2x+3)-8][(2x+3)+8]=(2x-5)(2x+11)\\).\nFor the first three, check the middle term; for \\(F\\), treat \\(2x+3\\) as a single block."]},{"k":"example","t":["Identités remarquables : factoriser","Special identities: factorising"],"b":["Les égalités \\((a+b)^2=a^2+b^2\\) et \\(a^2+b^2=(a-b)(a+b)\\) sont-elles vraies pour tous réels ?","Are the equalities \\((a+b)^2=a^2+b^2\\) and \\(a^2+b^2=(a-b)(a+b)\\) true for all real numbers?"],"a":["Non : pour \\(a=b=1\\), la première donnerait \\(4=2\\) et la seconde \\(2=0\\). Le terme manquant dans la première est \\(2ab\\) ; le produit de la seconde vaut \\(a^2-b^2\\).","No: for \\(a=b=1\\), the first would give \\(4=2\\) and the second \\(2=0\\). The missing term in the first is \\(2ab\\); the product in the second equals \\(a^2-b^2\\)."],"h":["Contrôler une identité","Checking an identity"]},{"k":"concept","t":["Puissances entières relatives","Integer powers"],"b":["Pour \\(n\\geq1\\), \\(a^n\\) est le produit de \\(n\\) facteurs égaux à \\(a\\). Pour \\(a\\ne0\\), \\(a^0=1\\) et \\(a^{-n}=1/a^n\\). Dans ce cours, \\(0^0\\) n'est pas défini.\nPour \\(a,b\\ne0\\) et des entiers relatifs \\(m,n\\) :\n\\[a^ma^n=a^{m+n},\\quad\\frac{a^m}{a^n}=a^{m-n},\\quad(a^m)^n=a^{mn},\\]\n\\[(ab)^n=a^nb^n,\\qquad\\left(\\frac ab\\right)^n=\\frac{a^n}{b^n}.\\]\nPour des exposants strictement positifs, certaines bases peuvent être nulles si les expressions restent définies.","For \\(n\\geq1\\), \\(a^n\\) is the product of \\(n\\) factors equal to \\(a\\). For \\(a\\ne0\\), \\(a^0=1\\) and \\(a^{-n}=1/a^n\\). In this course, \\(0^0\\) is not defined.\nFor \\(a,b\\ne0\\) and integers \\(m,n\\):\n\\[a^ma^n=a^{m+n},\\quad\\frac{a^m}{a^n}=a^{m-n},\\quad(a^m)^n=a^{mn},\\]\n\\[(ab)^n=a^nb^n,\\qquad\\left(\\frac ab\\right)^n=\\frac{a^n}{b^n}.\\]\nFor strictly positive exponents, some bases may be zero if the expressions remain defined."],"h":["Définition et règles","Definition and rules"]},{"k":"example","t":["Puissances entières relatives","Integer powers"],"b":["Simplifier \\(A=2^4\\times2^3\\), \\(B=(-5)^{12}/(-5)^3\\), \\(C=(7^3)^6\\times7^{-5}\\), \\(D=7^{24}\\times3^2\\times2^3\\). Calculer aussi \\((-3)^5\\), \\(5^1\\) et \\(99999^0\\).","Simplify \\(A=2^4\\times2^3\\), \\(B=(-5)^{12}/(-5)^3\\), \\(C=(7^3)^6\\times7^{-5}\\), \\(D=7^{24}\\times3^2\\times2^3\\). Also calculate \\((-3)^5\\), \\(5^1\\) and \\(99999^0\\)."],"a":["\\(A=2^7=128\\). \\(B=(-5)^9=-1953125\\). \\(C=7^{18-5}=7^{13}\\). \\(D=72\\times7^{24}\\) : on ne peut pas additionner les exposants de bases différentes. Les trois dernières valeurs sont \\(-243\\), \\(5\\), \\(1\\).","\\(A=2^7=128\\). \\(B=(-5)^9=-1953125\\). \\(C=7^{18-5}=7^{13}\\). \\(D=72\\times7^{24}\\): exponents of different bases cannot be added. The last three values are \\(-243\\), \\(5\\), \\(1\\)."]},{"k":"error","t":["Puissances entières relatives","Integer powers"],"b":["La définition comme produit répété ne vaut pas pour un exposant négatif. \\(-3^2=-9\\), tandis que \\((-3)^2=9\\).","The definition as a repeated product does not hold for a negative exponent. \\(-3^2=-9\\), whereas \\((-3)^2=9\\)."]},{"k":"example","t":["Puissances entières relatives","Integer powers"],"b":["Résoudre mentalement \\(2^n&gt;100\\) pour le plus petit entier naturel \\(n\\). Écrire un programme qui le trouve.","Solve \\(2^n&gt;100\\) mentally for the smallest natural number \\(n\\). Write a program that finds it."],"a":["\\(2^6=64\\leq100&lt;128=2^7\\), donc \\(n=7\\). Initialiser \\(n=0\\), \\(p=1\\) ; tant que \\(p\\leq100\\), remplacer \\(p\\) par \\(2p\\) et \\(n\\) par \\(n+1\\). Le programme est donné en fin de séquence.","\\(2^6=64\\leq100&lt;128=2^7\\), so \\(n=7\\). Initialise \\(n=0\\), \\(p=1\\); while \\(p\\leq100\\), replace \\(p\\) by \\(2p\\) and \\(n\\) by \\(n+1\\). The program is given at the end of the sequence."]},{"k":"concept","t":["Fractions et expressions fractionnaires","Fractions and fractional expressions"],"b":["Pour les dénominateurs non nuls :\n\\[\\frac ac\\pm\\frac bc=\\frac{a\\pm b}{c},\\quad\\frac ac\\pm\\frac bd=\\frac{ad\\pm bc}{cd},\\quad\\frac ac\\times\\frac bd=\\frac{ab}{cd}.\\]\nUne fraction \\(c/d\\) possède un inverse seulement si \\(c\\ne0\\) et \\(d\\ne0\\). Alors\n\\[\\frac ab\\div\\frac cd=\\frac ab\\times\\frac dc=\\frac{ad}{bc}\\quad(b,c,d\\ne0).\\]","For nonzero denominators:\n\\[\\frac ac\\pm\\frac bc=\\frac{a\\pm b}{c},\\quad\\frac ac\\pm\\frac bd=\\frac{ad\\pm bc}{cd},\\quad\\frac ac\\times\\frac bd=\\frac{ab}{cd}.\\]\nA fraction \\(c/d\\) has an inverse only if \\(c\\ne0\\) and \\(d\\ne0\\). Then\n\\[\\frac ab\\div\\frac cd=\\frac ab\\times\\frac dc=\\frac{ad}{bc}\\quad(b,c,d\\ne0).\\]"],"h":["Règles et conditions","Rules and conditions"]},{"k":"example","t":["Fractions et expressions fractionnaires","Fractions and fractional expressions"],"b":["Calculer et rendre irréductible :\n\\[A=\\left(\\frac23+\\frac16\\right)\\times\\frac45,\\quad B=\\frac12+\\frac34\\times\\frac56,\\quad C=\\frac45\\div\\frac23\\times\\frac7{10},\\]\n\\[D=\\frac{\\left(\\frac25+\\frac13\\right)\\times\\frac34}{\\frac12-\\frac16}.\\]","Calculate and reduce to lowest terms:\n\\[A=\\left(\\frac23+\\frac16\\right)\\times\\frac45,\\quad B=\\frac12+\\frac34\\times\\frac56,\\quad C=\\frac45\\div\\frac23\\times\\frac7{10},\\]\n\\[D=\\frac{\\left(\\frac25+\\frac13\\right)\\times\\frac34}{\\frac12-\\frac16}.\\]"],"a":["\\(A=\\frac56\\times\\frac45=\\frac23\\). \\(B=\\frac12+\\frac58=\\frac98\\). \\(C=\\frac45\\times\\frac32\\times\\frac7{10}=\\frac{21}{25}\\). \\(D=\\frac{11}{15}\\times\\frac34\\div\\frac13=\\frac{11}{20}\\times3=\\frac{33}{20}\\). Dans \\(C\\), multiplication et division sont effectuées de gauche à droite.","\\(A=\\frac56\\times\\frac45=\\frac23\\). \\(B=\\frac12+\\frac58=\\frac98\\). \\(C=\\frac45\\times\\frac32\\times\\frac7{10}=\\frac{21}{25}\\). \\(D=\\frac{11}{15}\\times\\frac34\\div\\frac13=\\frac{11}{20}\\times3=\\frac{33}{20}\\). In \\(C\\), multiplication and division are carried out from left to right."]},{"k":"example","t":["Fractions et expressions fractionnaires","Fractions and fractional expressions"],"b":["Simplifier \\(\\dfrac{x^2-1}{x-1}\\) en précisant le domaine. Peut-on ensuite prendre \\(x=1\\) ?","Simplify \\(\\dfrac{x^2-1}{x-1}\\), stating the domain. Can we then take \\(x=1\\)?"],"a":["Pour \\(x\\ne1\\), \\(\\frac{(x-1)(x+1)}{x-1}=x+1\\). L'expression initiale reste non définie en \\(1\\) ; la simplification ne lève pas la restriction.","For \\(x\\ne1\\), \\(\\frac{(x-1)(x+1)}{x-1}=x+1\\). The original expression remains undefined at \\(1\\); the simplification does not lift the restriction."]},{"k":"concept","t":["Racines carrées et conditions de validité","Square roots and validity conditions"],"b":["Pour \\(a\\geq0\\), \\(\\sqrt a\\) est l'unique nombre positif ou nul dont le carré vaut \\(a\\). Ainsi \\((\\sqrt a)^2=a\\). Pour tout \\(x\\in\\R\\), \\(\\sqrt{x^2}=|x|\\).\nPour \\(a,b\\geq0\\), \\(\\sqrt{ab}=\\sqrt a\\sqrt b\\). Si \\(b&gt;0\\), \\(\\sqrt{a/b}=\\sqrt a/\\sqrt b\\).","For \\(a\\geq0\\), \\(\\sqrt a\\) is the unique positive or zero number whose square is \\(a\\). Thus \\((\\sqrt a)^2=a\\). For every \\(x\\in\\R\\), \\(\\sqrt{x^2}=|x|\\).\nFor \\(a,b\\geq0\\), \\(\\sqrt{ab}=\\sqrt a\\sqrt b\\). If \\(b&gt;0\\), \\(\\sqrt{a/b}=\\sqrt a/\\sqrt b\\)."],"h":["Définition et propriétés","Definition and properties"]},{"k":"proof","t":["Racines carrées et conditions de validité","Square roots and validity conditions"],"b":["Le nombre \\(\\sqrt a\\sqrt b\\) est positif ou nul et son carré vaut \\(ab\\) ; par unicité de la racine carrée positive, il égale \\(\\sqrt{ab}\\). Le même argument appliqué au quotient établit la deuxième formule, sous \\(b&gt;0\\). De même \\(|x|\\geq0\\) et \\(|x|^2=x^2\\), donc \\(\\sqrt{x^2}=|x|\\).","The number \\(\\sqrt a\\sqrt b\\) is positive or zero and its square is \\(ab\\); by uniqueness of the positive square root, it equals \\(\\sqrt{ab}\\). The same argument applied to the quotient establishes the second formula, under \\(b&gt;0\\). Similarly \\(|x|\\geq0\\) and \\(|x|^2=x^2\\), so \\(\\sqrt{x^2}=|x|\\)."]},{"k":"example","t":["Racines carrées et conditions de validité","Square roots and validity conditions"],"b":["Simplifier \\(\\sqrt{18}\\) ; \\(\\sqrt2\\sqrt8\\) ; \\(\\sqrt{7/25}\\) ; \\(\\sqrt{27/75}\\) ; \\(\\sqrt{(-5)^2}\\).","Simplify \\(\\sqrt{18}\\); \\(\\sqrt2\\sqrt8\\); \\(\\sqrt{7/25}\\); \\(\\sqrt{27/75}\\); \\(\\sqrt{(-5)^2}\\)."],"a":["\\(3\\sqrt2\\) ; \\(4\\) ; \\(\\sqrt7/5\\) ; \\(\\sqrt{9/25}=3/5\\) ; \\(5\\).","\\(3\\sqrt2\\) ; \\(4\\) ; \\(\\sqrt7/5\\) ; \\(\\sqrt{9/25}=3/5\\) ; \\(5\\)."]},{"k":"error","t":["Racines carrées et conditions de validité","Square roots and validity conditions"],"b":["Il n'existe pas de règle générale \\(\\sqrt{a+b}=\\sqrt a+\\sqrt b\\). Avec \\(a=4,b=9\\), on aurait à tort \\(\\sqrt{13}=5\\). Dire que ces expressions sont toujours différentes serait aussi faux, par exemple si \\(a=0\\).","There is no general rule \\(\\sqrt{a+b}=\\sqrt a+\\sqrt b\\). With \\(a=4,b=9\\), we would wrongly have \\(\\sqrt{13}=5\\). Saying these expressions are always different would also be wrong, for example if \\(a=0\\)."]},{"k":"example","t":["Racines carrées et conditions de validité","Square roots and validity conditions"],"b":["Simplifier \\(2\\sqrt{18}-\\sqrt{50}+\\sqrt8\\). Encadrer \\(\\sqrt{20}\\) entre deux entiers consécutifs.","Simplify \\(2\\sqrt{18}-\\sqrt{50}+\\sqrt8\\). Bound \\(\\sqrt{20}\\) between two consecutive integers."],"a":["\\(6\\sqrt2-5\\sqrt2+2\\sqrt2=3\\sqrt2\\). Comme \\(16&lt;20&lt;25\\), \\(4&lt;\\sqrt{20}&lt;5\\).","\\(6\\sqrt2-5\\sqrt2+2\\sqrt2=3\\sqrt2\\). Since \\(16&lt;20&lt;25\\), \\(4&lt;\\sqrt{20}&lt;5\\)."]},{"k":"concept","t":["Équations du premier degré","First-degree equations"],"b":["Résoudre une équation, c'est trouver toutes les valeurs de l'inconnue qui vérifient l'égalité. Deux équations sont équivalentes si elles ont les mêmes solutions. Ajouter une même expression ou multiplier par un même nombre non nul conserve l'équivalence.","To solve an equation is to find all the values of the unknown that satisfy the equality. Two equations are equivalent if they have the same solutions. Adding the same expression or multiplying by the same nonzero number preserves equivalence."],"h":["Définition","Definition"]},{"k":"method","t":["Équations du premier degré","First-degree equations"],"b":["Développer si nécessaire, regrouper les termes en \\(x\\), puis isoler \\(x\\). Si son coefficient est nul, examiner l'égalité restante : elle peut être toujours vraie ou impossible. Vérifier dans l'équation de départ.","Expand if necessary, collect the terms in \\(x\\), then isolate \\(x\\). If its coefficient is zero, examine the remaining equality: it may be always true or impossible. Check in the original equation."]},{"k":"example","t":["Équations du premier degré","First-degree equations"],"b":["Résoudre :\n\\[\\begin{aligned}\na)&amp;\\ 5x-3=2x+9,&amp; b)&amp;\\ 3(2x-1)=2(x+4)+7,\\\\\nc)&amp;\\ -2(x+3)=4x-(x-1),&amp;d)&amp;\\ \\frac{x+2}{3}=x-1,\\\\\ne)&amp;\\ \\frac{-5x+5}{8}=-\\frac34,&amp;f)&amp;\\ \\frac{-3x-1}{9}=-\\frac74.\n\\end{aligned}\\]","Solve:\n\\[\\begin{aligned}\na)&amp;\\ 5x-3=2x+9,&amp; b)&amp;\\ 3(2x-1)=2(x+4)+7,\\\\\nc)&amp;\\ -2(x+3)=4x-(x-1),&amp;d)&amp;\\ \\frac{x+2}{3}=x-1,\\\\\ne)&amp;\\ \\frac{-5x+5}{8}=-\\frac34,&amp;f)&amp;\\ \\frac{-3x-1}{9}=-\\frac74.\n\\end{aligned}\\]"],"a":["a) \\(3x=12\\), donc \\(x=4\\). b) \\(6x-3=2x+15\\), donc \\(x=9/2\\). c) \\(-2x-6=3x+1\\), donc \\(x=-7/5\\). d) \\(x+2=3x-3\\), donc \\(x=5/2\\). e) \\(-5x+5=-6\\), donc \\(x=11/5\\). f) \\(4(-3x-1)=-63\\), donc \\(-12x=-59\\) et \\(x=59/12\\).","a) \\(3x=12\\), so \\(x=4\\). b) \\(6x-3=2x+15\\), so \\(x=9/2\\). c) \\(-2x-6=3x+1\\), so \\(x=-7/5\\). d) \\(x+2=3x-3\\), so \\(x=5/2\\). e) \\(-5x+5=-6\\), so \\(x=11/5\\). f) \\(4(-3x-1)=-63\\), so \\(-12x=-59\\) and \\(x=59/12\\)."]},{"k":"example","t":["Équations du premier degré","First-degree equations"],"b":["Résoudre \\(2(x+1)=2x+2\\), puis \\(2(x+1)=2x+3\\).","Solve \\(2(x+1)=2x+2\\), then \\(2(x+1)=2x+3\\)."],"a":["La première se réduit à \\(2=2\\) : \\(S=\\R\\). La seconde donne \\(2=3\\) : \\(S=\\varnothing\\). On ne divise pas par un coefficient nul.","The first reduces to \\(2=2\\): \\(S=\\R\\). The second gives \\(2=3\\): \\(S=\\varnothing\\). We do not divide by a zero coefficient."]},{"k":"concept","t":["Produit nul et équations avec un quotient","Zero-product property and equations with a quotient"],"b":["\\(AB=0\\iff A=0\\) ou \\(B=0\\). Pour \\(B\\ne0\\), \\(A/B=0\\iff A=0\\). Pour résoudre \\(A(x)/B(x)=k\\), imposer d'abord \\(B(x)\\ne0\\), puis résoudre \\(A(x)=kB(x)\\) et écarter les valeurs interdites.","\\(AB=0\\iff A=0\\) or \\(B=0\\). For \\(B\\ne0\\), \\(A/B=0\\iff A=0\\). To solve \\(A(x)/B(x)=k\\), first require \\(B(x)\\ne0\\), then solve \\(A(x)=kB(x)\\) and discard the forbidden values."],"h":["Propriétés","Properties"]},{"k":"example","t":["Produit nul et équations avec un quotient","Zero-product property and equations with a quotient"],"b":["Résoudre \\((4x+6)(3-7x)=0\\) ; \\(3x(-7x+5)=0\\) ; \\(\\dfrac{2x+1}{3x-5}=0\\).","Solve \\((4x+6)(3-7x)=0\\); \\(3x(-7x+5)=0\\); \\(\\dfrac{2x+1}{3x-5}=0\\)."],"a":["Solutions : \\(\\{-3/2;3/7\\}\\) ; \\(\\{0;5/7\\}\\) ; \\(\\{-1/2\\}\\), avec valeur interdite \\(5/3\\) dans le dernier cas.","Solutions: \\(\\{-3/2,3/7\\}\\); \\(\\{0,5/7\\}\\); \\(\\{-1/2\\}\\), with forbidden value \\(5/3\\) in the last case."]},{"k":"example","t":["Produit nul et équations avec un quotient","Zero-product property and equations with a quotient"],"b":["Factoriser puis résoudre \\((1-6x)^2-(1-6x)(2+5x)=0\\) et \\((4x-1)(x+6)+(4x-1)=0\\).","Factorise then solve \\((1-6x)^2-(1-6x)(2+5x)=0\\) and \\((4x-1)(x+6)+(4x-1)=0\\)."],"a":["Première : \\((6x-1)(11x+1)=0\\), donc \\(S=\\{1/6;-1/11\\}\\). Deuxième : \\((4x-1)(x+7)=0\\), donc \\(S=\\{1/4;-7\\}\\).","First: \\((6x-1)(11x+1)=0\\), so \\(S=\\{1/6,-1/11\\}\\). Second: \\((4x-1)(x+7)=0\\), so \\(S=\\{1/4,-7\\}\\)."]},{"k":"example","t":["Produit nul et équations avec un quotient","Zero-product property and equations with a quotient"],"b":["Résoudre \\(\\dfrac{x+1}{x-2}=3\\), puis \\(\\dfrac{x^2-4}{x-2}=4\\).","Solve \\(\\dfrac{x+1}{x-2}=3\\), then \\(\\dfrac{x^2-4}{x-2}=4\\)."],"a":["Dans les deux cas, \\(x\\ne2\\). Première : \\(x+1=3x-6\\), donc \\(x=7/2\\), autorisé. Deuxième : pour \\(x\\ne2\\), le quotient vaut \\(x+2\\) ; l'équation impose \\(x=2\\), interdit. Donc aucune solution.","In both cases, \\(x\\ne2\\). First: \\(x+1=3x-6\\), so \\(x=7/2\\), allowed. Second: for \\(x\\ne2\\), the quotient equals \\(x+2\\); the equation requires \\(x=2\\), forbidden. So no solution."]},{"k":"concept","t":["Équations avec un carré ; isoler une variable","Equations with a square; isolating a variable"],"b":["Dans \\(\\R\\), \\(x^2=a\\) a deux solutions \\(\\pm\\sqrt a\\) si \\(a&gt;0\\), une solution \\(0\\) si \\(a=0\\), et aucune si \\(a&lt;0\\).","In \\(\\R\\), \\(x^2=a\\) has two solutions \\(\\pm\\sqrt a\\) if \\(a&gt;0\\), one solution \\(0\\) if \\(a=0\\), and none if \\(a&lt;0\\)."],"h":["Rappel","Reminder"]},{"k":"example","t":["Équations avec un carré ; isoler une variable","Equations with a square; isolating a variable"],"b":["Résoudre \\(x^2=0\\) ; \\(x^2=-8\\) ; \\(x^2=7\\) ; \\(25x^2=81\\) ; \\((x+2)^2=9\\).","Solve \\(x^2=0\\); \\(x^2=-8\\); \\(x^2=7\\); \\(25x^2=81\\); \\((x+2)^2=9\\)."],"a":["Dans l'ordre : \\(\\{0\\}\\) ; \\(\\varnothing\\) ; \\(\\{-\\sqrt7;\\sqrt7\\}\\) ; \\(\\{-9/5;9/5\\}\\) ; \\(\\{-5;1\\}\\). Pour la dernière, \\(x+2=-3\\) ou \\(x+2=3\\).","In order: \\(\\{0\\}\\); \\(\\varnothing\\); \\(\\{-\\sqrt7,\\sqrt7\\}\\); \\(\\{-9/5,9/5\\}\\); \\(\\{-5,1\\}\\). For the last one, \\(x+2=-3\\) or \\(x+2=3\\)."]},{"k":"method","t":["Équations avec un carré ; isoler une variable","Equations with a square; isolating a variable"],"b":["Décrire les opérations effectuées sur les deux membres ; préciser les conditions qui permettent de diviser ou de prendre une racine carrée.","Describe the operations performed on both sides; state the conditions that allow dividing or taking a square root."],"h":["Isoler une variable dans une formule","Isolating a variable in a formula"]},{"k":"example","t":["Équations avec un carré ; isoler une variable","Equations with a square; isolating a variable"],"b":["Isoler \\(h\\) dans \\(V=\\pi r^2h\\) avec \\(r&gt;0\\) ; isoler \\(v\\) dans \\(E=\\frac12mv^2\\) avec \\(m&gt;0\\), \\(E\\geq0\\) et \\(v\\geq0\\) ; isoler \\(x\\) dans \\(y=ax+b\\) avec \\(a\\ne0\\).","Isolate \\(h\\) in \\(V=\\pi r^2h\\) with \\(r&gt;0\\); isolate \\(v\\) in \\(E=\\frac12mv^2\\) with \\(m&gt;0\\), \\(E\\geq0\\) and \\(v\\geq0\\); isolate \\(x\\) in \\(y=ax+b\\) with \\(a\\ne0\\)."],"a":["\\(h=V/(\\pi r^2)\\). Puis \\(v^2=2E/m\\) ; comme \\(v\\geq0\\), \\(v=\\sqrt{2E/m}\\). Enfin \\(x=(y-b)/a\\). Sans la condition \\(v\\geq0\\), deux signes seraient possibles pour \\(E&gt;0\\).","\\(h=V/(\\pi r^2)\\). Then \\(v^2=2E/m\\); since \\(v\\geq0\\), \\(v=\\sqrt{2E/m}\\). Finally \\(x=(y-b)/a\\). Without the condition \\(v\\geq0\\), two signs would be possible for \\(E&gt;0\\)."]},{"k":"concept","t":["Inégalités et comparaison","Inequalities and comparison"],"b":["On peut additionner des inégalités de même sens : \\(a\\leq b\\), \\(c\\leq d\\Rightarrow a+c\\leq b+d\\). Ajouter un même réel conserve le sens. Multiplier ou diviser par un réel strictement positif conserve le sens ; par un réel strictement négatif, le renverse.\nComparer \\(A\\) et \\(B\\) revient à étudier le signe de \\(A-B\\). Si \\(A,B&gt;0\\), on peut aussi comparer \\(A/B\\) à \\(1\\).","Inequalities of the same direction can be added: \\(a\\leq b\\), \\(c\\leq d\\Rightarrow a+c\\leq b+d\\). Adding the same real number preserves the direction. Multiplying or dividing by a strictly positive real number preserves the direction; by a strictly negative one, it reverses it.\nComparing \\(A\\) and \\(B\\) amounts to studying the sign of \\(A-B\\). If \\(A,B&gt;0\\), one can also compare \\(A/B\\) to \\(1\\)."],"h":["Règles","Rules"]},{"k":"example","t":["Inégalités et comparaison","Inequalities and comparison"],"b":["1. Si \\(x\\leq-4\\), que dire de \\(3x-4\\) ? 2. Si \\(x&gt;-6\\), que dire de \\(2x-3\\) ? 3. Si \\(7\\leq x\\leq16\\) et \\(3\\leq y\\leq12\\), encadrer \\(8x+7y\\). 4. Si \\(-10\\leq x\\leq-6\\), encadrer \\(2x-6\\).","1. If \\(x\\leq-4\\), what can be said about \\(3x-4\\)? 2. If \\(x&gt;-6\\), what can be said about \\(2x-3\\)? 3. If \\(7\\leq x\\leq16\\) and \\(3\\leq y\\leq12\\), bound \\(8x+7y\\). 4. If \\(-10\\leq x\\leq-6\\), bound \\(2x-6\\)."],"a":["1. \\(3x-4\\leq-16\\). 2. \\(2x-3&gt;-15\\). 3. \\(56\\leq8x\\leq128\\) et \\(21\\leq7y\\leq84\\), donc \\(77\\leq8x+7y\\leq212\\). Les bornes sont atteignables. 4. \\(-26\\leq2x-6\\leq-18\\).","1. \\(3x-4\\leq-16\\). 2. \\(2x-3&gt;-15\\). 3. \\(56\\leq8x\\leq128\\) and \\(21\\leq7y\\leq84\\), so \\(77\\leq8x+7y\\leq212\\). The bounds are attainable. 4. \\(-26\\leq2x-6\\leq-18\\)."]},{"k":"example","t":["Inégalités et comparaison","Inequalities and comparison"],"b":["Résoudre \\(3x+1\\geq x-7\\) ; \\(2x-11\\leq4x-5\\) ; \\(6x+19\\leq2x-3\\).","Solve \\(3x+1\\geq x-7\\); \\(2x-11\\leq4x-5\\); \\(6x+19\\leq2x-3\\)."],"a":["1. \\(2x\\geq-8\\), soit \\([-4;+\\infty[\\). 2. \\(-6\\leq2x\\), soit \\([-3;+\\infty[\\). 3. \\(4x\\leq-22\\), soit \\(]-\\infty;-11/2]\\).","1. \\(2x\\geq-8\\), that is \\([-4,+\\infty)\\). 2. \\(-6\\leq2x\\), that is \\([-3,+\\infty)\\). 3. \\(4x\\leq-22\\), that is \\((-\\infty,-11/2]\\)."]},{"k":"concept","t":["Signe d'une expression affine et d'un produit","Sign of an affine expression and of a product"],"b":["Pour \\(a\\ne0\\), \\(ax+b\\) s'annule en \\(x_0=-b/a\\) ; son signe à droite est celui de \\(a\\), à gauche l'opposé. Si \\(a=0\\), le signe est celui de la constante \\(b\\). Pour un produit, multiplier les signes des facteurs.","For \\(a\\ne0\\), \\(ax+b\\) vanishes at \\(x_0=-b/a\\); its sign to the right is that of \\(a\\), to the left the opposite. If \\(a=0\\), the sign is that of the constant \\(b\\). For a product, multiply the signs of the factors."],"h":["Propriété","Property"]},{"k":"example","t":["Signe d'une expression affine et d'un produit","Sign of an affine expression and of a product"],"b":["Dresser les tableaux de signes de \\(3-x\\), \\(2x-6\\), puis \\(P(x)=(2x-6)(x+1)\\).","Draw the sign tables of \\(3-x\\), \\(2x-6\\), then \\(P(x)=(2x-6)(x+1)\\)."],"a":["Les deux expressions affines s'annulent en \\(3\\) : \\(3-x\\) est positif à gauche, négatif à droite ; \\(2x-6\\) a les signes inverses.\ncenter tabularc|ccccccc\n\\(x\\)&amp;\\(-\\infty\\)&amp;&amp;\\(-1\\)&amp;&amp;\\(3\\)&amp;&amp;\\(+\\infty\\)<br>\n\\(2x-6\\)&amp;&amp;\\(-\\)&amp;\\(-\\)&amp;\\(-\\)&amp;\\(0\\)&amp;\\(+\\)&amp;<br>\n\\(x+1\\)&amp;&amp;\\(-\\)&amp;\\(0\\)&amp;\\(+\\)&amp;\\(+\\)&amp;\\(+\\)&amp;<br>\n\\(P(x)\\)&amp;&amp;\\(+\\)&amp;\\(0\\)&amp;\\(-\\)&amp;\\(0\\)&amp;\\(+\\)&amp;\ntabularcenter","Both affine expressions vanish at \\(3\\): \\(3-x\\) is positive on the left, negative on the right; \\(2x-6\\) has the opposite signs.\ncenter tabularc|ccccccc\n\\(x\\)&amp;\\(-\\infty\\)&amp;&amp;\\(-1\\)&amp;&amp;\\(3\\)&amp;&amp;\\(+\\infty\\)<br>\n\\(2x-6\\)&amp;&amp;\\(-\\)&amp;\\(-\\)&amp;\\(-\\)&amp;\\(0\\)&amp;\\(+\\)&amp;<br>\n\\(x+1\\)&amp;&amp;\\(-\\)&amp;\\(0\\)&amp;\\(+\\)&amp;\\(+\\)&amp;\\(+\\)&amp;<br>\n\\(P(x)\\)&amp;&amp;\\(+\\)&amp;\\(0\\)&amp;\\(-\\)&amp;\\(0\\)&amp;\\(+\\)&amp;\ntabularcenter"]},{"k":"example","t":["Signe d'une expression affine et d'un produit","Sign of an affine expression and of a product"],"b":["Résoudre \\((7+3x)(2x+6)&gt;0\\).","Solve \\((7+3x)(2x+6)&gt;0\\)."],"a":["Les zéros sont \\(-7/3\\) et \\(-3\\), à ranger \\(-3&lt;-7/3\\). Le produit est positif à l'extérieur de ces racines et négatif entre elles. L'inégalité est stricte : \\(S=]-\\infty;-3[\\cup]-7/3;+\\infty[\\).","The zeros are \\(-7/3\\) and \\(-3\\), to be ordered \\(-3&lt;-7/3\\). The product is positive outside these roots and negative between them. The inequality is strict: \\(S=(-\\infty,-3)\\cup(-7/3,+\\infty)\\)."]},{"k":"method","t":["Signe d'un quotient et synthèse algorithmique","Sign of a quotient and algorithmic synthesis"],"b":["Chercher les valeurs interdites, puis les zéros du numérateur. Ranger toutes les valeurs critiques et appliquer la règle des signes. Sur la ligne du quotient, une double barre indique une valeur interdite.","Find the forbidden values, then the zeros of the numerator. Order all the critical values and apply the sign rule. On the quotient row, a double bar indicates a forbidden value."]},{"k":"example","t":["Signe d'un quotient et synthèse algorithmique","Sign of a quotient and algorithmic synthesis"],"b":["Dresser le tableau de signes de \\(Q(x)=\\dfrac{-4x+6}{x-3}\\), puis résoudre \\(\\dfrac{2x-1}{-4x+3}\\leq0\\).","Draw the sign table of \\(Q(x)=\\dfrac{-4x+6}{x-3}\\), then solve \\(\\dfrac{2x-1}{-4x+3}\\leq0\\)."],"a":["Pour \\(Q\\), zéro \\(3/2\\), interdit \\(3\\). Signes : négatif sur \\(]-\\infty;3/2[\\), nul en \\(3/2\\), positif sur \\(]3/2;3[\\), non défini en \\(3\\), négatif sur \\(]3;+\\infty[\\).\nPour la seconde expression, zéro \\(1/2\\), interdit \\(3/4\\). Les signes sont \\(-,+,-\\) sur les trois intervalles. Ainsi \\(S=]-\\infty;1/2]\\cup]3/4;+\\infty[\\).","For \\(Q\\), zero \\(3/2\\), forbidden \\(3\\). Signs: negative on \\((-\\infty,3/2)\\), zero at \\(3/2\\), positive on \\((3/2,3)\\), undefined at \\(3\\), negative on \\((3,+\\infty)\\).\nFor the second expression, zero \\(1/2\\), forbidden \\(3/4\\). The signs are \\(-,+,-\\) on the three intervals. Thus \\(S=(-\\infty,1/2]\\cup(3/4,+\\infty)\\)."]},{"k":"code","t":["Python","Python"],"b":["def premiere_puissance(seuil):\n    # seuil reel &gt;= 1\n    n, p = 0, 1\n    while p &lt;= seuil:\n        n = n+1\n        p = 2*p\n    return n, p","def premiere_puissance(seuil):\n    # seuil reel &gt;= 1\n    n, p = 0, 1\n    while p &lt;= seuil:\n        n = n+1\n        p = 2*p\n    return n, p"]},{"k":"example","t":["Signe d'un quotient et synthèse algorithmique","Sign of a quotient and algorithmic synthesis"],"b":["Que renvoie <code>premiere_puissance(100)<\/code> ? Quel lien reste vrai entre <code>p<\/code> et <code>n<\/code> à chaque étape ? Comment tester ensuite le signe d'un nombre en Python ?","What does <code>premiere_puissance(100)<\/code> return? What relation between <code>p<\/code> and <code>n<\/code> stays true at each step? How can the sign of a number then be tested in Python?"],"a":["Le résultat est \\((7;128)\\). L'invariant est \\(p=2^n\\), vrai à l'initialisation puis conservé. Pour le signe, tester d'abord <code>x &gt; 0<\/code>, puis <code>x &lt; 0<\/code>, sinon \\(x=0\\). Ne pas remplacer l'inégalité large de la boucle par une stricte sans modifier le problème posé.","The result is \\((7,128)\\). The invariant is \\(p=2^n\\), true at initialisation and then preserved. For the sign, first test <code>x &gt; 0<\/code>, then <code>x &lt; 0<\/code>, otherwise \\(x=0\\). Do not replace the loop's non-strict inequality by a strict one without changing the problem posed."]}],"figureVersion":"e3b0c44298fc1c14"},"figs":{}};</script>

// A camera is independent of the mathematical parameters. Moving an object never changes it.
function camera2D() {
  const c = { scale: 1, x: 0, y: 0 };
  c.project = ([x,y]) => [c.x+c.scale*x,c.y+c.scale*y];
  c.unproject = ([x,y]) => [(x-c.x)/c.scale,(y-c.y)/c.scale];
  c.zoomAt = (factor,[x,y]) => { const p=c.unproject([x,y]); c.scale=Math.max(.2,Math.min(12,c.scale*factor)); c.x=x-p[0]*c.scale;c.y=y-p[1]*c.scale; };
  c.reset=()=>{c.scale=1;c.x=c.y=0;};return c;
}
function navigationButtons(host,action,lang='fr') {
  const bar=document.createElement('output');bar.className='canvas-navigation';bar.hidden=true;

}
function canvasNavigation(c,g,size,redraw,{host=c.parentElement,lang=document.documentElement.lang,canPan=()=>false}={}) {
  const camera=camera2D(),rawClear=g.clearRect.bind(g);let last=null,gesture=null;

  const apply=()=>{const [w]=size(),d=c.width/w;g.setTransform(d*camera.scale,0,0,d*camera.scale,d*camera.x,d*camera.y);};
  g.clearRect=()=>{g.save();g.setTransform(1,0,0,1,0,0);rawClear(0,0,c.width,c.height);g.restore();apply();};
  const refresh=()=>{apply();bar.update(camera.scale);redraw();};
  const action=id=>{const [w,h]=size();if(id==='reset')camera.reset();else if(id==='in'||id==='out')camera.zoomAt(id==='in'?1.25:.8,[w/2,h/2]);else{const d={left:[40,0],right:[-40,0],up:[0,40],down:[0,-40]}[id];camera.x+=d[0];camera.y+=d[1];}refresh();};
  const bar=navigationButtons(host,action,lang);c.style.touchAction='none';if(c.tabIndex<0)c.tabIndex=0;
  const down=e=>{if(e.pointerType==='touch')pointers.set(e.pointerId,point(e));if(pointers.size===2){const a=[...pointers.values()];gesture={distance:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),mid:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]};c.dispatchEvent(new CustomEvent('view-gesture'));}if(gesture||e.button===1||e.altKey||e.shiftKey||canPan(camera.unproject(point(e)))){if(!gesture)last=point(e);c.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopImmediatePropagation();}};
  const move=e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,point(e));if(gesture&&pointers.size===2){const a=[...pointers.values()],mid=[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);camera.zoomAt(d/Math.max(1,gesture.distance),gesture.mid);camera.x+=mid[0]-gesture.mid[0];camera.y+=mid[1]-gesture.mid[1];gesture={distance:d,mid};refresh();e.preventDefault();e.stopImmediatePropagation();}else if(last){const q=point(e);camera.x+=q[0]-last[0];camera.y+=q[1]-last[1];last=q;refresh();e.preventDefault();e.stopImmediatePropagation();}};
  const end=e=>{const handled=!!last||!!gesture;pointers.delete(e.pointerId);last=null;if(pointers.size<2)gesture=null;if(handled){e.preventDefault();e.stopImmediatePropagation();}};
  const wheel=e=>{e.preventDefault();e.stopImmediatePropagation();camera.zoomAt(Math.exp(-e.deltaY*.005),point(e));refresh();};
  const key=e=>{const arrows={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(e.shiftKey&&arrows[e.key]){e.preventDefault();e.stopImmediatePropagation();action(arrows[e.key]);return;}if(['+','=','-','0'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();action(e.key==='0'?'reset':e.key==='-'?'out':'in');}};
  const events=[['pointerdown',down],['pointermove',move],['pointerup',end],['pointercancel',end],['wheel',wheel],['dblclick',()=>action('reset')],['keydown',key]];

}
// Changing viewBox preserves the inverse screen transform used by the SVG editors for picking.
function svgNavigation(svg,{lang=document.documentElement.lang,host=svg.parentElement,state={},canPan=()=>false}={}) {

  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}


function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
