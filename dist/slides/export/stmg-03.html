h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}

.text{line-height:1.45;overflow-wrap:anywhere}

.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}

#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}

  #live{max-height:none}
}

<script>window.__MX_EXPORT__={"deck":{"id":"stmg-03","course":"stmg","number":3,"title":["Fonction logarithme décimal","The common logarithm"],"slides":[{"k":"title","t":["Fonction logarithme décimal","Common logarithm function"],"b":["",""]},{"k":"concept","t":["Cours de référence","Reference notes"],"b":["Pour tout \\(b&gt;0\\), \\(\\log(b)\\) est l'unique réel \\(x\\) tel que \\(10^x=b\\). Ainsi \\(\\log(10^x)=x\\) et, pour \\(b&gt;0\\), \\(10^{\\log(b)}=b\\). La fonction \\(\\log\\) est définie sur \\(]0,+\\infty[\\) et elle est strictement croissante.","For every \\(b&gt;0\\), \\(\\log(b)\\) is the unique real number \\(x\\) such that \\(10^x=b\\). Hence \\(\\log(10^x)=x\\) and, for \\(b&gt;0\\), \\(10^{\\log(b)}=b\\). The function \\(\\log\\) is defined on \\(]0,+\\infty[\\) and it is strictly increasing."]},{"k":"error","t":["Cours de référence","Reference notes"],"b":["\\(\\log(a+b)\\) ne se simplifie pas. Avant tout calcul logarithmique, vérifier que chaque argument est strictement positif.","\\(\\log(a+b)\\) does not simplify. Before any logarithmic calculation, check that each argument is strictly positive."]},{"k":"method","t":["Cours de référence","Reference notes"],"b":["Pour résoudre \\(a^x=b\\), avec \\(a&gt;0\\), \\(a\\neq1\\) et \\(b&gt;0\\), on prend le logarithme : \\(x\\log(a)=\\log(b)\\), donc \\(x=\\dfrac{\\log(b)}{\\log(a)}\\).","To solve \\(a^x=b\\), with \\(a&gt;0\\), \\(a\\neq1\\) and \\(b&gt;0\\), take the logarithm: \\(x\\log(a)=\\log(b)\\), so \\(x=\\dfrac{\\log(b)}{\\log(a)}\\)."]},{"k":"example","t":["Cours de référence","Reference notes"],"b":["Résoudre \\(1{,}08^x=2\\) revient à écrire \\(x=\\dfrac{\\log(2)}{\\log(1{,}08)}\\approx9{,}01\\). Une valeur multipliée chaque année par \\(1{,}08\\) double donc après un peu plus de neuf ans.","Solving \\(1.08^x=2\\) amounts to writing \\(x=\\dfrac{\\log(2)}{\\log(1.08)}\\approx9.01\\). A value multiplied by \\(1.08\\) each year therefore doubles after a little more than nine years."]},{"k":"goals","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["<ul><li>Relier puissance de 10 et logarithme.<li>Calculer des valeurs usuelles.<li>Utiliser la calculatrice.<\/ul>","<ul><li>Link powers of 10 and logarithms.<li>Calculate common values.<li>Use the calculator.<\/ul>"]},{"k":"activity","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["Compléter les couples \\(10^x=b\\) et \\(x=\\log(b)\\) pour \\(b=0{,}001;0{,}1;1;10;1\\,000\\). Puis utiliser la calculatrice pour \\(b=7\\).<br><br>","Complete the pairs \\(10^x=b\\) and \\(x=\\log(b)\\) for \\(b=0.001;0.1;1;10;1{,}000\\). Then use the calculator for \\(b=7\\).<br><br>"]},{"k":"concept","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["Pour \\(b&gt;0\\), \\(\\log(b)\\) est l'unique solution de \\(10^x=b\\). En particulier \\(\\log(1)=0\\), \\(\\log(10)=1\\) et \\(\\log(100)=2\\).","For \\(b&gt;0\\), \\(\\log(b)\\) is the unique solution of \\(10^x=b\\). In particular \\(\\log(1)=0\\), \\(\\log(10)=1\\) and \\(\\log(100)=2\\)."]},{"k":"example","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask quick students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Sens de variation et représentation","Variations and graph"],"b":["<ul><li>Connaître le domaine.<li>Utiliser la croissance.<li>Lire la courbe.<\/ul>","<ul><li>Know the domain.<li>Use the fact that the function is increasing.<li>Read the curve.<\/ul>"]},{"k":"activity","t":["Sens de variation et représentation","Variations and graph"],"b":["Tracer \\(y=10^x\\) et la droite \\(y=x\\), puis obtenir la courbe du logarithme par symétrie. En déduire son domaine, son sens de variation et l'asymptote.","Plot \\(y=10^x\\) and the line \\(y=x\\), then obtain the curve of the logarithm by symmetry. Deduce its domain, its direction of variation and its asymptote."],"f":[[2,2]]},{"k":"concept","t":["Sens de variation et représentation","Variations and graph"],"b":["La fonction \\(\\log\\) est définie sur \\(]0,+\\infty[\\), strictement croissante, et sa courbe admet \\(x=0\\) comme asymptote verticale.","The function \\(\\log\\) is defined on \\(]0,+\\infty[\\), is strictly increasing, and its curve has \\(x=0\\) as a vertical asymptote."]},{"k":"example","t":["Sens de variation et représentation","Variations and graph"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Sens de variation et représentation","Variations and graph"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask quick students to produce a counterexample, a justification or a second method."]},{"k":"widget","t":["Fonction à explorer","Function explorer"],"b":["Choisissez le modèle, puis déplacez les points pour lire paramètres et propriétés.","Pick the model, then drag the points to read parameters and properties."],"w":{"type":"fn","mode":"log","modes":["log"]}},{"k":"goals","t":["Propriétés algébriques","Algebraic properties"],"b":["<ul><li>Développer ou condenser des logarithmes.<li>Vérifier les conditions.<li>Éviter les fausses propriétés.<\/ul>","<ul><li>Expand or condense logarithms.<li>Check the conditions.<li>Avoid false properties.<\/ul>"]},{"k":"activity","t":["Propriétés algébriques","Algebraic properties"],"b":["À partir de \\(10^2\\times10^3=10^5\\), conjecturer \\(\\log(ab)=\\log a+\\log b\\). Tester numériquement avec \\(a=2,b=5\\), puis expliquer pourquoi \\(a,b\\) doivent être positifs.<br><br>","Starting from \\(10^2\\times10^3=10^5\\), conjecture \\(\\log(ab)=\\log a+\\log b\\). Test numerically with \\(a=2,b=5\\), then explain why \\(a,b\\) must be positive.<br><br>"]},{"k":"concept","t":["Propriétés algébriques","Algebraic properties"],"b":["Pour \\(a,b&gt;0\\), \\(\\log(ab)=\\log a+\\log b\\) et \\(\\log\\!\\left(\\dfrac ab\\right)=\\log a-\\log b\\). De plus \\(\\log(a^n)=n\\log a\\).","For \\(a,b&gt;0\\), \\(\\log(ab)=\\log a+\\log b\\) and \\(\\log\\!\\left(\\dfrac ab\\right)=\\log a-\\log b\\). Moreover \\(\\log(a^n)=n\\log a\\)."]},{"k":"example","t":["Propriétés algébriques","Algebraic properties"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Propriétés algébriques","Algebraic properties"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask quick students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["<ul><li>Résoudre \\(10^x=b\\).<li>Encadrer une solution.<li>Interpréter un ordre de grandeur.<\/ul>","<ul><li>Solve \\(10^x=b\\).<li>Bracket a solution.<li>Interpret an order of magnitude.<\/ul>"]},{"k":"activity","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["Un appareil mesure des intensités \\(b=0{,}04;3{,}2;850\\). Pour chaque valeur, résoudre \\(10^x=b\\), donner \\(x\\) au centième et vérifier en calculant \\(10^x\\).<br><br>","A device measures intensities \\(b=0.04;3.2;850\\). For each value, solve \\(10^x=b\\), give \\(x\\) to the nearest hundredth and check by calculating \\(10^x\\).<br><br>"]},{"k":"concept","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["L'équation \\(10^x=b\\) n'a de solution que si \\(b&gt;0\\) ; cette solution est \\(x=\\log(b)\\).","The equation \\(10^x=b\\) has a solution only if \\(b&gt;0\\); this solution is \\(x=\\log(b)\\)."]},{"k":"example","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact s","Equations \\(x^a=b\\) and simple inequalities"],"b":["<ul><li>Résoudre une puissance inconnue.<li>Traiter une inégalité.<li>Tenir compte du domaine.<\/ul>","<ul><li>Solve equations where the variable is the base.<li>Deal with an inequality.<li>Take the domain into account.<\/ul>"]},{"k":"activity","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["Résoudre sur \\([0,+\\infty[\\) : \\(x^3=40\\), puis \\(x^4=16\\). Résoudre ensuite \\(1{,}08^x&lt;1{,}5\\) et expliquer le rôle de la croissance.<br><br>","Solve on \\([0,+\\infty[\\): \\(x^3=40\\), then \\(x^4=16\\). Then solve \\(1.08^x&lt;1.5\\) and explain the role of the function being increasing.<br><br>"]},{"k":"concept","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["Pour résoudre \\(x^n=b\\), tenir compte du domaine et de la parité de \\(n\\). Pour une inégalité exponentielle, le sens dépend de la croissance ou décroissance de la fonction.","To solve \\(x^n=b\\), take the domain and the parity of \\(n\\) into account. For an exponential inequality, the direction depends on whether the function is increasing or decreasing."]},{"k":"example","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d' }
// ---- mathematics: normalise the deck TeX to the skill's rules before MathJax sees it
const SUB = "₀₁₂₃₄₅₆₇₈₉", SUP = { "²": "2", "³": "3" };
const MATH_ANY = /\\\((.*?)\\\)|\\\[(.*?)\\\]/gs;
// Fractions are always \dfrac; French intervals and lists take a thin space before ";" (entities such as &lt; are left alone).
const fixTeX = t => {
  t = t.replace(/\\frac(?![A-Za-z])/g, "\\dfrac");
  if (!lang) t = t.replace(/(\\[,;]|\\text\{[^}]*\}|&[a-z]+;)|;/g, (m, keep) => keep || "\\,;");
  return t;
};
// Unicode sub/superscripts in prose become TeX: x₁ -> \(x_1\).
const uniMath = h => h.replace(/([A-Za-z])([₀-₉]+|[²³])/g, (_, v, u) => `\\(${v}${SUP[u] ? "^" + SUP[u] : "_{" + [...u].map(c => SUB.indexOf(c)).join("") + "}"}\\)`);
// \begin{array}{c|c} ... \hline ... \end{array} is an HTML <table> with CSS rules (MathJax array rules do not render reliably).
const arrayTable = (spec, body) => {
  const cols = []; let rule = false;
  for (const c of spec) { if (c === "|") { if (cols.length) cols[cols.length - 1].r = true; else rule = true; } else cols.push({ l: rule, r: false }), rule = false; }
  const rows = []; let top = false;
  for (let row of body.split(/\\\\/)) {
    let line = false; row = row.replace(/\\hline/g, () => { line = true; return ""; });
    if (!row.trim()) { if (line) top = true; continue; }
    rows.push({ cells: row.split("&amp;").map(c => c.trim()), top: top || line }); top = false;
  }
  const tr = rows.map((r, i) => `<tr${r.top && i ? ' class="rule"' : ""}>${r.cells.map((c, j) => `<td${cols[j]?.l ? ' class="l"' : ""}${cols[j]?.r ? ' class="r"' : ""}>${c ? `\\(${c}\\)` : ""}</td>`).join("")}</tr>`).join("");
  return `<table class="sg">${tr}</table>`;
};
const tex = s => {
  s = s.replace(/\\\[\s*\\begin\{array\}\{([^}]*)\}([\s\S]*?)\\end\{array\}\s*\\\]/g, (_, spec, body) => arrayTable(spec, fixTeX(body)));
  s = s.replace(MATH_ANY, (m, a, b) => (a !== undefined ? `\\(${fixTeX(a)}\\)` : `\\[${fixTeX(b)}\\]`));
  s = s.split(/(\\\(.*?\\\)|\\\[.*?\\\]|<table[\s\S]*?<\/table>)/gs).map((part, i) => (i % 2 ? part : uniMath(part))).join("");
  return lang ? s.replace(/\\pgcd/g, "\\gcd").replace(/\\ppcm/g, "\\operatorname{lcm}") : s;
};
const plain = s => String(s).replace(/\\\((.*?)\\\)/g, (_, t) => t.replace(/\\[a-zA-Z]+\s?/g, "").replace(/[{}]/g, ""));

// Text nodes come back from the DOM decoded ("<" for &lt;): escape them again before they are re-parsed.
const escText = x => x.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Cumulative reveal: one block per sentence, list item, paragraph or table, shown step by step.
function revealMarkup(html) {
  const template = document.createElement("template"); template.innerHTML = html;
  const parts = []; let pending = "";
  const flush = () => { if (pending.trim()) parts.push(pending); pending = ""; };
  for (const node of template.content.childNodes) {
    if (node.nodeType === 1 && ["UL", "OL"].includes(node.tagName)) {
      flush(); [...node.children].forEach((li, i) => parts.push(`<${node.tagName.toLowerCase()} ${node.tagName === "OL" ? `start="${i + 1}"` : ""}>${li.outerHTML}</${node.tagName.toLowerCase()}>`));
    } else if (node.nodeType === 3) {
      const text = node.textContent; let start = 0, math = false;
      for (let i = 0; i < text.length; i++) {
        if (text.slice(i, i + 2) === "\\(" || text.slice(i, i + 2) === "\\[") math = true;
        if (text.slice(i, i + 2) === "\\)" || text.slice(i, i + 2) === "\\]") math = false;
        if (!math && text[i] === "." && /^\s+[A-ZÀ-Ý]/.test(text.slice(i + 1))) { pending += escText(text.slice(start, i + 1)); flush(); start = i + 1; }
      }
      pending += escText(text.slice(start));
    } else if (node.nodeType === 1) {
      if (node.tagName === "BR") flush(); else if (["P", "DIV", "TABLE", "PRE"].includes(node.tagName)) { flush(); parts.push(node.outerHTML); } else pending += node.outerHTML;
    }
  }
  flush(); return (parts.length ? parts : [html]).map((part, i) => `<div class="reveal-block" data-reveal="${i + 1}">${part}</div>`).join("");
}

const blocks = () => [...document.querySelectorAll("#flow [data-reveal]")];
function paintSteps() {
  const all = blocks();
  all.forEach((b, i) => { b.hidden = i >= step; });
  const n = Math.max(all.length, 1);
  $("#step-count").textContent = all.length ? `${t("step")} ${Math.min(step, n)} / ${n}` : "";
  $("#step-prev").disabled = step <= 1 && index === 0; $("#step-next").disabled = step >= n && index === deck.slides.length - 1;
  $("#all-steps").classList.toggle("on", all.length > 0 && step >= all.length && all.length > 1);
  $("#all-steps").hidden = all.length < 2;
  if (typeof MathJax !== "undefined" && $("#flow").querySelector("mjx-container")) fitMath();
}
function advance(direction) {
  const n = blocks().length;
  if (direction > 0 && step < n) { step++; paintSteps(); const b = blocks()[step - 1]; b?.scrollIntoView({ block: "nearest", behavior: "instant" }); }
  else if (direction < 0 && step > 1) { step--; paintSteps(); }
  else go(index + direction, direction < 0);
}

function companion(spec, showDelta) {
  if (live) { live.destroy?.(); live = null; }
  $("#live").hidden = false; $("#live-lab").textContent = t("liveLab");
  live = mount({ ...spec, showDelta }, { host: $("#wcanvas"), controls: $("#wctl"), readout: $("#readout"), hint: $("#whint"), lang });
}

function figSrc(deckKey, name) { const file = `${deckKey}-${name}${lang ? "-en" : ""}.svg`; return EXPORT ? EXPORT.figs[file] || "" : `./fig/${encodeURIComponent(file)}`; }

async function render() {
  const renderId = ++generation;
  if (live) { live.destroy?.(); live = null; }
  const s = deck.slides[index], k = s.k, label = KIND[k]?.[lang] || k;
  document.documentElement.lang = lang ? "en" : "fr";
  document.title = `${plain(deck.title[lang])} · Maths Explorer`;
  const title = esc(s.t[lang]), rawBody = tex(s.b[lang] || "");
  const widgets = deck.slides.filter(x => x.k === "widget"), shared = widgets[0];
  const ans = s.a ? tex(s.a[lang]) : "";
  const figs = (s.f || []).map(p => `<figure class="fig"><img src="${figSrc(deckId, p[lang])}" alt="${esc(plain(s.t[lang]))}"></figure>`).join("");
  const mode = k === "title" || k === "code" ? "none" : k === "widget" ? "widget" : figs ? "fig" : shared && k !== "goals" ? "explore" : "none";
  const col = $("#col"), flow = $("#flow"), rt = $("#rt");
  col.dataset.kind = k;
  $("#live").hidden = true; $("#readout").innerHTML = "";

  if (k === "title") {
    flow.innerHTML = `<div class="title-slide"><span class="chip">${esc(COURSE[deck.course] || "")}</span><h1>${title}</h1><div class="meta">${deck.slides.length} ${t("slides")}</div><div class="hint">${t("hint")}</div></div>`;
  } else if (k === "code") {
    flow.innerHTML = `<div class="hd">${esc(label)}</div><h2 class="tt">${title}</h2><pre>${s.b[lang]}</pre>`;
  } else {
    const cls = sizeClass(rawBody + ans);
    flow.innerHTML = `<div class="hd ${k === "error" ? "red" : ""}"><span>${esc(label)}</span><span class="deckname">${esc(deck.title[lang])}</span></div><h2 class="tt">${title}</h2>${s.h?.[lang] ? `<div class="sub">${esc(s.h[lang])}</div>` : ""}<div class="steps text ${cls}">${revealMarkup(rawBody)}</div>${ans ? `<div class="answer text ${cls}" id="ans" ${revealed ? "" : "hidden"}><div class="hd green">${t("answerLab")}</div>${ans}</div>` : ""}`;
  }

  if (mode === "fig") rt.innerHTML = `<div class="figcol">${figs}</div>`;
  else if (mode === "widget" || mode === "explore") {
    rt.innerHTML = `<div class="hint-line" id="whint"></div><div class="canvas-wrap" id="wcanvas"></div>${mode === "explore" ? `<label class="explore-label">${t("explore")}<select id="explore-choice">${widgets.map((w, i) => `<option value="${i}">${esc(plain(w.t[lang]))}</option>`).join("")}</select></label><p class="note">${t("free")}</p>` : ""}<div class="wctl" id="wctl"></div>`;
  } else rt.innerHTML = "";

  chrome();
  figHidden = false; layout(mode);
  try { history.replaceState(null, "", EXPORT ? `#${index}` : `?deck=${encodeURIComponent(deckId)}&lang=${lang ? "en" : "fr"}#${index}`); } catch {}
  // Formulas first: the widget readouts are typeset as they are written, so MathJax must be ready before they mount.
  let ready = true;
  try {
    if (typeof MathJax === "undefined") throw new Error("MathJax");
    await MathJax.startup.promise; await document.fonts.load('400 25px "STIX Two Text"');
  } catch (e) { ready = false; console.warn(e); if (renderId === generation) toast(t("noMath")); }
  if (renderId !== generation) return;
  const defined = deck.slides.findIndex(x => x.k === "concept" && /Discriminant/.test(x.t[0]));
  if (mode === "widget") companion(s.w, true);
  else if (mode === "explore") {
    companion(shared.w, defined < 0 || index >= defined);
    $("#explore-choice").onchange = e => companion(widgets[+e.target.value].w, true);
  }
  paintSteps(); flow.scrollTop = 0;
  if (ready) {
    try { await MathJax.typesetPromise([$("#stage")]); $("#stage").querySelectorAll("mjx-assistive-mml").forEach(x => x.remove()); } catch (e) { console.warn(e); }
    if (renderId !== generation) return;
    fitMath();
    // A figure that is only an exploration aid gives way when an equation needs the whole width.
    if (mode === "explore" && needsWidth()) { figHidden = true; layout(mode); fitMath(); }
  }
}

// ---- layout: the flow column is 520 px wide beside a figure, 1200 px without one
let figHidden = false;
function layout(mode) {
  const wide = mode === "none" || (mode === "explore" && figHidden);
  $("#col").className = wide ? "wide" : ""; $("#rt").hidden = wide;
  const tg = $("#tg"); tg.hidden = mode !== "explore"; tg.setAttribute("aria-pressed", String(!figHidden)); tg.textContent = t("figure");
}
// Shrink any formula wider than the column so that nothing is cut off or needs sideways scrolling (never below MIN_SCALE).
const MIN_SCALE = .5;
function fitMath() {
  const flow = $("#flow"), avail = flow.clientWidth - 4;
  flow.querySelectorAll("mjx-container").forEach(m => { m.style.fontSize = ""; });
  flow.querySelectorAll("mjx-container").forEach(m => {
    if (!m.offsetParent) return;
    const svg = m.querySelector("svg"); if (!svg) return;
    const room = m.getAttribute("display") === "true" ? Math.min(avail, m.parentElement.clientWidth || avail) : avail;
    const w = svg.getBoundingClientRect().width / (flow.getBoundingClientRect().width / flow.offsetWidth);
    if (w > room) m.style.fontSize = Math.max(MIN_SCALE, room / w) * 100 + "%";
  });
}
function needsWidth() {
  return [...$("#flow").querySelectorAll("mjx-container")].some(m => m.offsetParent && m.querySelector("svg") && m.scrollWidth > m.clientWidth + 2 || m.offsetParent && m.style.fontSize && parseFloat(m.style.fontSize) <= MIN_SCALE * 100 + 1);
}

function chrome() {
  const s = deck.slides[index], n = deck.slides.length;
  $("#count").textContent = `${index + 1} / ${n}`;
  $("#pv").disabled = index === 0; $("#nx").disabled = index === n - 1;
  $("#pv").setAttribute("aria-label", t("prev")); $("#nx").setAttribute("aria-label", t("next"));
  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lng").textContent = t("lang"); $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));
  const dl = $("#dl"); if (dl) { dl.href = `./export/${encodeURIComponent(deckId)}.html`; dl.setAttribute("download", `${deckId}.html`); dl.textContent = "⬇ HTML"; dl.title = t("downloadTip"); dl.setAttribute("aria-label", t("downloadTip")); }
  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}
function setLang(v) { lang = v; try { localStorage.setItem("me-slides-lang", lang ? "en" : "fr"); } catch {} buildDrawer(); render(); }

function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lng").onclick = () => setLang(lang ? 0 : 1);
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "l" || k === "L") setLang(lang ? 0 : 1);
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
</html>
