<style>
/* Classroom slide player, design v3 "Cahier" (docs/DESIGN_V3.md): the tokens are the site's (styles/explorer.css), Jour by

   Colour carries meaning: --accent = the object studied and focus, --pos = true / valid, --neg = warning. Sharp corners, borders not shadows. */

:root,:root[data-theme="jour"]{color-scheme:light;--bg:#ffffff;--surface:#ffffff;--sunken:#f2f2f2;--ink:#000000;--ink-2:#1f1f1f;--muted:#595959;--line:#cdcdcd;--line-strong:#6e6e6e;--grid:#ececec;--accent:#d90012;--accent-ink:#ffffff;--accent-soft:#fff0f1;--obj2:#000000;--obj3:#8a8a8a;--pos:#0a7a43;--pos-soft:#e1f3ea;--neg:#b3000f;--neg-soft:#fbe7e5;--c1:#2563eb;--c2:#e8710a;--c3:#0f9d58;--c4:#c2185b;--c5:#7b1fa2;--c6:#00838f;--c7:#b8860b;--c8:#d84315}
:root[data-theme="nuit"]{color-scheme:dark;--bg:#0a0a0a;--surface:#121212;--sunken:#1b1b1b;--ink:#ffffff;--ink-2:#dcdcdc;--muted:#a3a3a3;--line:#333333;--line-strong:#808080;--grid:#202020;--accent:#ff5560;--accent-ink:#000000;--accent-soft:#3a1316;--obj2:#f2f2f2;--obj3:#9a9a9a;--pos:#5fd0a0;--pos-soft:#12301f;--neg:#ff8a80;--neg-soft:#3a1714;--c1:#7aa2ff;--c2:#ffa94d;--c3:#5fd0a0;--c4:#ff7eb6;--c5:#c9a6ff;--c6:#4dd0e1;--c7:#ffd54f;--c8:#ff8a65}
:root{--display:"Schibsted Grotesk",var(--ui);--ui:"Schibsted Grotesk",var(--ui);--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;--math:"STIX Two Text","Times New Roman",serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--body)}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:64px;width:520px;height:596px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--ink);font:700 21px var(--display);letter-spacing:.01em}
.hd>span:first-child{border-left:5px solid var(--accent);padding-left:10px}
.hd.red{color:var(--neg)}.hd.red>span:first-child{border-left-color:var(--neg)}.hd.green{color:var(--pos);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-family:var(--display);font-weight:700;line-height:1.15;letter-spacing:-.01em}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--pos);padding:6px 0 6px 16px;background:var(--pos-soft)}
pre{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:700 16px var(--ui);color:var(--bg);background:var(--ink);border-left:6px solid var(--accent);padding:6px 14px;border-radius:0}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--line);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

/* A table wider than the text column scrolls inside it instead of widening the column (a table that fits looks the same). */
.sg{border-collapse:collapse;margin:8px 0;max-width:100%;display:block;overflow-x:auto}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
/* Dense lists of observations keep each value intact inside the text column. */
.sg:has(tr > td:nth-child(12)) td{padding-inline:4px;white-space:nowrap}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:64px;width:640px;height:596px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px var(--ui);color:var(--ink-2);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:370px;background:var(--surface);border:1px solid var(--line);border-radius:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px var(--ui);max-width:70%;height:44px;border-radius:0;padding:0 8px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line-strong)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--accent);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px var(--ui);height:44px;min-width:40px;padding:0 10px;border:1.5px solid var(--line-strong);border-radius:0;background:var(--surface);color:var(--ink);cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#ffffff;border:1px solid var(--line-strong);border-radius:0;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 18px var(--ui);height:44px;min-width:44px;padding:0 14px;border-radius:0;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b:hover{border-color:var(--ink)}
.b.on,.b[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#r1{position:absolute;left:40px;top:668px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px var(--ui);min-width:96px;text-align:center}
.count{font:600 18px var(--ui);min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:668px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
#prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
#drawer{position:absolute;left:600px;top:64px;width:640px;height:596px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:10px;z-index:5}
#drawer button{display:block;width:100%;min-height:44px;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px var(--ui);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--accent);border-left-width:5px;color:var(--ink)}
#toast{position:absolute;left:600px;top:64px;width:640px;text-align:center;font:600 16px var(--ui);color:var(--bg);background:var(--ink);border-radius:0;padding:8px 12px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  .sg:has(tr > td:nth-child(12)) td{min-width:0;padding-inline:1px;font-size:16px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px var(--ui)}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:0;color:var(--ink);background:var(--surface);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}

/* laboratory experiments in a slide ({type:"lab"}, site/js/lab/shell.js mode "slide"): the canvas fills the widget host, the
   controls, the answer area and the mission stepper sit in #wctl, the formula and the readout in #readout, the prompt in the hint line */
.canvas-wrap.lab2-canvas-host{height:320px}
.lab2-stage{position:absolute;inset:0}
.lab2-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.lab2-handle{position:absolute;left:0;top:0;width:44px;height:44px;padding:0;border:0;border-radius:0;background:transparent;pointer-events:none}
.lab2-handle:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.hint-line.lab2-hint{height:auto;min-height:22px;max-height:84px;overflow:auto;white-space:normal;font-size:18px;line-height:1.3;outline:0}
.lab2-slide{width:100%}
.lab2-slide .lab2-card{display:flex;flex-direction:column;gap:8px;width:100%}
.lab2-stepper{display:flex;align-items:center;gap:10px}
.lab2-step-label{font:600 18px var(--ui);color:var(--muted)}
.lab2-kind{color:var(--ink);margin-left:4px}
.lab2-controls{display:grid;gap:8px}
.lab2-ctl{display:grid;gap:4px}
.lab2-ctl.is-locked{opacity:.45}
.lab2-ctl-label{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.lab2-ctl input[type=range]{width:100%}
.lab2-segments,.lab2-variants{display:flex;flex-wrap:wrap;gap:6px}
.lab2-segment.is-on,.lab2-variant[aria-pressed=true]{background:var(--ink)!important;color:var(--bg)!important}
.lab2-options,.lab2-answer{display:grid;gap:6px}
.wctl .lab2-option,.wctl .lab2-variant{height:auto;min-height:44px;padding:6px 12px;text-align:left;white-space:normal;font-size:17px}
.lab2-option[aria-pressed=true]{background:var(--ink)!important;color:var(--bg)!important}
.lab2-check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab2-check input[type=text]{height:44px;width:130px;border-radius:0;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0 8px;font:600 17px var(--ui)}
.lab2-check label{font-size:17px}
.lab2-feedback{margin:0;font:600 17px/1.3 var(--ui)}.lab2-feedback:empty{display:none}
.lab2-feedback[data-tone=good]{color:var(--pos)}.lab2-feedback[data-tone=warn]{color:var(--neg)}
.lab2-reveal{border-left:4px solid var(--pos);padding:4px 0 4px 12px;font-size:17px;line-height:1.35}
.lab2-recall,.lab2-note{margin:0;color:var(--muted);font-size:16px}
.lab2-hintbox summary{cursor:pointer;color:var(--ink);text-decoration:underline;font:600 16px var(--ui)}.lab2-hintbox p{margin:4px 0 0;font-size:16px}
.wctl .lab2-restart{height:44px;background:transparent;color:var(--muted);text-decoration:underline;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab2-formula{margin:0 0 6px;font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.lab2-readout{display:grid;gap:3px;margin:0}
.lab2-readout>div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lab2-readout dt{color:var(--muted);font-size:16px}
.lab2-readout dd{margin:0;font-size:21px}

/* Keep the complete mission readable while the parameter controls scroll below the fixed figure. */
.hint-line.lab2-hint{flex:0 0 auto;max-height:none;overflow:visible}
.lab2-slide[data-experiment="quadratic"] .lab2-controls{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.lab2-slide[data-experiment="quadratic"] [data-control="form"]{grid-column:1 / -1}
@media(max-width:760px) and (orientation:portrait){
  .lab2-slide[data-experiment="quadratic"] .lab2-controls{grid-template-columns:1fr}
}

/* persistent bar: leave the deck (Retour, Accueil), the deck name, the theme. Always visible, never over the content. */
#bar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 40px;background:var(--surface);border-bottom:1px solid var(--line);z-index:6}
#bar .b{height:44px;gap:8px;font-size:17px}
#bar .b svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
#bar-title{flex:1 1 auto;min-width:0;margin:0 12px;font:700 17px var(--display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#bar-title small{font:400 15px var(--body);color:var(--muted);margin-left:10px}
#bar .sp{flex:1}
#theme[aria-pressed=true]{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
@media (max-width:760px) and (orientation:portrait){
  #bar{position:sticky;top:0;margin:-16px -16px 0;padding:0 12px;width:auto;height:56px;gap:6px}
  #bar .b{padding:0 10px}
  #bar{order:-2}#bar-title{display:none}
  #r1,#r2{flex-wrap:wrap}
}
</style>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Terminale STMG","Terminale STMG"],"id":"stmg-03","course":"stmg","number":3,"title":["Fonction logarithme décimal","The common logarithm"],"slides":[{"k":"title","t":["Fonction logarithme décimal","The common logarithm"],"b":["",""]},{"k":"concept","t":["Cours de référence","Reference notes"],"b":["Pour tout \\(b&gt;0\\), \\(\\log(b)\\) est l'unique réel \\(x\\) tel que \\(10^x=b\\). Ainsi \\(\\log(10^x)=x\\) et, pour \\(b&gt;0\\), \\(10^{\\log(b)}=b\\). La fonction \\(\\log\\) est définie sur \\(]0,+\\infty[\\) et elle est strictement croissante.","For every \\(b&gt;0\\), \\(\\log(b)\\) is the unique real number \\(x\\) such that \\(10^x=b\\). Hence \\(\\log(10^x)=x\\) and, for \\(b&gt;0\\), \\(10^{\\log(b)}=b\\). The function \\(\\log\\) is defined on \\(]0,+\\infty[\\) and it is strictly increasing."]},{"k":"error","t":["Cours de référence","Reference notes"],"b":["\\(\\log(a+b)\\) ne se simplifie pas. Avant tout calcul logarithmique, vérifier que chaque argument est strictement positif.","\\(\\log(a+b)\\) does not simplify. Before any logarithmic calculation, check that each argument is strictly positive."]},{"k":"method","t":["Cours de référence","Reference notes"],"b":["Pour résoudre \\(a^x=b\\), avec \\(a&gt;0\\), \\(a\\neq1\\) et \\(b&gt;0\\), on prend le logarithme : \\(x\\log(a)=\\log(b)\\), donc \\(x=\\dfrac{\\log(b)}{\\log(a)}\\).","To solve \\(a^x=b\\), with \\(a&gt;0\\), \\(a\\neq1\\) and \\(b&gt;0\\), take the logarithm: \\(x\\log(a)=\\log(b)\\), so \\(x=\\dfrac{\\log(b)}{\\log(a)}\\)."]},{"k":"example","t":["Cours de référence","Reference notes"],"b":["Résoudre \\(1{,}08^x=2\\) revient à écrire \\(x=\\dfrac{\\log(2)}{\\log(1{,}08)}\\approx9{,}01\\). Une valeur multipliée chaque année par \\(1{,}08\\) double donc après un peu plus de neuf ans.","Solving \\(1.08^x=2\\) amounts to writing \\(x=\\dfrac{\\log(2)}{\\log(1.08)}\\approx9.01\\). A value multiplied by \\(1.08\\) each year therefore doubles after a little more than nine years."]},{"k":"goals","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["<ul><li>Relier puissance de 10 et logarithme.<li>Calculer des valeurs usuelles.<li>Utiliser la calculatrice.<\/ul>","<ul><li>Link powers of 10 and logarithms.<li>Calculate common values.<li>Use the calculator.<\/ul>"]},{"k":"activity","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["Compléter les couples \\(10^x=b\\) et \\(x=\\log(b)\\) pour \\(b=0{,}001;0{,}1;1;10;1\\,000\\). Puis utiliser la calculatrice pour \\(b=7\\).<br><br>","Complete the pairs \\(10^x=b\\) and \\(x=\\log(b)\\) for \\(b=0.001;0.1;1;10;1{,}000\\). Then use the calculator for \\(b=7\\).<br><br>"]},{"k":"concept","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["Pour \\(b&gt;0\\), \\(\\log(b)\\) est l'unique solution de \\(10^x=b\\). En particulier \\(\\log(1)=0\\), \\(\\log(10)=1\\) et \\(\\log(100)=2\\).","For \\(b&gt;0\\), \\(\\log(b)\\) is the unique solution of \\(10^x=b\\). In particular \\(\\log(1)=0\\), \\(\\log(10)=1\\) and \\(\\log(100)=2\\)."]},{"k":"example","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Définition du logarithme décimal","Definition of the common logarithm"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 35 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast finishers to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Sens de variation et représentation","Variations and graph"],"b":["<ul><li>Connaître le domaine.<li>Utiliser la croissance.<li>Lire la courbe.<\/ul>","<ul><li>Know the domain.<li>Use the fact that the function is increasing.<li>Read the curve.<\/ul>"]},{"k":"activity","t":["Sens de variation et représentation","Variations and graph"],"b":["Tracer \\(y=10^x\\) et la droite \\(y=x\\), puis obtenir la courbe du logarithme par symétrie. En déduire son domaine, son sens de variation et l'asymptote.","Plot \\(y=10^x\\) and the line \\(y=x\\), then obtain the curve of the logarithm by symmetry. Deduce its domain, its direction of variation and its asymptote."],"f":[[2,2]]},{"k":"concept","t":["Sens de variation et représentation","Variations and graph"],"b":["La fonction \\(\\log\\) est définie sur \\(]0,+\\infty[\\), strictement croissante, et sa courbe admet \\(x=0\\) comme asymptote verticale.","The function \\(\\log\\) is defined on \\(]0,+\\infty[\\), is strictly increasing, and its curve has \\(x=0\\) as a vertical asymptote."]},{"k":"example","t":["Sens de variation et représentation","Variations and graph"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Sens de variation et représentation","Variations and graph"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 35 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast finishers to produce a counterexample, a justification or a second method."]},{"k":"widget","t":["Fonction à explorer","Function explorer"],"b":["Choisissez le modèle, puis déplacez les points pour lire paramètres et propriétés.","Pick the model, then drag the points to read parameters and properties."],"w":{"type":"fn","mode":"log","modes":["log"]}},{"k":"goals","t":["Propriétés algébriques","Algebraic properties"],"b":["<ul><li>Développer ou condenser des logarithmes.<li>Vérifier les conditions.<li>Éviter les fausses propriétés.<\/ul>","<ul><li>Expand or condense logarithms.<li>Check the conditions.<li>Avoid false properties.<\/ul>"]},{"k":"activity","t":["Propriétés algébriques","Algebraic properties"],"b":["À partir de \\(10^2\\times10^3=10^5\\), conjecturer \\(\\log(ab)=\\log a+\\log b\\). Tester numériquement avec \\(a=2,b=5\\), puis expliquer pourquoi \\(a,b\\) doivent être positifs.<br><br>","Starting from \\(10^2\\times10^3=10^5\\), conjecture \\(\\log(ab)=\\log a+\\log b\\). Test numerically with \\(a=2,b=5\\), then explain why \\(a,b\\) must be positive.<br><br>"]},{"k":"concept","t":["Propriétés algébriques","Algebraic properties"],"b":["Pour \\(a,b&gt;0\\), \\(\\log(ab)=\\log a+\\log b\\) et \\(\\log\\!\\left(\\dfrac ab\\right)=\\log a-\\log b\\). De plus \\(\\log(a^n)=n\\log a\\).","For \\(a,b&gt;0\\), \\(\\log(ab)=\\log a+\\log b\\) and \\(\\log\\!\\left(\\dfrac ab\\right)=\\log a-\\log b\\). Moreover \\(\\log(a^n)=n\\log a\\)."]},{"k":"example","t":["Propriétés algébriques","Algebraic properties"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Propriétés algébriques","Algebraic properties"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 35 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast finishers to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["<ul><li>Résoudre \\(10^x=b\\).<li>Encadrer une solution.<li>Interpréter un ordre de grandeur.<\/ul>","<ul><li>Solve \\(10^x=b\\).<li>Bracket a solution.<li>Interpret an order of magnitude.<\/ul>"]},{"k":"activity","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["Un appareil mesure des intensités \\(b=0{,}04;3{,}2;850\\). Pour chaque valeur, résoudre \\(10^x=b\\), donner \\(x\\) au centième et vérifier en calculant \\(10^x\\).<br><br>","A device measures intensities \\(b=0.04;3.2;850\\). For each value, solve \\(10^x=b\\), give \\(x\\) to the nearest hundredth and check by calculating \\(10^x\\).<br><br>"]},{"k":"concept","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["L'équation \\(10^x=b\\) n'a de solution que si \\(b&gt;0\\) ; cette solution est \\(x=\\log(b)\\).","The equation \\(10^x=b\\) has a solution only if \\(b&gt;0\\); this solution is \\(x=\\log(b)\\)."]},{"k":"example","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Résoudre \\(10^x=b\\)","Solving \\(10^x=b\\)"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 35 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast finishers to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Résoudre \\(a^x=b\\)","Solving \\(a^x=b\\)"],"b":["<ul><li>Résoudre \\(a^x=b\\).<li>Utiliser un quotient de logarithmes.<li>Arrondir avec sens.<\/ul>","<ul><li>Solve \\(a^x=b\\).<li>Use a quotient of logarithms.<li>Round sensibly.<\/ul>"]},{"k":"activity","t":["Résoudre \\(a^x=b\\)","Solving \\(a^x=b\\)"],"b":["Le nombre d'abonnés est multiplié par \\(1{,}15\\) chaque mois. Déterminer au bout de combien de mois il aura triplé. Poser l'équation, la résoudre avec les logarithmes et interpréter l'arrondi.<br><br>","The number of subscribers is multiplied by \\(1.15\\) each month. Determine after how many months it will have tripled. Set up the equation, solve it using logarithms and interpret the rounding.<br><br>"]},{"k":"concept","t":["Résoudre \\(a^x=b\\)","Solving \\(a^x=b\\)"],"b":["Pour \\(a&gt;0\\), \\(a\\neq1\\) et \\(b&gt;0\\), \\(a^x=b\\) équivaut à \\(x=\\dfrac{\\log(b)}{\\log(a)}\\).","For \\(a&gt;0\\), \\(a\\neq1\\) and \\(b&gt;0\\), \\(a^x=b\\) is equivalent to \\(x=\\dfrac{\\log(b)}{\\log(a)}\\)."]},{"k":"example","t":["Résoudre \\(a^x=b\\)","Solving \\(a^x=b\\)"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Résoudre \\(a^x=b\\)","Solving \\(a^x=b\\)"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 35 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast finishers to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["<ul><li>Résoudre une puissance inconnue.<li>Traiter une inégalité.<li>Tenir compte du domaine.<\/ul>","<ul><li>Solve equations where the variable is the base.<li>Deal with an inequality.<li>Take the domain into account.<\/ul>"]},{"k":"activity","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["Résoudre sur \\([0,+\\infty[\\) : \\(x^3=40\\), puis \\(x^4=16\\). Résoudre ensuite, pour \\(x\\) réel, \\(1{,}08^x&lt;1{,}5\\) et expliquer le rôle de la croissance.<br><br>","Solve on \\([0,+\\infty[\\): \\(x^3=40\\), then \\(x^4=16\\). Then, for a real \\(x\\), solve \\(1.08^x&lt;1.5\\) and explain the role of the increase.<br><br>"]},{"k":"concept","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["Pour résoudre \\(x^n=b\\), tenir compte du domaine et de la parité de \\(n\\). Pour une inégalité exponentielle, le sens dépend de la croissance ou décroissance de la fonction.","To solve \\(x^n=b\\), take the domain and the parity of \\(n\\) into account. For an exponential inequality, the direction depends on whether the function is increasing or decreasing."]},{"k":"example","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Équations \\(x^a=b\\) et inégalités simples","Equations \\(x^a=b\\) and simple inequalities"],"b":["<b>Condui .","In a problem, define the variable, set up the equation, solve, check the domain and conclude with the unit. A numerical solution without interpretation is incomplete."]},{"k":"example","t":["Problèmes contextualisés","Problems in context"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Problèmes contextualisés","Problems in context"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>1 h session:<\/b> 7 min of fluency; 10 min of pooling and written record; 35 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>2 h session:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast finishers to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Bilan et évaluation","Review and assessment"],"b":["<ul><li>Synthétiser les méthodes.<li>Identifier les conditions.<li>Remédier aux erreurs.<\/ul>","<ul><li>Summarise the methods.<li>Identify the conditions.<li>Correct mistakes.<\/ul>"]},{"k":"activity","t":["Bilan et évaluation","Review and assessment"],"b":["Réaliser une carte de méthodes : domaine ; propriétés ; équations \\(10^x=b\\) ; équations \\(a^x=b\\) ; inégalités. Associer à chaque branche une condition et un exemple.<br><br>","Make a map of methods: domain; properties; equations \\(10^x=b\\); equations \\(a^x=b\\); inequalities. Attach a condition and an example to each branch.<br><br>"]},{"k":"concept","t":["Bilan et évaluation","Review and assessment"],"b":["Avant un calcul de logarithme : vérifier la positivité. Avant une comparaison : identifier le sens de variation. Avant une conclusion : contrôler la vraisemblance.","Before calculating a logarithm: check positivity. Before a comparison: identify the direction of variation. Before a conclusion: check that the result is plausible."]},{"k":"example","t":["Bilan et évaluation","Review and assessment"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Revisit the data from the investigation and write up the solution in order: definition of the objects, property used, exact or approximate calculation, then a concluding sentence. The model answer appears in the teacher edition."]},{"k":"method","t":["Bilan et évaluation","Review and assessment"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 35 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapi   // Complex plane, same scale on both axes. Modes: alg (drag z: parts, conjugate, z times its conjugate), polar (drag z:

  // Quadratic equation with real coefficients, built from its roots: drag z1; off the real axis its conjugate is the

  cquad(o) {
    const z1 = [1, 2]; let x2 = -1; const v = () => iso(o, 4);
    return {
      handles() {
        const V = v(), h = [{ x: V.X(z1[0]), y: V.Y(z1[1]), cur: "grab", move(X, Y) { z1[0] = clamp(snap(V.iX(X), .25), -3.5, 3.5); const y = clamp(snap(V.iY(Y), .25), -3.5, 3.5); z1[1] = Math.abs(y) < .15 ? 0 : y; } }];

  // n-th roots of a complex number a: drag a (modulus and argument snap), choose n. The roots form a regular polygon

  // Residues modulo n on a clock: drag a around the clock, set n. Mode powers: the successive powers of a (period, and

    const geo = () => { const cx = o.W / 2, cy = o.H / 2 + 6, R = Math.min(o.W, o.H) / 2 - 46; return { cx, cy, R, at: k => [cx + R * Math.sin(2 * Math.PI * k / n), cy - R * Math.cos(2 * Math.PI * k / n)] }; };

  // Walks in the bush-taxi graph of the activity (A-B, A-C, A-D, B-C, C-D, D-E): drag the start and end markers onto
  // vertices and choose the length k; the entry of M^k counts the walks, as the adjacency-matrix theorem states.
  walks(o) {
    const names = ["A", "B", "C", "D", "E"], pos = [[.22, .3], [.5, .12], [.5, .55], [.22, .78], [.82, .78]], E = [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 4]];

    const mul = (A, B) => A.map(row => B[0].map((_, c) => row.reduce((s, x, t) => s + x * B[t][c], 0)));
    const at = q => [40 + pos[q][0] * (o.W - 80), 30 + pos[q][1] * (o.H - 60)];
    const near = (X, Y) => pos.map((_, q) => [Math.hypot(at(q)[0] - X, at(q)[1] - Y), q]).sort((u, w) => u[0] - w[0])[0][1];

      draw(g) {

        g.save(); g.strokeStyle = C.axis; g.lineWidth = 3; E.forEach(([p, q]) => { g.beginPath(); g.moveTo(...at(p)); g.lineTo(...at(q)); g.stroke(); }); g.restore();
        names.forEach((s, q) => { const [x, y] = at(q); g.save(); g.fillStyle = q === i || q === j ? C.ink : C.grid; g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 17, 0, 7); g.fill(); g.stroke(); g.restore(); text(g, inl(s), x, y + 8, q === i || q === j ? C.bg : C.ink, 18, "center"); });
        const [xi, yi] = at(i), [xj, yj] = at(j); dot(o, xi - 18, yi - 18, C.acc, o.pair("départ", "start"), "grab", true, -1); dot(o, xj + 18, yj + 18, C.warn, o.pair("arrivée", "end"));

        set(o, lines(o.pair(`Chaînes de longueur ${inl(String(k))} de ${inl(I)} à ${inl(J)} : ${inl(String(n))}`, `Walks of length ${inl(String(k))} from ${inl(I)} to ${inl(J)}: ${inl(String(n))}`),
          o.pair(`C'est le coefficient ${inl(`\\left(M^{${k}}\\right)_{${I}${J}}=${n}`)} de la matrice d'adjacence.`, `It is the entry ${inl(`\\left(M^{${k}}\\right)_{${I}${J}}=${n}`)} of the adjacency matrix.`),
          o.pair(`Ligne ${inl(I)} de ${inl(`M^{${k}}`)} : ${inl(`\\begin{pmatrix}${row}\\end{pmatrix}`)}`, `Row ${inl(I)} of ${inl(`M^{${k}}`)}: ${inl(`\\begin{pmatrix}${row}\\end{pmatrix}`)}`)));

  // Two-state Markov chain: drag the initial probability a0 = P(X0 = 1) and the transition probabilities p (1 to 2) and
  // q (2 to 1). The plot shows a_n = P(Xn = 1), which tends to q/(p+q) since a_n - l = (1-p-q)^n (a_0 - l).
  markov(o) {
    let a0 = .9, p = .3, q = .2; const bx = 70, rows = [[34, "a_0"], [86, "p"], [138, "q"]];
    const vplot = () => ({ x0: 70, x1: o.W - 30, y0: 190, y1: o.H - 34 }), bw = () => o.W - 100;
    return {
      handles() { return rows.map(([y], k) => ({ x: bx + [a0, p, q][k] * bw(), y: y + 13, cur: "ew-resize", move(X) { const val = clamp(snap((X - bx) / bw(), .05), k ? .05 : 0, 1); if (k === 0) a0 = val; else if (k === 1) p = val; else q = val; } })); },
      draw(g) {

        rows.forEach(([y, s], k) => { const val = [a0, p, q][k]; g.fillStyle = C.grid; g.fillRect(bx, y, B, 26); g.fillStyle = C.acc; g.fillRect(bx, y, val * B, 26); text(g, inl(`${s}=${N(val)}`), 12, y + 20, C.ink, 16); dot(o, bx + val * B, y + 13, C.warn); });
        g.save(); g.strokeStyle = C.axis; g.lineWidth = 1.5; g.beginPath(); g.moveTo(F.x0, F.y0); g.lineTo(F.x0, F.y1); g.lineTo(F.x1, F.y1); g.stroke(); g.setLineDash([6, 5]); g.strokeStyle = C.blue; g.beginPath(); g.moveTo(F.x0, Y(l)); g.lineTo(F.x1, Y(l)); g.stroke(); g.restore();
        text(g, "1", F.x0 - 8, Y(1) + 6, C.muted, 14, "right"); text(g, "0", F.x0 - 8, Y(0) + 6, C.muted, 14, "right"); text(g, inl("\\ell"), F.x1 - 4, Y(l) - 8, C.blue, 16, "right"); text(g, inl("n"), F.x1, F.y1 + 24, C.muted, 16, "right");
        let a = a0; g.save(); g.fillStyle = C.acc; for (let t = 0; t <= n; t++) { g.beginPath(); g.arc(X(t), Y(a), 5, 0, 7); g.fill(); a = a * (1 - p) + (1 - a) * q; } g.restore();
        const an = l + (1 - p - q) ** n * (a0 - l), osc = Math.abs(p + q - 2) < 1e-9; // p = q = 1: T swaps the states, no limit
        set(o, lines(inl(`T=\\begin{pmatrix}${N(1 - p)}&${N(p)}\\\\${N(q)}&${N(1 - q)}\\end{pmatrix},\\quad \\pi_{n+1}=\\pi_nT`),
          o.pair(`Avec ${inl("\\pi_n=\\begin{pmatrix}a_n&1-a_n\\end{pmatrix}")} : ${inl(`a_{n+1}=${N(1 - p - q)}\\,a_n+${N(q)}`)}`, `With ${inl("\\pi_n=\\begin{pmatrix}a_n&1-a_n\\end{pmatrix}")}: ${inl(`a_{n+1}=${N(1 - p - q)}\\,a_n+${N(q)}`)}`),
          osc ? o.pair(`${inl("p+q=2")} : ${inl("(a_n)")} alterne entre ${inl(N(a0))} et ${inl(N(1 - a0))}, elle n'a pas de limite (sauf si ${inl("a_0=0{,}5")}). La loi ${inl("\\pi=\\begin{pmatrix}0{,}5&0{,}5\\end{pmatrix}")} reste invariante.`, `${inl("p+q=2")}: ${inl("(a_n)")} alternates between ${inl(N(a0))} and ${inl(N(1 - a0))}; it has no limit (unless ${inl("a_0=0.5")}). The distribution ${inl("\\pi=\\begin{pmatrix}0.5&0.5\\end{pmatrix}")} stays invariant.`) :
          o.pair(`Limite ${inl(`\\ell=\\dfrac{q}{p+q}=${N(l, 3)}`)} ; état stable ${inl(`\\pi=\\begin{pmatrix}${N(l, 3)}&${N(1 - l, 3)}\\end{pmatrix}`)}`, `Limit ${inl(`\\ell=\\dfrac{q}{p+q}=${N(l, 3)}`)}; stable state ${inl(`\\pi=\\begin{pmatrix}${N(l, 3)}&${N(1 - l, 3)}\\end{pmatrix}`)}`),
          inl(`a_{${n}}=\\ell+(${N(1 - p - q)})^{${n}}(a_0-\\ell)\\approx${N(an, 4)}`)));

  // Two-way table as a mosaic: the width of each row band is its share of the total, the split inside a band is the
  // conditional frequency of B in that row. Drag the row boundary and the two splits; the table, the marginal and the
  // conditional frequencies (both directions) follow. Counts are whole numbers out of a total chosen with the slider.
  twoway(o) {
    let n = o.spec.n || 200, rA = .45, pA = .7, pN = .3;   // share of A, f(B | A), f(B | not A)
    const lab = o.spec.labels || ["A", "\\overline{A}", "B", "\\overline{B}"];
    slider(o, o.pair("Effectif total", "Total count"), 40, 600, 20, n, v => { n = v; o.redraw(); });
    const box = () => ({ x: 70, y: 46, w: o.W - 140, h: o.H - 120 });
    const counts = () => { const nA = Math.round(n * rA), nN = n - nA, a = Math.round(nA * pA), c = Math.round(nN * pN); return { a, b: nA - a, c, d: nN - c, nA, nN }; };
    return {
      handles() {
        const B = box(), hA = B.h * rA;
        return [
          { x: B.x + B.w / 2, y: B.y + hA, cur: "ns-resize", move(_, Y) { rA = clamp(snap((Y - B.y) / B.h, .01), .1, .9); } },
          { x: B.x + B.w * pA, y: B.y + hA / 2, cur: "ew-resize", move(X) { pA = clamp(snap((X - B.x) / B.w, .01), .02, .98); } },
          { x: B.x + B.w * pN, y: B.y + hA + (B.h - hA) / 2, cur: "ew-resize", move(X) { pN = clamp(snap((X - B.x) / B.w, .01), .02, .98); } },
        ];
      },
      draw(g) {

        const cell = (x, y, w, h, col, val) => { g.fillStyle = col; g.globalAlpha = .78; g.fillRect(x, y, w, h); g.globalAlpha = 1; g.strokeStyle = C.bg; g.lineWidth = 3; g.strokeRect(x, y, w, h); if (w > 40 && h > 30) text(g, String(val), x + w / 2, y + h / 2 + 8, C.bg, 22, "center"); };
        cell(B.x, B.y, B.w * pA, hA, C.acc, k.a); cell(B.x + B.w * pA, B.y, B.w * (1 - pA), hA, C.blue, k.b);
        cell(B.x, B.y + hA, B.w * pN, B.h - hA, C.acc, k.c); cell(B.x + B.w * pN, B.y + hA, B.w * (1 - pN), B.h - hA, C.blue, k.d);
        text(g, inl(lab[0]), B.x - 14, B.y + hA / 2 + 8, C.ink, 20, "right"); text(g, inl(lab[1]), B.x - 14, B.y + hA + (B.h - hA) / 2 + 8, C.ink, 20, "right");
        text(g, inl(lab[2]), B.x + 8, B.y - 14, C.acc, 20); text(g, inl(lab[3]), B.x + B.w - 8, B.y - 14, C.blue, 20, "right");
        // the overall share of B, as a dashed line: compare it with the two conditional splits
        const fB = (k.a + k.c) / n; g.save(); g.setLineDash([6, 6]); g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(B.x + B.w * fB, B.y - 6); g.lineTo(B.x + B.w * fB, B.y + B.h + 6); g.stroke(); g.restore();
        text(g, inl(`f(${lab[2]})`), B.x + B.w * fB, B.y + B.h + 30, C.ink, 18, "center");
        [[B.x + B.w / 2, B.y + hA, C.ink], [B.x + B.w * pA, B.y + hA / 2, C.ink], [B.x + B.w * pN, B.y + hA + (B.h - hA) / 2, C.ink]].forEach(([x, y, col]) => dot(o, x, y, col));
        const fr = (p, q) => (q ? `\\tfrac{${p}}{${q}}\\approx ${N(p / q, 3)}` : "?");
        const tab = `\\begin{array}{c|cc|c}&${lab[2]}&${lab[3]}&\\text{Total}\\\\\\hline ${lab[0]}&${k.a}&${k.b}&${k.nA}\\\\${lab[1]}&${k.c}&${k.d}&${k.nN}\\\\\\hline\\text{Total}&${k.a + k.c}&${k.b + k.d}&${n}\\end{array}`;
        set(o, lines(inl(tab), o.pair("Fréquences marginales : ", "Marginal frequencies: ") + inl(`f(${lab[0]})=${fr(k.nA, n)}`) + " ; " + inl(`f(${lab[2]})=${fr(k.a + k.c, n)}`),
          o.pair("Conditionnelles : ", "Conditional: ") + inl(`f_{${lab[0]}}(${lab[2]})=${fr(k.a, k.nA)}`) + " ; " + inl(`f_{${lab[1]}}(${lab[2]})=${fr(k.c, k.nN)}`),
          o.pair("Dans l’autre sens : ", "The other way round: ") + inl(`f_{${lab[2]}}(${lab[0]})=${fr(k.a, k.a + k.c)}`),
          Math.abs(k.a / (k.nA || 1) - k.c / (k.nN || 1)) < .015 ? o.pair("Les deux conditionnelles sont presque égales : les caractères semblent indépendants.", "The two conditional frequencies are almost equal: the variables look independent.") : ""));
      },
    };
  },

  // Sign of a product or a quotient of two affine functions: drag the root of each line along the x-axis and the
  // slope point; the sign table below the graph is rebuilt from the two roots and the two slopes.
  signtable(o) {
    let r1 = -2, a1 = 1, r2 = 1.5, a2 = -.5, mode = o.spec.mode || "product";
    choice(o, [["product", o.pair("Produit", "Product"), o.pair("Produit", "Product")], ["quotient", o.pair("Quotient", "Quotient"), o.pair("Quotient", "Quotient")]], mode, m => { mode = m; o.redraw(); });
    const v = () => { const w = o.W - 72, h = o.H * .55, k = w / h; return { ...view(o, -5 * k / 1.6, 5 * k / 1.6, -5, 5), Y: y => 24 + (5 - y) / 10 * h, iY: Y => 5 - (Y - 24) / h * 10 }; };
    const aff = (r, a) => x => a * (x - r);
    return {
      handles() {
        const V = v();
        return [[() => r1, x => (r1 = x), () => a1, x => (a1 = x)], [() => r2, x => (r2 = x), () => a2, x => (a2 = x)]].flatMap(([r, sr, a, sa]) => [
          { x: V.X(r()), y: V.Y(0), cur: "ew-resize", move(X) { sr(clamp(snap(V.iX(X), .25), V.x0 + .5, V.x1 - .5)); } },
          { x: V.X(r() + 1), y: V.Y(clamp(a(), -4.8, 4.8)), cur: "ns-resize", move(_, Y) { let t = clamp(snap(V.iY(Y), .25), -4.75, 4.75); if (Math.abs(t) < .25) t = t < 0 ? -.25 : .25; sa(t); } },
        ]);
      },
      draw(g) {

        curve(g, V, prod ? x => f(x) * h(x) : x => f(x) / h(x), V.x0, V.x1, C.muted, 2);
        curve(g, V, f, V.x0, V.x1, C.acc, 3); curve(g, V, h, V.x0, V.x1, C.blue, 3); g.restore();
        dot(o, V.X(r1), V.Y(0), C.acc); dot(o, V.X(r1 + 1), V.Y(clamp(a1, -4.8, 4.8)), C.acc, inl("f"));
        dot(o, V.X(r2), V.Y(0), C.blue); dot(o, V.X(r2 + 1), V.Y(clamp(a2, -4.8, 4.8)), C.blue, inl("g"));
        // sign table (bottom part)
        const top = V.Y(-5) + 18, rowH = (o.H - top - 10) / 4, x0 = 120, x1 = o.W - 30, roots = [...new Set([r1, r2])].sort((p, q) => p - q);
        const cols = [-Infinity, ...roots, Infinity], X = i => x0 + (x1 - x0) * i / (cols.length - 1);
        g.save(); g.strokeStyle = C.axis; g.lineWidth = 1.5; g.strokeRect(x0 - 100, top, x1 - x0 + 100, rowH * 4);
        for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(x0 - 100, top + rowH * i); g.lineTo(x1, top + rowH * i); g.stroke(); }
        g.beginPath(); g.moveTo(x0, top); g.lineTo(x0, top + rowH * 4); g.stroke(); g.restore();
        ["x", "f(x)", "g(x)", prod ? "f(x)g(x)" : "f(x)/g(x)"].forEach((t, i) => text(g, inl(t), x0 - 50, top + rowH * i + rowH / 2 + 7, C.ink, 18, "center"));
        cols.forEach((c, i) => text(g, inl(c === -Infinity ? "-\\infty" : c === Infinity ? "+\\infty" : N(c)), X(i) + (i === 0 ? 22 : i === cols.length - 1 ? -22 : 0), top + rowH / 2 + 7, C.ink, 18, "center"));
        const sgnAt = (fn, x) => (fn(x) > 0 ? "+" : "-");
        for (let i = 0; i < cols.length - 1; i++) {
          const lo = cols[i] === -Infinity ? roots[0] - 1 : cols[i], hi = cols[i + 1] === Infinity ? roots[roots.length - 1] + 1 : cols[i + 1], m = (lo + hi) / 2, xm = (X(i) + X(i + 1)) / 2;
          const sf = sgnAt(f, m), sh = sgnAt(h, m), sp = sf === sh ? "+" : "-";
          [[sf, 1, C.acc], [sh, 2, C.blue], [sp, 3, C.ink]].forEach(([s_, row, col]) => text(g, s_ === "+" ? "+" : "−", xm, top + rowH * row + rowH / 2 + 8, col, 24, "center"));
        }
        roots.forEach((r, j) => { const xi = X(j + 1); [[f, 1], [h, 2]].forEach(([fn, row]) => { if (Math.abs(fn(r)) < 1e-9) text(g, "0", xi, top + rowH * row + rowH / 2 + 8, C.ink, 20, "center"); else { g.save(); g.strokeStyle = C.grid; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(xi, top + rowH * row + 4); g.lineTo(xi, top + rowH * (row + 1) - 4); g.stroke(); g.restore(); } });
          const zeroDen = !prod && Math.abs(h(r)) < 1e-9;
          if (zeroDen) { g.save(); g.strokeStyle = C.warn; g.lineWidth = 2; [-3, 3].forEach(d => { g.beginPath(); g.moveTo(xi + d, top + rowH * 3 + 4); g.lineTo(xi + d, top + rowH * 4 - 4); g.stroke(); }); g.restore(); }
          else text(g, "0", xi, top + rowH * 3 + rowH / 2 + 8, C.ink, 20, "center"); });
        set(o, lines(inl(`f(x)=${tpoly([[a1, "x"], [-a1 * r1, ""]], N)}`) + o.pair(", racine ", ", root ") + inl(N(r1)),
          inl(`g(x)=${tpoly([[a2, "x"], [-a2 * r2, ""]], N)}`) + o.pair(", racine ", ", root ") + inl(N(r2)),
          o.pair("Une expression affine prend le signe de son coefficient directeur à droite de sa racine.", "An affine expression has the sign of its slope to the right of its root."),
          prod ? o.pair("Règle des signes : le produit est positif là où les deux facteurs ont le même signe.", "Sign rule: the product is positive where both factors have the same sign.") : o.pair(`La valeur ${inl(N(r2))} est interdite : ${inl("g")} s’y annule (double barre).`, `The value ${inl(N(r2))} is excluded: ${inl("g")} vanishes there (double bar).`)));
      },
    };
  },
};
}

{
// True 3D with the 2D canvas: orthographic camera, z up, painter's algorithm. Dragging empty space rotates (pitch clamped).
// the one camera of the site (also the laboratory template `space`)

const set = (o, html) => rich(o.readout, html);
const lines = (...a) => a.filter(Boolean).join("<br>");

function cam(o, s = 38, c = [0, 0, 1]) {
  const k = { yaw: -.7, pitch: .55 };
  o.rotate = {
    active: false, last: null,
    start(e, pt) { this.active = true; this.last = pt(e); },
    move(e, pt) { const p = pt(e); cam3Turn(k, (p[0] - this.last[0]) * .008, (p[1] - this.last[1]) * .006); this.last = p; o.redraw(); },
    end() { this.active = false; },
  };
  const P = (x, y, z) => { const q = cam3Project(k.yaw, k.pitch, x - c[0], y - c[1], z - c[2]); return { X: o.W / 2 + s * q.u, Y: o.H / 2 - s * q.v, d: q.d }; };
  const un = (X, Y, zf) => { const q = cam3Unproject(k.yaw, k.pitch, (X - o.W / 2) / s, -(Y - o.H / 2) / s, zf - c[2]); return { x: q.x + c[0], y: q.y + c[1] }; };
  return { k, P, un };
}
function poly(g, pts, fill, alpha, stroke) { g.save(); g.globalAlpha = alpha; g.fillStyle = fill; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p.X, p.Y) : g.moveTo(p.X, p.Y))); g.closePath(); g.fill(); g.globalAlpha = 1; if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); } g.restore(); }
function seg(g, a, b, col, w = 2.5, dash) { g.save(); g.strokeStyle = col; g.lineWidth = w; if (dash) g.setLineDash(dash); g.beginPath(); g.moveTo(a.X, a.Y); g.lineTo(b.X, b.Y); g.stroke(); g.restore(); }
function floor(g, V, half = 4) { const f = []; for (let i = -half; i <= half; i++) { seg(g, V(i, -half, 0), V(i, half, 0), C.grid, 1); seg(g, V(-half, i, 0), V(half, i, 0), C.grid, 1); } }
function axes3(g, V, L = 4.5) { [["x", [L, 0, 0]], ["y", [0, L, 0]], ["z", [0, 0, L]]].forEach(([n, p]) => { const a = V(0, 0, 0), b = V(...p); seg(g, a, b, C.axis, 1.6); text(g, inl(n), b.X + 6, b.Y - 6, C.muted, 16); }); }



var W3 = {
  // Surface z = f(x, y) patch with a draggable point on the floor (integration / level curves): painter's algorithm.
  surface3d(o) {
    let px = 1, py = 1; const f = (x, y) => 3 - (x * x + y * y) / 3; const { k, P, un } = cam(o, 36, [0, 0, 1.5]); const n = 18, h = 3;
    return {
      handles() { const s = P(px, py, 0); return [{ x: s.X, y: s.Y, cur: "move", move(X, Y) { const q = un(X, Y, 0); px = clamp(snap(q.x, .25), -h, h); py = clamp(snap(q.y, .25), -h, h); } }]; },
      draw(g) {
        floor(g, P, 3); axes3(g, P, 3.5); const facets = [];
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
          const x0 = -h + 2 * h * i / n, x1 = -h + 2 * h * (i + 1) / n, y0 = -h + 2 * h * j / n, y1 = -h + 2 * h * (j + 1) / n;
          const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([x, y]) => P(x, y, f(x, y))), z = f((x0 + x1) / 2, (y0 + y1) / 2);
          facets.push({ pts, d: pts.reduce((s, p) => s + p.d, 0) / 4, z });
        }
        facets.sort((a, b) => b.d - a.d).forEach(F => { const sh = .45 + .1 * Math.min(1, F.z / 3); poly(g, F.pts, mix(C.grid, C.axis, 2 * (sh - .45) / .1 * .25 + .15), .95, fade(C.ink, .35)); });
        const s = P(px, py, 0), t = P(px, py, f(px, py)); seg(g, s, t, C.warn, 2, [4, 4]); dot(o, t.X, t.Y, C.warn, "", "default", false); dot(o, s.X, s.Y, C.acc, o.L ? "(x, y)" : "(x ; y)");
        set(o, lines(inl("z=3-\\dfrac{x^2+y^2}{3}"), inl(`f${tpt(o, px, py)}=${o.tn(f(px, py), 3)}`), o.pair("Glissez le fond pour tourner.", "Drag the background to rotate.")));
      },
    };
  },
};
}

  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
