<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:1180px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:340px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

.sg{border-collapse:collapse;margin:8px 0;max-width:100%}
.sg td{padding:4px 14px;min-width:28px;height:40px;text-align:center;vertical-align:middle}
.sg tr.rule td{border-top:2px solid var(--muted)}
.sg td.l{border-left:2px solid var(--muted)}.sg td.r{border-right:2px solid var(--muted)}
mjx-container[jax="SVG"]{max-width:none}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.wctl button,.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.wctl button[aria-pressed=true]{background:var(--amber)}
.wctl>div{display:flex;flex-wrap:wrap;gap:8px}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
.canvas-navigation{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:16px system-ui}.canvas-navigation button{min-width:44px;min-height:44px;padding:4px 8px;font-size:20px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel);cursor:pointer}.canvas-navigation output{color:var(--muted);margin-left:6px}

/* laboratory experiments in a slide ({type:"lab"}, site/js/lab/shell.js mode "slide"): the canvas fills the widget host, the
   controls, the answer area and the mission stepper sit in #wctl, the formula and the readout in #readout, the prompt in the hint line */
.canvas-wrap.lab2-canvas-host{height:340px}
.lab2-stage{position:absolute;inset:0}
.lab2-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.lab2-handle{position:absolute;left:0;top:0;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;pointer-events:none}
.lab2-handle:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
.hint-line.lab2-hint{height:auto;min-height:22px;max-height:84px;overflow:auto;white-space:normal;font-size:18px;line-height:1.3;outline:0}
.lab2-slide{width:100%}
.lab2-slide .lab2-card{display:flex;flex-direction:column;gap:8px;width:100%}
.lab2-stepper{display:flex;align-items:center;gap:10px}
.lab2-step-label{font:600 18px system-ui,sans-serif;color:var(--muted)}
.lab2-kind{color:var(--amber);margin-left:4px}
.lab2-controls{display:grid;gap:8px}
.lab2-ctl{display:grid;gap:4px}
.lab2-ctl.is-locked{opacity:.45}
.lab2-ctl-label{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.lab2-ctl input[type=range]{width:100%}
.lab2-segments,.lab2-variants{display:flex;flex-wrap:wrap;gap:6px}
.lab2-segment.is-on,.lab2-variant[aria-pressed=true]{background:var(--amber)!important}
.lab2-options,.lab2-answer{display:grid;gap:6px}
.wctl .lab2-option,.wctl .lab2-variant{height:auto;min-height:38px;padding:6px 12px;text-align:left;white-space:normal;font-size:17px}
.lab2-option[aria-pressed=true]{background:var(--amber)!important}
.lab2-check{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab2-check input[type=text]{height:38px;width:130px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:0 8px;font:600 17px system-ui,sans-serif}
.lab2-check label{font-size:17px}
.lab2-feedback{margin:0;font:600 17px/1.3 system-ui,sans-serif}.lab2-feedback:empty{display:none}
.lab2-feedback[data-tone=good]{color:var(--green)}.lab2-feedback[data-tone=warn]{color:var(--red)}
.lab2-reveal{border-left:4px solid var(--green);padding:4px 0 4px 12px;font-size:17px;line-height:1.35}
.lab2-recall,.lab2-note{margin:0;color:var(--muted);font-size:16px}
.lab2-hintbox summary{cursor:pointer;color:var(--amber);font:600 16px system-ui,sans-serif}.lab2-hintbox p{margin:4px 0 0;font-size:16px}
.wctl .lab2-restart{height:30px;background:transparent;color:var(--muted);text-decoration:underline;font-size:15px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab2-formula{margin:0 0 6px;font-size:21px;line-height:1.35;overflow-wrap:anywhere}
.lab2-readout{display:grid;gap:3px;margin:0}
.lab2-readout>div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lab2-readout dt{color:var(--muted);font-size:16px}
.lab2-readout dd{margin:0;font-size:21px}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"language":"fr","courseTitle":["Terminale STMG","Terminale STMG"],"id":"stmg-05","course":"stmg","number":5,"title":["Statistiques à deux variables quantitatives","Bivariate statistics"],"slides":[{"k":"title","t":["Statistiques à deux variables quantitatives","Bivariate statistics"],"b":["",""]},{"k":"concept","t":["Cours de référence","Reference course"],"b":["Une droite d'ajustement \\(y=ax+b\\) fournit des estimations, pas des égalités exactes. Le coefficient \\(a\\) décrit la variation moyenne estimée de \\(y\\) quand \\(x\\) augmente d'une unité. Une interpolation reste dans l'intervalle des valeurs observées ; une extrapolation sort de cet intervalle et doit être présentée avec prudence.","A line of best fit \\(y=ax+b\\) gives estimates, not exact equalities. The coefficient \\(a\\) describes the estimated average change in \\(y\\) when \\(x\\) increases by one unit. Interpolation stays within the range of observed values; extrapolation goes outside that range and must be presented with caution."]},{"k":"method","t":["Cours de référence","Reference course"],"b":["Pour exploiter \\(y=ax+b\\) : 1) remplacer \\(x\\) par la valeur demandée pour estimer \\(y\\) ; 2) résoudre \\(ax+b=y_0\\) pour estimer \\(x\\) ; 3) arrondir selon le contexte ; 4) préciser interpolation ou extrapolation ; 5) rappeler que le résultat dépend du modèle.","To use \\(y=ax+b\\): 1) replace \\(x\\) by the requested value to estimate \\(y\\); 2) solve \\(ax+b=y_0\\) to estimate \\(x\\); 3) round according to the context; 4) state whether it is interpolation or extrapolation; 5) remind that the result depends on the model."]},{"k":"goals","t":["Nuage de points","Scatter plot"],"b":["<ul><li>Construire un nuage.<li>Choisir les échelles.<li>Identifier les variables.<\/ul>","<ul><li>Construct a scatter plot.<li>Choose the scales.<li>Identify the variables.<\/ul>"]},{"k":"activity","t":["Nuage de points","Scatter plot"],"b":["Le tableau \\((x_i;y_i)\\) donne les dépenses publicitaires et les ventes de six mois : \\((1;12),(2;15),(3;17),(4;22),(5;24),(6;28)\\). Choisir des échelles, tracer le nuage et placer le point moyen.","The table \\((x_i,y_i)\\) gives the advertising spending and the sales over six months: \\((1,12),(2,15),(3,17),(4,22),(5,24),(6,28)\\). Choose scales, draw the scatter plot and plot the mean point."],"f":[[2,2]]},{"k":"concept","t":["Nuage de points","Scatter plot"],"b":["Un nuage de points représente les couples \\((x_i;y_i)\\). Les axes, unités et échelles doivent être indiqués ; chaque couple donne un seul point.","A scatter plot represents the pairs \\((x_i,y_i)\\). The axes, units and scales must be indicated; each pair gives a single point."]},{"k":"example","t":["Nuage de points","Scatter plot"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Nuage de points","Scatter plot"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["<ul><li>Décrire une tendance.<li>Repérer dispersion et atypiques.<li>Éviter causalité abusive.<\/ul>","<ul><li>Describe a trend.<li>Spot spread and outliers.<li>Avoid unwarranted causality.<\/ul>"]},{"k":"activity","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["Comparer trois nuages : tendance croissante serrée, tendance décroissante dispersée, absence de tendance. Rédiger pour chacun deux phrases sans employer le mot « cause ».<br><br>","Compare three scatter plots: a tight increasing trend, a scattered decreasing trend, no trend. For each, write two sentences without using the word “cause”.<br><br>"]},{"k":"concept","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["Décrire un nuage consiste à commenter la direction, la forme, la dispersion et les valeurs atypiques, sans affirmer une causalité non établie.","Describing a scatter plot means commenting on its direction, shape, spread and outliers, without claiming a causality that has not been established."]},{"k":"example","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Ajustement affine","Linear regression"],"b":["<ul><li>Obtenir un ajustement affine.<li>Interpréter \\(a\\) et \\(b\\).<li>Vérifier avec le point moyen.<\/ul>","<ul><li>Obtain a linear regression.<li>Interpret \\(a\\) and \\(b\\).<li>Check with the mean point.<\/ul>"]},{"k":"activity","t":["Ajustement affine","Linear regression"],"b":["Avec les données de la séance 31, obtenir la régression affine à la calculatrice. Interpréter la pente et vérifier que le point moyen appartient approximativement à la droite.","With the data of session 31, obtain the linear regression with a calculator. Interpret the slope and check that the mean point lies approximately on the line."],"f":[[3,3]]},{"k":"concept","t":["Ajustement affine","Linear regression"],"b":["Une droite \\(y=ax+b\\) ajuste un nuage. \\(a\\) représente la variation moyenne estimée de \\(y\\) pour une unité supplémentaire de \\(x\\).","A line \\(y=ax+b\\) fits a scatter plot. \\(a\\) represents the estimated average change in \\(y\\) for one extra unit of \\(x\\)."]},{"k":"example","t":["Ajustement affine","Linear regression"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Ajustement affine","Linear regression"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"widget","t":["Nuage et droite de régression","Scatter plot and regression line"],"b":["Déplacez les points : la droite et le coefficient r se recalculent.","Drag the points: the line and the coefficient r are recomputed."],"w":{"type":"scatter"}},{"k":"goals","t":["Interpolation","Interpolation"],"b":["<ul><li>Interpoler.<li>Résoudre avec le modèle.<li>Exprimer une estimation.<\/ul>","<ul><li>Interpolate.<li>Solve using the model.<li>Express an estimate.<\/ul>"]},{"k":"activity","t":["Interpolation","Interpolation"],"b":["Sur la période observée \\(x\\in[1,12]\\), le modèle est \\(y=2{,}8x+14\\). Estimer \\(y\\) pour \\(x=7{,}5\\), puis estimer \\(x\\) lorsque \\(y=35\\). Qualifier chaque estimation.","Over the observed period \\(x\\in[1,12]\\), the model is \\(y=2.8x+14\\). Estimate \\(y\\) for \\(x=7.5\\), then estimate \\(x\\) when \\(y=35\\). Classify each estimate."],"f":[[4,4]]},{"k":"concept","t":["Interpolation","Interpolation"],"b":["Une interpolation estime une valeur à l'intérieur de l'intervalle observé. Le résultat est une estimation dépendante du modèle.","An interpolation estimates a value inside the observed range. The result is an estimate that depends on the model."]},{"k":"example","t":["Interpolation","Interpolation"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Interpolation","Interpolation"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Extrapolation","Extrapolation"],"b":["<ul><li>Extrapoler prudemment.<li>Évaluer la plausibilité.<li>Présenter une limite du modèle.<\/ul>","<ul><li>Extrapolate with caution.<li>Assess plausibility.<li>Present a limitation of the model.<\/ul>"]},{"k":"activity","t":["Extrapolation","Extrapolation"],"b":["Le même modèle \\(y=2{,}8x+14\\), ajusté sur \\([1,12]\\), est utilisé pour \\(x=40\\). Calculer l'estimation, puis donner trois raisons pour lesquelles elle peut être peu fiable.","The same model \\(y=2.8x+14\\), fitted on \\([1,12]\\), is used for \\(x=40\\). Calculate the estimate, then give three reasons why it may be unreliable."],"f":[[5,5]]},{"k":"concept","t":["Extrapolation","Extrapolation"],"b":["Une extrapolation estime hors de l'intervalle observé. Plus on s'en éloigne, plus la prudence est nécessaire.","An extrapolation estimates outside the observed range. The further away we go, the more caution is needed."]},{"k":"example","t":["Extrapolation","Extrapolation"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Extrapolation","Extrapolation"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Changement de variable","Change of variable"],"b":["<ul><li>Effectuer un changement de variable.<li>Ajuster les nouvelles données.<li>Revenir à la variable initiale.<\/ul>","<ul><li>Carry out a change of variable.<li>Fit the new data.<li>Return to the original variable.<\/ul>"]},{"k":"activity","t":["Changement de variable","Change of variable"],"b":["Les données semblent exponentielles. On pose \\(z=\\log(y)\\) et l'ajustement donne \\(z=0{,}08x+1{,}2\\). Exprimer \\(y\\) en fonction de \\(x\\), puis calculer \\(y\\) pour \\(x=5\\).<br><br>","The data appear to be exponential. We set \\(z=\\log(y)\\) and the fit gives \\(z=0.08x+1.2\\). Express \\(y\\) as a function of \\(x\\), then calculate \\(y\\) for \\(x=5\\).<br><br>"]},{"k":"concept","t":["Changement de variable","Change of variable"],"b":["Un changement de variable peut aligner un nuage. Après l'ajustement dans la nouvelle variable, il faut revenir à la variable initiale.","A change of variable can make a scatter plot linear. After fitting in the new variable, we must return to the original variable."]},{"k":"example","t":["Changement de variable","Change of variable"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Changement de variable","Change of variable"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["<ul><li>Comparer des modèles.<li>Utiliser les résidus.<li>Définir un domaine d'usage.<\/ul>","<ul><li>Compare models.<li>Use residuals.<li>Define a range of use.<\/ul>"]},{"k":"activity","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["Deux modèles donnent des résidus absolus totaux \\(18{,}4\\) et \\(11{,}7\\) sur la zone observée. Le second comporte cependant une croissance irréaliste après \\(x=20\\). Choisir un modèle pour interpoler à \\(x=12\\), puis discuter l'extrapolation à \\(x=50\\).","Two models give total absolute residuals of \\(18.4\\) and \\(11.7\\) over the observed range. The second, however, shows unrealistic growth beyond \\(x=20\\). Choose a model to interpolate at \\(x=12\\), then discuss extrapolation at \\(x=50\\)."],"f":[[6,6]]},{"k":"concept","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["On choisit un modèle selon la forme du nuage, la taille des résidus et le domaine d'usage. Un meilleur ajustement visuel n'autorise pas une extrapolation illimitée.","We choose a model according to the shape of the scatter plot, the size of the residuals and the range of use. A better visual fit does not allow unlimited extrapolation."]},{"k":"example","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method" ":["Une réponse statistique complète contient le modèle, le calcul, l'arrondi, l'unité, le type d'estimation et une réserve sur la validité.","A complete statistical answer contains the model, the calculation, the rounding, the unit, the type of estimate and a caveat on validity."]},{"k":"example","t":["Bilan et évaluation","Review and assessment"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Bilan et évaluation","Review and assessment"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]}],"figureVersion":"b65d7e25e0cbe5ae"},"figs":{"stmg-05-2.sv   // Complex plane, same scale on both axes. Modes: alg (drag z: parts, conjugate, z times its conjugate), polar (drag z:

  // Quadratic equation with real coefficients, built from its roots: drag z1; off the real axis its conjugate is the

  cquad(o) {
    const z1 = [1, 2]; let x2 = -1; const v = () => iso(o, 4);

      handles() {
        const V = v(), h = [{ x: V.X(z1[0]), y: V.Y(z1[1]), cur: "grab", move(X, Y) { z1[0] = clamp(snap(V.iX(X), .25), -3.5, 3.5); const y = clamp(snap(V.iY(Y), .25), -3.5, 3.5); z1[1] = Math.abs(y) < .15 ? 0 : y; } }];

  // n-th roots of a complex number a: drag a (modulus and argument snap), choose n. The roots form a regular polygon

  // Residues modulo n on a clock: drag a around the clock, set n. Mode powers: the successive powers of a (period, and

    const geo = () => { const cx = o.W / 2, cy = o.H / 2 + 6, R = Math.min(o.W, o.H) / 2 - 46; return { cx, cy, R, at: k => [cx + R * Math.sin(2 * Math.PI * k / n), cy - R * Math.cos(2 * Math.PI * k / n)] }; };

  // Walks in the bush-taxi graph of the activity (A-B, A-C, A-D, B-C, C-D, D-E): drag the start and end markers onto
  // vertices and choose the length k; the entry of M^k counts the walks, as the adjacency-matrix theorem states.
  walks(o) {
    const names = ["A", "B", "C", "D", "E"], pos = [[.22, .3], [.5, .12], [.5, .55], [.22, .78], [.82, .78]], E = [[0, 1], [0, 2], [0, 3], [1, 2], [2, 3], [3, 4]];

    const M = names.map((_, r) => names.map((_, c) => (E.some(([p, q]) => (p === r && q === c) || (p === c && q === r)) ? 1 : 0)));
    const mul = (A, B) => A.map(row => B[0].map((_, c) => row.reduce((s, x, t) => s + x * B[t][c], 0)));
    const at = q => [40 + pos[q][0] * (o.W - 80), 30 + pos[q][1] * (o.H - 60)];
    const near = (X, Y) => pos.map((_, q) => [Math.hypot(at(q)[0] - X, at(q)[1] - Y), q]).sort((u, w) => u[0] - w[0])[0][1];

      draw(g) {

        g.save(); g.strokeStyle = C.axis; g.lineWidth = 3; E.forEach(([p, q]) => { g.beginPath(); g.moveTo(...at(p)); g.lineTo(...at(q)); g.stroke(); }); g.restore();
        names.forEach((s, q) => { const [x, y] = at(q); g.save(); g.fillStyle = q === i || q === j ? C.ink : C.grid; g.strokeStyle = C.ink; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 17, 0, 7); g.fill(); g.stroke(); g.restore(); text(g, inl(s), x, y + 8, q === i || q === j ? C.bg : C.ink, 18, "center"); });
        const [xi, yi] = at(i), [xj, yj] = at(j); dot(o, xi - 18, yi - 18, C.acc, o.pair("départ", "start"), "grab", true, -1); dot(o, xj + 18, yj + 18, C.warn, o.pair("arrivée", "end"));

    flow.innerHTML = `<div class="title-slide"><span class="chip">${esc(deck.courseTitle?.[lang] || COURSE[deck.course] || "")}</span><h1>${title}</h1><div class="meta">${deck.slides.length} ${t("slides")}</div><div class="hint">${t("hint")}</div></div>`;
  } else if (k === "code") {
    flow.innerHTML = `<div class="hd">${esc(label)}</div><h2 class="tt">${title}</h2><pre>${s.b[lang]}</pre>`;
  } else {
    const cls = sizeClass(rawBody + ans);
    flow.innerHTML = `<div class="hd ${k === "error" ? "red" : ""}"><span>${esc(label)}</span><span class="deckname">${esc(deck.title[lang])}</span></div><h2 class="tt">${title}</h2>${s.h?.[lang] ? `<div class="sub">${esc(s.h[lang])}</div>` : ""}<div class="steps text ${cls}">${revealMarkup(rawBody)}</div>${ans ? `<div class="answer text ${cls}" id="ans" ${revealed ? "" : "hidden"}><div class="hd green">${t("answerLab")}</div>${ans}</div>` : ""}`;
  }

  if (mode === "fig") rt.innerHTML = `<div class="figcol">${figs}</div>`;
  else if (mode === "widget" || mode === "explore") {
    rt.innerHTML = `<div class="hint-line" id="whint"></div><div class="canvas-wrap" id="wcanvas"></div>${mode === "explore" ? `${widgets.length > 1 ? `<label class="explore-label">${t("explore")}<select id="explore-choice">${widgets.map((w, i) => `<option value="${i}">${esc(plain(w.t[lang]))}</option>`).join("")}</select></label>` : ""}<p class="note">${t("free")}</p>` : ""}<div class="wctl" id="wctl"></div>`;
  } else rt.innerHTML = "";

  chrome();
  figHidden = false; layout(mode);
  try { history.replaceState(null, "", EXPORT ? `#${index}` : `?deck=${encodeURIComponent(deckId)}&lang=${lang ? "en" : "fr"}#${index}`); } catch {}
  // Formulas first: the widget readouts are typeset as they are written, so MathJax must be ready before they mount.
  let ready = true;
  try {
    if (typeof MathJax === "undefined") throw new Error("MathJax");
    await MathJax.startup.promise; await document.fonts.load('400 25px "STIX Two Text"');
  } catch (e) { ready = false; console.warn(e); if (renderId === generation) toast(t("noMath")); }
  if (renderId !== generation) return;
  const defined = deck.slides.findIndex(x => x.k === "concept" && /Discriminant/.test(x.t[0]));
  if (mode === "widget") companion(s.w, true);
  else if (mode === "explore") {
    companion(shared.w, defined < 0 || index >= defined);
    if ($("#explore-choice")) $("#explore-choice").onchange = e => companion(widgets[+e.target.value].w, true);
  }
  paintSteps(); flow.scrollTop = 0;
  if (ready) {
    try { await MathJax.typesetPromise([$("#stage")]); $("#stage").querySelectorAll("mjx-assistive-mml").forEach(x => x.remove()); } catch (e) { console.warn(e); }
    if (renderId !== generation) return;
    fitMath();
    // A figure that is only an exploration aid gives way when an equation needs the whole width.
    if (mode === "explore" && needsWidth()) { figHidden = true; layout(mode); fitMath(); }
  }
}

// ---- layout: the flow column is 520 px wide beside a figure, 1200 px without one
let figHidden = false;
function layout(mode) {
  const wide = mode === "none" || (mode === "explore" && figHidden);
  $("#col").className = wide ? "wide" : ""; $("#rt").hidden = wide;
  const tg = $("#tg"); tg.hidden = mode !== "explore"; tg.setAttribute("aria-pressed", String(!figHidden)); tg.textContent = t("figure");
}
// Shrink any formula wider than the column so that nothing is cut off or needs sideways scrolling (never below MIN_SCALE).
const MIN_SCALE = .5;
function fitMath() {
  const flow = $("#flow"), avail = flow.clientWidth - 4;
  flow.querySelectorAll("mjx-container").forEach(m => { m.style.fontSize = ""; });
  flow.querySelectorAll("mjx-container").forEach(m => {
    if (!m.offsetParent) return;
    const svg = m.querySelector("svg"); if (!svg) return;
    const room = m.getAttribute("display") === "true" ? Math.min(avail, m.parentElement.clientWidth || avail) : avail;
    const w = svg.getBoundingClientRect().width / (flow.getBoundingClientRect().width / flow.offsetWidth);
    if (w > room) m.style.fontSize = Math.max(MIN_SCALE, room / w) * 100 + "%";
  });
}
function needsWidth() {
  return [...$("#flow").querySelectorAll("mjx-container")].some(m => m.offsetParent && m.querySelector("svg") && m.scrollWidth > m.clientWidth + 2 || m.offsetParent && m.style.fontSize && parseFloat(m.style.fontSize) <= MIN_SCALE * 100 + 1);
}

function chrome() {
  const s = deck.slides[index], n = deck.slides.length;
  $("#count").textContent = `${index + 1} / ${n}`;
  $("#pv").disabled = index === 0; $("#nx").disabled = index === n - 1;
  $("#pv").setAttribute("aria-label", t("prev")); $("#nx").setAttribute("aria-label", t("next"));
  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));

  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc(KIND[x.k]?.[lang] || x.k)} · ${esc(x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
  if (typeof MathJax !== "undefined" && MathJax.typesetPromise) MathJax.startup.promise.then(() => MathJax.typesetPromise([d])).then(() => d.querySelectorAll("mjx-assistive-mml").forEach(x => x.remove())).catch(() => {});
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}


function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#tg").onclick = () => { figHidden = !figHidden; layout("explore"); fitMath(); };
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
</html>
