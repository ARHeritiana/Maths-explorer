<style>
/* Classroom slide player, modelled on the interactive maths slide skill: fixed 1280x720 stage scaled to the window,
   flow column of step blocks on the left (x 40-560), live figure and controls on the right (x 600-1240),
   step buttons bottom left. Colour carries meaning: amber = focus, green = true / valid, red = warning, blue-grey = secondary. */

:root{--bg:#0f1b2d;--panel:#13243b;--panel-2:#24364f;--line:#5d7699;--ink:#f4f1ea;--muted:#8fa6c4;--amber:#e8a33d;--green:#5fd0a0;--red:#ff7a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"STIX Two Text","Latin Modern Roman",Georgia,serif}
mjx-assistive-mml{display:none!important}
[hidden]{display:none!important}

/* left: flow column */
#col{position:absolute;left:40px;top:24px;width:520px;height:636px;display:flex;flex-direction:column;gap:10px;min-height:0}
#col.wide{width:1200px}
#col.wide #flow{font-size:28px}
#col.wide .steps,#col.wide .answer{max-width:900px}
#flow{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;font-size:25px;scrollbar-width:none;outline:0}
#flow::-webkit-scrollbar{display:none}
.hd{display:flex;gap:12px;align-items:baseline;color:var(--amber);font-weight:600;font-size:21px}
.hd.red{color:var(--red)}.hd.green{color:var(--green);margin-bottom:3px}
.hd .deckname{color:var(--muted);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1,h2{margin:0;font-weight:700;line-height:1.2}
h2.tt{font-size:32px}
.sub{color:var(--muted);font-size:20px;margin-top:-6px}
.text{line-height:1.45;overflow-wrap:anywhere}
.text.s3{line-height:1.4}.text.s4{font-size:23px}
.text ul,.text ol{padding-left:1.2em;margin:.3em 0}.text li{margin:.2em 0}
.text code,pre{font-family:ui-monospace,Consolas,monospace}
.reveal-block{margin-bottom:12px;animation:fd .6s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.reveal-block mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;margin:.5em 0!important}
.answer{border-left:4px solid var(--green);padding:6px 0 6px 16px;background:linear-gradient(90deg,#13243b,transparent)}
pre{background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;padding:18px 22px;font-size:22px;line-height:1.45;overflow:auto;max-height:520px;margin:0}
.title-slide{display:grid;align-content:center;justify-items:start;gap:18px;min-height:560px}
.title-slide h1{font-size:68px;max-width:16ch}
.chip{font:600 16px system-ui,sans-serif;color:var(--bg);background:var(--amber);padding:6px 14px;border-radius:999px}
.title-slide .meta{color:var(--muted);font-size:24px}
.title-slide .hint{color:var(--muted);font-size:18px;margin-top:30px}
#live{flex:none;max-height:200px;overflow:auto;border-top:2px solid var(--panel-2);padding-top:8px;font-size:21px;line-height:1.4}
#live .hd{font-size:17px;margin-bottom:2px}
#readout{overflow-wrap:anywhere}

/* right: live figure, controls */
#rt{position:absolute;left:600px;top:24px;width:640px;height:636px;display:flex;flex-direction:column;gap:8px;min-height:0}
.hint-line{font:600 16px system-ui,sans-serif;color:var(--amber);height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;flex:none;height:400px;background:var(--panel);border:1px solid var(--panel-2);border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.explore-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--muted)}
.explore-label select,.canvas-keyboard select{font:600 17px system-ui,sans-serif;max-width:70%;height:38px;border-radius:9px;padding:0 8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);margin:0}
.wctl{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:18px;color:var(--ink);overflow:auto;min-height:0}
.wctl label{display:flex;gap:8px;align-items:center}
.wctl input[type=range]{width:150px;height:30px;accent-color:var(--amber);touch-action:pan-y}
.canvas-keyboard{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.canvas-keyboard button{font:600 18px system-ui,sans-serif;height:38px;min-width:40px;padding:0 10px;border:0;border-radius:9px;background:#e6edf3;color:#0d1117;cursor:pointer}
.canvas-wrap:focus-within,.canvas-keyboard:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.figcol{display:grid;gap:14px;align-content:start;overflow:auto;max-height:100%}
.fig{margin:0;background:#f4f7f6;border-radius:12px;padding:14px;display:grid;place-items:center}
.fig img{width:100%;max-height:420px;height:auto;display:block}

/* bottom rows, skill buttons */
.b{font:600 19px system-ui,sans-serif;height:40px;min-width:40px;padding:0 14px;border-radius:9px;border:0;background:#e6edf3;color:#0d1117;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.b.on,.b[aria-pressed=true]{background:var(--amber)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#r1{position:absolute;left:40px;top:672px;display:flex;gap:8px;align-items:center}
#r1 .gap{width:14px}
#step-count{font:600 18px system-ui,sans-serif;min-width:96px;text-align:center}
.count{font:600 18px system-ui,sans-serif;min-width:64px;text-align:center;color:var(--muted)}
#r2{position:absolute;left:600px;top:672px;width:640px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
#prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--panel-2)}
#prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
#drawer{position:absolute;left:600px;top:24px;width:640px;height:636px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5}
#drawer button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 12px;font:600 17px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--panel-2);border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer button[aria-current]{border-color:var(--amber);color:var(--amber)}
#toast{position:absolute;left:600px;top:4px;width:640px;text-align:center;font:600 16px system-ui,sans-serif;color:#0d1117;background:var(--amber);border-radius:8px;padding:6px 10px;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phones in portrait: the stage becomes a normal scrolling page (the slide is designed for landscape) */
@media (max-width:760px) and (orientation:portrait){
  html,body{height:auto;min-height:100%}body{display:block;overflow:auto}
  #wrap{width:auto!important;height:auto!important}
  #stage{position:relative;width:100%;height:auto;transform:none!important;overflow:visible;display:flex;flex-direction:column;gap:14px;padding:16px}
  #col,#col.wide,#rt,#r1,#r2,#drawer{position:static;width:auto;height:auto}
  #col{display:block}#flow{overflow:visible;font-size:20px}
  #col.wide #flow{min-height:0}
  h2.tt{font-size:26px}.title-slide h1{font-size:38px}.title-slide{min-height:0}
  #rt{order:-1}.canvas-wrap{height:280px}
  #r1,#r2{flex-wrap:wrap;justify-content:flex-start}
  #drawer{position:fixed;inset:0;z-index:10;border-radius:0}
  #prog{position:fixed}
  #live{max-height:none}
}
</style>
</head>

<script>window.__MX_EXPORT__={"deck":{"id":"stmg-05","course":"stmg","number":5,"title":["Statistiques à deux variables quantitatives","Bivariate statistics"],"slides":[{"k":"title","t":["Statistiques à deux variables quantitatives","Bivariate statistics"],"b":["",""]},{"k":"concept","t":["Cours de référence","Reference course"],"b":["Une droite d'ajustement \\(y=ax+b\\) fournit des estimations, pas des égalités exactes. Le coefficient \\(a\\) décrit la variation moyenne estimée de \\(y\\) quand \\(x\\) augmente d'une unité. Une interpolation reste dans l'intervalle des valeurs observées ; une extrapolation sort de cet intervalle et doit être présentée avec prudence.","A line of best fit \\(y=ax+b\\) gives estimates, not exact equalities. The coefficient \\(a\\) describes the estimated average change in \\(y\\) when \\(x\\) increases by one unit. Interpolation stays within the range of observed values; extrapolation goes outside that range and must be presented with caution."]},{"k":"method","t":["Cours de référence","Reference course"],"b":["Pour exploiter \\(y=ax+b\\) : 1) remplacer \\(x\\) par la valeur demandée pour estimer \\(y\\) ; 2) résoudre \\(ax+b=y_0\\) pour estimer \\(x\\) ; 3) arrondir selon le contexte ; 4) préciser interpolation ou extrapolation ; 5) rappeler que le résultat dépend du modèle.","To use \\(y=ax+b\\): 1) replace \\(x\\) by the requested value to estimate \\(y\\); 2) solve \\(ax+b=y_0\\) to estimate \\(x\\); 3) round according to the context; 4) state whether it is interpolation or extrapolation; 5) remind that the result depends on the model."]},{"k":"goals","t":["Nuage de points","Scatter plot"],"b":["<ul><li>Construire un nuage.<li>Choisir les échelles.<li>Identifier les variables.<\/ul>","<ul><li>Construct a scatter plot.<li>Choose the scales.<li>Identify the variables.<\/ul>"]},{"k":"activity","t":["Nuage de points","Scatter plot"],"b":["Le tableau \\((x_i;y_i)\\) donne les dépenses publicitaires et les ventes de six mois : \\((1;12),(2;15),(3;17),(4;22),(5;24),(6;28)\\). Choisir des échelles, tracer le nuage et placer le point moyen.","The table \\((x_i,y_i)\\) gives the advertising spending and the sales over six months: \\((1,12),(2,15),(3,17),(4,22),(5,24),(6,28)\\). Choose scales, draw the scatter plot and plot the mean point."],"f":[[2,2]]},{"k":"concept","t":["Nuage de points","Scatter plot"],"b":["Un nuage de points représente les couples \\((x_i;y_i)\\). Les axes, unités et échelles doivent être indiqués ; chaque couple donne un seul point.","A scatter plot represents the pairs \\((x_i,y_i)\\). The axes, units and scales must be indicated; each pair gives a single point."]},{"k":"example","t":["Nuage de points","Scatter plot"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Nuage de points","Scatter plot"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["<ul><li>Décrire une tendance.<li>Repérer dispersion et atypiques.<li>Éviter causalité abusive.<\/ul>","<ul><li>Describe a trend.<li>Spot spread and outliers.<li>Avoid unwarranted causality.<\/ul>"]},{"k":"activity","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["Comparer trois nuages : tendance croissante serrée, tendance décroissante dispersée, absence de tendance. Rédiger pour chacun deux phrases sans employer le mot « cause ».<br><br>","Compare three scatter plots: a tight increasing trend, a scattered decreasing trend, no trend. For each, write two sentences without using the word “cause”.<br><br>"]},{"k":"concept","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["Décrire un nuage consiste à commenter la direction, la forme, la dispersion et les valeurs atypiques, sans affirmer une causalité non établie.","Describing a scatter plot means commenting on its direction, shape, spread and outliers, without claiming a causality that has not been established."]},{"k":"example","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Lecture et interprétation du nuage","Reading and interpreting a scatter plot"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Ajustement affine","Linear regression"],"b":["<ul><li>Obtenir un ajustement affine.<li>Interpréter \\(a\\) et \\(b\\).<li>Vérifier avec le point moyen.<\/ul>","<ul><li>Obtain a linear regression.<li>Interpret \\(a\\) and \\(b\\).<li>Check with the mean point.<\/ul>"]},{"k":"activity","t":["Ajustement affine","Linear regression"],"b":["Avec les données de la séance 31, obtenir la régression affine à la calculatrice. Interpréter la pente et vérifier que le point moyen appartient approximativement à la droite.","With the data of session 31, obtain the linear regression with a calculator. Interpret the slope and check that the mean point lies approximately on the line."],"f":[[3,3]]},{"k":"concept","t":["Ajustement affine","Linear regression"],"b":["Une droite \\(y=ax+b\\) ajuste un nuage. \\(a\\) représente la variation moyenne estimée de \\(y\\) pour une unité supplémentaire de \\(x\\).","A line \\(y=ax+b\\) fits a scatter plot. \\(a\\) represents the estimated average change in \\(y\\) for one extra unit of \\(x\\)."]},{"k":"example","t":["Ajustement affine","Linear regression"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Ajustement affine","Linear regression"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"widget","t":["Nuage et droite de régression","Scatter plot and regression line"],"b":["Déplacez les points : la droite et le coefficient r se recalculent.","Drag the points: the line and the coefficient r are recomputed."],"w":{"type":"scatter"}},{"k":"goals","t":["Interpolation","Interpolation"],"b":["<ul><li>Interpoler.<li>Résoudre avec le modèle.<li>Exprimer une estimation.<\/ul>","<ul><li>Interpolate.<li>Solve using the model.<li>Express an estimate.<\/ul>"]},{"k":"activity","t":["Interpolation","Interpolation"],"b":["Sur la période observée \\(x\\in[1,12]\\), le modèle est \\(y=2{,}8x+14\\). Estimer \\(y\\) pour \\(x=7{,}5\\), puis estimer \\(x\\) lorsque \\(y=35\\). Qualifier chaque estimation.","Over the observed period \\(x\\in[1,12]\\), the model is \\(y=2.8x+14\\). Estimate \\(y\\) for \\(x=7.5\\), then estimate \\(x\\) when \\(y=35\\). Classify each estimate."],"f":[[4,4]]},{"k":"concept","t":["Interpolation","Interpolation"],"b":["Une interpolation estime une valeur à l'intérieur de l'intervalle observé. Le résultat est une estimation dépendante du modèle.","An interpolation estimates a value inside the observed range. The result is an estimate that depends on the model."]},{"k":"example","t":["Interpolation","Interpolation"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Interpolation","Interpolation"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Extrapolation","Extrapolation"],"b":["<ul><li>Extrapoler prudemment.<li>Évaluer la plausibilité.<li>Présenter une limite du modèle.<\/ul>","<ul><li>Extrapolate with caution.<li>Assess plausibility.<li>Present a limitation of the model.<\/ul>"]},{"k":"activity","t":["Extrapolation","Extrapolation"],"b":["Le même modèle \\(y=2{,}8x+14\\), ajusté sur \\([1,12]\\), est utilisé pour \\(x=40\\). Calculer l'estimation, puis donner trois raisons pour lesquelles elle peut être peu fiable.","The same model \\(y=2.8x+14\\), fitted on \\([1,12]\\), is used for \\(x=40\\). Calculate the estimate, then give three reasons why it may be unreliable."],"f":[[5,5]]},{"k":"concept","t":["Extrapolation","Extrapolation"],"b":["Une extrapolation estime hors de l'intervalle observé. Plus on s'en éloigne, plus la prudence est nécessaire.","An extrapolation estimates outside the observed range. The further away we go, the more caution is needed."]},{"k":"example","t":["Extrapolation","Extrapolation"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Extrapolation","Extrapolation"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Changement de variable","Change of variable"],"b":["<ul><li>Effectuer un changement de variable.<li>Ajuster les nouvelles données.<li>Revenir à la variable initiale.<\/ul>","<ul><li>Carry out a change of variable.<li>Fit the new data.<li>Return to the original variable.<\/ul>"]},{"k":"activity","t":["Changement de variable","Change of variable"],"b":["Les données semblent exponentielles. On pose \\(z=\\log(y)\\) et l'ajustement donne \\(z=0{,}08x+1{,}2\\). Exprimer \\(y\\) en fonction de \\(x\\), puis calculer \\(y\\) pour \\(x=5\\).<br><br>","The data appear to be exponential. We set \\(z=\\log(y)\\) and the fit gives \\(z=0.08x+1.2\\). Express \\(y\\) as a function of \\(x\\), then calculate \\(y\\) for \\(x=5\\).<br><br>"]},{"k":"concept","t":["Changement de variable","Change of variable"],"b":["Un changement de variable peut aligner un nuage. Après l'ajustement dans la nouvelle variable, il faut revenir à la variable initiale.","A change of variable can make a scatter plot linear. After fitting in the new variable, we must return to the original variable."]},{"k":"example","t":["Changement de variable","Change of variable"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Changement de variable","Change of variable"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["<ul><li>Comparer des modèles.<li>Utiliser les résidus.<li>Définir un domaine d'usage.<\/ul>","<ul><li>Compare models.<li>Use residuals.<li>Define a range of use.<\/ul>"]},{"k":"activity","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["Deux modèles donnent des résidus absolus totaux \\(18{,}4\\) et \\(11{,}7\\) sur la zone observée. Le second comporte cependant une croissance irréaliste après \\(x=20\\). Choisir un modèle pour interpoler à \\(x=12\\), puis discuter l'extrapolation à \\(x=50\\).","Two models give total absolute residuals of \\(18.4\\) and \\(11.7\\) over the observed range. The second, however, shows unrealistic growth beyond \\(x=20\\). Choose a model to interpolate at \\(x=12\\), then discuss extrapolation at \\(x=50\\)."],"f":[[6,6]]},{"k":"concept","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["On choisit un modèle selon la forme du nuage, la taille des résidus et le domaine d'usage. Un meilleur ajustement visuel n'autorise pas une extrapolation illimitée.","We choose a model according to the shape of the scatter plot, the size of the residuals and the range of use. A better visual fit does not allow unlimited extrapolation."]},{"k":"example","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Choix du modèle et ajustement","Choosing the model and fitting"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]},{"k":"goals","t":["Bilan et évaluation","Review and assessment"],"b":["<ul><li>Choisir et exploiter un ajustement.<li>Rédiger une conclusion statistique.<li>Analyser une erreur.<\/ul>","<ul><li>Choose and use a regression.<li>Write a statistical conclusion.<li>Analyse an error.<\/ul>"]},{"k":"activity","t":["Bilan et évaluation","Review and assessment"],"b":["À partir d'un nuage fourni par le professeur, produire une réponse complète : choix du modèle, équation, estimation, type d'estimation, unité et réserve. Échanger les copies et utiliser une grille de six critères.<br><br>","Starting from a scatter plot supplied by the teacher, produce a complete answer: choice of model, equation, estimate, type of estimate, unit and caveat. Swap papers and use a six-criterion grid.<br><br>"]},{"k":"concept","t":["Bilan et évaluation","Review and assessment"],"b":["Une réponse statistique complète contient le modèle, le calcul, l'arrondi, l'unité, le type d'estimation et une réserve sur la validité.","A complete statistical answer contains the model, the calculation, the rounding, the unit, the type of estimate and a caveat on validity."]},{"k":"example","t":["Bilan et évaluation","Review and assessment"],"b":["Reprendre les données de l'activité et rédiger la solution dans l'ordre : définition des objets, propriété utilisée, calcul exact ou approché, puis phrase de réponse. La réponse modèle figure dans l'édition enseignant.","Take the data of the investigation and write the solution in order: definition of the objects, property used, exact or approximate calculation, then a sentence giving the answer. The model answer appears in the teacher edition."]},{"k":"method","t":["Bilan et évaluation","Review and assessment"],"b":["<b>Conduite en 1 h :<\/b> 7 min d'automatismes ; 10 min de mise en commun et trace ; 28 min d'exercices essentiels ; 5 min de correction ; 3 min de billet de sortie.<br>\n<b>Conduite en 2 h :<\/b> ajouter 20 min de recherche de l'activité, 20 min d'institutionnalisation, un second exercice autonome et 10 min de correction comparée.<br>\n<b>Différenciation :<\/b> fournir aux élèves fragiles une fiche à quatre cases (données, modèle, calcul, conclusion). Demander aux élèves rapides de produire un contre-exemple, une justification ou une seconde méthode.","<b>One-hour plan:<\/b> 7 min of fluency; 10 min of pooling and written record; 28 min of essential exercises; 5 min of correction; 3 min of exit ticket.<br>\n<b>Two-hour plan:<\/b> add 20 min of investigation, 20 min of formalisation, a second independent exercise and 10 min of comparative correction.<br>\n<b>Differentiation:<\/b> give struggling students a four-box sheet (data, model, calculation, conclusion). Ask fast students to produce a counterexample, a justification or a second method."]}]},"figs":{"stmg-05-2.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbG5zOnhsaW5rPSJ <script>
(function(){
"use strict";
/* ---- widgets.js ---- */
// Interactive canvases for the slide player. Every canvas has draggable handles, keyboard movement and explicit controls.
// The same quantities are mirrored by the readout; space scenes use true 3D.

const C = { bg: "#13243b", grid: "#24364f", axis: "#8fa6c4", ink: "#f4f1ea", muted: "#8fa6c4", acc: "#e8a33d", warn: "#ff7a7a", blue: "#8fb7ff" };

function mount(spec, ctx) {
  const f = W2[spec.type] || W3[spec.type];
  if (!f) { ctx.host.textContent = "?"; return { destroy() {} }; }
  const cv = canvas(ctx.host);
  const api = Object.assign(cv, { ...ctx, spec, L: ctx.lang, num: n => fmt(n, ctx.lang), pair: (fr, en) => (ctx.lang ? en : fr) });
  ctx.hint.textContent = api.pair(spec.hintFr || "Interactif : glissez les points.", spec.hintEn || "Interactive: drag the points.");
  const inst = f(api) || {};
  cv.start(inst);
  const handles=()=>cv.handles();
  if(handles().length){
    const group=document.createElement('div');group.className='canvas-keyboard';
    const pick=document.createElement('select');pick.setAttribute('aria-label',api.pair('Point à déplacer','Point to move'));
    handles().forEach((h,i)=>{const option=document.createElement('option');option.value=i;option.textContent=api.pair('Point ','Point ')+(i+1);pick.append(option);});group.append(pick);
    let selected=0;pick.onchange=()=>{selected=+pick.value;};
    const move=(dx,dy)=>{const h=handles()[selected];if(!h)return;h.move(h.x+dx,h.y+dy);cv.redraw();};
    for(const [label,dx,dy,fr,en] of [['←',-14,0,'Déplacer vers la gauche','Move left'],['→',14,0,'Déplacer vers la droite','Move right'],['↑',0,-14,'Déplacer vers le haut','Move up'],['↓',0,14,'Déplacer vers le bas','Move down']]){
      const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-label',api.pair(fr,en));button.onclick=()=>move(dx,dy);group.append(button);
    }
    cv.c.tabIndex=0;cv.c.setAttribute('role','group');cv.c.setAttribute('aria-label',api.pair('Figure interactive : flèches pour déplacer le point choisi','Interactive figure: arrow keys move the selected point'));
    cv.c.onkeydown=e=>{const deltas={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]};if(deltas[e.key]){e.preventDefault();e.stopPropagation();const d=deltas[e.key],k=e.shiftKey?3:1;move(d[0]*k,d[1]*k);}};
    ctx.controls.append(group);
  }
  return { destroy() { cv.stop(); ctx.controls.innerHTML = ""; ctx.readout.innerHTML = ""; } };
}

        floor(g, P); axes3(g, P); const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]];
        const far = s => P(A[0] + s * u[0], A[1] + s * u[1], A[2] + s * u[2]); seg(g, far(-3), far(3), C.acc, 2.5);
        const Mt = [A[0] + t * u[0], A[1] + t * u[1], A[2] + t * u[2]], m = P(...Mt), a = P(...A), b = P(...B);
        seg(g, a, b, C.warn, 3); dot(o, a.X, a.Y, C.ink, "A"); dot(o, b.X, b.Y, C.warn, "B"); dot(o, m.X, m.Y, C.acc, "M(t)", "default", false);
        const N = o.num; set(o, lines(`u = AB = ${pt(o, ...u)}`, `x = ${N(A[0])} ${u[0] < 0 ? "−" : "+"} ${N(Math.abs(u[0]))}t`, `y = ${N(A[1])} ${u[1] < 0 ? "−" : "+"} ${N(Math.abs(u[1]))}t`, `z = ${N(A[2])} ${u[2] < 0 ? "−" : "+"} ${N(Math.abs(u[2]))}t`, `M${pt(o, ...Mt)}`));

    };
  },

  // Line D = (AB) and plane P: n·M = d. Drag A and B (floor shadows), the plane's z-intercept, and B's height.
  // The part of D hidden by the plane is dashed: orthographic view, the side of P facing away from the viewer.

    return {
      handles() {

        return [{ x: a.X, y: a.Y, cur: "move", move(X, Y) { const q = un(X, Y, 0); A[0] = clamp(snap(q.x), -4, 4); A[1] = clamp(snap(q.y), -4, 4); } },
          { x: b.X, y: b.Y, cur: "move", move(X, Y) { const q = un(X, Y, 0); B[0] = clamp(snap(q.x), -4, 4); B[1] = clamp(snap(q.y), -4, 4); } },
          { x: c.X, y: c.Y, cur: "ns-resize", move(X, Y) { const base = P(0, 0, 0); d = clamp(snap((base.Y - Y) / (36 * Math.cos(k.pitch)) * n[2], 1), -4, 10); } }];
      },
      draw(g) {
        floor(g, P); axes3(g, P);
        const h = 4, sq = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => P(x, y, (d - n[0] * x - n[1] * y) / n[2])); poly(g, sq, C.acc, .2, C.acc);
        const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], at = t => [A[0] + t * u[0], A[1] + t * u[1], A[2] + t * u[2]];
        const cy = Math.cos(k.yaw), sy = Math.sin(k.yaw), cp = Math.cos(k.pitch), sp = Math.sin(k.pitch), toViewer = dotn([-sy * cp, -cy * cp, sp]);

        const a = P(...A), b = P(...B), sa = P(A[0], A[1], 0), sb = P(B[0], B[1], 0), c = P(0, 0, d / n[2]);

        rows.push(o.pair("Glissez les ombres de A et B, le point d du plan ; tournez avec le fond.", "Drag the shadows of A and B and the plane point d; rotate with the background."));
        set(o, lines(...rows)); zb.value = B[2];
      },
    };
  },

  // Surface z = f(x, y) patch with a draggable point on the floor (integration / level curves): painter's algorithm.
  surface3d(o) {

      draw(g) {

}

/* ---- player.js ---- */
// Classroom slide player, modelled on the interactive maths slide skill (Presenter + Explore):
// fixed 1280x720 stage, flow column of step blocks on the left, live figure with controls on the right,
// ◀ ▶ steps and "Tout" at the bottom left. The same file is bundled by scripts/export-slides.py into a
// self-contained HTML export of each deck (window.__MX_EXPORT__ then carries the deck and its figures).

const $ = (s, r = document) => r.querySelector(s);
const EXPORT = typeof window !== "undefined" && window.__MX_EXPORT__ ? window.__MX_EXPORT__ : null;
const params = new URLSearchParams(location.search);
const deckId = EXPORT ? EXPORT.deck.id : params.get("deck") || "premiere-01";
const stored = () => { try { return localStorage.getItem("me-slides-lang") === "en" ? 1 : 0; } catch { return 0; } };
let lang = params.get("lang") === "en" ? 1 : params.get("lang") === "fr" ? 0 : stored();
let deck, index = 0, revealed = false, live = null, step = 1, generation = 0, toastTimer = 0;

const KIND = {
  title: ["Titre", "Title"], goals: ["Objectifs", "Goals"], concept: ["À retenir", "Key idea"], method: ["Méthode", "Method"],
  example: ["Exemple", "Example"], error: ["Attention", "Watch out"], try: ["À vous", "Your turn"], proof: ["Démonstration", "Proof"],
  activity: ["Activité", "Activity"], code: ["Python", "Python"], widget: ["Explorer", "Explore"],
};
const UI = {
  stepPrev: ["Étape précédente", "Previous step"], stepNext: ["Étape suivante", "Next step"], all: ["Tout", "All"],
  step: ["Étape", "Step"], prev: ["Diapositive précédente", "Previous slide"], next: ["Diapositive suivante", "Next slide"],
  answer: ["Voir la réponse", "Show the answer"], hide: ["Masquer la réponse", "Hide the answer"], answerLab: ["Réponse", "Answer"],
  lang: ["English", "Français"], list: ["Plan", "Outline"], full: ["Plein écran", "Full screen"],
  download: ["Télécharger HTML", "Download HTML"], downloadTip: ["Télécharger ce diaporama en un seul fichier HTML", "Download this deck as a single HTML file"],
  home: ["Toutes les séries", "All decks"], loadErr: ["Série introuvable.", "Deck not found."],
  hint: ["Flèches : étapes et diapositives · R réponse · G plan · L langue · F plein écran", "Arrows: steps and slides · R answer · G outline · L language · F full screen"],
  slides: ["diapositives", "slides"], liveLab: ["Valeurs en direct", "Live values"],
  explore: ["Explorer le chapitre", "Explore the chapter"],
  free: ["La figure est réglable librement ; ses valeurs peuvent différer de celles de l’exemple.", "The figure is freely adjustable; its values may differ from the worked example."],
  blocked: ["Plein écran bloqué par l’application. Ouvrez le lien dans le navigateur, puis touchez ⛶.", "Full screen is blocked here. Open the page in the browser, then tap ⛶."],
  noMath: ["Les formules n’ont pas pu se charger : une connexion internet est nécessaire.", "Formulas could not load: an internet connection is required."],
};
const t = k => UI[k][lang];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const COURSE = { stmg: "Terminale STMG", premiere: "Première", seconde: "Seconde", terminale: "Terminale" };
const SIZE_NARROW = 1500;

function fit() {
  const wrap = $("#wrap"), stage = $("#stage");
  if (matchMedia("(max-width:760px) and (orientation:portrait)").matches) { wrap.style.width = ""; wrap.style.height = ""; stage.style.transform = ""; return; }
  const k = Math.min(innerWidth / 1280, innerHeight / 720);
  wrap.style.width = 1280 * k + "px"; wrap.style.height = 720 * k + "px"; stage.style.transform = `scale(${k})`;
}

function toast(message) {
  const el = $("#toast"); el.textContent = message; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

function shell() {
  $("#stage").innerHTML = `<div id="col"><div id="flow" tabindex="-1"></div><div id="live" hidden><div class="hd" id="live-lab"></div><div id="readout"></div></div></div>
<div id="rt"></div>
<div id="r1"><button class="b" id="step-prev">◀</button><span id="step-count"></span><button class="b" id="step-next">▶</button><button class="b" id="all-steps">Tout</button><span class="gap"></span><button class="b" id="pv">‹</button><span class="count" id="count"></span><button class="b" id="nx">›</button></div>
<div id="r2"><button class="b" id="rev" hidden></button><button class="b" id="lng"></button><button class="b" id="lst" aria-pressed="false"></button>${EXPORT ? "" : `<a class="b" id="dl" download></a>`}<button class="b" id="fs" title="Plein écran">⛶</button></div>
<div id="prog"><i></i></div><nav id="drawer" hidden></nav><div id="toast" hidden></div>`;
}

async function load() {
  if (EXPORT) deck = EXPORT.deck;
  else {
    try {
      const r = await fetch(`./data/${encodeURIComponent(deckId)}.json`);
      if (!r.ok) throw new Error(r.status);
      deck = await r.json();
    } catch {
      $("#stage").innerHTML = `<div id="col" class="wide"><h2 class="tt">${t("loadErr")}</h2><p><a class="b" href="../index.html#slides">${t("home")}</a></p></div>`;
      return;
    }
  }
  shell(); bind();
  const h = parseInt(location.hash.slice(1), 10);
  index = Number.isFinite(h) ? Math.min(Math.max(h, 0), deck.slides.length - 1) : 0;
  buildDrawer(); render();
}

function sizeClass(html) {
  const n = html.replace(/<[^>]+>/g, "").length + (html.match(/\\[(\[]/g) || []).length * 25 + (html.match(/<li>/g) || []).length * 70 + (html.match(/\\\\/g) || []).length * 45;
  return n > SIZE_NARROW ? "s4" : n > 1100 ? "s3" : n > 750 ? "s2" : n > 420 ? "s1" : "";
}
const tex = s => lang ? s.replace(/\\pgcd/g, "\\gcd").replace(/\\ppcm/g, "\\operatorname{lcm}") : s;

// Cumulative reveal: one block per sentence, list item, paragraph or table, shown step by step.
function revealMarkup(html) {
  const template = document.createElement("template"); template.innerHTML = html;
  const parts = []; let pending = "";
  const flush = () => { if (pending.trim()) parts.push(pending); pending = ""; };
  for (const node of template.content.childNodes) {
    if (node.nodeType === 1 && ["UL", "OL"].includes(node.tagName)) {
      flush(); [...node.children].forEach((li, i) => parts.push(`<${node.tagName.toLowerCase()} ${node.tagName === "OL" ? `start="${i + 1}"` : ""}>${li.outerHTML}</${node.tagName.toLowerCase()}>`));
    } else if (node.nodeType === 3) {
      const text = node.textContent; let start = 0, math = false;
      for (let i = 0; i < text.length; i++) {
        if (text.slice(i, i + 2) === "\\(" || text.slice(i, i + 2) === "\\[") math = true;
        if (text.slice(i, i + 2) === "\\)" || text.slice(i, i + 2) === "\\]") math = false;
        if (!math && text[i] === "." && /^\s+[A-ZÀ-Ý]/.test(text.slice(i + 1))) { pending += text.slice(start, i + 1); flush(); start = i + 1; }
      }
      pending += text.slice(start);
    } else if (node.nodeType === 1) {
      if (node.tagName === "BR") flush(); else if (["P", "DIV", "TABLE", "PRE"].includes(node.tagName)) { flush(); parts.push(node.outerHTML); } else pending += node.outerHTML;
    }
  }
  flush(); return (parts.length ? parts : [html]).map((part, i) => `<div class="reveal-block" data-reveal="${i + 1}">${part}</div>`).join("");
}

const blocks = () => [...document.querySelectorAll("#flow [data-reveal]")];
function paintSteps() {
  const all = blocks();
  all.forEach((b, i) => { b.hidden = i >= step; });
  const n = Math.max(all.length, 1);
  $("#step-count").textContent = all.length ? `${t("step")} ${Math.min(step, n)} / ${n}` : "";
  $("#step-prev").disabled = step <= 1 && index === 0; $("#step-next").disabled = step >= n && index === deck.slides.length - 1;
  $("#all-steps").classList.toggle("on", all.length > 0 && step >= all.length && all.length > 1);
  $("#all-steps").hidden = all.length < 2;
}
function advance(direction) {
  const n = blocks().length;
  if (direction > 0 && step < n) { step++; paintSteps(); const b = blocks()[step - 1]; b?.scrollIntoView({ block: "nearest", behavior: "instant" }); }
  else if (direction < 0 && step > 1) { step--; paintSteps(); }
  else go(index + direction, direction < 0);
}

function companion(spec, showDelta) {
  if (live) { live.destroy?.(); live = null; }
  $("#live").hidden = false; $("#live-lab").textContent = t("liveLab");
  live = mount({ ...spec, showDelta }, { host: $("#wcanvas"), controls: $("#wctl"), readout: $("#readout"), hint: $("#whint"), lang });
}

function figSrc(deckKey, name) { const file = `${deckKey}-${name}${lang ? "-en" : ""}.svg`; return EXPORT ? EXPORT.figs[file] || "" : `./fig/${encodeURIComponent(file)}`; }

async function render() {
  const renderId = ++generation;
  if (live) { live.destroy?.(); live = null; }
  const s = deck.slides[index], k = s.k, label = KIND[k]?.[lang] || k;
  document.documentElement.lang = lang ? "en" : "fr";
  document.title = `${deck.title[lang]} · Maths Explorer`;
  const title = esc(s.t[lang]), rawBody = tex(s.b[lang] || "");
  const widgets = deck.slides.filter(x => x.k === "widget"), shared = widgets[0];
  const ans = s.a ? tex(s.a[lang]) : "";
  const figs = (s.f || []).map(p => `<figure class="fig"><img src="${figSrc(deckId, p[lang])}" alt="${esc(s.t[lang])}"></figure>`).join("");
  const mode = k === "title" || k === "code" ? "none" : k === "widget" ? "widget" : figs ? "fig" : shared && k !== "goals" ? "explore" : "none";
  const col = $("#col"), flow = $("#flow"), rt = $("#rt");
  col.className = mode === "none" ? "wide" : ""; col.dataset.kind = k;
  $("#live").hidden = true; $("#readout").innerHTML = "";

  if (k === "title") {
    flow.innerHTML = `<div class="title-slide"><span class="chip">${esc(COURSE[deck.course] || "")}</span><h1>${title}</h1><div class="meta">${deck.slides.length} ${t("slides")}</div><div class="hint">${t("hint")}</div></div>`;
  } else if (k === "code") {
    flow.innerHTML = `<div class="hd">${esc(label)}</div><h2 class="tt">${title}</h2><pre>${s.b[lang]}</pre>`;
  } else {
    const cls = sizeClass(rawBody + ans);
    flow.innerHTML = `<div class="hd ${k === "error" ? "red" : ""}"><span>${esc(label)}</span><span class="deckname">${esc(deck.title[lang])}</span></div><h2 class="tt">${title}</h2>${s.h?.[lang] ? `<div class="sub">${esc(s.h[lang])}</div>` : ""}<div class="steps text ${cls}">${revealMarkup(rawBody)}</div>${ans ? `<div class="answer text ${cls}" id="ans" ${revealed ? "" : "hidden"}><div class="hd green">${t("answerLab")}</div>${ans}</div>` : ""}`;
  }

  if (mode === "fig") rt.innerHTML = `<div class="figcol">${figs}</div>`;
  else if (mode === "widget" || mode === "explore") {
    rt.innerHTML = `<div class="hint-line" id="whint"></div><div class="canvas-wrap" id="wcanvas"></div>${mode === "explore" ? `<label class="explore-label">${t("explore")}<select id="explore-choice">${widgets.map((w, i) => `<option value="${i}">${esc(w.t[lang])}</option>`).join("")}</select></label><p class="note">${t("free")}</p>` : ""}<div class="wctl" id="wctl"></div>`;
  } else rt.innerHTML = "";
  rt.hidden = mode === "none";

  chrome();
  const defined = deck.slides.findIndex(x => x.k === "concept" && /Discriminant/.test(x.t[0]));
  if (mode === "widget") companion(s.w, true);
  else if (mode === "explore") {
    companion(shared.w, defined < 0 || index >= defined);
    $("#explore-choice").onchange = e => companion(widgets[+e.target.value].w, true);
  }
  paintSteps(); flow.scrollTop = 0;
  try { history.replaceState(null, "", EXPORT ? `#${index}` : `?deck=${encodeURIComponent(deckId)}&lang=${lang ? "en" : "fr"}#${index}`); } catch {}
  try {
    if (typeof MathJax === "undefined") throw new Error("MathJax");
    await MathJax.startup.promise; await document.fonts.load('400 25px "STIX Two Text"');
    if (renderId === generation) { await MathJax.typesetPromise([$("#stage")]); $("#stage").querySelectorAll("mjx-assistive-mml").forEach(x => x.remove()); }
  } catch (e) { console.warn(e); if (renderId === generation && typeof MathJax === "undefined") toast(t("noMath")); }
}

function chrome() {
  const s = deck.slides[index], n = deck.slides.length;
  $("#count").textContent = `${index + 1} / ${n}`;
  $("#pv").disabled = index === 0; $("#nx").disabled = index === n - 1;
  $("#pv").setAttribute("aria-label", t("prev")); $("#nx").setAttribute("aria-label", t("next"));
  $("#step-prev").setAttribute("aria-label", t("stepPrev")); $("#step-next").setAttribute("aria-label", t("stepNext"));
  $("#all-steps").textContent = t("all");
  const rev = $("#rev"); rev.hidden = !s.a; rev.textContent = revealed ? t("hide") : t("answer"); rev.setAttribute("aria-pressed", revealed);
  $("#lng").textContent = t("lang"); $("#lst").textContent = t("list"); $("#fs").setAttribute("aria-label", t("full"));
  const dl = $("#dl"); if (dl) { dl.href = `./export/${encodeURIComponent(deckId)}.html`; dl.setAttribute("download", `${deckId}.html`); dl.textContent = "⬇ HTML"; dl.title = t("downloadTip"); dl.setAttribute("aria-label", t("downloadTip")); }
  $("#prog i").style.width = `${((index + 1) / n) * 100}%`;
  document.querySelectorAll("#drawer button").forEach((b, i) => b.toggleAttribute("aria-current", i === index));
}

function buildDrawer() {
  const d = $("#drawer");
  d.innerHTML = deck.slides.map((x, i) => `<button data-i="${i}">${i + 1}. ${esc((KIND[x.k]?.[lang] || x.k) + " · " + x.t[lang])}</button>`).join("");
  d.querySelectorAll("button").forEach(b => { b.onclick = () => { setDrawer(false); go(+b.dataset.i); }; });
}
function setDrawer(on) { $("#drawer").hidden = !on; $("#lst").setAttribute("aria-pressed", on); }

function go(i, toEnd = false) {
  index = Math.min(Math.max(i, 0), deck.slides.length - 1); revealed = false; step = 1;
  render().then(() => { if (toEnd) { step = Math.max(blocks().length, 1); paintSteps(); } });
}
function toggleAnswer() {
  if (!deck.slides[index].a) return;
  revealed = !revealed; $("#ans").hidden = !revealed;
  const b = $("#rev"); b.setAttribute("aria-pressed", revealed); b.textContent = revealed ? t("hide") : t("answer");
  if (revealed) $("#ans").scrollIntoView({ block: "nearest", behavior: "instant" });
}
function setLang(v) { lang = v; try { localStorage.setItem("me-slides-lang", lang ? "en" : "fr"); } catch {} buildDrawer(); render(); }

function bind() {
  $("#nx").onclick = () => go(index + 1); $("#pv").onclick = () => go(index - 1);
  $("#step-next").onclick = () => advance(1); $("#step-prev").onclick = () => advance(-1);
  $("#all-steps").onclick = () => { step = blocks().length; paintSteps(); };
  $("#lng").onclick = () => setLang(lang ? 0 : 1);
  $("#lst").onclick = () => setDrawer($("#drawer").hidden);
  $("#rev").onclick = toggleAnswer;
  $("#fs").onclick = () => {
    const de = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const rq = de.requestFullscreen || de.webkitRequestFullscreen;
    if (!rq) { toast(t("blocked")); return; }
    let r; try { r = rq.call(de); } catch (e) { toast(t("blocked")); return; }
    Promise.resolve(r).then(() => { try { screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} }).catch(() => toast(t("blocked")));
  };
}
addEventListener("keydown", e => {
  if (!deck || e.target.closest?.("input,select,textarea,canvas,button,a")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); advance(1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); advance(-1); }
  else if (k === "Home") go(0); else if (k === "End") go(deck.slides.length - 1);
  else if (k === "r" || k === "R" || k === "ArrowDown") { e.preventDefault(); toggleAnswer(); }
  else if (k === "l" || k === "L") setLang(lang ? 0 : 1);
  else if (k === "g" || k === "G") setDrawer($("#drawer").hidden);
  else if (k === "f" || k === "F") $("#fs").click();
  else if (k === "Escape" && !$("#drawer").hidden) setDrawer(false);
});
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1), 10); if (deck && Number.isFinite(h) && h !== index) go(h); });
document.addEventListener("fullscreenchange", () => setTimeout(fit, 100));
addEventListener("resize", fit); fit();
load();

})();
</script>
</body>
</html>
