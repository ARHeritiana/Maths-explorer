<title>Maths Explorer Nocturne</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;500;700;800&family=Sora:wght@300;600;800&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400;1,600&display=swap">
<style>
/* Layout: the figure is the page. A full-bleed canvas carries the text; everything else is hairline and type.
   The home page is a slideshow of live figures, one after the other.
   Colour: one cool curve (ice for the falling branch, ultramarine for the rising one), one warm colour for whatever
   you can move. No other hue. Dark first, like a night sky for mathematics; the light theme is clean white paper. */
:root {
  color-scheme: dark;
  --bg: #070b16; --bg-2: #0d1325; --panel: rgba(13, 19, 37, .78);
  --ink: #eef1fb; --ink-2: #c3c9de; --muted: #8e97b5; --line: #232d4d;
  --grid: rgba(160, 185, 255, .06); --grid-2: rgba(160, 185, 255, .15);
  --down: #6fe3ff; --up: #8aa0ff; --hand: #ffc247; --acc: #9db0ff; --acc-ink: #070b16;
  --display: "Manrope", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --math: "STIX Two Text", "Times New Roman", serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
:root[data-face="b"] { --display: "Sora", system-ui, sans-serif; }
:root[data-face="c"] { --display: "STIX Two Text", "Times New Roman", serif; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #fbfbfe; --bg-2: #f0f1f8; --panel: rgba(251, 251, 254, .82);
  --ink: #0a0f1f; --ink-2: #363e5c; --muted: #5e6786; --line: #d6d9ea;
  --grid: rgba(20, 30, 90, .07); --grid-2: rgba(20, 30, 90, .17);
  --down: #0a86ab; --up: #2a3fe0; --hand: #d96f00; --acc: #2a3fe0; --acc-ink: #fbfbfe; } }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fbfbfe; --bg-2: #f0f1f8; --panel: rgba(251, 251, 254, .82);
  --ink: #0a0f1f; --ink-2: #363e5c; --muted: #5e6786; --line: #d6d9ea;
  --grid: rgba(20, 30, 90, .07); --grid-2: rgba(20, 30, 90, .17);
  --down: #0a86ab; --up: #2a3fe0; --hand: #d96f00; --acc: #2a3fe0; --acc-ink: #fbfbfe; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 1.0625rem/1.65 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.05; letter-spacing: -.035em; }
:root[data-face="c"] h1, :root[data-face="c"] h2 { font-weight: 700; letter-spacing: -.02em; }
h1 { font-size: clamp(2.3rem, 5.4vw, 4.4rem); }
h2 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); }
h3 { font: 700 1.1rem/1.3 var(--body); }
h1 em, h2 em { font-style: normal; font-weight: 300; color: var(--down); }
:root[data-face="c"] h1 em, :root[data-face="c"] h2 em { font-style: italic; font-weight: 400; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--hand); outline-offset: 3px; }
.v { font-family: var(--math); font-style: italic; }
.kicker { font: 500 .78rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1240px; margin-inline: auto; padding-inline: var(--gl) var(--gr); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0 36px; }
.brand { display: flex; align-items: center; gap: 12px; padding-block: 14px; text-decoration: none; font: 800 1.15rem var(--display); letter-spacing: -.03em; }
.brand svg { width: 28px; height: 28px; overflow: visible; }
.doors { display: flex; gap: 6px; order: 3; width: 100%; margin-inline: -10px; }
.doors a { position: relative; text-decoration: none; padding: 10px 10px 12px; min-height: 44px; font-weight: 700; font-size: .98rem; color: var(--muted); transition: color .2s; }
.doors a::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--hand); transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.doors a:hover { color: var(--ink); } .doors a[aria-current] { color: var(--ink); } .doors a[aria-current]::after, .doors a:hover::after { transform: scaleX(1); }
.tools { margin-left: auto; display: flex; gap: 4px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--ink-2); cursor: pointer; border-radius: 50%; }
.icon-btn:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
@media (min-width: 720px) { .doors { order: 0; width: auto; margin: 0 auto 0 0; } }

.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 24px; border-radius: 999px; font: 700 .98rem var(--body); text-decoration: none; border: 1.5px solid var(--ink-2); background: transparent; color: var(--ink); cursor: pointer; transition: transform .2s, background .2s, color .2s; }
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.solid { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); } .btn.solid:hover { transform: translateY(-2px); background: var(--acc); color: var(--acc-ink); }

/* the stage: a full-bleed canvas that carries the page */
.hero { position: relative; display: grid; }
.stage { position: relative; height: 62vh; min-height: 400px; width: 100%; background: radial-gradient(120% 90% at 70% 40%, var(--bg-2), var(--bg) 70%); overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; transition: opacity .32s ease; }
.stage.swap canvas { opacity: 0; }
.stage.kbd canvas:focus { outline: 2px solid var(--hand); outline-offset: -3px; }
.hint { position: absolute; left: 16px; bottom: 14px; z-index: 2; font: 500 .75rem var(--mono); letter-spacing: .06em; color: var(--muted); transition: opacity .6s; pointer-events: none; }
.touched .hint, .swap .hint { opacity: 0; }
.bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid var(--line); background: var(--bg); }
.bar > div { padding: 12px 20px 14px; border-right: 1px solid var(--line); min-width: 0; }
.bar > div:last-child { border-right: 0; }
.bar b { display: block; font: 500 .74rem var(--mono); letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.bar span { font: 500 .96rem var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar .dn { color: var(--down); } .bar .upc { color: var(--up); }

/* home slideshow */
.copy { padding: 32px var(--gr) 28px var(--gl); display: grid; gap: 24px; max-width: 660px; }
.slides { display: grid; }
.slide { grid-area: 1 / 1; display: grid; gap: 20px; align-content: start; opacity: 0; transform: translateY(16px); visibility: hidden; transition: opacity .55s, transform .55s cubic-bezier(.2, .8, .2, 1), visibility 0s .55s; }
.slide.on { opacity: 1; transform: none; visibility: visible; transition-delay: .2s, .2s, 0s; }
.slide .lede { font-size: 1.15rem; color: var(--ink-2); max-width: 38ch; }
.acts { display: flex; flex-wrap: wrap; gap: 12px; }
.pager { display: flex; align-items: end; gap: 10px; }
.pg { flex: 1 1 0; min-width: 0; display: grid; gap: 8px; padding: 10px 0 0; background: none; border: 0; color: var(--muted); text-align: left; cursor: pointer; min-height: 44px; font: 700 .82rem var(--body); }
.pg:hover { color: var(--ink); } .pg[aria-current] { color: var(--ink); }
.pgt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pgb { position: relative; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.pgb i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--hand); }
.pg.done .pgb i { width: 100%; }
.pg[aria-current] .pgb i { animation: fill var(--dur, 9s) linear forwards; }
.hero.paused .pg[aria-current] .pgb i { animation-play-state: paused; }
.hero.static .pg[aria-current] .pgb i { animation: none; width: 100%; }
@media (max-width: 600px) { .pgt { display: none; } .pg { padding-top: 18px; } }
@keyframes fill { to { width: 100%; } }
.pp { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.pp:hover { border-color: var(--ink-2); color: var(--ink); }
@media (min-width: 900px) {
  .hero--home .stage { position: absolute; inset: 0; height: auto; min-height: 0; }
  .hero--home { min-height: min(88vh, 840px); align-content: space-between; }
  .hero--home::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, var(--bg) 4%, color-mix(in srgb, var(--bg) 78%, transparent) 30%, transparent 58%); }
  .hero--home .copy { position: relative; z-index: 2; pointer-events: none; padding: 7vh 0 3vh max(var(--gl), calc((100vw - 1240px) / 2 + var(--gl))); margin-block: auto; }
  .hero--home .copy a, .hero--home .copy button { pointer-events: auto; }
  .hero--home .bar { position: relative; z-index: 2; background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
}

/* sections */
main > section + section { margin-top: clamp(64px, 9vw, 120px); }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 24px; padding-bottom: 20px; }
.sec-head a { font-weight: 700; color: var(--acc); text-underline-offset: 5px; }
.index { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink-2); }
.index li { border-bottom: 1px solid var(--line); }
.index a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 24px; align-items: baseline; padding: 22px 0; text-decoration: none; transition: padding-left .35s cubic-bezier(.2, .8, .2, 1); }
.index a:hover { padding-left: 14px; }
.index .t { font: 700 clamp(1.35rem, 2.6vw, 1.9rem)/1.15 var(--display); letter-spacing: -.025em; transition: color .2s; }
.index .t em { font-style: normal; font-weight: 300; }
:root[data-face="c"] .index .t em { font-style: italic; font-weight: 400; }
.index a:hover .t { color: var(--hand); }
.index .d { grid-column: 1; color: var(--ink-2); max-width: 62ch; }
.index .m { grid-row: 1; grid-column: 2; font: 500 .85rem var(--mono); color: var(--muted); white-space: nowrap; }
.index .m i { font-style: normal; color: var(--hand); margin-left: 8px; display: inline-block; transition: transform .3s; } .index a:hover .m i { transform: translateX(6px); }
.index.g a { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 2px 24px; align-items: center; }
.index.g .d { grid-column: 2; } .index.g .m { grid-column: 3; } .index.g svg { grid-row: 1 / span 2; width: 64px; height: 40px; fill: none; stroke: var(--down); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 600px) { .index.g a { grid-template-columns: 52px minmax(0, 1fr); } .index.g .m { grid-column: 2; grid-row: auto; } .index a:not(.gl) { grid-template-columns: minmax(0, 1fr); } .index a:not(.gl) .m { grid-column: 1; grid-row: auto; } }

/* chapter */
.crumb { color: var(--muted); font-size: .95rem; } .crumb a { color: var(--acc); }
.head { display: grid; gap: 18px; padding-block: 40px 28px; }
.head h1 { max-width: 16ch; }
.steps { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(130px, 1fr); list-style: none; margin: 0; padding: 0; overflow-x: auto; }
.steps a { display: grid; gap: 2px; padding: 12px 12px 12px 0; border-top: 2px solid var(--line); text-decoration: none; color: var(--muted); font-weight: 700; font-size: .95rem; min-height: 56px; }
.steps a b { font: 500 .72rem var(--mono); letter-spacing: .12em; }
.steps a:hover { color: var(--ink); } .steps a[aria-current] { color: var(--ink); border-top-color: var(--hand); }
.hero--chap { position: relative; margin-top: clamp(16px, 3vw, 40px); }
.mission { padding: 24px var(--gr) 28px var(--gl); display: grid; gap: 14px; background: var(--bg); border-top: 1px solid var(--line); }
.mission .tag { font: 500 .74rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--hand); }
.mission h3 { font: 700 1.2rem/1.35 var(--display); letter-spacing: -.02em; }
.choices { display: flex; gap: 8px; }
.choices button { width: 58px; height: 50px; font: 500 1.15rem var(--mono); border-radius: 12px; border: 1.5px solid var(--ink-2); background: transparent; color: var(--ink); cursor: pointer; transition: background .2s, transform .15s; }
.choices button:hover { transform: translateY(-2px); } .choices button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.verdict { padding: 12px 14px; border-radius: 10px; font-size: .96rem; border: 1px solid var(--line); }
.verdict.ok { border-color: var(--down); } .verdict.no { border-color: var(--hand); }
@media (min-width: 980px) {
  .hero--chap .stage { height: clamp(500px, 72vh, 720px); }
  .hero--chap .mission { position: absolute; z-index: 3; top: 24px; right: max(var(--gr), calc((100vw - 1240px) / 2 + var(--gr))); width: 340px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 22px; }
}
.two { display: grid; gap: 40px; } @media (min-width: 900px) { .two { grid-template-columns: 7fr 5fr; gap: 80px; } }
.prose { display: grid; gap: 16px; color: var(--ink-2); max-width: 60ch; } .prose strong { color: var(--ink); }
.proof { border-left: 2px solid var(--hand); padding-left: 22px; align-self: start; display: grid; gap: 10px; }
.proof .kicker { color: var(--hand); }
.filter { display: flex; flex-wrap: wrap; gap: 8px; }
.filter button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-2); font: 700 .95rem var(--body); cursor: pointer; transition: border-color .2s; }
.filter button:hover { border-color: var(--ink-2); } .filter button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
footer { margin-top: clamp(64px, 9vw, 120px); border-top: 1px solid var(--line); } footer .wrap { padding-block: 24px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; justify-content: space-between; color: var(--muted); font-size: .92rem; }
.face { display: flex; align-items: center; gap: 6px; } .face span { margin-right: 6px; }
.face button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink-2); font: 700 .85rem var(--body); cursor: pointer; }
.face button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const TAU = Math.PI * 2, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmt = (n, d = 2) => { const q = 10 ** d, v = Math.round(n * q) / q; return String(Object.is(v, -0) ? 0 : v).replace('.', ',').replace('-', '−'); };
const approx = (n) => (Math.abs(Math.round(n * 100) / 100 - n) < 1e-9 ? '=' : '≈');
const sgn = (n) => (n < 0 ? ' − ' : ' + ') + fmt(Math.abs(n));
const lab = (v) => String(+v.toFixed(8)).replace('.', ',').replace('-', '−');

/* ============ scenes ============
   A scene owns its state and describes itself to the engine:
   view (world box to fit), axes, hint, animating(), tick(dt,t), settle(k), draw(V), handles(), grab(k), drag(k,wx,wy,ctx,snap,V), nudge(k,dx,dy), fields(), touch() */

/* --- parabola, shared by home and chapter: f(x) = a(x − α)² + β --- */
const S = { al: 0, be: -2, a: 1, dx: 1.5 };
function parabolaForms() {
  const { al, be, a } = S, b = -2 * a * al, c = a * al * al + be, d = b * b - 4 * a * c;
  const lead = Math.abs(a - 1) < 5e-3 ? '' : Math.abs(a + 1) < 5e-3 ? '−' : fmt(a);
  const sq = Math.abs(al) < 5e-3 ? 'x²' : '(x ' + (al > 0 ? '−' : '+') + ' ' + fmt(Math.abs(al)) + ')²';
  const canon = 'f(x) = ' + lead + sq + (Math.abs(be) < 5e-3 ? '' : sgn(be));
  const dev = 'f(x) = ' + lead + 'x²' + (Math.abs(b) < 5e-3 ? '' : sgn(b) + 'x') + (Math.abs(c) < 5e-3 ? '' : sgn(c));
  const real = -be / a >= -1e-9, r = real ? Math.sqrt(Math.max(0, -be / a)) : 0, count = !real ? 0 : r < 1e-4 ? 1 : 2;
  const roots = count === 0 ? 'aucune racine réelle' : count === 1 ? 'x = ' + fmt(al) : `x₁ ${approx(al - r)} ${fmt(al - r)} · x₂ ${approx(al + r)} ${fmt(al + r)}`;
  return { canon, dev, delta: fmt(d), roots, count, a };
}
function makeParabola(o = {}) {
  const sh = { ...S }; let touched = !o.drift;
  const magnet = (v, V, on) => { if (!on) return v; const r = Math.round(v); return Math.abs(v - r) * V.s() < 7 ? r : v; };
  const f = (x) => sh.a * (x - sh.al) ** 2 + sh.be;
  return {
    view: { x0: -6.5, x1: 6.5, y0: -4.6, y1: 5 }, axes: true,
    hint: o.hint || 'glisse les points chauds · cercles blancs = racines · molette pour zoomer',
    touch() { touched = true; }, animating: () => !touched && !reduced,
    tick(dt, t) { S.al = 0.9 * Math.sin(t * 0.33); S.be = -2 + 0.7 * Math.sin(t * 0.27 + 1); S.a = 1 + 0.4 * Math.sin(t * 0.21); },
    settle(k, dragging) { let m = false; for (const key of ['al', 'be', 'a', 'dx']) { const d = S[key] - sh[key]; if (Math.abs(d) > 1e-5) { sh[key] += d * k(dragging ? 42 : 14); m = true; } else sh[key] = S[key]; } return m; },
    handles() { const r2 = -sh.be / sh.a, out = [{ k: 'V', x: sh.al, y: sh.be }, { k: 'P', x: sh.al + sh.dx, y: f(sh.al + sh.dx) }];
      if (r2 >= 0) { const r = Math.sqrt(r2); out.push({ k: 'R1', x: sh.al - r, y: 0, root: true, t: fmt(sh.al - r) }, { k: 'R2', x: sh.al + r, y: 0, root: true, t: fmt(sh.al + r) }); } return out; },
    grab(k) { const r = Math.sqrt(Math.max(0, -S.be / S.a)); return k === 'R1' ? S.al + r : S.al - r; },
    drag(k, wx, wy, other, snap, V) {
      if (k === 'V') { S.al = clamp(magnet(wx, V, snap), -40, 40); S.be = clamp(magnet(wy, V, snap), -40, 40); }
      else if (k === 'P') { let dx = wx - S.al; if (Math.abs(dx) < 0.3) dx = (S.dx < 0 ? -1 : 1) * 0.3;
