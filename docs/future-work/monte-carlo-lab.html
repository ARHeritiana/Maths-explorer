<!DOCTYPE html>

<title>Monte Carlo Lab — An interactive introduction</title>
<style>
:root{--ink:#1c3036;--muted:#64777a;--paper:#f5f7f5;--white:#ffffff;--line:#dae3df;--forest:#127a67;--forest-pale:#e7f5ef;--coral:#dc7860;--coral-pale:#fff1eb;--gold:#d8a13d;--blue:#426ca5;--shadow:0 8px 30px rgba(24,53,54,.055)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.52 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e8b15c;outline-offset:3px}button:disabled{opacity:.45;cursor:default}
main{max-width:1250px;margin:0 auto;padding:24px 28px 65px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:42px}.brand{display:flex;align-items:center;gap:11px;font-size:.82rem;font-weight:850;letter-spacing:.17em;text-transform:uppercase}.brandmark{display:grid;place-items:center;width:37px;height:37px;background:var(--forest);border-radius:12px;color:white;font-family:Georgia,serif;font-size:23px;letter-spacing:0}.locale{display:inline-flex;background:white;border:1px solid var(--line);padding:3px;border-radius:100px}.locale button{border:0;background:transparent;color:var(--muted);padding:6px 13px;border-radius:100px;font-size:12px;font-weight:800;letter-spacing:.04em}.locale button.active{background:var(--ink);color:#fff}.hero{display:grid;grid-template-columns: minmax(0,1.2fr) minmax(230px,.6fr);align-items:center;gap:48px;margin-bottom:33px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--forest);margin:0 0 14px}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.7rem,5.7vw,5.15rem);line-height:1.04;letter-spacing:-.052em;margin:0 0 17px;font-weight:500}.hero p{max-width:630px;color:#53676a;font-size:1.075rem;line-height:1.65;margin:0}.hero-diagram{border:1px solid var(--line);border-radius:22px;background:var(--white);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}.diagram-row{display:flex;align-items:center;gap:13px}.diagram-num{font:700 17px Georgia,serif;display:grid;place-items:center;background:#eaf1ed;color:var(--forest);border-radius:50%;flex:none;width:38px;height:38px}.diagram-content strong{display:block;font-size:13px}.diagram-content span{display:block;font-size:12px;color:var(--muted)}.diagram-line{border-left:1px dashed #bdcfc5;height:13px;margin:-7px 0 -7px 18px}
.section-kicker{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}.section-kicker h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#64777a;margin:0}.section-kicker span{font-size:12px;color:#889995}.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.tab{display:flex;align-items:center;gap:13px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 13px;color:var(--ink);min-height:80px;transition:transform .15s,border-color .15s,background .15s}.tab:hover{transform:translateY(-2px);border-color:#aabeb6}.tab[aria-selected=true]{border-color:var(--forest);background:var(--forest-pale);box-shadow:inset 0 0 0 1px var(--forest)}.tab-icon{font:400 27px/1 Georgia,serif;color:var(--forest);width:36px;text-align:center;flex:none}.tab strong{font-size:14px;display:block;line-height:1.15}.tab small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:5px;line-height:1.32}
.workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(315px,1fr);gap:16px;align-items:start}.card{border:1px solid var(--line);border-radius:20px;background:var(--white);box-shadow:var(--shadow);overflow:hidden}.visual-header{padding:21px 24px 13px}.visual-header h2{font:500 26px Georgia,serif;letter-spacing:-.025em;margin:0 0 5px}.visual-header p{font-size:13px;color:var(--muted);margin:0;min-height:20px}.stage{position:relative;padding:3px 12px 12px;background:linear-gradient(#fff,#fbfcfb)}.stage canvas{display:block;width:100%;aspect-ratio:1.43;touch-action:pan-y;cursor:crosshair;border-radius:13px}.stage.draw-mode canvas{touch-action:none;cursor:crosshair}.canvas-hint{position:absolute;bottom:19px;left:23px;right:23px;pointer-events:none;font-size:11px;font-weight:600;color:#55716b;display:inline-flex;gap:5px}.controlbar{border-top:1px solid var(--line);background:#fafcfb;padding:15px 18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.button{border-radius:11px;border:1px solid #ccd9d4;background:#fff;color:var(--ink);min-height:41px;padding:9px 14px;font-size:13px;font-weight:750;transition:background .15s,border-color .15s}.button:hover{background:#edf4f0}.button.primary{background:var(--forest);border-color:var(--forest);color:#fff;min-width:132px}.button.primary:hover{background:#0a6453}.button.iconbutton{padding:9px 11px;font-size:18px;line-height:18px}.speed-wrap{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}.speed-wrap select{max-width:108px;border:1px solid #ccd9d4;border-radius:10px;padding:8px 7px;color:var(--ink);background:white;font-size:12px}
.sidebar{display:flex;flex-direction:column;gap:16px}.reading-card{padding:22px 24px}.mini-eyebrow{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;color:var(--forest);margin-bottom:7px}.estimate{font:400 clamp(2.5rem,4.5vw,3.45rem)/1.15 Georgia,serif;font-variant-numeric:tabular-nums;letter-spacing:-.045em;white-space:nowrap}.estimate-unit{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:0}.metric-row{margin:19px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:15px}.metric-row div{border-top:1px solid var(--line);padding-top:12px;min-width:0}.metric-row dt{font-size:11px;color:var(--muted);margin-bottom:4px}.metric-row dd{font-size:16px;font-weight:780;margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.interval{margin-top:17px;background:#f0f6f3;border-radius:12px;padding:12px 13px;font-size:12px;line-height:1.5;color:#49615b}.interval strong{display:block;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px;font-size:13px}.reference-toggle{background:none;color:var(--forest);border:0;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px;font-weight:750}.explanation-card{padding:20px 24px}.explanation-card h3{margin:0 0 9px;font-size:15px}.explanation-card p{font-size:13px;color:#52676a;line-height:1.65;margin:0 0 12px}.formula{background:#f6f8f7;border-left:3px solid var(--forest);padding:12px 13px;font-family:Georgia,serif;font-size:16px;line-height:1.65;margin:13px 0;color:#263b3e;overflow-x:auto}.lesson-tip{font-size:12px;color:#675a37;background:#fbf5e9;padding:12px;border-radius:11px;line-height:1.6}.case-controls{display:flex;flex-direction:column;gap:10px;margin:0 0 16px}.setting{display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:12px;font-weight:750}.setting select{padding:8px 10px;max-width:205px;min-width:0;border:1px solid var(--line);background:white;border-radius:9px;font-size:12px;color:var(--ink)}.setting input[type=range]{accent-color:var(--forest);width:125px}.tip-highlight{color:var(--forest);font-weight:800}
.chart-card{margin-top:16px;padding:20px 22px 18px}.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap}.chart-head h3{font-size:16px;margin:0}.chart-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}.legend{font-size:11px;color:var(--muted);display:flex;gap:13px;align-items:center}.legend-swatch{display:inline-block;width:17px;height:0;border-top:2px solid var(--forest);vertical-align:middle;margin-right:5px}.legend-swatch.dashed{border-color:var(--coral);border-top-style:dashed}.chart-card canvas{display:block;width:100%;height:185px;margin:12px 0 3px}.chart-note{font-size:12px;color:var(--muted);margin:0}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:17px}.bottom article{padding:24px 26px;border:1px solid var(--line);background:white;border-radius:20px}.bottom h2{margin:0 0 10px;font:500 25px Georgia,serif}.bottom p{font-size:13px;line-height:1.75;color:#536669;margin:0 0 12px}.pseudocode{font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;background:#183538;color:#e7f6ed;padding:15px 17px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:12px;margin:12px 0}.bottom strong{color:var(--ink)}.takeaway{display:flex;gap:13px;align-items:flex-start;font-size:13px;color:#51686a;background:#e9f4ed;padding:14px;border-radius:12px}.takeaway-icon{font-size:24px;line-height:1}footer{margin:25px 0 0;text-align:center;font-size:12px;color:#8b9c98}
@media(max-width:920px){.workspace{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr}.reading-card,.explanation-card{height:100%}.hero{gap:20px}.hero h1{font-size:clamp(2.7rem,6vw,4.2rem)}}
@media(max-width:680px){main{padding:17px 13px 42px}.topbar{margin-bottom:29px}.hero{grid-template-columns:1fr;gap:18px;margin-bottom:28px}.hero-diagram{display:none}.hero h1{font-size:clamp(2.55rem,10vw,3.7rem)}.hero p{font-size:15px}.tabs{grid-template-columns:1fr 1fr;gap:7px}.tab{min-height:65px;padding:11px 9px;gap:6px;border-radius:12px}.tab-icon{font-size:23px;width:29px}.tab strong{font-size:12px}.tab small{font-size:10px}.visual-header{padding:17px 17px 10px}.visual-header h2{font-size:24px}.stage{padding:3px 5px 8px}.stage canvas{aspect-ratio:1.08}.canvas-hint{position:static;display:block;margin:6px 9px 3px;font-size:10px;line-height:1.45}.controlbar{gap:6px;padding:11px}.button{font-size:12px;padding:9px 10px;min-height:39px}.button.primary{min-width:95px}.speed-wrap{margin-left:0}.sidebar{display:flex}.reading-card,.explanation-card{padding:18px}.bottom{grid-template-columns:1fr}.bottom article{padding:20px}.chart-card{padding:16px 12px}.chart-card canvas{height:160px}.estimate{font-size:2.8rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="topbar"><div class="brand"><span class="brandmark">∑</span><span id="brand">THE MATH LAB</span></div><div class="locale" aria-label="Language"><button id="langEn" data-lang="en" class="active" type="button">EN</button><button id="langFr" data-lang="fr" type="button">FR</button></div></header>
<section class="hero" aria-labelledby="heroTitle"><div><p class="eyebrow" id="eyebrow"></p><h1 id="heroTitle"></h1><p id="heroIntro"></p></div><div class="hero-diagram" aria-label="Monte Carlo in three steps"><div class="diagram-row"><span class="diagram-num">1</span><div class="diagram-content"><strong id="step1"></strong><span id="substep1"></span></div></div><div class="diagram-line"></div><div class="diagram-row"><span class="diagram-num">2</span><div class="diagram-content"><strong id="step2"></strong><span id="substep2"></span></div></div><div class="diagram-line"></div><div class="diagram-row"><span class="diagram-num">3</span><div class="diagram-content"><strong id="step3"></strong><span id="substep3"></span></div></div></div></section>
<div class="section-kicker"><h2 id="chooseTitle"></h2><span id="chooseHint"></span></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Experiments"><button class="tab" id="tab-pi" type="button" role="tab" aria-selected="true" data-case="pi"><span class="tab-icon">π</span><span><strong id="tabTitle-pi"></strong><small id="tabSub-pi"></small></span></button><button class="tab" id="tab-lake" type="button" role="tab" aria-selected="false" data-case="lake"><span class="tab-icon">◌</span><span><strong id="tabTitle-lake"></strong><small id="tabSub-lake"></small></span></button><button class="tab" id="tab-integral" type="button" role="tab" aria-selected="false" data-case="integral"><span class="tab-icon">∫</span><span><strong id="tabTitle-integral"></strong><small id="tabSub-integral"></small></span></button><button class="tab" id="tab-walk" type="button" role="tab" aria-selected="false" data-case="walk"><span class="tab-icon">↗</span><span><strong id="tabTitle-walk"></strong><small id="tabSub-walk"></small></span></button></nav>
<div class="workspace"><section class="card visual-card" aria-labelledby="caseTitle"><div class="visual-header"><h2 id="caseTitle"></h2><p id="caseSubtitle"></p></div><div id="stage" class="stage"><canvas id="experimentCanvas" role="img" aria-label="Interactive Monte Carlo experiment"></canvas><span id="canvasHint" class="canvas-hint"></span></div><div class="controlbar"><button id="runBtn" class="button primary" type="button"></button><button id="oneBtn" class="button" type="button">+1</button><button id="hundredBtn" class="button" type="button">+100</button><button id="resetBtn" class="button iconbutton" type="button" title="Reset" aria-label="Reset">↺</button><label class="speed-wrap"><span id="speedLabel"></span><select id="speedSelect"><option value="1" id="speedSlow"></option><option value="15" selected id="speedNormal"></option><option value="200" id="speedFast"></option></select></label></div></section>
<aside class="sidebar"><section class="card reading-card"><div class="mini-eyebrow" id="estimateLabel"></div><div class="estimate"><span id="estimateValue">—</span><span class="estimate-unit" id="estimateUnit"></span></div><dl class="metric-row"><div><dt id="nLabel"></dt><dd id="nValue">0</dd></div><div><dt id="referenceLabel"></dt><dd id="referenceValue">—</dd></div><div><dt id="errorLabel"></dt><dd id="errorValue">—</dd></div><div><dt id="successLabel"></dt><dd id="successValue">—</dd></div></dl><div class="interval"><span id="intervalLabel"></span><strong id="intervalValue">—</strong></div><button id="revealBtn" class="reference-toggle" type="button"></button></section><section class="card explanation-card"><div id="caseControls" class="case-controls"></div><h3 id="methodTitle"></h3><p id="caseExplain"></p><div id="formula" class="formula"></div><p id="caseInsight"></p><div class="lesson-tip" id="caseChallenge"></div></section></aside></div>
<section class="card chart-card" aria-labelledby="chartTitle"><div class="chart-head"><div><h3 id="chartTitle"></h3><p id="chartSubtitle"></p></div><div class="legend"><span><i class="legend-swatch"></i><span id="estimatedLegend"></span></span><span><i class="legend-swatch dashed"></i><span id="exactLegend"></span></span></div></div><canvas id="chartCanvas" role="img" aria-label="Estimate convergence over number of simulations"></canvas><p class="chart-note" id="chartNote"></p></section>
<section class="bottom"><article><div class="eyebrow" id="generalEyebrow"></div><h2 id="algorithmTitle"></h2><p id="algorithmIntro"></p><pre class="pseudocode" id="pseudocode"></pre><p id="algorithmOutro"></p></article><article><div class="eyebrow" id="limitsEyebrow"></div><h2 id="limitsTitle"></h2><p id="limitsIntro"></p><div class="takeaway"><span class="takeaway-icon">√</span><span id="rateText"></span></div><p id="limitsOutro" style="margin-top:14px"></p></article></section>
<footer id="footer"></footer>
</main>
<script>
(()=>{'use strict';
const I18N={
 en:{brand:'THE MATH LAB',eyebrow:'INTERACTIVE EXPLORATION · PROBABILITY',hero:'Can randomness solve a problem?',intro:'Monte Carlo methods turn random experiments into numerical answers. Watch estimates emerge from thousands of unpredictable trials — then discover what they can and cannot tell us.',steps:[['Sample','Generate a random outcome'],['Measure','Evaluate an event or a quantity'],['Estimate','Average and quantify uncertainty']],choose:'CHOOSE AN EXPERIMENT',chooseHint:'Same idea, four very different problems',tab:{pi:['Find π','Darts and a circle'],lake:['Measure a lake','Draw your own shape'],integral:['Find an integral','Average function values'],walk:['Random walk','Will the walker escape?']},case:{pi:{title:'Can random dots reveal π?',sub:'A circle of radius 1 fits inside a square of side 2.',explain:'Each dot is placed uniformly in the square. The probability of landing inside the circle equals the ratio of their areas. If H of N dots land inside, H/N approximates π/4.',formula:'π ≈ 4 × H / N',insight:'The dots never form a perfect pattern. Yet the fraction inside the circle becomes increasingly stable.',challenge:'Try this: run 100 points, reset, and repeat. Why are the answers different each time?'},lake:{title:'How large is this lake?',sub:'The map square represents 10 km × 10 km. Draw a new shoreline directly on the map.',explain:'For a complicated boundary, randomly sample points across a region of known area. The fraction inside the lake estimates the fraction of the square covered by water.',formula:'Lake area ≈ 100 × H / N km²',insight:'This works for arbitrary shapes — even when finding an exact area formula is awkward. Sketch your own lake by dragging on the map.',challenge:'Try drawing a narrow, winding lake. How many random points do you need before the estimate looks reliable?'},integral:{title:'Integration by taking averages',sub:'Pick a function, then sample random x-values uniformly.',explain:'To estimate the area under a nonnegative curve, choose x uniformly between a and b. The average height approaches the mean value of the function; multiply by the interval width.',formula:'∫ₐᵇ f(x) dx ≈ (b − a) × (Σ f(xᵢ)) / N',insight:'A rare, very narrow spike is hard to catch by random sampling. Change the function to test this failure mode. With few samples the interval shown can be too narrow for such a spiky function: it may cover the true value less than 95% of the time.',challenge:'Choose “Narrow spike” and run only 100 trials. Does the estimated integral necessarily come close to the reference?'},walk:{title:'What are the odds of reaching the goal?',sub:'A walker moves +1 or −1 with equal probability until hitting a boundary.',explain:'A single path is unpredictable. But if we simulate many independent walks, the fraction that reaches the upper goal estimates the success probability.',formula:'P(reach +U first) ≈ successful walks / N',insight:'This is Monte Carlo for an event, not an area. For this fair random walk, a mathematical answer also exists: L / (U + L).',challenge:'Move the upper and lower boundaries. Can you make success rare, even though every step is a fair coin toss?'}},start:'▶ Run',pause:'Ⅱ Pause',speed:'Speed',slow:'Slow',normal:'Normal',fast:'Fast',reset:'Reset',estimate:'MONTE CARLO ESTIMATE',samples:'Independent trials',reference:'Reference',error:'Absolute error',inside:'Inside / total',success:'Successes',mean:'Mean sampled height',interval:'Approximate 95% uncertainty interval',intervalSmall:'Run more trials to see an uncertainty interval.',intervalHelp:'Based on sampling variability, not a guarantee that an individual estimate is correct.',reveal:'Reveal reference value',hide:'Hide reference value',method:'How does it work?',chart:'Convergence of the estimate',chartSub:'Observe how the fluctuations change as the number of experiments grows.',estLegend:'Estimate',refLegend:'Reference',emptyChart:'Begin the experiment to trace the estimates.',chartNote:'The horizontal reference line is a mathematical benchmark, not information used by the simulation.',hiddenChartNote:'The reference is hidden. Reveal it when you want to compare your estimate.',generalEyebrow:'THE GENERAL IDEA',algorithmTitle:'One recipe, many problems',algorithmIntro:'Although the experiments look different, their core algorithm is the same:',algorithmOutro:'The success of the method depends on drawing from the correct distribution — not merely choosing points that look random.',limitsEyebrow:'WHAT TO REMEMBER',limitsTitle:'Random does not mean exact',limitsIntro:'Monte Carlo estimates fluctuate between runs. Independent samples, correct models, and large enough sample sizes matter.',rate:'In many ordinary cases, typical sampling error falls roughly like 1/√N. To reduce it by a factor of 2, you need about 4 times as many samples.',limitsOutro:'The interval is an approximate 95% confidence interval for sampling uncertainty (for a fixed model). It does not account for a wrong model or biased sampling. Very rare events need special care.',footer:'Self-contained, offline-ready educational prototype · EN / FR',mapHint:'✎ Drag on the square to redraw the lake; sampling will reset.',plotHint:'Each dot shows a randomly sampled point. Green = inside; coral = outside.',integralHint:'Each point is (x, f(x)). Vertical lines indicate sampled heights.',walkHint:'The newest walk is emphasized; earlier paths are faint.',unitsLake:'km²',functionLabel:'Function',upperLabel:'Upper goal',lowerLabel:'Lower stop',funcOptions:['e^(−x²) on [0, 2]','sin²(πx) on [0, 1]','Narrow spike on [0, 1]'],noSamples:'—',trialsFormat:'trials',referenceSub:'Calculated from the polygon boundary',pseudo:'repeat N times:\n    generate one independent random trial\n    measure its outcome X\nreturn average(X₁, …, Xₙ)',pseudoCase:{pi:'hits = 0\nrepeat N times:\n    x = random uniform(-1, 1)\n    y = random uniform(-1, 1)\n    if x² + y² ≤ 1: hits += 1\nreturn 4 × hits / N',lake:'hits = 0\nrepeat N times:\n    x, y = random point in square\n    if inside_lake(x, y): hits += 1\nreturn 100 × hits / N   // km²',integral:'total = 0\nrepeat N times:\n    x = random uniform(a, b)\n    total += f(x)\nreturn (b − a) × total / N',walk:'wins = 0\nrepeat N times:\n    position = 0\n    while −L < position < U:\n        position += random choice(−1, +1)\n    if position == U: wins += 1\nreturn wins / N'},lakeDrawing:'New shoreline drawn. Start a fresh experiment.',drawSmall:'Draw a larger closed loop for a new lake.'},
 fr:{brand:'LE LABO DES MATHS',eyebrow:'EXPLORATION INTERACTIVE · PROBABILITÉS',hero:'Le hasard peut-il résoudre un problème ?',intro:'Les méthodes de Monte-Carlo transforment des expériences aléatoires en réponses numériques. Observez les estimations issues de milliers d’essais, puis découvrez leurs forces et leurs limites.',steps:[['Tirer au hasard','Générer une issue aléatoire'],['Mesurer','Évaluer un événement ou une grandeur'],['Estimer','Calculer une moyenne et son incertitude']],choose:'CHOISIR UNE EXPÉRIENCE',chooseHint:'Une même idée, quatre problèmes différents',tab:{pi:['Approcher π','Points dans un cercle'],lake:['Mesurer un lac','Dessinez votre forme'],integral:['Calculer une intégrale','Moyenne de valeurs'],walk:['Marche aléatoire','Atteindre la cible ?']},case:{pi:{title:'Le hasard peut-il révéler π ?',sub:'Un disque de rayon 1 est inscrit dans un carré de côté 2.',explain:'Chaque point est tiré uniformément dans le carré. La probabilité d’appartenir au disque est égale au rapport de leurs aires. Si H points sur N sont dans le disque, H/N approche π/4.',formula:'π ≈ 4 × H / N',insight:'Les points ne forment jamais de motif régulier. Pourtant, la proportion dans le disque se stabilise peu à peu.',challenge:'À essayer : simulez 100 points, réinitialisez et recommencez. Pourquoi les résultats changent-ils ?'},lake:{title:'Quelle est la superficie de ce lac ?',sub:'Le carré représente une carte de 10 km × 10 km. Dessinez vous-même le contour du lac.',explain:'Pour une frontière compliquée, on tire des points au hasard dans une région d’aire connue. La proportion de points dans le lac estime la fraction de la surface occupée par l’eau.',formula:'Aire du lac ≈ 100 × H / N km²',insight:'Cela fonctionne même pour des formes irrégulières, difficiles à mesurer par une formule. Dessinez un lac en glissant sur la carte.',challenge:'Dessinez un lac long et étroit. Combien de points faut-il avant que l’estimation soit convaincante ?'},integral:{title:'Intégrer en c function drawWalk(c,w,h){let x0=45,x1=w-21,y0=30,y1=h-42,W=x1-x0,H=y1-y0,maxT=Math.max(18,lastPath.length-1, ...oldPaths.map(p=>p.path.length-1)),high=upper+1,low=-lower-1;let X=t=>x0+t/maxT*W,Y=v=>y0+(high-v)/(high-low)*H;
 c.fillStyle='#fbfdfb';c.fillRect(x0,y0,W,H);for(let v=-lower;v<=upper;v++){let yy=Y(v);c.strokeStyle=v===0?'#b3c6c0':'#e7ede8';c.lineWidth=1;c.beginPath();c.moveTo(x0,yy);c.lineTo(x1,yy);c.stroke();}
 for(let [v,col] of [[upper,color.forest],[-lower,color.coral]]){c.setLineDash([5,5]);c.strokeStyle=col;c.lineWidth=1.6;c.beginPath();c.moveTo(x0,Y(v));c.lineTo(x1,Y(v));c.stroke();c.setLineDash([]);label(c,(v>0?'+':'')+v,x0-7,Y(v),col,12,'right');}
 oldPaths.forEach((o,i)=>{if(!o.path.length)return;c.beginPath();o.path.forEach((v,j)=>j?c.lineTo(X(j),Y(v)):c.moveTo(X(j),Y(v)));c.lineWidth=i===oldPaths.length-1?2.8:1.25;c.strokeStyle=i===oldPaths.length-1?(o.success?color.forest:color.coral):(o.success?'rgba(18,122,103,.18)':'rgba(220,120,96,.18)');c.stroke();if(i===oldPaths.length-1){let px=X(o.path.length-1),py=Y(o.path.at(-1));c.beginPath();c.arc(px,py,5,0,Math.PI*2);c.fillStyle=o.success?color.forest:color.coral;c.fill();}});
 c.strokeStyle='#8ba39b';c.lineWidth=1;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0,y1);c.lineTo(x1,y1);c.stroke();label(c,lang==='fr'?'nombre de pas':'number of steps',x1,y1+24,color.muted,11,'right');label(c,lang==='fr'?'position':'position',x0,y0-13,color.muted,11);if(!oldPaths.length){label(c,lang==='fr'?'Lancez des marches pour voir les trajectoires':'Run trials to see the paths',x0+W/2,y0+H/2,color.muted,12,'center');}}
function drawChart(){let {ctx:c,w,h}=metrics($('chartCanvas'));c.clearRect(0,0,w,h);let L=54,R=18,T=15,B=31,ww=w-L-R,hh=h-T-B;c.fillStyle='#fbfdfb';c.fillRect(L,T,ww,hh);let vals=history.map(p=>p.y).filter(Number.isFinite);let ref=reference(),show=showReference;let lowerY,upperY;if(!vals.length){if(show){lowerY=ref*.85;upperY=ref*1.15;}else{lowerY=0;upperY=mode==='lake'?100:mode==='pi'?4:1;}}else{let lo=Math.min(...vals,show?ref:Infinity),hi=Math.max(...vals,show?ref:-Infinity),spread=hi-lo||Math.max(Math.abs(hi)*.1,.05);lowerY=lo-spread*.18;upperY=hi+spread*.18;if(mode!=='integral')lowerY=Math.max(0,lowerY);if(mode==='walk')upperY=Math.min(1.04,upperY);}
 if(!Number.isFinite(lowerY)||!Number.isFinite(upperY)||upperY<=lowerY){lowerY=0;upperY=1;}
 const X=N=>L+(n>1?(N-1)/(n-1):.5)*ww,Y=v=>T+(upperY-v)/(upperY-lowerY)*hh;
 c.strokeStyle='#e6eee9';c.lineWidth=1;for(let i=0;i<=4;i++){let yy=T+hh*i/4;c.beginPath();c.moveTo(L,yy);c.lineTo(L+ww,yy);c.stroke();label(c,fmt(upperY-(upperY-lowerY)*i/4,(upperY-lowerY)<.06?3:2),L-6,yy,color.muted,10,'right');}
 if(show&&ref>=lowerY&&ref<=upperY){c.strokeStyle=color.coral;c.lineWidth=1.5;c.setLineDash([7,5]);c.beginPath();c.moveTo(L,Y(ref));c.lineTo(L+ww,Y(ref));c.stroke();c.setLineDash([]);}
 if(history.length){c.beginPath();history.forEach((p,i)=>i?c.lineTo(X(p.n),Y(p.y)):c.moveTo(X(p.n),Y(p.y)));c.strokeStyle=color.forest;c.lineWidth=2.25;c.lineJoin='round';c.stroke();let last=history[history.length-1];c.beginPath();c.arc(X(last.n),Y(last.y),4,0,Math.PI*2);c.fillStyle=color.forest;c.fill();}
 c.strokeStyle='#8aa29a';c.lineWidth=1;c.beginPath();c.moveTo(L,T);c.lineTo(L,T+hh);c.lineTo(L+ww,T+hh);c.stroke();label(c,'0',L,T+hh+17,color.muted,11,'center');label(c,countFmt(n),L+ww,T+hh+17,color.muted,11,'right');label(c,'N',L+ww+7,T+hh+17,color.ink,11);
 if(!history.length)label(c,I18N[lang].emptyChart,L+ww/2,T+hh/2,color.muted,12,'center');}
function pointerPos(e){let rect=$('experimentCanvas').getBoundingClientRect();let x=(e.clientX-rect.left)*stageSize.w/rect.width,y=(e.clientY-rect.top)*stageSize.h/rect.height;return {x:Math.max(0,Math.min(1,(x-experimentRect.x)/experimentRect.s)),y:Math.max(0,Math.min(1,(y-experimentRect.y)/experimentRect.s))};}
function onPointerDown(e){if(mode!=='lake')return;let p=pointerPos(e);drawing=true;pointerPts=[p];$('experimentCanvas').setPointerCapture(e.pointerId);e.preventDefault();}
function onPointerMove(e){if(mode!=='lake'||!drawing)return;let p=pointerPos(e),q=pointerPts.at(-1);if(Math.hypot(p.x-q.x,p.y-q.y)>.004)pointerPts.push(p);let {ctx:c}=metrics($('experimentCanvas'));drawDarts(c,stageSize.w,stageSize.h);c.save();c.strokeStyle=color.coral;c.lineWidth=2.5;c.setLineDash([5,5]);c.beginPath();pointerPts.forEach((a,i)=>i?c.lineTo(experimentRect.x+a.x*experimentRect.s,experimentRect.y+a.y*experimentRect.s):c.moveTo(experimentRect.x+a.x*experimentRect.s,experimentRect.y+a.y*experimentRect.s));c.stroke();c.restore();e.preventDefault();}
function segmentsIntersect(a,b,c,d){const cross=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);const p=cross(a,b,c),q=cross(a,b,d),r=cross(c,d,a),s=cross(c,d,b);return (p*q<0&&r*s<0);}
function selfIntersects(poly){let N=poly.length;for(let i=0;i<N;i++)for(let j=i+2;j<N;j++){if(i===0&&j===N-1)continue;if(segmentsIntersect(poly[i],poly[(i+1)%N],poly[j],poly[(j+1)%N]))return true;}return false;}
function onPointerUp(e){if(!drawing)return;drawing=false;let points=pointerPts;pointerPts=[];if(points.length>=12){ // discard redundant close points and thin long traces for accurate interactive geometry
 let simplified=points.filter((_,i)=>i%Math.max(1,Math.floor(points.length/250))===0);if(polyArea(simplified)>.002&&!selfIntersects(simplified)){shape=simplified;shapeName='custom';reset();updateCase();}else {setText('canvasHint',I18N[lang].drawSmall);drawAll();}}else {setText('canvasHint',I18N[lang].drawSmall);drawAll();}e.preventDefault();}
function frame(t){if(running){add(rate);}requestAnimationFrame(frame);}
$('tabs').addEventListener('keydown',e=>{const i=CASES.indexOf(mode);let j=e.key==='ArrowRight'?(i+1)%CASES.length:e.key==='ArrowLeft'?(i+CASES.length-1)%CASES.length:e.key==='Home'?0:e.key==='End'?CASES.length-1:-1;if(j<0)return;e.preventDefault();setCase(CASES[j]);$('tab-'+CASES[j]).focus();});
$('tabs').addEventListener('click',e=>{let button=e.target.closest('[data-case]');if(button)setCase(button.dataset.case);});
$('langEn').addEventListener('click',()=>{lang='en';renderLanguage();});$('langFr').addEventListener('click',()=>{lang='fr';renderLanguage();});
$('runBtn').addEventListener('click',()=>{running=!running;updateRunButton();});$('oneBtn').addEventListener('click',()=>{running=false;updateRunButton();add(1);});$('hundredBtn').addEventListener('click',()=>{running=false;updateRunButton();add(100);});$('resetBtn').addEventListener('click',reset);$('speedSelect').addEventListener('change',e=>rate=+e.target.value);$('revealBtn').addEventListener('click',()=>{showReference=!showReference;updateStats();drawChart();});
$('experimentCanvas').addEventListener('pointerdown',onPointerDown);$('experimentCanvas').addEventListener('pointermove',onPointerMove);$('experimentCanvas').addEventListener('pointerup',onPointerUp);$('experimentCanvas').addEventListener('pointercancel',onPointerUp);
if('ResizeObserver' in window){let ro=new ResizeObserver(()=>drawAll());ro.observe($('experimentCanvas'));ro.observe($('chartCanvas'));}else window.addEventListener('resize',drawAll);
renderLanguage();requestAnimationFrame(frame);
})();
