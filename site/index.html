    <script>
      // Reuse the actual SVG in the site header, including its computed colours.
      document.addEventListener("DOMContentLoaded", () => {
        const favicon = document.querySelector('link[rel="icon"]');
        const app = document.querySelector("#app");
        if (!favicon || !app) return;
        const syncFavicon = () => {
          const mark = app.querySelector(".brandmark");
          if (!mark) return;
          const copy = mark.cloneNode(true);
          copy.setAttribute("xmlns", "http://www.w3.org/2000/svg");
          const sourceNodes = [mark, ...mark.querySelectorAll("*")];
          const copyNodes = [copy, ...copy.querySelectorAll("*")];
          sourceNodes.forEach((node, i) => {
            const style = getComputedStyle(node);
            const target = copyNodes[i];
            target.removeAttribute("class");
            target.removeAttribute("aria-hidden");
            target.removeAttribute("focusable");
            for (const prop of ["fill", "stroke", "stroke-width", "stroke-linecap"]) {
              target.setAttribute(prop, style.getPropertyValue(prop));
            }
          });
          favicon.href = "data:image/svg+xml," +
            encodeURIComponent(new XMLSerializer().serializeToString(copy));
        };
        syncFavicon();
        new MutationObserver(syncFavicon).observe(app, { childList: true });
        new MutationObserver(syncFavicon).observe(document.documentElement, {
          attributes: true, attributeFilter: ["data-theme"]
        });
      });
    </script>
    <script>
      /* Apply the saved theme before first paint (no flash). Storage may be blocked. */
      try {
        var saved = localStorage.getItem("maths-explorer-theme");
        if (saved === "marine" || saved === "charbon") saved = "nuit";
        if (saved !== "jour" && saved !== "nuit")
          saved = matchMedia("(prefers-color-scheme: dark)").matches ? "nuit" : "jour";
        document.documentElement.dataset.theme = saved;
        document.querySelector('meta[name="theme-color"]').content = saved === "nuit" ? "#0c111b" : "#f5f6f8";
      } catch (e) {}
    </script>
