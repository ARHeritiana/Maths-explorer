'use strict';
const $=LX.$,fmt=LX.fmt,vf=LX.vf;
const show=LX.init(T,['explore','converse','practice','recap']);
// ---- Pure logic (language free)
const imp=(p,q)=>!p||q;
const isPrime=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d===0)return false;return true;};
const U=Array.from({length:20},(_,i)=>i+1);
const PRED=[
{id:'even',f:n=>n%2===0},{id:'odd',f:n=>n%2===1},{id:'m3',f:n=>n%3===0},{id:'m4',f:n=>n%4===0},{id:'m6',f:n=>n%6===0},
{id:'m23',f:n=>n%2===0&&n%3===0},{id:'prime',f:isPrime},{id:'gt10',f:n=>n>10},{id:'lt5',f:n=>n<5}
];
const predById=id=>PRED.find(x=>x.id===id);
const lit=(f,neg)=>neg?(n=>!f(n)):f;
// The four statements built from "if P then Q": a = hypothesis, b = conclusion, na/nb = negated or not.
const kinds=(p,q)=>[
{id:'imp',ha:p,hb:q,na:false,nb:false,sym:'P ⇒ Q'},
{id:'conv',ha:q,hb:p,na:false,nb:false,sym:'Q ⇒ P'},
{id:'contra',ha:q,hb:p,na:true,nb:true,sym:'¬Q ⇒ ¬P'},
{id:'inv',ha:p,hb:q,na:true,nb:true,sym:'¬P ⇒ ¬Q'}
].map(k=>({...k,a:predById(k.ha).f,b:predById(k.hb).f}));
const counters=k=>U.filter(n=>lit(k.a,k.na)(n)&&!lit(k.b,k.nb)(n));
const holds=k=>counters(k).length===0;
const roster=a=>'{'+a.join(' ; ')+'}';
// Sentences built from the text of a predicate: [affirmative, negative].
const clause=(id,neg)=>'n '+T.pred[id][neg?1:0];
const ifThen=(a,na,b,nb)=>fmt(T.ifThen,clause(a,na),clause(b,nb));

// ---- Explore: the promise
let P=true,Q=false;
function renderPromise(){
 $('togs').innerHTML=[['p',P,T.story.p],['q',Q,T.story.q]].map(([k,v,s])=>`<button type="button" class="tog" role="switch" aria-checked="${v}" data-var="${k}" aria-label="${fmt(T.togLabel,s,T.vt[+v])}"><span class="nm">${k.toUpperCase()}</span><span>${s}</span><span class="val">${T.vt[+v]}</span></button>`).join('');
 const v=imp(P,Q);
 $('pr-verdict').innerHTML=`<p class="fb ${v?'good':'bad'}">${T.verdict[LX.regionOf(P,Q)]} <strong>P ⇒ Q : ${vf(v)}</strong></p>`;
 $('tt').innerHTML=`<table class="tt"><caption class="sr">${T.ttCaption}</caption><thead><tr><th scope="col">P</th><th scope="col">Q</th><th scope="col">P ⇒ Q</th></tr></thead><tbody>${[[true,true],[true,false],[false,true],[false,false]].map(([p,qq])=>`<tr class="${p===P&&qq===Q?'cur':''}"><td class="${p?'y':'n'}">${vf(p)}</td><td class="${qq?'y':'n'}">${vf(qq)}</td><td class="${imp(p,qq)?'y':'n'}">${vf(imp(p,qq))}</td></tr>`).join('')}</tbody></table>`;
}
$('togs').addEventListener('click',e=>{const b=e.target.closest('[data-var]');if(!b)return;if(b.dataset.var==='p')P=!P;else Q=!Q;LX.keepFocus(renderPromise);});

// ---- Explore and converse: the same pair of properties P(n), Q(n) on U = {1 ; ... ; 20}
let vp='m6',vq='even',picked=null;
function pickers(){
 const html=k=>PRED.map(p=>`<button type="button" class="chip" data-${k}="${p.id}" aria-pressed="${p.id===(k==='p'?vp:vq)}">n ${T.pred[p.id][0]}</button>`).join('');
 ['','2'].forEach(s=>{$('ppick'+s).innerHTML=html('p');$('qpick'+s).innerHTML=html('q');});
}
function renderTest(){
 const Pf=predById(vp).f,Qf=predById(vq).f,items={'10':[],'01':[],'11':[],'00':[]};
 U.forEach(n=>items[LX.regionOf(Pf(n),Qf(n))].push(n));
 const bad=items['10'];
 $('venn-svg').innerHTML=LX.venn2({sel:new Set(bad.length?['10']:[]),expected:new Set(),checked:true,items,ring:picked,aria:bad.length?fmt(T.vennBad,roster(bad)):T.vennOk});
 $('test-read').innerHTML=bad.length?`<p class="fb bad"><strong>P ⇒ Q : ${vf(false)}.</strong> ${fmt(T.testBad,roster(bad),bad[0])}</p>`:`<p class="fb good"><strong>P ⇒ Q : ${vf(true)}${T.onU}</strong> ${T.testOk}</p>`;
 $('tiles').innerHTML=U.map(n=>{const p=Pf(n),qq=Qf(n),cls=!p?'hid':qq?'ok':'ko',glyph=!p?'○':qq?'✓':'✗';
  return `<button type="button" class="tile ${cls}${n===picked?' cur':''}" data-n="${n}" aria-pressed="${n===picked}" aria-label="${n} : ${T.status[!p?'free':qq?'ok':'ko']}">${n}<small>${glyph}</small></button>`;}).join('');
 $('tile-read').innerHTML=picked===null?T.tilesHint:fmt(T.tileRead,picked,vf(Pf(picked)),vf(Qf(picked)),T.status[!Pf(picked)?'freeLong':Qf(picked)?'okLong':'koLong']);
}
function renderConverse(){
 const ks=kinds(vp,vq),res=ks.map(k=>({k,ok:holds(k),c:counters(k)}));
 $('stmts').innerHTML=res.map(({k,ok,c})=>`<div class="stmt ${ok?'t':'f2'}"><div><span class="nm">${T.kind[k.id]}</span><span class="f">${k.sym}</span><div>${ifThen(k.ha,k.na,k.hb,k.nb)}</div></div><div><span class="badge ${ok?'t':'f'}">${vf(ok)}</span>${ok?'':' <span class="muted">'+fmt(T.counter,c[0])+'</span>'}</div></div>`).join('');
 const sameContra=res[0].ok===res[2].ok,sameInv=res[1].ok===res[3].ok,diff=res[0].ok!==res[1].ok;
 $('conv-read').innerHTML=`<p>${T.sameContra}</p>`+(diff?`<p class="note">${T.convDiffers}</p>`:'');
 const both=res[0].ok&&res[1].ok;
 $('equiv').innerHTML=`<div class="math">P ⇔ Q</div><p><span class="badge ${both?'t':'f'}">${vf(both)}</span> ${both?T.equivYes:T.equivNo}</p>`+
  (res[0].ok?'<p>'+T.suff+'</p>':'')+(res[1].ok?'<p>'+T.nec+'</p>':'');
}
function pairClick(e){
 const b=e.target.closest('[data-p],[data-q]');if(!b)return;
 if(b.dataset.p)vp=b.dataset.p;else vq=b.dataset.q;
 picked=null;
 LX.keepFocus(()=>{pickers();renderTest();renderConverse();});
}
$('panel-explore').addEventListener('click',pairClick);
$('panel-converse').addEventListener('click',pairClick);
$('tiles').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;picked=picked===+b.dataset.n?null:+b.dataset.n;LX.keepFocus(renderTest);});

// ---- Challenges
function itemValue(){
 const tr=T.facts.true,fa=T.facts.false,p=Math.random()<.5,qq=Math.random()<.5,c=T.c.c1;
 const ps=LX.pickOne(p?tr:fa),qs=LX.pickOne(qq?tr:fa),res=imp(p,qq);
 return LX.choice({q:fmt(c.q,ps,qs),opts:[T.vtrue,T.vfalse],correct:res?0:1,why:fmt(c.why,vf(p),vf(qq),vf(res)),hint:c.hint});
}
const GOODPAIRS=[['m6','even'],['m4','even'],['m6','m3'],['even','m4'],['prime','odd'],['gt10','odd'],['m3','m6'],['lt5','prime']];
function pairItem(kind){
 const [a,b]=LX.pickOne(GOODPAIRS),c=T.c[kind];
 const s0=ifThen(a,false,b,false);
 const conv=ifThen(b,false,a,false),contra=ifThen(b,true,a,true),inv=ifThen(a,true,b,true),iff=fmt(T.iff,clause(a,false),clause(b,false));
 const right=kind==='conv'?conv:contra,other=kind==='conv'?contra:conv;
 return LX.choice({q:fmt(c.q,s0),opts:[right,other,inv,iff],correct:0,why:fmt(c.why,right),hint:c.hint});
}
function itemCounter(){
 const bads=GOODPAIRS.filter(([a,b])=>counters({a:predById(a).f,b:predById(b).f,na:false,nb:false}).length);
 const [a,b]=LX.pickOne(bads),Pf=predById(a).f,Qf=predById(b).f,c=T.c.c4,wanted=U.filter(n=>Pf(n)&&!Qf(n));
 return {hint:c.hint,why:fmt(c.why,roster(wanted)),
 reveal(){$('quiz').querySelectorAll('[data-n]').forEach(t=>{t.disabled=true;if(wanted.includes(+t.dataset.n))t.classList.add('ko');});},
 render(body,api){
  body.innerHTML=`<p>${fmt(c.q,ifThen(a,false,b,false))}</p><div class="tiles" role="group" aria-label="${T.ia.tiles}">${U.map(n=>`<button type="button" class="tile" data-n="${n}">${n}</button>`).join('')}</div>`;
  body.addEventListener('click',e=>{const t=e.target.closest('[data-n]');if(!t||t.disabled)return;const n=+t.dataset.n,p=Pf(n),qq=Qf(n);
   if(p&&!qq){t.classList.add('ko');body.querySelectorAll('[data-n]').forEach(x=>{x.disabled=true;});api.answer(true,fmt(c.found,n)+' ');}
   else{t.disabled=true;t.classList.add('hid');api.answer(false,fmt(!p?c.notConcerned:c.holdsHere,n)+' ');}
  });
 }};
}
function itemGrid(){
 const [a,b]=LX.pickOne(GOODPAIRS),ks=kinds(a,b),want=ks.map(holds),c=T.c.c5;
 const st=[null,null,null,null];
 return {hint:c.hint,why:fmt(c.why,want.map((v,i)=>ks[i].sym+' : '+vf(v)).join(' ; ')),
 reveal(){$('quiz').querySelectorAll('[data-g]').forEach((b2,i)=>{st[i]=want[i];b2.textContent=vf(want[i]);b2.disabled=true;});},
 render(body,api){
  const text=ks.map(k=>ifThen(k.ha,k.na,k.hb,k.nb));
  body.innerHTML=`<p>${fmt(c.q,T.pred[a][0],T.pred[b][0],U.length)}</p><div class="stmts">${ks.map((k,i)=>`<div class="stmt"><div><span class="nm">${T.kind[k.id]}</span><span class="f">${k.sym}</span><div>${text[i]}</div></div><button type="button" class="chip" data-g="${i}" aria-label="${fmt(T.cellLabel,k.sym,'?')}">?</button></div>`).join('')}</div><div class="row"><button type="button" class="btn" id="c5-check">${T.q.check}</button></div>`;
  body.querySelectorAll('[data-g]').forEach(btn=>btn.addEventListener('click',()=>{const i=+btn.dataset.g;st[i]=st[i]===null?true:!st[i];btn.textContent=vf(st[i]);btn.setAttribute('aria-label',fmt(T.cellLabel,ks[i].sym,vf(st[i])));btn.closest('.stmt').className='stmt';}));
  $('c5-check').addEventListener('click',()=>{
   if(st.some(v=>v===null)){api.answer(false,c.fill+' ');return;}
   const bad=st.map((v,i)=>v===want[i]?-1:i).filter(i=>i>=0);
   body.querySelectorAll('.stmt').forEach((s,i)=>{s.className='stmt '+(st[i]===want[i]?'t':'f2');});
   api.answer(!bad.length,bad.length?fmt(c.wrong,bad.map(i=>ks[i].sym).join(', '))+' ':'');
  });
 }};
}
function itemIff(){const c=T.c.c6;return LX.choice({q:c.q,opts:c.opts,correct:0,why:c.why,hint:c.hint});}
function itemTheorem(){const c=T.c.c7;return LX.choice({q:c.q,opts:c.opts,correct:2,why:c.why,hint:c.hint});}
const makeQuiz=()=>[itemValue(),pairItem('conv'),pairItem('contra'),itemCounter(),itemGrid(),itemIff(),itemTheorem()];

// ---- Static content
$('recap-rows').innerHTML=T.recap.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
$('ideas').innerHTML=T.ideas;
pickers();renderPromise();renderTest();renderConverse();LX.quiz('quiz',makeQuiz);
LX.notifySize();
