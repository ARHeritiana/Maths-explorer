*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:1.0625rem/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 14px 48px;overflow-wrap:anywhere}

p{margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 16px;max-width:60ch}

button{font:inherit;color:var(--ink);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tab,.btn,.seg button,.op,.answer,.num,.cbtn,.law-btn{min-height:44px;min-width:44px;border-radius:10px;border:2px solid var(--line);background:var(--surf);padding:6px 12px;font-weight:700;text-align:left}
.tab{flex:1 1 auto;text-align:center}
.tab[aria-selected="true"],.seg button[aria-pressed="true"],.op[aria-pressed="true"],.cbtn[aria-pressed="true"],.law-btn[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{background:var(--ink);color:var(--paper);border-color:var(--ink);text-align:center}

.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.card{background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 6px 18px -12px rgba(19,48,59,.35);min-width:0}
.play,.practice,.reference,.concepts{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stagetop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{text-align:center}
.svg-holder{overflow-x:auto;margin-top:8px}
.svg-holder svg{display:block;width:100%;min-width:400px;height:auto}
.vframe{fill:var(--surf);stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 6}
.vu{fill:var(--mute);font:italic 16px "STIX Two Text",Georgia,serif}
.vlab{font:italic 600 27px "STIX Two Text",Georgia,serif}
.vel{fill:var(--ink);font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace}
.vtxt{fill:var(--ink);font:600 24px "STIX Two Text",Georgia,serif}
.vsmall{fill:var(--mute);font:16px "Atkinson Hyperlegible",system-ui,sans-serif}
g[data-region]{cursor:pointer}
g[data-region]:focus{outline:none}
g[data-region]:focus-visible .rg{opacity:.25;fill:var(--ink)}
g[data-region]:focus-visible .rg.on{opacity:.8}
.pills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px;margin-top:8px}
.pill{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:.85rem}
.pill.picked{border-color:var(--vs)}
.pill b{display:block;font-size:.8rem;color:var(--mute)}
.opgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:6px}
.op{display:flex;flex-direction:column;gap:2px}
.op .sym{font:600 1rem "STIX Two Text",Georgia,serif}
.op .nm{font-size:.8rem;font-weight:400}
.math{font:600 1.5rem/1.3 "STIX Two Text",Georgia,serif;margin:6px 0 2px}
.setrow{margin:8px 0}
.setrow code{display:block;font:700 .9rem ui-monospace,monospace;margin:2px 0 6px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.num{text-align:center;padding:4px;font-family:ui-monospace,monospace}
.num[aria-pressed="true"]{color:#fff;border-color:transparent}
.num.A[aria-pressed="true"]{background:var(--va)}.num.B[aria-pressed="true"]{background:var(--vb)}.num.C[aria-pressed="true"]{background:var(--vc)}
.cA{color:var(--va)}.cB{color:var(--vb)}.cC{color:var(--vc)}
.note{border-left:4px solid var(--vs);padding:6px 12px;margin:14px 0;background:var(--surf);border-radius:0 10px 10px 0}
.cbtn{display:flex;justify-content:space-between;gap:8px;width:100%;margin:2px 0}
.cbtn .gl{font-family:"STIX Two Text",Georgia,serif;white-space:nowrap;flex:none}
.cgroup{font-weight:700;font-size:.8rem;color:var(--mute);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.defn{font-size:1.05rem}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:10px 0}
.panels>div{border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.formula{font:600 1.3rem/1.4 "STIX Two Text",Georgia,serif;margin:14px 0;overflow-x:auto}
.answers{display:grid;gap:8px;margin:12px 0}
.answer{display:flex;gap:10px;align-items:center;font-weight:400;width:100%}
.answer .ltr{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-weight:700;font-size:.85rem}
.answer.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surf))}
.answer.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surf))}
.answer:disabled{color:var(--ink);cursor:default}
.ctx{font:600 1rem ui-monospace,monospace;background:var(--paper);border-radius:10px;padding:8px 10px;margin:8px 0;overflow-x:auto}
.fb{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:6px}
.score b{display:block;font:600 1.6rem "STIX Two Text",Georgia,serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.laws{display:grid;gap:4px}
.law-btn{width:100%;font-weight:400;text-align:left}
.halves{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.halves svg{min-width:0!important}
.halves .svg-holder{overflow:visible}
.tt{border-collapse:collapse;margin:8px 0;min-width:280px}
.tt th,.tt td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.tt .y{color:var(--ok);font-weight:700}.tt .n{color:var(--mute)}
.scroll{overflow-x:auto}
.mini{border-collapse:collapse;width:100%}
.mini td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
.mini td:first-child{font-family:"STIX Two Text",Georgia,serif;font-weight:600;white-space:nowrap}
@media (min-width:700px){.play{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.concepts,.reference{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)}.practice{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;src:url("../../fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;src:url("../../fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2");font-display:swap}
@font-face{font-family:"STIX Two Text";font-weight:600;src:url("../../fonts/stix-two-text-latin-600-normal.woff2") format("woff2");font-display:swap}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

lessons:{
set:{name:'Qu’est-ce qu’un ensemble ?',glyph:'{ }',title:'Une collection d’objets distincts',definition:'Un ensemble est une collection bien définie d’objets, appelés ses éléments. Un ensemble ne tient compte ni de l’ordre ni des répétitions.',formula:'A = {1 ; 2 ; 3}',example:'{1 ; 2 ; 2 ; 3} = {3 ; 2 ; 1} = {1 ; 2 ; 3}. Les mêmes éléments définissent le même ensemble.',caution:'Les accolades servent à écrire un ensemble. Les parenthèses, comme dans (1 ; 2), désignent en général un couple.'},
membership:{name:'Appartenance',glyph:'∈',title:'Appartient, ou n’appartient pas',definition:'Le symbole x ∈ A signifie que x est un élément de A ; x ∉ A signifie qu’il n’en est pas un. L’appartenance relie un objet à un ensemble.',formula:'2 ∈ A,  4 ∉ A',example:'Pour A = {1 ; 2 ; 3}, l’affirmation 2 ∈ A est vraie, mais 4 ∈ A est fausse.',caution:'2 ∈ A n’a pas le même sens que {2} ⊂ A. L’une concerne un élément, l’autre un ensemble.'},
empty:{name:'Ensemble vide',glyph:'∅',title:'Un ensemble sans élément',definition:'L’ensemble vide, noté ∅ ou {}, n’a aucun élément. Il est inclus dans tout ensemble, y compris dans lui-même.',formula:'Card(∅) = 0',example:'{x ∈ ℕ | x < 0} = ∅, où ℕ désigne l’ensemble des entiers naturels (0 compris).',caution:'∅ et {∅} sont différents : le second ensemble a exactement un élément, à savoir ∅.'},
universal:{name:'Ensemble de référence',glyph:'U',title:'Choisir l’univers dans lequel on travaille',definition:'L’ensemble de référence U (ou univers) contient tous les objets considérés. Les complémentaires sont toujours pris relativement à U.',formula:'U = {1 ; 2 ; 3 ; 4 ; 5 ; 6}',example:'Si U = {1 ; 2 ; 3 ; 4 ; 5 ; 6} et A = {1 ; 2 ; 3 ; 5}, alors 4 et 6 sont hors de A mais dans U.',caution:'Changer d’univers peut changer le complémentaire, même si A reste le même.'},
subset:{name:'Inclusion',glyph:'⊂',title:'Tous les éléments sont inclus',definition:'A ⊂ B signifie que tout élément de A est aussi un élément de B (on dit que A est une partie de B, ou un sous-ensemble de B). L’égalité est permise.',formula:'A ⊂ B ⇔ ∀x (x ∈ A ⇒ x ∈ B)',example:'{3 ; 5} ⊂ {1 ; 2 ; 3 ; 5}. De plus, A ⊂ A pour tout ensemble A.',caution:'A ⊂ B ne veut pas dire que A est plus petit. Pour exiger des ensembles différents, on utilise l’inclusion stricte. Selon les manuels, ⊂ désigne l’inclusion au sens large (convention du lycée français, suivie sur cette page) ou l’inclusion stricte ; le symbole ⊆ est aussi employé pour l’inclusion au sens large.'},
proper:{name:'Inclusion stricte',glyph:'⊊',title:'Inclus, mais pas égal',definition:'A ⊊ B signifie que tout élément de A appartient à B et que B contient au moins un élément qui n’est pas dans A.',formula:'A ⊊ B ⇔ A ⊂ B et A ≠ B',example:'{3 ; 5} ⊊ {1 ; 2 ; 3 ; 5}. Mais {3 ; 5} n’est pas strictement inclus dans lui-même.',caution:'Certains manuels écrivent ⊂ pour l’inclusion stricte, d’autres pour l’inclusion au sens large. Ici, ⊂ est large et ⊊ est strict : il n’y a pas d’ambiguïté.'},
equality:{name:'Égalité d’ensembles',glyph:'=',title:'Deux noms, les mêmes éléments',definition:'A = B exactement lorsque A ⊂ B et B ⊂ A. L’ordre d’écriture et les répétitions n’ont pas d’importance.',formula:'A = B ⇔ (A ⊂ B) et (B ⊂ A)',example:'{1 ; 3 ; 5} = {5 ; 1 ; 3 ; 3}.',caution:'Avoir le même cardinal ne suffit pas pour que deux ensembles soient égaux.'},
disjoint:{name:'Ensembles disjoints',glyph:'∩',title:'Aucun élément commun',definition:'A et B sont disjoints si leur intersection est vide : aucun objet n’appartient aux deux ensembles.',formula:'A ∩ B = ∅',example:'L’ensemble des entiers pairs et celui des entiers impairs sont disjoints.',caution:'Des ensembles disjoints peuvent être non vides. Deux ensembles disjoints peuvent recouvrir tout l’univers, mais ce n’est pas obligatoire.'},
union:{name:'Réunion',glyph:'∪',title:'Dans A ou dans B, ou dans les deux',definition:'La réunion rassemble tous les éléments qui appartiennent à au moins un des ensembles. Le « ou » mathématique est inclusif : il admet le cas où les deux propriétés sont vraies.',formula:'A ∪ B = {x | x ∈ A ou x ∈ B}',example:'{1 ; 2 ; 3 ; 5} ∪ {3 ; 4 ; 5} = {1 ; 2 ; 3 ; 4 ; 5}.',caution:'Les éléments communs aux deux ensembles ne figurent qu’une seule fois dans la réunion.'},
intersection:{name:'Intersection',glyph:'∩',title:'La partie commune',definition:'L’intersection contient exactement les éléments qui appartiennent aux deux ensembles à la fois.',formula:'A ∩ B = {x | x ∈ A et x ∈ B}',example:'{1 ; 2 ; 3 ; 5} ∩ {3 ; 4 ; 5} = {3 ; 5}.',caution:'Pour trouver l’intersection, il ne suffit pas de réunir les deux listes : on ne garde que les éléments communs.'},
difference:{name:'Différence',glyph:'∖',title:'On garde A, on retire B',definition:'La différence A ∖ B contient les éléments de A qui ne sont pas dans B. La différence dépend de l’ordre.',formula:'A ∖ B = {x | x ∈ A et x ∉ B}',example:'{1 ; 2 ; 3 ; 5} ∖ {3 ; 4 ; 5} = {1 ; 2}. En revanche, {3 ; 4 ; 5} ∖ {1 ; 2 ; 3 ; 5} = {4}.',caution:'Contrairement à la réunion et à l’intersection, A ∖ B est en général différent de B ∖ A.'},
complement:{name:'Complémentaire',glyph:'ᶜ',title:'Tout ce qui est hors de A',definition:'Le complémentaire Aᶜ de A (noté aussi Ā, ou U ∖ A) est formé de tous les éléments de U qui ne sont pas dans A.',formula:'Aᶜ = U ∖ A',example:'Si U = {1 ; 2 ; 3 ; 4 ; 5 ; 6} et A = {1 ; 2 ; 3 ; 5}, alors Aᶜ = {4 ; 6}.',caution:'On ne peut pas déterminer un complémentaire sans savoir ce que contient l’univers.'},
sym:{name:'Différence symétrique',glyph:'Δ',title:'Exactement un des deux, pas les deux',definition:'La différence symétrique est formée des éléments qui appartiennent à exactement un des deux ensembles. C’est leur réunion privée de leur intersection.',formula:'A Δ B = (A ∖ B) ∪ (B ∖ A)',example:'{1 ; 2 ; 3 ; 5} Δ {3 ; 4 ; 5} = {1 ; 2 ; 4}.',caution:'Elle exclut la partie commune, que la réunion ordinaire contient.'},
cardinality:{name:'Cardinal',glyph:'Card',title:'Combien d’éléments ?',definition:'Pour un ensemble fini, Card(A) (noté aussi |A|) est le nombre de ses éléments distincts. Pour compter une réunion, on retire une fois les éléments communs pour ne pas les compter deux fois.',formula:'Card(A ∪ B) = Card(A) + Card(B) − Card(A ∩ B)',example:'Si Card(A) = 4, Card(B) = 3 et Card(A ∩ B) = 2, alors Card(A ∪ B) = 4 + 3 − 2 = 5.',caution:'Compter les répétitions d’une liste écrite donne un cardinal faux.'},
power:{name:'Ensemble des parties',glyph:'𝒫',title:'L’ensemble de toutes les parties',definition:'L’ensemble des parties 𝒫(A) contient toutes les parties de A, y compris ∅ et A lui-même. Un ensemble fini à n éléments a 2<sup>n</sup> parties.',formula:'Card(𝒫(A)) = 2<sup>Card(A)</sup>',example:'𝒫({a ; b}) = {∅ ; {a} ; {b} ; {a ; b}} ; il a 4 éléments.',caution:'Les éléments de 𝒫(A) sont eux-mêmes des ensembles, et non les éléments a et b pris isolément.'},
cartesian:{name:'Produit cartésien',glyph:'×',title:'Former des couples',definition:'A × B est l’ensemble de tous les couples (a ; b) avec a dans A et b dans B. En général, (a ; b) est différent de (b ; a).',formula:'A × B = {(a ; b) | a ∈ A, b ∈ B}',example:'{1 ; 2} × {x ; y} = {(1 ; x) ; (1 ; y) ; (2 ; x) ; (2 ; y)}.',caution:'A × B et B × A ne sont pas toujours égaux : l’ordre dans un couple compte.'},
partition:{name:'Partition',glyph:'⋃',title:'Découper un ensemble sans recouvrement',definition:'Une partition d’un ensemble S est une famille de parties non vides, deux à deux disjointes, dont la réunion est S. Chaque élément appartient à exactement une partie.',formula:'S = S₁ ∪ S₂ ∪ ⋯,   Sᵢ ∩ Sⱼ = ∅ (i ≠ j)',example:'Pour S = {1 ; 2 ; 3 ; 4 ; 5 ; 6}, les ensembles {1 ; 3 ; 5} et {2 ; 4 ; 6} forment une partition.',caution:'Des groupes qui se chevauchent ou qui oublient des éléments ne forment pas une partition.'},
predicates:{name:'Notation en compréhension',glyph:'|',title:'Décrire les éléments par une règle',definition:'La notation en compréhension précise les éléments qui vérifient une propriété. L’écriture {x ∈ S | P(x)} désigne l’ensemble des x de S pour lesquels P(x) est vraie (la barre se lit « tel que »).',formula:'{x ∈ ℤ | x est pair}',example:'{x ∈ {1 ; 2 ; 3 ; 4 ; 5 ; 6} | x est pair} = {2 ; 4 ; 6}.',caution:'La propriété doit rendre l’appartenance sans ambiguïté.'}
},
diag:{empty:'aucun élément à l’intérieur',odd:'impairs',even:'pairs',label:{basic:'Un ensemble A contenant les éléments 1, 2 et 3, avec 4 à l’extérieur',nested:'Un cercle A dessiné à l’intérieur d’un cercle B plus grand',disjoint:'Deux cercles séparés A et B qui ne se recouvrent pas',equal:'Un seul cercle pour A = B',empty:'Un cercle A sans rien à l’intérieur',universe:'Un cercle A dans l’univers U, avec son complémentaire à l’extérieur',power:'Les quatre parties de {a ; b} : l’ensemble vide, {a}, {b} et {a ; b}',cartesian:'Les quatre couples de {1 ; 2} × {x ; y}',partition:'Les nombres de 1 à 6 répartis en impairs et pairs, deux parties sans recouvrement',union:'Diagramme de Venn de A ∪ B : les deux cercles sont colorés',intersection:'Diagramme de Venn de A ∩ B : seule la partie commune est colorée',diff:'Diagramme de Venn de A ∖ B : la partie de A hors de B est colorée',complement:'Diagramme de Venn du complémentaire de A : tout ce qui est hors de A est coloré',sym:'Diagramme de Venn de A Δ B : les deux cercles sont colorés sauf la partie commune'}},

function renderQuiz(){
 const q=quizState.current,selected=quizState.selected,done=selected!==null,U2=T.quizUi;
 $('quiz-area').innerHTML=`<div class="muted">${done?U2.review:U2.question} · ${U2.completed(quizState.total)}</div><h3 id="quiz-title" tabindex="-1">${q.prompt}</h3><div class="ctx">${q.context}</div><div class="answers">${q.choices.map((c,i)=>`<button class="answer ${done?(c.correct?'correct':selected===i?'wrong':''):''}" data-answer="${i}" ${done?'disabled':''}><span class="ltr">${'ABCD'[i]}</span><span>${c.text}${done&&c.correct?` <strong>✓<span class="sr"> ${U2.markRight}</span></strong>`:done&&selected===i?` <strong>✗<span class="sr"> ${U2.markWrong}</span></strong>`:''}</span></button>`).join('')}</div><div aria-live="polite">${done?`<div class="fb ${q.choices[selected].correct?'good':'bad'}"><strong>${q.choices[selected].correct?U2.right:U2.wrong}</strong> ${q.explanation}</div>`:quizState.hint?`<div class="fb">${q.hint}</div>`:''}</div><div class="row">${done?`<button id="quiz-next" class="btn">${U2.next}</button>`:`<button id="quiz-hint" class="btn alt" aria-expanded="${quizState.hint}">${U2.hint}</button>`}<button id="quiz-reset" class="btn alt">${U2.reset}</button></div>`;
 renderScore();
}
$('quiz-area').addEventListener('click',e=>{
 const answer=e.target.closest('[data-answer]');
 if(answer&&quizState.selected===null){quizState.selected=+answer.dataset.answer;quizState.total++;if(quizState.current.choices[quizState.selected].correct){quizState.correct++;quizState.streak++;}else quizState.streak=0;renderQuiz();$('quiz-next').focus({preventScroll:true});return;}
 if(e.target.closest('#quiz-hint')){quizState.hint=!quizState.hint;renderQuiz();$('quiz-hint').focus({preventScroll:true});return;}
 if(e.target.closest('#quiz-next')){nextQuestion(true);return;}
 if(e.target.closest('#quiz-reset')){quizState.total=quizState.correct=quizState.streak=0;nextQuestion(true);}
});
// Shade the diagram.
let shadeQuestion=null,shadeSelection=new Set(),shadeChecked=false,shadeRevealed=false;
const shadePrompts=[...ops3,{id:'notAAndB',symbol:'Aᶜ ∩ B',test:(a,b,c)=>!a&&b},{id:'ABCexcept',symbol:'(A ∩ B) ∖ C',test:(a,b,c)=>a&&b&&!c},{id:'diff3',symbol:'A ∖ (B ∩ C)',test:(a,b,c)=>a&&!(b&&c)},{id:'atLeastTwo',symbol:'(A ∩ B) ∪ (A ∩ C) ∪ (B ∩ C)',test:(a,b,c)=>Number(a)+Number(b)+Number(c)>=2}];
const shadeDescribe=p=>T.shadeDesc[p.id]||describe(p.id);
function expectedRegions(){return new Set(allBits(3).filter(bits=>shadeQuestion.test(...bits.split('').map(v=>v==='1'))));}
function newShade(){shadeQuestion=shadePrompts[rand(0,shadePrompts.length-1)];shadeSelection=new Set();shadeChecked=false;shadeRevealed=false;renderShade();}
// Colour is not the only cue: name the wrongly shaded and the missed regions in words.
function regionWords(bits){const inn=[...bits].map((v,i)=>v==='1'?'ABC'[i]:'').filter(Boolean),out=[...bits].map((v,i)=>v==='0'?'ABC'[i]:'').filter(Boolean);return T.regionWords(inn,out);}
function regionReport(expected){const wrong=[...shadeSelection].filter(r=>!expected.has(r)).map(regionWords),missed=[...expected].filter(r=>!shadeSelection.has(r)).map(regionWords);if(!wrong.length&&!missed.length)return '';return `<br><span>${wrong.length?T.shadeUi.wrongList(wrong):''}${wrong.length&&missed.length?' ':''}${missed.length?T.shadeUi.missedList(missed):''}</span>`;}
function shadeMatches(expected){return [...new Set([...expected,...shadeSelection])].every(r=>expected.has(r)===shadeSelection.has(r));}
function renderShade(){
 const expected=expectedRegions(),S2=T.shadeUi;
 $('shade-prompt').textContent=S2.prompt(shadeQuestion.symbol);
 $('shade-svg').innerHTML=vennSvg(3,(a,b,c)=>shadeSelection.has([a,b,c].map(Number).join('')),{clickable:true,shadeMode:true,expected,checked:shadeChecked,label:S2.svgLabel(shadeSelection.size)});
 const ok=shadeMatches(expected);
 $('shade-feedback').innerHTML=shadeChecked?`<div class="fb ${ok?'good':'bad'}"><strong>${shadeRevealed?S2.revealed:(ok?S2.good:S2.bad)}</strong> ${shadeDescribe(shadeQuestion)} ${shadeRevealed?S2.revealedNote:S2.tryAgain}${shadeRevealed?'':regionReport(expected)}</div>`:'';
}
const toggleRegion=e=>{const r=e.target.closest('[data-region]');if(!r)return false;const bits=r.dataset.region;shadeSelection.has(bits)?shadeSelection.delete(bits):shadeSelection.add(bits);shadeChecked=false;shadeRevealed=false;keepFocus(renderShade);return true;};
$('shade-svg').addEventListener('click',toggleRegion);
$('shade-svg').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;if(toggleRegion(e))e.preventDefault();});
$('shade-check').addEventListener('click',()=>{shadeChecked=true;renderShade();});
$('shade-reset').addEventListener('click',()=>{shadeSelection=new Set();shadeChecked=shadeRevealed=false;renderShade();});
$('shade-reveal').addEventListener('click',()=>{shadeSelection=expectedRegions();shadeChecked=shadeRevealed=true;renderShade();});
$('shade-next').addEventListener('click',newShade);
document.querySelectorAll('[data-practice]').forEach(b=>b.addEventListener('click',()=>{const mode=b.dataset.practice;document.querySelectorAll('[data-practice]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));$('quiz-mode').hidden=mode!=='quiz';$('shade-mode').hidden=mode!=='shade';}));
// Reference: fifteen identities, each checked by a membership table.
const laws=[
{id:'demorgan1',formula:'(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ',left:'(A ∪ B)ᶜ',right:'Aᶜ ∩ Bᶜ',l:(a,b)=>!(a||b),r:(a,b)=>!a&&!b,n:2},
{id:'demorgan2',formula:'(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ',left:'(A ∩ B)ᶜ',right:'Aᶜ ∪ Bᶜ',l:(a,b)=>!(a&&b),r:(a,b)=>!a||!b,n:2},
{id:'commUnion',formula:'A ∪ B = B ∪ A',left:'A ∪ B',right:'B ∪ A',l:(a,b)=>a||b,r:(a,b)=>b||a,n:2},
{id:'commInter',formula:'A ∩ B = B ∩ A',left:'A ∩ B',right:'B ∩ A',l:(a,b)=>a&&b,r:(a,b)=>b&&a,n:2},
{id:'assocUnion',formula:'(A ∪ B) ∪ C = A ∪ (B ∪ C)',left:'(A ∪ B) ∪ C',right:'A ∪ (B ∪ C)',l:(a,b,c)=>(a||b)||c,r:(a,b,c)=>a||(b||c),n:3},
{id:'assocInter',formula:'(A ∩ B) ∩ C = A ∩ (B ∩ C)',left:'(A ∩ B) ∩ C',right:'A ∩ (B ∩ C)',l:(a,b,c)=>(a&&b)&&c,r:(a,b,c)=>a&&(b&&c),n:3},
{id:'distribute1',formula:'A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)',left:'A ∩ (B ∪ C)',right:'(A ∩ B) ∪ (A ∩ C)',l:(a,b,c)=>a&&(b||c),r:(a,b,c)=>(a&&b)||(a&&c),n:3},
{id:'distribute2',formula:'A ∪ (B ∩ C) = (A ∪ B) ∩ (A ∪ C)',left:'A ∪ (B ∩ C)',right:'(A ∪ B) ∩ (A ∪ C)',l:(a,b,c)=>a||(b&&c),r:(a,b,c)=>(a||b)&&(a||c),n:3},
{id:'absorb1',formula:'A ∪ (A ∩ B) = A',left:'A ∪ (A ∩ B)',right:'A',l:(a,b)=>a||(a&&b),r:(a,b)=>a,n:2},
{id:'absorb2',formula:'A ∩ (A ∪ B) = A',left:'A ∩ (A ∪ B)',right:'A',l:(a,b)=>a&&(a||b),r:(a,b)=>a,n:2},
{id:'difference',formula:'A ∖ B = A ∩ Bᶜ',left:'A ∖ B',right:'A ∩ Bᶜ',l:(a,b)=>a&&!b,r:(a,b)=>a&&!b,n:2},
{id:'symDiff',formula:'A Δ B = (A ∖ B) ∪ (B ∖ A)',left:'A Δ B',right:'(A ∖ B) ∪ (B ∖ A)',l:(a,b)=>a!==b,r:(a,b)=>(a&&!b)||(!a&&b),n:2},
{id:'doubleComplement',formula:'(Aᶜ)ᶜ = A',left:'(Aᶜ)ᶜ',right:'A',l:a=>!!a,r:a=>a,n:2},
{id:'excludedMiddle',formula:'A ∪ Aᶜ = U',left:'A ∪ Aᶜ',right:'U',l:a=>a||!a,r:()=>true,n:2},
{id:'contradiction',formula:'A ∩ Aᶜ = ∅',left:'A ∩ Aᶜ',right:'∅',l:a=>a&&!a,r:()=>false,n:2}
];
let activeLaw=laws[0].id;
function renderLaws(){
 const L=T.lawUi;
 $('law-list').innerHTML=laws.map(l=>`<button class="law-btn" data-law="${l.id}" aria-current="${l.id===activeLaw}">${T.laws[l.id].name}</button>`).join('');
 const l=laws.find(z=>z.id===activeLaw),tx=T.laws[l.id],rows=allBits(l.n);
 $('law-article').innerHTML=`<div class="muted">${L.kicker}</div><h3>${tx.name}</h3><div class="math">${l.formula}</div><p>${tx.explain} ${L.bothAgree}</p><div class="halves"><div><h4>${L.left} ${l.left}</h4>${vennSvg(l.n,l.l,{label:L.svgLabel('left',l.left,l.n)})}</div><div><h4>${L.right} ${l.right}</h4>${vennSvg(l.n,l.r,{label:L.svgLabel('right',l.right,l.n)})}</div></div><h4>${L.check}</h4><div class="scroll"><table class="tt"><thead><tr>${'ABC'.slice(0,l.n).split('').map(s=>`<th scope="col">${s}</th>`).join('')}<th scope="col">${L.thLeft}</th><th scope="col">${L.thRight}</th><th scope="col">${L.thEqual}</th></tr></thead><tbody>${rows.map(bits=>{const b=bits.split('').map(x=>x==='1'),left=!!l.l(...b),right=!!l.r(...b);return `<tr>${b.map(z=>`<td>${z?'1':'0'}</td>`).join('')}<td class="${left?'y':'n'}">${left?'1':'0'}</td><td class="${right?'y':'n'}">${right?'1':'0'}</td><td class="y">${left===right?'✓':'✗'}</td></tr>`;}).join('')}</tbody></table></div><p class="muted">${L.foot}</p>`;
}
$('law-list').addEventListener('click',e=>{const b=e.target.closest('[data-law]');if(!b)return;activeLaw=b.dataset.law;keepFocus(renderLaws);});
switchTab('explore',false);renderExplore();renderLesson();nextQuestion(false);newShade();renderLaws();
function notifySize(){try{parent.postMessage({type:'mx-basics-size',height:document.documentElement.scrollHeight},location.origin)}catch{}}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(notifySize).observe(document.body);
window.addEventListener('load',notifySize);
document.fonts?.ready.then(notifySize);
notifySize();
</script>
