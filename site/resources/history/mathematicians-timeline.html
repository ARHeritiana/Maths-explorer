e manipulated through symbolic rules. His work provided a mathematical foundation for reasoning about truth and falsity, long before Boolean algebra became indispensable to digital circuits and computing. He also contributed to differential equations and probability. His central innovation was to make logical operations objects of algebraic study.","year":1815,"words":58,"weight":"standard","imageUrl":"","wikiTitle":"George Boole","era":7,"death":1864,"endYear":1864,"lifespanApproximate":false},{"id":103,"name":"Augustus De Morgan","sourceHeading":"Augustus De Morgan","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"De Morgan helped develop formal logic and rigorous mathematical exposition in Victorian Britain. The laws bearing his name express how negation interacts with conjunction and disjunction. He also wrote influential textbooks, supported mathematical education and helped establish the London Mathematical Society's intellectual environment.","year":1806,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Augustus De Morgan","era":7,"death":1871,"endYear":1871,"lifespanApproximate":false},{"id":104,"name":"August Ferdinand Möbius","sourceHeading":"August Ferdinand Möbius","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Möbius contributed to projective geometry, transformations and the study of geometric configurations. The one-sided Möbius strip made his name widely known, although its mathematical significance forms only part of his research. His work illustrates the nineteenth century's growing interest in properties of shapes that survive changes of perspective and deformation.","year":1790,"words":50,"weight":"standard","imageUrl":"../../data/history/mobius.webp","wikiTitle":"August Ferdinand Möbius","era":6,"death":1868,"endYear":1868,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:August_Ferdinand_M%C3%B6bius.jpg","imageLicense":"Public domain"},{"id":105,"name":"Jean-Victor Poncelet","sourceHeading":"Jean-Victor Poncelet","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Poncelet was a major figure in the revival of projective geometry. He studied geometric properties preserved under projection and developed powerful methods involving conics and duality. His work helped establish projective geometry as an independent subject rather than a collection of construction tricks.","year":1788,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Jean-Victor Poncelet","era":6,"death":1867,"endYear":1867,"lifespanApproximate":false},{"id":106,"name":"Michel Chasles","sourceHeading":"Michel Chasles","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Chasles made significant contributions to projective geometry and the history of geometry. His studies of transformations, correspondences and enumerative methods helped broaden nineteenth-century geometric research. He also played a substantial role in mathematical teaching and scholarship in France.","year":1793,"words":38,"weight":"standard","imageUrl":"","wikiTitle":"Michel Chasles","era":6,"death":1880,"endYear":1880,"lifespanApproximate":false},{"id":107,"name":"Arthur Cayley","sourceHeading":"Arthur Cayley","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Cayley contributed to matrix theory, algebra, group theory and geometry. His work helped make matrices into mathematical objects in their own right rather than mere arrays used in calculations, and the Cayley-Hamilton theorem became a fundamental result of linear algebra. He also investigated abstract groups and algebraic geometry, contributing to the emergence of a more structural mathematics.","year":1821,"words":57,"weight":"standard","imageUrl":"","wikiTitle":"Arthur Cayley","era":7,"death":1895,"endYear":1895,"lifespanApproximate":false},{"id":108,"name":"James Joseph Sylvester","sourceHeading":"James Joseph Sylvester","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Sylvester was a pioneering algebraist whose research helped develop invariant theory, matrices and combinatorial methods. Working in close intellectual contact with Cayley, he introduced terminology and problems that influenced algebra for generations. He was also an energetic organizer of mathematical research and education.","year":1814,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"James Joseph Sylvester","era":7,"death":1897,"endYear":1897,"lifespanApproximate":false},{"id":109,"name":"Ernst Kummer","sourceHeading":"Ernst Kummer","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Kummer introduced ideal numbers while studying algebraic integers and Fermat's Last Theorem. His work showed how new algebraic objects could restore forms of factorization that fail in familiar number systems. This approach prepared the way for Dedekind's theory of ideals and modern algebraic number theory.","year":1810,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Ernst Kummer","era":7,"death":1893,"endYear":1893,"lifespanApproximate":false},{"id":110,"name":"Leopold Kronecker","sourceHeading":"Leopold Kronecker","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Kronecker made major contributions to algebraic number theory, elliptic functions and the theory of equations. He advocated constructive approaches to mathematical existence, often questioning arguments based on more abstract notions of infinity. His mathematics and philosophical positions shaped important nineteenth-century debates over foundations.","year":1823,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Leopold Kronecker","era":7,"death":1891,"endYear":1891,"lifespanApproximate":false},{"id":111,"name":"Karl Weierstrass","sourceHeading":"Karl Weierstrass (1815-1897)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Weierstrass was a central figure in the rigorous reformulation of analysis. He developed methods based on precise limits, uniform convergence and carefully defined analytic functions. His constructions, including continuous functions with no derivative anywhere, challenged geometric intuition and revealed that familiar-looking curves could behave unexpectedly. The standards of proof associated with him became essential to modern real and complex analysis.","year":1815,"words":60,"weight":"standard","imageUrl":"","wikiTitle":"Karl Weierstrass","era":7,"death":1897,"endYear":1897,"lifespanApproximate":false},{"id":112,"name":"Pafnuty Chebyshev","sourceHeading":"Pafnuty Chebyshev","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Chebyshev contributed to number theory, probability and approximation theory. His work on the distribution of prime numbers produced decisive bounds related to the prime number theorem. He also investigated polynomial approximation and mechanical linkages, joining deep theoretical methods with practical engineering questions.","year":1821,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Pafnuty Chebyshev","era":7,"death":1894,"endYear":1894,"lifespanApproximate":false},{"id":113,"name":"Bernhard Riemann","sourceHeading":"Bernhard Riemann (1826-1866)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Riemann transformed several fields in a remarkably short career. His work on complex functions introduced Riemann surfaces and reshaped the understanding of multivalued functions and analytic continuation. His theory of integration gave a fundamental mathematical definition of area under a curve, while his geometric ideas generalized space through manifolds and variable curvature. This new geometry eventually became central to general relativity. In number theory, his study of the zeta function connected complex analysis to the distribution of primes and led to the celebrated Riemann hypothesis. The unity and originality of these ideas make Riemann one of the defining figures of modern mathematics.","year":1826,"words":102,"weight":"landmark","imageUrl":"","wikiTitle":"Bernhard Riemann","era":7,"death":1866,"endYear":1866,"lifespanApproximate":false},{"id":114,"name":"Richard Dedekind","sourceHeading":"Richard Dedekind","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Dedekind developed the theory of ideals in algebraic number theory and gave an influential construction of the real numbers through cuts. His work clarified the structure of infinite number systems and arithmetic itself. He helped turn algebra and analysis toward abstract properties that could be defined independently of concrete computation.","year":1831,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Richard Dedekind","era":7,"death":1916,"endYear":1916,"lifespanApproximate":false},{"id":115,"name":"Camille Jordan","sourceHeading":"Camille Jordan","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Jordan's *Traité des substitutions* helped establish group theory as a systematic subject. He worked on permutation groups, linear transformations and topology. The Jordan curve theorem, despite its intuitive appearance, revealed how difficult it can be to prove basic facts about continuous curves.","year":1838,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Camille Jordan","era":7,"death":1922,"endYear":1922,"lifespanApproximate":false},{"id":116,"name":"Sophus Lie","sourceHeading":"Sophus Lie","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Lie created the theory of continuous transformation groups, now called Lie groups, linking symmetry with differential equations and geometry. His ideas provided a general framework for identifying transformations that preserve mathematical structure. Lie theory later became foundational in geometry, representation theory and theoretical physics.","year":1842,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Sophus Lie","era":7,"death":1899,"endYear":1899,"lifespanApproximate":false},{"id":117,"name":"Georg Cantor","sourceHeading":"Georg Cantor (1845-1918)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Cantor founded set theory and developed the modern mathematics of infinity. He proved that infinite sets can have different cardinalities, showing in particular that the real numbers cannot be listed in the same way as the integers. He also developed transfinite numbers and a systematic language for comparing infinite collections. His discoveries overturned assumptions about the infinite and provoked intense debate, but they eventually became part of the foundations of almost every branch of mathematics. The questions he opened still shape logic, analysis and the philosophy of mathematics.","year":1845,"words":88,"weight":"notable","imageUrl":"","wikiTitle":"Georg Cantor","era":7,"death":1918,"endYear":1918,"lifespanApproximate":false},{"id":118,"name":"Sofia Kovalevskaya","sourceHeading":"Sofia Kovalevskaya","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Kovalevskaya made significant contributions to partial differential equations, notably the theorem now called Cauchy-Kovalevskaya, and to the dynamics of rigid bodies. She also became a prominent university mathematician despite formidable institutional barriers faced by women. Her research stands on its own as an important contribution to analysis and mechanics.","year":1850,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Sofia Kovalevskaya","era":8,"death":1891,"endYear":1891,"lifespanApproximate":false},{"id":119,"name":"Felix Klein","sourceHeading":"Felix Klein","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Klein's Erlangen Program proposed understanding geometries through the transformations that preserve their essential properties. This unifying perspective linked projective, Euclidean and other geometries and influenced later mathematical research. He also studied complex functions, groups and mathematical education, helping bridge abstract developments and teaching.","year":1849,"words":43,"weight":"standard","imageUrl":"../../data/history/klein.webp","wikiTitle":"Felix Klein","era":7,"death":1925,"endYear":1925,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Felix_Klein,_ante_1897_-_Accademia_delle_Scienze_di_Torino_0078_B.jpg","imageLicense":"Public domain"},{"id":120,"name":"Gottlob Frege","sourceHeading":"Gottlob Frege","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Frege developed a formal logical language of extraordinary precision and sought to ground arithmetic in logic. His *Begriffsschrift* was a foundational work of modern mathematical logic. Although Russell's paradox exposed a contradiction in his original system, Frege's approach profoundly influenced logic, philosophy and the mathematical study of formal reasoning.","year":1848,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Gottlob Frege","era":7,"death":1925,"endYear":1925,"lifespanApproximate":false},{"id":121,"name":"Henri Poincaré","sourceHeading":"Henri Poincaré (1854-1912)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Poincaré made fundamental contributions across geometry, topology, analysis, dynamical systems and mathematical physics. In studying the three-body problem, he uncovered the complicated behavior of dynamical systems, anticipating central ideas of chaos theory. He founded algebraic topology as a major field and formulated the Poincaré conjecture, eventually resolved a century later. His work on automorphic functions, differential equations and qualitative methods changed how mathematicians study systems that cannot be solved by explicit formulas. Poincaré was also a gifted philosophical writer who explored the nature of proof, intuition and scientific discovery. Few mathematicians of his period matched the range and originality of his work.","year":1854,"words":102,"weight":"landmark","imageUrl":"../../data/history/poincare.webp","wikiTitle":"Henri Poincaré","era":8,"death":1912,"endYear":1912,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:PSM_V82_D416_Henri_Poincare.png","imageLicense":"Public domain"},{"id":122,"name":"Giuseppe Peano","sourceHeading":"Giuseppe Peano","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Peano contributed to logic, the formal language of mathematics and the axiomatic description of the natural numbers. His work helped clarify how arithmetic could be built from precise assumptions. He also constructed a space-filling curve, demonstrating that continuity can produce results that defy ordinary geometric intuition.","year":1858,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Giuseppe Peano","era":8,"death":1932,"endYear":1932,"lifespanApproximate":false},{"id":123,"name":"Aleksandr Lyapunov","sourceHeading":"Aleksandr Lyapunov","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Lyapunov developed mathematical tools for studying the stability of motion and equilibrium. His methods made it possible to analyze whether small disturbances remain small or grow, without always solving differential equations explicitly. Lyapunov stability theory is central to dynamics, control and nonlinear systems.","year":1857,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Aleksandr Lyapunov","era":8,"death":1918,"endYear":1918,"lifespanApproximate":false},{"id":124,"name":"Andrey Markov","sourceHeading":"Andrey Markov","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Markov contributed to probability, number theory and mathematical analysis. His name is especially associated with Markov chains, models in which the probability of the next state depends on the present state rather than the entire past. These processes became indispensable in statistics, physics, computation and many applications of probability.","year":1856,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Andrey Markov","era":8,"death":1922,"endYear":1922,"lifespanApproximate":false},{"id":125,"name":"Georgy Voronoi","sourceHeading":"Georgy Voronoi","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Voronoi made important contributions to the geometry of numbers and quadratic forms. The partition of a region into cells nearest to selected sites, now called a Voronoi diagram, is one particularly accessible aspect of his work. His mathematical ideas later found applications in crystallography, spatial analysis and computational geometry.","year":1868,"words":49,"weight":"standard","imageUrl":"../../data/history/voronoi.webp","wikiTitle":"Georgy Voronoy","era":8,"death":1908,"endYear":1908,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Georgy_Voronoy.jpg","imageLicense":"Public domain"},{"id":126,"name":"David Hilbert","sourceHeading":"David Hilbert (1862-1943)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Hilbert was a central architect of twentieth-century mathematical thought. He advanced invariant theory, algebraic number theory, integral equations and the axiomatic foundations of geometry. His *Foundations of Geometry* showed how a mathematical theory could be examined through a carefully stated system of assumptions. At the 1900 International Congress of Mathematicians he presented a famous collection of problems that guided research for decades. Hilbert also proposed an ambitious program for establishing the consistency of mathematics through formal methods, a program fundamentally challenged by Gödel's later results. His distinctive achievement was to identify deep structural questions and formulate them with a clarity that reshaped entire research fields.","year":1862,"words":105,"weight":"landmark","imageUrl":"../../data/history/hilbert.webp","wikiTitle":"David Hilbert","era":8,"death":1943,"endYear":1943,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Hilbert.jpg","imageLicense":"Public domain"},{"id":127,"name":"Hermann Minkowski","sourceHeading":"Hermann Minkowski","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Minkowski helped create the geometry of numbers, using geometric shapes and lattices to prove results about integers. His four-dimensional formulation of spacetime also became a central mathematical language of relativity. His work shows how geometric ideas can illuminate both number theory and physics.","year":1864,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Hermann Minkowski","era":8,"death":1909,"endYear":1909,"lifespanApproximate":false},{"id":128,"name":"Jacques Hadamard","sourceHeading":"Jacques Hadamard","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Hadamard proved the prime number theorem independently of Charles-Jean de la Vallée Poussin in 1896. He made important contributions to complex analysis, differential equations and the study of well-posed mathematical problems. He also wrote influential reflections on mathematical creativity and problem-solving.","year":1865,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Jacques Hadamard","era":8,"death":1963,"endYear":1963,"lifespanApproximate":false},{"id":129,"name":"Charles Hermite","sourceHeading":"Charles Hermite","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Hermite contributed to algebra, number theory and analysis, and proved the transcendence of the number e. His work on elliptic functions, approximation and polynomial theory influenced a large mathematical community. He was also a prominent teacher of later French mathematicians.","year":1822,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"Charles Hermite","era":7,"death":1901,"endYear":1901,"lifespanApproximate":false},{"id":130,"name":"Georg Frobenius","sourceHeading":"Georg Frobenius","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Frobenius helped develop group representation theory, creating tools that turn abstract group symmetries into linear transformations. He also worked in algebra and number theory. His character theory became essential to the study of finite groups and remains fundamental in modern representation theory.","year":1849,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Ferdinand Georg Frobenius","era":7,"death":1917,"endYear":1917,"lifespanApproximate":false},{"id":131,"name":"Felix Hausdorff","sourceHeading":"Felix Hausdorff","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Hausdorff was a major founder of general topology. His work clarified the abstract concept of a topological space and introduced separation conditions that remain basic today. He also investigated set theory and dimensions, contributing to the theory behind what is now called Hausdorff dimension, especially useful in fractal geometry.","year":1868,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Felix Hausdorff","era":8,"death":1942,"endYear":1942,"lifespanApproximate":false},{"id":132,"name":"Henri Lebesgue","sourceHeading":"Henri Lebesgue (1875-1941)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Lebesgue revolutionized integration by reorganizing the way mathematicians measure and sum values of functions. His integral extends the earlier Riemann integral and makes powerful limit theorems possible. This changed the foundations of real analysis and provided a language essential to probability, Fourier analysis and differential equations. Lebesgue's work is a prime example of a new definition opening entire areas of mathematics.","year":1875,"words":61,"weight":"standard","imageUrl":"","wikiTitle":"Henri Lebesgue","era":8,"death":1941,"endYear":1941,"lifespanApproximate":false},{"id":133,"name":"Émile Borel","sourceHeading":"Émile Borel","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Borel contributed to measure theory, probability, complex analysis and set theory. The concept of Borel sets became fundamental in modern analysis and probability. He also helped develop mathematical ideas about randomness and the practical interpretation of chance.","year":1871,"words":37,"weight":"standard","imageUrl":"","wikiTitle":"Émile Borel","era":8,"death":1956,"endYear":1956,"lifespanApproximate":false},{"id":134,"name":"René Baire","sourceHeading":"René Baire","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Baire studied discontinuous functions and proved the category theorem bearing his name. The theorem is now one of the basic tools of analysis and functional analysis, showing that certain “large” sets of points must exist even when direct construction is difficult.","year":1874,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"René Baire","era":8,"death":1932,"endYear":1932,"lifespanApproximate":false},{"id":135,"name":"Ernst Zermelo","sourceHeading":"Ernst Zermelo","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Zermelo worked on the axiomatic foundations of set theory and developed an early axiomatic system designed to avoid paradoxes. His well-ordering theorem and use of the axiom of choice became central to debates about mathematical existence. His ideas helped shape the modern framework now known as Zermelo-Fraenkel set theory.","year":1871,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Ernst Zermelo","era":8,"death":1953,"endYear":1953,"lifespanApproximate":false},{"id":136,"name":"L. E. J. Brouwer","sourceHeading":"L. E. J. Brouwer","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Brouwer helped found modern topology, proving major results on fixed points and the invariance of dimension. He also became the leading advocate of intuitionism, a philosophy that insists on constructive meaning for mathematical claims. His work changed both geometric theory and debates about the logical foundations of mathematics.","year":1881,"words":48,"weight":"standard","imageUrl":"","wikiTitle":"L. E. J. Brouwer","era":8,"death":1966,"endYear":1966,"lifespanApproximate":false},{"id":137,"name":"G. H. Hardy","sourceHeading":"G. H. Hardy","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Hardy was a leading analyst and number theorist who made major contributions to analytic number theory and divergent series, often in collaboration with John Littlewood. His mathematical partnership with Ramanujan produced influential results in partitions and other problems. Hardy also wrote *A Mathematician's Apology*, a celebrated reflection on the motivations and beauty of pure mathematics.","year":1877,"words":55,"weight":"standard","imageUrl":"","wikiTitle":"G. H. Hardy","era":8,"death":1947,"endYear":1947,"lifespanApproximate":false},{"id":138,"name":"Bertrand Russell","sourceHeading":"Bertrand Russell","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Russell made important contributions to mathematical logic and the philosophy of mathematics. The paradox bearing his name revealed a serious problem for naive set theory. With Alfred North Whitehead he wrote *Principia Mathematica*, an ambitious attempt to derive mathematics from formal logic, whose legacy influenced foundational research throughout the twentieth century.","year":1872,"words":51,"weight":"standard","imageUrl":"../../data/history/bertrand.webp","wikiTitle":"Bertrand Russell","era":8,"death":1970,"endYear":1970,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Bertrand.jpg","imageLicense":"Public domain"},{"id":139,"name":"Élie Cartan","sourceHeading":"Élie Cartan","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Élie Cartan made profound contributions to differential geometry, Lie groups and the mathematics of symmetry. His exterior differential forms and moving-frame methods became basic tools of modern geometry and mathematical physics. His work reveals the power of describing curved spaces through structures that remain meaningful under changes of coordinates.","year":1869,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Élie Cartan","era":8,"death":1951,"endYear":1951,"lifespanApproximate":false},{"id":140,"name":"Hermann Weyl","sourceHeading":"Hermann Weyl","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Weyl contributed to analysis, differential geometry, representation theory, number theory and mathematical physics. His work on symmetry and the theory of groups was particularly influential in quantum mechanics. He also explored mathematical foundations and wrote influential syntheses connecting different areas of mathematics.","year":1885,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Hermann Weyl","era":8,"death":1955,"endYear":1955,"lifespanApproximate":false},{"id":141,"name":"Joseph Bertrand","sourceHeading":"Joseph Bertrand","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Joseph Bertrand worked on probability, number theory and mathematical physics. Bertrand's paradox illustrates how a seemingly simple probability question can have different answers when its random experiment is not precisely specified. He also formulated a result on primes between n and 2n that Chebyshev subsequently proved.","year":1822,"words":46,"weight":"standard","imageUrl":"../../data/history/bertrand.webp","wikiTitle":"Joseph Bertrand","era":7,"death":1900,"endYear":1900,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Bertrand.jpg","imageLicense":"Public domain"},{"id":142,"name":"Francis Galton","sourceHeading":"Francis Galton","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Galton developed statistical ideas about correlation, regression and variation while studying inherited characteristics. His work helped shape early statistical methods, although other mathematicians later made the concepts precise. His advocacy of eugenics caused serious harm and belongs in any responsible historical account; mathematical achievements do not excuse those views or their consequences.","year":1822,"words":52,"weight":"standard","imageUrl":"../../data/history/galton.webp","wikiTitle":"Francis Galton","era":7,"death":1911,"endYear":1911,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Francis_Galton_1850s.jpg","imageLicense":"Public domain"},{"id":143,"name":"Ada Lovelace","sourceHeading":"Ada Lovelace","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Lovelace's notes on Charles Babbage's proposed Analytical Engine included a detailed sequence of operations for calculating Bernoulli numbers, often described as the first published computer program intended for a general-purpose machine. The exact division of intellectual labor between Lovelace and Babbage remains debated. Her notes were also unusually perceptive about the possibilities of symbolic computation beyond ordinary arithmetic.","year":1815,"words":58,"weight":"standard","imageUrl":"","wikiTitle":"Ada Lovelace","era":7,"death":1852,"endYear":1852,"lifespanApproximate":false},{"id":144,"name":"Srinivasa Ramanujan","sourceHeading":"Srinivasa Ramanujan (1887-1920)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Ramanujan was a mathematician of extraordinary originality whose discoveries ranged across number theory, infinite series, continued fractions and partition functions. Largely self-taught in his early years in India, he developed striking formulas and conjectures, many initially without proofs in the form expected by contemporary mathematicians. His collaboration with G. H. Hardy led to influential research, including asymptotic formulas for partitions. Later mathematicians continued to uncover the depth of his notebooks, particularly in the theory of modular forms and mock theta functions. Ramanujan's career reveals both the power of creative numerical experimentation and the importance of rigorous justification and mathematical collaboration.","year":1887,"words":100,"weight":"landmark","imageUrl":"../../data/history/ramanujan.webp","wikiTitle":"Srinivasa Ramanujan","era":8,"death":1920,"endYear":1920,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Srinivasa_Ramanujan-Add._MS_a94_version2_(cropped).jpg","imageLicense":"CC BY 4.0"},{"id":145,"name":"John Edensor Littlewood","sourceHeading":"John Edensor Littlewood","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Littlewood was a leading British analyst and number theorist, especially known for his long collaboration with G. H. Hardy. Their joint work developed central techniques of analytic number theory and investigated prime numbers, series and inequalities. Littlewood also made important contributions to the mathematical theory of functions and differential equations.","year":1885,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"J. E. Littlewood","era":8,"death":1977,"endYear":1977,"lifespanApproximate":false},{"id":146,"name":"Emmy Noether","sourceHeading":"Emmy Noether (1882-1935)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Noether was among the most transformative algebraists of the twentieth century. She helped redirect algebra away from calculations with individual expressions toward the abstract study of rings, ideals and structural relationships. Noetherian rings became a fundamental concept in algebraic geometry and commutative algebra. Her celebrated theorem linking continuous symmetries to conservation laws also became indispensable in theoretical physics. Despite serious professional discrimination, she established a powerful school of mathematical research. Her work changed what mathematicians considered the natural objects and methods of algebra.","year":1882,"words":83,"weight":"notable","imageUrl":"../../data/history/noether.webp","wikiTitle":"Emmy Noether","era":8,"death":1935,"endYear":1935,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Emmy_Noether_(3x4_cropped).jpg","imageLicense":"Public domain"},{"id":147,"name":"Stefan Banach","sourceHeading":"Stefan Banach","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Banach was a founder of functional analysis, the study of spaces of functions and infinite-dimensional mathematical structures. His work gave rise to Banach spaces and the contraction mapping theorem, among many foundational results. Through the Lwów mathematical school, he helped develop a language now essential to analysis, differential equations and optimization.","year":1892,"words":51,"weight":"standard","imageUrl":"../../data/history/banach.webp","wikiTitle":"Stefan Banach","era":8,"death":1945,"endYear":1945,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Stefana_Banach_-_%D8%B3%D8%AA%D9%8A%D9%81%D8%A7%D9%86_%D8%A8%D9%86%D8%A7%D8%AE.jpg","imageLicense":"Public domain"},{"id":148,"name":"Hugo Steinhaus","sourceHeading":"Hugo Steinhaus","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Steinhaus contributed to probability, measure theory and functional analysis. A central figure of the Lwów school, he encouraged the study of mathematical problems arising from games, practical decisions and human behavior. He also helped bring Banach into the mathematical research community and promoted accessible mathematical problem-solving.","year":1887,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Hugo Steinhaus","era":8,"death":1972,"endYear":1972,"lifespanApproximate":false},{"id":149,"name":"Alfred Tarski","sourceHeading":"Alfred Tarski","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Tarski made foundational contributions to mathematical logic, model theory and the study of formal languages. His definition of truth for formalized languages influenced logic and philosophy, while his decision methods clarified which logical theories permit algorithmic solutions. He also worked on geometry and algebra. The Banach-Tarski paradox, named jointly with Banach, is an especially striking consequence of abstract set-theoretic reasoning.","year":1901,"words":60,"weight":"standard","imageUrl":"../../data/history/tarski.webp","wikiTitle":"Alfred Tarski","era":9,"death":1983,"endYear":1983,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Alfred_Tarski_1968_(as-is,_cropped)_(cropped).jpg","imageLicense":"CC BY-SA 4.0"},{"id":150,"name":"John von Neumann","sourceHeading":"John von Neumann (1903-1957)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Von Neumann was one of the most versatile mathematical thinkers of the twentieth century. He made deep contributions to operator theory, functional analysis, quantum mechanics and the foundations of mathematics. With collaborators he helped establish game theory, and his minimax theorem became a foundational result. His work on computing influenced the logical organization of stored-program computers, though that architecture was developed through broader collaborative efforts. Von Neumann also contributed to numerical methods, hydrodynamics and the mathematical study of self-reproducing systems. Across these fields, he repeatedly turned complex problems into general structures that others could use and extend.","year":1903,"words":97,"weight":"notable","imageUrl":"https://raw.githubusercontent.com/ARHeritiana/Maths-explorer/main/site/data/history/von-neumann.webp","wikiTitle":"John von Neumann","era":9,"death":1957,"endYear":1957,"lifespanApproximate":false},{"id":151,"name":"Andrey Kolmogorov","sourceHeading":"Andrey Kolmogorov (1903-1987)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Kolmogorov placed probability theory on modern axiomatic foundations in 1933, treating probabilities through measure theory. He also contributed to turbulence, dynamical systems, algorithms, information complexity and many areas of analysis. His work on random processes helped transform probability into a rigorous and broadly applicable mathematical discipline. Few twentieth-century mathematicians had comparable range across pure and applied research.","year":1903,"words":57,"weight":"standard","imageUrl":"","wikiTitle":"Andrey Kolmogorov","era":9,"death":1987,"endYear":1987,"lifespanApproximate":false},{"id":152,"name":"Kurt Gödel","sourceHeading":"Kurt Gödel (1906-1978)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Gödel's incompleteness theorems established fundamental limits on sufficiently expressive formal mathematical systems: such systems cannot, under appropriate conditions, prove every true arithmetical statement, and cannot establish their own consistency using only their internal resources. He also proved the completeness theorem for first-order logic and made important contributions to set theory. These discoveries profoundly changed the understanding of proof, truth and the foundations of mathematics, while showing that formal rigor does not eliminate every open question about mathematical certainty.","year":1906,"words":78,"weight":"notable","imageUrl":"","wikiTitle":"Kurt Gödel","era":9,"death":1978,"endYear":1978,"lifespanApproximate":false},{"id":153,"name":"Alonzo Church","sourceHeading":"Alonzo Church","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Church developed the lambda calculus and made foundational contributions to computability theory and mathematical logic. His work provided a precise model of effective calculation and helped explain why some problems have no general algorithmic solution. The Church-Turing thesis links several independently developed conceptions of computability.","year":1903,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Alonzo Church","era":9,"death":1995,"endYear":1995,"lifespanApproximate":false},{"id":154,"name":"Alan Turing","sourceHeading":"Alan Turing (1912-1954)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Turing provided a decisive mathematical model of computation through the abstract machines that bear his name. His 1936 work helped establish that some well-defined problems cannot be solved by any algorithm and clarified the limits of formal calculation. During the Second World War he made major contributions to cryptanalysis at Bletchley Park in a broader team effort. He later investigated computer design, artificial intelligence and the mathematical patterns produced by reaction-diffusion systems. Turing's legacy reaches from logic to computing and theoretical biology, making him one of the central figures in the mathematical understanding of information and algorithms.","year":1912,"words":97,"weight":"notable","imageUrl":"../../data/history/turing.webp","wikiTitle":"Alan Turing","era":9,"death":1954,"endYear":1954,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Alan_turing_header.jpg","imageLicense":"Public domain"},{"id":155,"name":"Claude Shannon","sourceHeading":"Claude Shannon (1916-2001)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Shannon founded modern information theory by giving mathematical measures of information, entropy and the limits of reliable communication. His 1948 work explained how signals could be encoded and transmitted even in the presence of noise. Earlier, he showed how Boolean algebra could analyze switching circuits, a pivotal connection between logic and electrical engineering. Shannon's ideas became foundational to digital communication, data compression, computing and modern probability-based approaches to information.","year":1916,"words":69,"weight":"notable","imageUrl":"../../data/history/shannon.webp","wikiTitle":"Claude Shannon","era":9,"death":2001,"endYear":2001,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:C.E._Shannon._Tekniska_museet_43069_(2x3_crop).jpg","imageLicense":"CC BY 2.0"},{"id":156,"name":"André Weil","sourceHeading":"André Weil","group":"The twentieth century: foundations, analysis, topology and computation","biography":"André Weil was a major contributor to algebraic geometry and number theory. His conjectures about the number of solutions to polynomial equations over finite fields helped guide some of the deepest research of the twentieth century, culminating in later proofs by Grothendieck and Deligne. As a member of the Bourbaki group, Weil also influenced the organization and language of modern mathematics.","year":1906,"words":61,"weight":"standard","imageUrl":"","wikiTitle":"André Weil","era":9,"death":1998,"endYear":1998,"lifespanApproximate":false},{"id":157,"name":"Oscar Zariski","sourceHeading":"Oscar Zariski","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Zariski helped transform algebraic geometry into a more rigorous and algebraically grounded discipline. His work on singularities, birational geometry and the topology now named after him laid essential foundations for later developments. He trained a generation of mathematicians who shaped modern algebraic geometry.","year":1899,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Oscar Zariski","era":8,"death":1986,"endYear":1986,"lifespanApproximate":false},{"id":158,"name":"Solomon Lefschetz","sourceHeading":"Solomon Lefschetz","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Lefschetz made major contributions to algebraic topology and algebraic geometry. His fixed-point theorem and studies of complex algebraic varieties connected geometric questions to algebraic invariants. He helped establish topology as a powerful method for studying spaces that are difficult to understand by direct visualization.","year":1884,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Solomon Lefschetz","era":8,"death":1972,"endYear":1972,"lifespanApproximate":false},{"id":159,"name":"Kazimierz Kuratowski","sourceHeading":"Kazimierz Kuratowski","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Kuratowski worked on topology, set theory and graph theory. His characterization of planar graphs by forbidden subgraphs became a celebrated result with broad mathematical and computational applications. He was also a central figure in the Polish school of modern mathematical analysis and topology.","year":1896,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Kazimierz Kuratowski","era":8,"death":1980,"endYear":1980,"lifespanApproximate":false},{"id":160,"name":"Paul Erdős","sourceHeading":"Paul Erdős (1913-1996)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Erdős was among the most prolific collaborators in mathematical history, making fundamental contributions to number theory, combinatorics, probability and graph theory. He pioneered probabilistic methods for proving that mathematical objects with desired properties must exist, even when an explicit construction is difficult. His work with many coauthors created new problems and research networks across mathematics. The playful concept of an “Erdős number” reflects this extraordinary collaborative style, but his lasting importance lies in the breadth and ingenuity of his theorems and conjectures.","year":1913,"words":82,"weight":"notable","imageUrl":"../../data/history/erdos.webp","wikiTitle":"Paul Erdős","era":9,"death":1996,"endYear":1996,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Erdos_budapest_fall_1992_(cropped).jpg","imageLicense":"CC BY 3.0"},{"id":161,"name":"Stanisław Ulam","sourceHeading":"Stanisław Ulam","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Ulam contributed to set theory, combinatorics, probability and computational mathematics. He helped develop the Monte Carlo method for using random sampling to study complex problems. His interests also included cellular automata and the behavior of iterated processes, showing how computation could open new routes to mathematical discovery.","year":1909,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Stanisław Ulam","era":9,"death":1984,"endYear":1984,"lifespanApproximate":false},{"id":162,"name":"Lev Pontryagin","sourceHeading":"Lev Pontryagin","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Pontryagin made major contributions to topology, duality theory and optimal control. The Pontryagin maximum principle supplied a powerful mathematical tool for choosing optimal actions in dynamical systems. His research connected abstract mathematics with engineering and physical applications.","year":1908,"words":37,"weight":"standard","imageUrl":"","wikiTitle":"Lev Pontryagin","era":9,"death":1988,"endYear":1988,"lifespanApproximate":false},{"id":163,"name":"Israel Gelfand","sourceHeading":"Israel Gelfand","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Gelfand made foundational advances in functional analysis, representation theory, distribution theory and mathematical physics. His work helped establish powerful connections between algebraic structures and spaces of functions. He also became an influential teacher and organizer of mathematical inquiry.","year":1913,"words":38,"weight":"standard","imageUrl":"","wikiTitle":"Israel Gelfand","era":9,"death":2009,"endYear":2009,"lifespanApproximate":false},{"id":164,"name":"Laurent Schwartz","sourceHeading":"Laurent Schwartz","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Schwartz created the theory of distributions, or generalized functions, placing objects such as the Dirac delta on a rigorous mathematical basis. This dramatically extended the methods available for differential equations and Fourier analysis. His work bridged pure analysis and mathematical physics and earned him the Fields Medal in 1950.","year":1915,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Laurent Schwartz","era":9,"death":2002,"endYear":2002,"lifespanApproximate":false},{"id":165,"name":"Jean Leray","sourceHeading":"Jean Leray","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Leray contributed to differential equations, fluid mechanics and algebraic topology. His analysis of the Navier-Stokes equations introduced influential ideas about weak solutions, while his topological work helped develop sheaf theory and spectral sequences. His career illustrates the fertile interaction between nonlinear analysis and abstract mathematics.","year":1906,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Jean Leray","era":9,"death":1980,"endYear":1980,"lifespanApproximate":false},{"id":166,"name":"Shiing-Shen Chern","sourceHeading":"Shiing-Shen Chern","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Chern transformed global differential geometry through characteristic classes and the study of curvature. Chern classes became essential for distinguishing and studying complex vector bundles, influencing geometry, topology and mathematical physics. His work helped make the geometry of curved spaces a central language of modern mathematics.","year":1911,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Shiing-Shen Chern","era":9,"death":2004,"endYear":2004,"lifespanApproximate":false},{"id":167,"name":"Hua Luogeng","sourceHeading":"Hua Luogeng","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Hua Luogeng contributed to analytic number theory, additive prime-number problems and mathematical applications. He played a central role in building modern mathematical research and education in China. His career linked advanced theoretical work with a sustained commitment to spreading mathematical methods.","year":1910,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Hua Luogeng","era":9,"death":1985,"endYear":1985,"lifespanApproximate":false},{"id":168,"name":"Mary Cartwright","sourceHeading":"Mary Cartwright","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Cartwright investigated complex analysis and nonlinear differential equations. Her work with John Littlewood on oscillatory systems revealed complicated behavior now recognized as an early contribution to chaos theory. She was also an influential figure in British mathematical institutions and teaching.","year":1900,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"Mary Cartwright","era":9,"death":1998,"endYear":1998,"lifespanApproximate":false},{"id":169,"name":"Julia Robinson","sourceHeading":"Julia Robinson","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Julia Robinson made fundamental contributions to mathematical logic and the study of Diophantine equations. Her research, together with work by Martin Davis, Hilary Putnam and Yuri Matiyasevich, helped establish the negative solution to Hilbert's tenth problem: no algorithm can decide in general whether a polynomial equation with integer coefficients has an integer solution. She was also an influential leader in the mathematical community.","year":1919,"words":63,"weight":"standard","imageUrl":"","wikiTitle":"Julia Robinson","era":9,"death":1985,"endYear":1985,"lifespanApproximate":false},{"id":170,"name":"Olga Ladyzhenskaya","sourceHeading":"Olga Ladyzhenskaya","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Ladyzhenskaya contributed major results on partial differential equations, especially equations describing fluid motion. Her research on existence, regularity and boundary-value problems helped build the foundations of modern mathematical fluid mechanics. She also worked across broad areas of elliptic and parabolic equations.","year":1922,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Olga Ladyzhenskaya","era":9,"death":2004,"endYear":2004,"lifespanApproximate":false},{"id":171,"name":"Alexander Grothendieck","sourceHeading":"Alexander Grothendieck (1928-2014)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Grothendieck transformed algebraic geometry by introducing new languages and frameworks, particularly schemes, sheaves, topoi and powerful cohomological methods. These ideas allowed geometric questions to be studied over very general algebraic structures and helped explain patterns that had previously appeared disconnected. His program strongly influenced the eventual proof of the Weil conjectures and reshaped number theory as well as geometry. Grothendieck's mathematical legacy is distinguished by extraordinary generality: rather than solving isolated problems, he repeatedly sought the concepts in which entire families of problems would become natural.","year":1928,"words":86,"weight":"notable","imageUrl":"","wikiTitle":"Alexander Grothendieck","era":9,"death":2014,"endYear":2014,"lifespanApproximate":false},{"id":172,"name":"Jean-Pierre Serre","sourceHeading":"Jean-Pierre Serre","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Serre has made deep contributions to algebraic topology, algebraic geometry and number theory. His early work on homotopy and spectral sequences helped transform topology, while his collaborations and ideas influenced the development of modern algebraic geometry. He later made major advances in Galois representations and arithmetic geometry, demonstrating an unusual ability to move between fields and reveal common structures.","year":1926,"words":59,"weight":"standard","imageUrl":"","wikiTitle":"Jean-Pierre Serre","era":9,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":173,"name":"Michael Atiyah","sourceHeading":"Michael Atiyah","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Atiyah was a central figure in modern geometry and topology. With Isadore Singer he developed the index theorem relating analytic properties of differential operators to topological invariants. He also contributed to K-theory and mathematical physics, establishing bridges that have remained productive for decades.","year":1929,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Michael Atiyah","era":9,"death":2019,"endYear":2019,"lifespanApproximate":false},{"id":174,"name":"Friedrich Hirzebruch","sourceHeading":"Friedrich Hirzebruch","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Hirzebruch made major contributions to topology and algebraic geometry, including the signature theorem and the development of characteristic-class methods. His work helped establish modern relationships between differentiable manifolds and complex algebraic varieties. He also played an important role in rebuilding international mathematical institutions after the Second World War.","year":1927,"words":48,"weight":"standard","imageUrl":"","wikiTitle":"Friedrich Hirzebruch","era":9,"death":2012,"endYear":2012,"lifespanApproximate":false},{"id":175,"name":"Benoît Mandelbrot","sourceHeading":"Benoît Mandelbrot (1924-2010)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Mandelbrot transformed the mathematical study of roughness and irregular shapes. By developing and popularizing fractal geometry, he showed that branching, self-similarity and complicated boundaries could be studied quantitatively rather than dismissed as imperfections. The Mandelbrot set became an iconic image of the unexpected complexity generated by simple iteration. His research drew connections among geometry, probability, natural forms and financial fluctuations. Although the mathematical roots of fractals extend to earlier researchers, Mandelbrot gave the subject a powerful unifying identity and made its visual possibilities widely accessible.","year":1924,"words":85,"weight":"notable","imageUrl":"","wikiTitle":"Benoît Mandelbrot","era":9,"death":2010,"endYear":2010,"lifespanApproximate":false},{"id":176,"name":"John Nash","sourceHeading":"John Nash (1928-2015)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Nash made foundational contributions to game theory, differential geometry and nonlinear partial differential equations. His equilibrium concept provided a general mathematical way to study strategic choices, far beyond simple two-player contests. The Nash embedding theorems also showed, under appropriate assumptions, how abstract Riemannian manifolds can be represented within Euclidean spaces. His achievements in several mathematically distinct fields testify to an unusually versatile and original mind.","year":1928,"words":65,"weight":"standard","imageUrl":"","wikiTitle":"John Nash","era":9,"death":2015,"endYear":2015,"lifespanApproximate":false},{"id":177,"name":"John Milnor","sourceHeading":"John Milnor","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Milnor has made profound contributions to topology, geometry and dynamical systems. His discovery of exotic spheres revealed that spaces may share a topological structure while differing as smooth manifolds. He also advanced knot theory, algebraic K-theory and complex dynamics. His clear exposition has influenced generations of mathematicians.","year":1931,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"John Milnor","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":178,"name":"Stephen Smale","sourceHeading":"Stephen Smale","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Smale transformed differential topology and dynamical systems. His proof of the high-dimensional Poincaré conjecture and his work on hyperbolic dynamics revealed the complex geometric behavior possible in smooth systems. The Smale horseshoe became an emblem of deterministic chaos and sensitive dependence on initial conditions.","year":1930,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Stephen Smale","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":179,"name":"Peter Lax","sourceHeading":"Peter Lax","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Lax made major contributions to partial differential equations, hyperbolic conservation laws, numerical analysis and integrable systems. His theories helped explain how waves and shocks behave and how equations can be approximated reliably by computation. He has been influential in linking rigorous analysis with practical mathematical modelling.","year":1926,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Peter Lax","era":9,"death":2025,"endYear":2025,"lifespanApproximate":false},{"id":180,"name":"Louis Nirenberg","sourceHeading":"Louis Nirenberg","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Nirenberg was a leading analyst whose work established fundamental estimates and regularity results for partial differential equations. Many ideas associated with him have become standard tools in geometric analysis and mathematical physics. His research helped make difficult nonlinear equations mathematically manageable.","year":1925,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Louis Nirenberg","era":9,"death":2020,"endYear":2020,"lifespanApproximate":false},{"id":181,"name":"John Horton Conway","sourceHeading":"John Horton Conway (1937-2020)","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Conway was a deeply original mathematician whose interests ranged from finite groups and number theory to knots, geometry and recreational mathematics. He developed the theory of surreal numbers, contributed to the classification of sporadic simple groups and investigated knot invariants and combinatorial games. His Game of Life showed how simple local rules could produce remarkably complex behavior, reaching an audience far beyond academic mathematics. Conway's achievement was to uncover serious mathematical structures in questions that often began as playful experiments.","year":1937,"words":80,"weight":"notable","imageUrl":"../../data/history/conway.webp","wikiTitle":"John Horton Conway","era":10,"death":2020,"endYear":2020,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:John_H_Conway_2005_(cropped).jpg","imageLicense":"CC BY 2.0"},{"id":182,"name":"Donald Knuth","sourceHeading":"Donald Knuth","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Knuth transformed the mathematical analysis of algorithms through *The Art of Computer Programming*. His work combines discrete mathematics, probability and rigorous study of computational efficiency. He also developed TeX, profoundly influencing how mathematical ideas are typeset and communicated. His career stands at the intersection of mathematics, computer science and scholarly craftsmanship.","year":1938,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Donald Knuth","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":183,"name":"George Dantzig","sourceHeading":"George Dantzig","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Dantzig introduced the simplex algorithm, one of the most influential computational methods in linear programming. His work made it possible to optimize large systems of constraints arising in industry, logistics and economics. Linear programming became a cornerstone of operations research and mathematical optimization.","year":1914,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"George Dantzig","era":9,"death":2005,"endYear":2005,"lifespanApproximate":false},{"id":184,"name":"Richard Karp","sourceHeading":"Richard Karp","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Karp made foundational contributions to theoretical computer science, especially computational complexity. By demonstrating the NP-completeness of many important combinatorial problems, he clarified why certain optimization and decision tasks are unlikely to admit universally efficient exact algorithms. His work helped establish complexity theory as a major mathematical discipline.","year":1935,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Richard Karp","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":185,"name":"Roger Penrose","sourceHeading":"Roger Penrose","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Penrose has contributed to geometry, mathematical physics and the theory of tilings. His nonperiodic tilings revealed how simple geometric rules can enforce order without translational repetition. He also introduced influential techniques and ideas in general relativity, including results about gravitational collapse. His mathematical imagination ranges from abstract geometry to the structure of spacetime.","year":1931,"words":53,"weight":"standard","imageUrl":"../../data/history/penrose.webp","wikiTitle":"Roger Penrose","era":10,"death":null,"endYear":2026,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Roger_Penrose_at_Festival_della_Scienza_Oct_29_2011.jpg","imageLicense":"CC BY-SA 2.0"},{"id":186,"name":"Kenneth Appel","sourceHeading":"Kenneth Appel","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Appel, working with Wolfgang Haken, completed the first accepted computer-assisted proof of the four-color theorem in 1976. Their work showed that a long-standing mathematical problem could be resolved through a combination of theoretical reductions and extensive computation. It also provoked important discussion about the nature of verification and proof.","year":1932,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Kenneth Appel","era":10,"death":2013,"endYear":2013,"lifespanApproximate":false},{"id":187,"name":"Wolfgang Haken","sourceHeading":"Wolfgang Haken","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Haken made major contributions to three-dimensional topology and algorithms for recognizing certain topological structures. With Kenneth Appel he proved the four-color theorem using computer-assisted case checking. His career links deep theoretical topology with a landmark change in mathematical proof practice.","year":1928,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"Wolfgang Haken","era":9,"death":2022,"endYear":2022,"lifespanApproximate":false},{"id":188,"name":"Vladimir Arnold","sourceHeading":"Vladimir Arnold","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Arnold made profound contributions to dynamical systems, classical mechanics, singularity theory and symplectic geometry. His work on the stability of nearly integrable systems, associated with Kolmogorov-Arnold-Moser theory, clarified important aspects of planetary and mechanical motion. He was also an influential expositor who emphasized geometric intuition in mathematics.","year":1937,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Vladimir Arnold","era":10,"death":2010,"endYear":2010,"lifespanApproximate":false},{"id":189,"name":"Ennio De Giorgi","sourceHeading":"Ennio De Giorgi","group":"The twentieth century: foundations, analysis, topology and computation","biography":"De Giorgi made foundational contributions to the regularity theory of partial differential equations and the calculus of variations. His methods for analyzing minimal surfaces and variational problems became central to modern geometric measure theory. His work significantly advanced the understanding of nonlinear phenomena.","year":1928,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Ennio De Giorgi","era":9,"death":1996,"endYear":1996,"lifespanApproximate":false},{"id":190,"name":"Paul Cohen","sourceHeading":"Paul Cohen","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Cohen developed the method of forcing and proved the independence of the continuum hypothesis and the axiom of choice from the standard Zermelo-Fraenkel axioms, assuming those axioms are consistent. Together with Gödel's earlier consistency results, this demonstrated that major questions about infinite sets cannot be resolved from the usual axioms alone. His method transformed mathematical logic and set theory.","year":1934,"words":59,"weight":"standard","imageUrl":"","wikiTitle":"Paul Cohen","era":10,"death":2007,"endYear":2007,"lifespanApproximate":false},{"id":191,"name":"Michael Artin","sourceHeading":"Michael Artin","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Michael Artin contributed to algebraic geometry and the theory of algebraic spaces, including foundational results on deformation and approximation. His work helped expand the range of geometric objects that can be studied using modern algebraic methods.","year":1934,"words":36,"weight":"standard","imageUrl":"","wikiTitle":"Michael Artin","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":192,"name":"Pierre Deligne","sourceHeading":"Pierre Deligne","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Deligne proved the final and deepest of the Weil conjectures, using cohomological methods that connected algebraic geometry with number theory. He has also contributed to Hodge theory, representation theory and related fields. His work is a landmark in modern arithmetic geometry.","year":1944,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Pierre Deligne","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":193,"name":"John Tate","sourceHeading":"John Tate","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Tate made fundamental contributions to algebraic number theory, Galois cohomology and arithmetic geometry. His ideas include Tate modules, Tate duality and important methods for studying elliptic curves and abelian varieties. His work profoundly shaped modern number theory.","year":1925,"words":37,"weight":"standard","imageUrl":"","wikiTitle":"John Tate","era":9,"death":2019,"endYear":2019,"lifespanApproximate":false},{"id":194,"name":"William Thurston","sourceHeading":"William Thurston","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Thurston transformed low-dimensional topology through geometric structures on three-dimensional manifolds. His geometrization program revealed that topology and geometry could be unified through a small family of model geometries. This vision later became central to Perelman's proof of the Poincaré conjecture and the geometrization conjecture.","year":1946,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"William Thurston","era":10,"death":2012,"endYear":2012,"lifespanApproximate":false},{"id":195,"name":"Hillel Furstenberg","sourceHeading":"Hillel Furstenberg","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Furstenberg developed powerful connections between ergodic theory, probability and number theory. His ergodic proof of Szemerédi's theorem demonstrated that dynamical systems could illuminate questions about arithmetic progressions. His work helped establish a productive exchange between apparently distant mathematical disciplines.","year":1935,"words":39,"weight":"standard","imageUrl":"","wikiTitle":"Hillel Furstenberg","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":196,"name":"David Mumford","sourceHeading":"David Mumford","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Mumford made foundational contributions to algebraic geometry, including the construction and study of moduli spaces. He later worked extensively on mathematical vision and patterns. His research helped reshape geometry through the study of families of objects rather than isolated examples.","year":1937,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"David Mumford","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":197,"name":"Gerd Faltings","sourceHeading":"Gerd Faltings","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Faltings proved the Mordell conjecture, establishing that algebraic curves of genus greater than one over number fields have only finitely many rational points. This result became a turning point in arithmetic geometry, combining sophisticated algebraic techniques with a classical number-theoretic question.","year":1954,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Gerd Faltings","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":198,"name":"Alexander Beilinson","sourceHeading":"Alexander Beilinson","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Beilinson has developed influential ideas in algebraic geometry, K-theory and arithmetic geometry. His conjectures concerning special values of L-functions and motivic structures helped shape important lines of research. His work is noted for its deep connections across modern algebraic mathematics.","year":1953,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"Alexander Beilinson","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":199,"name":"Robert Langlands","sourceHeading":"Robert Langlands","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Langlands proposed a vast network of conjectures connecting number theory, representation theory and harmonic analysis. The Langlands program predicts relationships between Galois representations and automorphic forms that have driven decades of research. The depth of the vision lies in identifying common structures behind problems that originally seemed unrelated.","year":1936,"words":48,"weight":"standard","imageUrl":"","wikiTitle":"Robert Langlands","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":200,"name":"Grigory Margulis","sourceHeading":"Grigory Margulis","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Margulis made major advances in the study of lattices in Lie groups, ergodic theory and the geometry of numbers. His rigidity and superrigidity theorems showed that certain algebraic and geometric structures are far more constrained than might be expected. His work profoundly influenced modern dynamics and geometry.","year":1946,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Grigory Margulis","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":201,"name":"Mikhail Gromov","sourceHeading":"Mikhail Gromov","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Gromov has changed modern geometry through ideas including hyperbolic groups, geometric group theory and the h-principle. His methods often connect large-scale geometric behavior to algebraic or topological structure. He is known for introducing broad conceptual tools that have generated entire new research directions.","year":1943,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Mikhail Gromov","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":202,"name":"Michael Freedman","sourceHeading":"Michael Freedman","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Freedman proved the topological four-dimensional Poincaré conjecture and developed deep methods for the study of four-manifolds. His work revealed how dramatically four dimensions differ from both lower and higher dimensions. He later contributed to mathematical approaches to quantum computation.","year":1951,"words":39,"weight":"standard","imageUrl":"","wikiTitle":"Michael Freedman","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":203,"name":"Jean Bourgain","sourceHeading":"Jean Bourgain","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Bourgain made extraordinary contributions to analysis, combinatorics, number theory and mathematical physics. He solved difficult problems across distinct areas and introduced methods that proved influential far beyond their initial applications. His work is especially notable for its technical depth and breadth.","year":1954,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Jean Bourgain","era":10,"death":2018,"endYear":2018,"lifespanApproximate":false},{"id":204,"name":"Vladimir Drinfeld","sourceHeading":"Vladimir Drinfeld","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Drinfeld contributed to algebraic geometry, number theory and quantum groups. His work on the Langlands correspondence for function fields and his introduction of major quantum-algebraic structures helped establish new connections between mathematical physics and representation theory.","year":1954,"words":36,"weight":"standard","imageUrl":"","wikiTitle":"Vladimir Drinfeld","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":205,"name":"Maxim Kontsevich","sourceHeading":"Maxim Kontsevich","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Kontsevich has contributed profound ideas to geometry, topology and mathematical physics. His work on deformation quantization, moduli spaces and enumerative geometry links seemingly different mathematical structures. He is particularly known for creating conceptual bridges between algebraic geometry and quantum field theory.","year":1964,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Maxim Kontsevich","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":206,"name":"Andrew Wiles","sourceHeading":"Andrew Wiles","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Wiles proved Fermat's Last Theorem by establishing a crucial modularity result for semistable elliptic curves, building on ideas developed by many mathematicians. His proof, completed with a decisive contribution from Richard Taylor in repairing a gap, connected a centuries-old elementary-sounding problem to deep modern number theory. It became one of the most celebrated achievements of twentieth-century mathematics.","year":1953,"words":57,"weight":"standard","imageUrl":"","wikiTitle":"Andrew Wiles","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":207,"name":"Grigori Perelman","sourceHeading":"Grigori Perelman","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Perelman proved the Poincaré conjecture and the wider geometrization conjecture for three-dimensional manifolds, building on Richard Hamilton's Ricci-flow program. His work established a landmark result in geometry and topology by controlling difficult singularities in the evolution of geometric structures. The achievement resolved one of the most famous open problems in mathematics.","year":1966,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Grigori Perelman","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":208,"name":"John Hammersley","sourceHeading":"John Hammersley","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Hammersley contributed to probability theory, percolation, stochastic processes and computational methods. He helped develop the systematic use of Monte Carlo simulation and studied the behavior of large random structures. His work was important in connecting abstract probability with statistical physics and practical calculation.","year":1920,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"John Hammersley","era":9,"death":2009,"endYear":2009,"lifespanApproximate":false},{"id":209,"name":"Edward Lorenz","sourceHeading":"Edward Lorenz","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Lorenz was a mathematical meteorologist whose simplified atmospheric equations revealed sensitive dependence on initial conditions. The Lorenz attractor became a defining example of deterministic chaos. His research demonstrated why even fully deterministic models can have severe practical limits on long-term prediction.","year":1917,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Edward Lorenz","era":9,"death":2008,"endYear":2008,"lifespanApproximate":false},{"id":210,"name":"Robert May","sourceHeading":"Robert May","group":"The twentieth century: foundations, analysis, topology and computation","biography":"Robert May applied nonlinear mathematical models to population dynamics and ecology. He showed how simple recurrence relations, including the logistic map, can exhibit stable behavior, oscillation and chaos as parameters change. His work helped introduce a wide scientific audience to the surprising behavior of nonlinear systems.","year":1936,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Robert May","era":10,"death":2020,"endYear":2020,"lifespanApproximate":false},{"id":211,"name":"Karen Uhlenbeck","sourceHeading":"Karen Uhlenbeck","group":"Late twentieth-century and contemporary mathematics","biography":"Uhlenbeck transformed geometric analysis, especially through her study of gauge theory, harmonic maps and partial differential equations. Her work on the regularity and compactness of solutions to nonlinear geometric equations became fundamental to modern geometry and mathematical physics. In 2019 she became the first woman awarded the Abel Prize.","year":1942,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Karen Uhlenbeck","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":212,"name":"Ingrid Daubechies","sourceHeading":"Ingrid Daubechies","group":"Late twentieth-century and contemporary mathematics","biography":"Daubechies made foundational contributions to wavelet theory, constructing families of wavelets with important mathematical and
