computational properties. Her work helped create practical tools for analyzing signals and images at different scales, with applications in data compression, scientific measurement and image processing.","year":1954,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Ingrid Daubechies","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":213,"name":"László Lovász","sourceHeading":"László Lovász","group":"Late twentieth-century and contemporary mathematics","biography":"Lovász is a leading figure in combinatorics and theoretical computer science. His work on graph theory, optimization and the mathematics of networks has introduced influential tools such as the Lovász local lemma and algorithms related to lattice reduction. His research helped demonstrate how discrete mathematics can connect elegant theoretical ideas with computational problems.","year":1948,"words":53,"weight":"standard","imageUrl":"","wikiTitle":"László Lovász","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":214,"name":"Endre Szemerédi","sourceHeading":"Endre Szemerédi","group":"Late twentieth-century and contemporary mathematics","biography":"Szemerédi proved that every subset of the positive integers with positive upper density contains arbitrarily long arithmetic progressions. This breakthrough became a cornerstone of additive combinatorics. His graph-theoretic regularity lemma also supplied a powerful general technique with applications across combinatorics and theoretical computer science.","year":1940,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Endre Szemerédi","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":215,"name":"Noga Alon","sourceHeading":"Noga Alon","group":"Late twentieth-century and contemporary mathematics","biography":"Alon has made major contributions to combinatorics, graph theory and theoretical computer science. His work on probabilistic methods, expanders and extremal problems helped expand the range of mathematical structures studied through randomness. He is also known for co-developing the polynomial method known as the Combinatorial Nullstellensatz.","year":1956,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Noga Alon","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":216,"name":"Peter Sarnak","sourceHeading":"Peter Sarnak","group":"Late twentieth-century and contemporary mathematics","biography":"Sarnak has contributed to number theory, spectral theory and the mathematics of automorphic forms. His work has brought together arithmetic, geometry and dynamics, particularly in questions involving eigenvalues and equidistribution. He has been an influential figure in modern analytic number theory.","year":1953,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Peter Sarnak","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":217,"name":"Richard Borcherds","sourceHeading":"Richard Borcherds","group":"Late twentieth-century and contemporary mathematics","biography":"Borcherds developed important connections among algebra, automorphic forms and mathematical physics. His work on generalized Kac-Moody algebras helped prove the monstrous moonshine conjectures, linking the monster finite simple group to modular functions. This remains one of the most remarkable bridges between apparently distant mathematical subjects.","year":1959,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Richard Borcherds","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":218,"name":"Ngô Bảo Châu","sourceHeading":"Ngô Bảo Châu","group":"Late twentieth-century and contemporary mathematics","biography":"Ngô Bảo Châu proved the fundamental lemma in the Langlands program, resolving a major obstacle in the comparison of trace formulas and representation theory. The proof drew on powerful ideas from algebraic geometry. His achievement greatly advanced a broad international program linking arithmetic and harmonic analysis.","year":1972,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Ngô Bảo Châu","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":219,"name":"Cédric Villani","sourceHeading":"Cédric Villani","group":"Late twentieth-century and contemporary mathematics","biography":"Villani made major contributions to optimal transport, kinetic equations and mathematical physics. His research clarified convergence toward equilibrium and the behavior of systems governed by nonlinear equations. He received the Fields Medal in 2010 for work involving these mathematical themes.","year":1973,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"Cédric Villani","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":220,"name":"Terence Tao","sourceHeading":"Terence Tao","group":"Late twentieth-century and contemporary mathematics","biography":"Tao is a remarkably versatile mathematician whose work spans harmonic analysis, partial differential equations, additive combinatorics and number theory. With Ben Green he proved that the primes contain arbitrarily long arithmetic progressions, a landmark result connecting combinatorial and analytic methods. His contributions to nonlinear equations, compressed sensing and many other problems exemplify the productivity of moving between mathematical disciplines. He is also an influential mathematical expositor.","year":1975,"words":66,"weight":"notable","imageUrl":"","wikiTitle":"Terence Tao","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":221,"name":"Manjul Bhargava","sourceHeading":"Manjul Bhargava","group":"Late twentieth-century and contemporary mathematics","biography":"Bhargava transformed aspects of algebraic number theory through new composition laws and methods for counting arithmetic objects. His work has produced major results on number fields and the arithmetic of elliptic curves. The elegance of his constructions helped open new directions in the study of polynomial equations and number-theoretic structures.","year":1974,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Manjul Bhargava","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":222,"name":"Maryam Mirzakhani","sourceHeading":"Maryam Mirzakhani (1977-2017)","group":"Late twentieth-century and contemporary mathematics","biography":"Mirzakhani made profound contributions to the geometry and dynamics of Riemann surfaces and their moduli spaces. She studied how geodesics behave on curved surfaces and developed remarkable formulas for volumes of moduli spaces, building connections to several other parts of geometry. Her later work with collaborators on dynamical properties of translation surfaces opened further deep directions. In 2014 she became the first woman awarded the Fields Medal. Her research combined geometric intuition with exceptionally sophisticated analysis.","year":1977,"words":76,"weight":"notable","imageUrl":"../../data/history/mirzakhani.webp","wikiTitle":"Maryam Mirzakhani","era":11,"death":2017,"endYear":2017,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Maryam_Mirzakhani_in_Seoul_2014.jpg","imageLicense":"CC BY-SA 2.0 de"},{"id":223,"name":"Artur Avila","sourceHeading":"Artur Avila","group":"Late twentieth-century and contemporary mathematics","biography":"Avila has made major contributions to dynamical systems and spectral theory. His work investigates how deterministic systems evolve and how their behavior changes with parameters, including transitions between regular and chaotic regimes. He received the Fields Medal in 2014 for his profound contributions to these areas.","year":1979,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Artur Avila","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":224,"name":"Martin Hairer","sourceHeading":"Martin Hairer","group":"Late twentieth-century and contemporary mathematics","biography":"Hairer developed the theory of regularity structures, providing a new mathematical framework for studying singular stochastic partial differential equations. His methods made it possible to give rigorous meaning to equations arising in random interfaces and statistical physics that had resisted earlier techniques. He received the Fields Medal in 2014.","year":1975,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Martin Hairer","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":225,"name":"Akshay Venkatesh","sourceHeading":"Akshay Venkatesh","group":"Late twentieth-century and contemporary mathematics","biography":"Venkatesh has made wide-ranging contributions to number theory and related areas, including arithmetic geometry, automorphic forms and homogeneous dynamics. His work links analytic and algebraic techniques and has produced important advances in understanding arithmetic structures. He received the Fields Medal in 2018.","year":1981,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Akshay Venkatesh","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":226,"name":"Peter Scholze","sourceHeading":"Peter Scholze","group":"Late twentieth-century and contemporary mathematics","biography":"Scholze introduced perfectoid spaces, creating new tools in arithmetic geometry that connect geometric and number-theoretic questions in characteristic zero and positive characteristic. His later work with collaborators on condensed mathematics has pursued new foundations for certain analytic constructions. He received the Fields Medal in 2018.","year":1987,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Peter Scholze","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":227,"name":"Alessio Figalli","sourceHeading":"Alessio Figalli","group":"Late twentieth-century and contemporary mathematics","biography":"Figalli works on optimal transport, partial differential equations and the calculus of variations. His research has advanced the regularity theory of transport maps and related geometric problems, with applications in analysis and mathematical physics. He received the Fields Medal in 2018.","year":1984,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Alessio Figalli","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":228,"name":"Hugo Duminil-Copin","sourceHeading":"Hugo Duminil-Copin","group":"Late twentieth-century and contemporary mathematics","biography":"Duminil-Copin has made major advances in probability and mathematical statistical physics, especially the theory of phase transitions and percolation. His work has resolved difficult questions about how large systems change from one statistical regime to another. He received the Fields Medal in 2022.","year":1985,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Hugo Duminil-Copin","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":229,"name":"June Huh","sourceHeading":"June Huh","group":"Late twentieth-century and contemporary mathematics","biography":"Huh has brought ideas from algebraic geometry into combinatorics, proving long-standing conjectures about matroids and log-concavity. His work shows how geometric structures can explain patterns in discrete counting problems. He received the Fields Medal in 2022.","year":1983,"words":36,"weight":"standard","imageUrl":"","wikiTitle":"June Huh","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":230,"name":"Maryna Viazovska","sourceHeading":"Maryna Viazovska","group":"Late twentieth-century and contemporary mathematics","biography":"Viazovska proved that the E8 lattice gives the densest packing of equal spheres in eight dimensions. Her extraordinarily elegant proof combined number theory, modular forms and Fourier analysis. She also contributed to the solution of the analogous problem in twenty-four dimensions with collaborators, and received the Fields Medal in 2022.","year":1984,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Maryna Viazovska","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":231,"name":"James Maynard","sourceHeading":"James Maynard","group":"Late twentieth-century and contemporary mathematics","biography":"Maynard has made influential breakthroughs in analytic number theory, particularly in understanding gaps between primes and the distribution of prime numbers. He developed methods that improved earlier results on bounded prime gaps and contributed to Diophantine approximation. He received the Fields Medal in 2022.","year":1987,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"James Maynard","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":232,"name":"Yitang Zhang","sourceHeading":"Yitang Zhang","group":"Late twentieth-century and contemporary mathematics","biography":"Zhang proved that there are infinitely many pairs of primes separated by a gap below a fixed finite bound, a major advance toward the twin-prime conjecture. His 2013 result inspired extensive further improvements by other researchers and reshaped work on small gaps between primes.","year":1955,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Yitang Zhang","era":10,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":233,"name":"Ciprian Manolescu","sourceHeading":"Ciprian Manolescu","group":"Late twentieth-century and contemporary mathematics","biography":"Manolescu works in topology and gauge-theoretic methods, particularly the study of three- and four-dimensional manifolds. His research has produced important results about triangulations and homology cobordism. His work illustrates the continuing interaction of topology with mathematical physics.","year":1978,"words":37,"weight":"standard","imageUrl":"","wikiTitle":"Ciprian Manolescu","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":234,"name":"Caucher Birkar","sourceHeading":"Caucher Birkar","group":"Late twentieth-century and contemporary mathematics","biography":"Birkar has made major contributions to birational algebraic geometry, especially the minimal model program and the classification of higher-dimensional algebraic varieties. His breakthroughs established important boundedness results and helped complete long-standing parts of the classification theory. He received the Fields Medal in 2018.","year":1978,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Caucher Birkar","era":11,"death":null,"endYear":2026,"lifespanApproximate":false},{"id":235,"name":"Maksym Radziwiłł","sourceHeading":"Maksym Radziwiłł","group":"Late twentieth-century and contemporary mathematics","biography":"Radziwiłł works in analytic number theory, especially the behavior of multiplicative functions and the values of the Riemann zeta function. His research with collaborators has clarified difficult questions about correlations and patterns in arithmetic functions. These results have opened new approaches to longstanding number-theoretic problems.","year":1986,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Maksym Radziwiłł","era":11,"death":null,"endYear":2026,"lifespanApproximate":false}],"eras":[{"start":-700,"end":0,"title":"Ancient geometry","subtitle":"From circles to proof"},{"start":0,"end":600,"title":"New mathematical worlds","subtitle":"Alexandria, India and China"},{"start":600,"end":1000,"title":"Algebra across cultures","subtitle":"Transmission and discovery"},{"start":1000,"end":1400,"title":"Medieval mathematics","subtitle":"From the Mediterranean to East Asia"},{"start":1400,"end":1600,"title":"Renaissance mathematics","subtitle":"A new language of number"},{"start":1600,"end":1700,"title":"The calculus century","subtitle":"Geometry, motion and infinite change"},{"start":1700,"end":1800,"title":"The age of analysis","subtitle":"Probability, mechanics and breadth"},{"start":1800,"end":1850,"title":"Algebraic revolutions","subtitle":"New structures and non-Euclidean spaces"},{"start":1850,"end":1900,"title":"Rigor and infinity","subtitle":"Functions, sets and modern geometry"},{"start":1900,"end":1930,"title":"Modern foundations","subtitle":"A new world of mathematical structures"},{"start":1930,"end":1960,"title":"The twentieth-century surge","subtitle":"Computing, topology and abstraction"},{"start":1960,"end":2000,"title":"Contemporary mathematics","subtitle":"New connections and new techniques"}]}</script>

function makeImg(p){let im=document.createElement('img');im.dataset.person=p.id;im.alt='';im.loading='lazy';im.src=imageFor(p);im.onerror=()=>imageError(p);return im}

function x(y){return LEFT+(y-BASE)*scale}function yr(pos){return BASE+(pos-LEFT)/scale}function fmt(y){return y<0?Math.abs(y)+tr(' av. n. è.',' BCE'):(y===0?'1'+tr(' de n. è.',' CE'):y+tr(' de n. è.',' CE'))}

const recommended=new Set(`Eudoxus of Cnidus|Euclid|Archimedes|Apollonius of Perga|Liu Hui|Aryabhata|Brahmagupta|Al-Khwarizmi|Omar Khayyam|Fibonacci|Leonardo Fibonacci|Madhava of Sangamagrama|François Viète|Isaac Newton|Gottfried Wilhelm Leibniz|Leonhard Euler|Joseph-Louis Lagrange|Pierre-Simon Laplace|Joseph Fourier|Carl Friedrich Gauss|Augustin-Louis Cauchy|Niels Henrik Abel|Carl Gustav Jacob Jacobi|Peter Gustav Lejeune Dirichlet|Évariste Galois|George Boole|Karl Weierstrass|Bernhard Riemann|Richard Dedekind|Sophus Lie|Georg Cantor|Sofia Kovalevskaya|Felix Klein|Henri Poincaré|David Hilbert|Felix Hausdorff|Henri Lebesgue|Élie Cartan|Emmy Noether|Srinivasa Ramanujan|Stefan Banach|Alfred Tarski|John von Neumann|Andrey Kolmogorov|Kurt Gödel|Alan Turing|Claude Shannon|André Weil|Paul Erdős|Laurent Schwartz|Shiing-Shen Chern|Alexander Grothendieck|Jean-Pierre Serre|Michael Atiyah|Benoît Mandelbrot|John Nash|John Milnor|Stephen Smale|John Horton Conway|Vladimir Arnold|Paul Cohen|Pierre Deligne|William Thurston|Robert Langlands|Mikhail Gromov|Maxim Kontsevich|Andrew Wiles|Grigori Perelman|Terence Tao|Maryam Mirzakhani|Peter Scholze|June Huh|Maryna Viazovska`.split('|'));
