/* Visitors should not see a hovered expansion on touch screens. */
@media(hover:none){.life:not(.selected):hover{width:var(--base-w)!important;filter:none}.life:not(.selected):hover .life-name,.life:not(.selected):hover .life-dates{opacity:0;visibility:hidden}.life:not(.selected):hover img{transform:none}}
@media(max-width:500px){.life{height:31px}.life img{width:31px;height:31px;flex-basis:31px}.life .lifeline{top:5px;height:21px}.life.compact:not(:hover):not(:focus-visible):not(.selected) .lifeline::after{border-top-width:11px;border-bottom-width:11px}.life .life-dates{left:40px;top:8px;font-size:10px}.life-name{top:-28px}.era-marker{top:93px}.century::after{top:116px}}
@media(prefers-reduced-motion:reduce){.life{transition:none}.life .lifeline{transition:none}}

/* Clean, quiet furniture: content and axis lead; controls support. */
.stagehead,.lower-controls,.help{display:none!important}
.sidebar:not(.open){box-shadow:none}
.nav-tab .vertical{font-size:9px;letter-spacing:.1em;opacity:.7}
.header{box-shadow:0 1px 4px #0002}
.life.full .lifeline{border-radius:999px}
.life.full .lifeline::after{content:none!important}
.life.compact:not(:hover):not(:focus-visible):not(.selected) .lifeline{border-radius:4px 0 0 4px}
/* Increase room for lives and reduce the attention paid to decorations. */
.surface{overflow:clip}
.paper-sketch{opacity:.10}
.era-marker{opacity:.75}
@media(max-width:500px){.nav-tab .vertical{letter-spacing:.04em}}
/* Prioritize all portraits first, then expand only the genuinely free intervals.
   Full bars carry the person's portrait and their name, not an empty band. */
.life{height:var(--life-height,33px);align-items:center;width:var(--base-w)}
.life img{width:var(--portrait-size,32px);height:var(--portrait-size,32px);flex:0 0 var(--portrait-size,32px)}
.life .lifeline{top:50%;height:calc(var(--portrait-size,32px)*.72);transform:translateY(-50%);left:calc(var(--portrait-size,32px)*.46);border-radius:999px}
.life.compact:not(:hover):not(:focus-visible):not(.selected) .lifeline{right:10px;border-radius:2px 0 0 2px}
.life.compact:not(:hover):not(:focus-visible):not(.selected) .lifeline::after{top:-1px;border-top-width:calc(var(--portrait-size,32px)*.36 + 1px);border-bottom-width:calc(var(--portrait-size,32px)*.36 + 1px)}
.life .life-inline{position:absolute;left:calc(var(--portrait-size,32px) + 6px);right:7px;top:50%;transform:translateY(-50%);z-index:4;color:#fff3d9;font:600 11px/1.1 'DM Sans',sans-serif;text-shadow:0 1px 3px #142d29c2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.life.compact:not(:hover):not(:focus-visible):not(.selected) .life-inline{display:none}
.life .life-dates{display:none!important}
.life.full .life-inline{display:block}
.life.full .life-name{display:none}
.life.compact:hover .life-name,.life.compact:focus-visible .life-name{opacity:1;visibility:visible}
.life.short-span .life-inline{font-size:10px}
.life.selected .life-inline{display:block}
.life.selected .life-name{display:none}
@media(hover:none){.life.compact:not(.selected):hover .life-inline{display:none}}

<script id="timeline-data" type="application/json">{"people":[{"id":0,"name":"Thales of Miletus","sourceHeading":"Thales of Miletus","group":"Antiquity and the Hellenistic world","biography":"Thales is traditionally associated with the beginnings of Greek deductive geometry, including elementary results about circles and triangles. Almost everything reported about his mathematical work comes from much later authors, so individual theorems cannot confidently be assigned to him. His place in history is as a figure around whom Greek traditions of mathematical reasoning were organized, rather than as a securely documented discoverer of particular proofs.","year":-624,"words":66,"weight":"notable","imageUrl":"","wikiTitle":"Thales of Miletus","era":0,"death":-546,"endYear":-546,"lifespanApproximate":true},{"id":1,"name":"Pythagoras","sourceHeading":"Pythagoras","group":"Antiquity and the Hellenistic world","biography":"Pythagoras founded a community whose members gave numbers and numerical relationships a central philosophical and mathematical role. The theorem bearing his name was known in other cultures long before his lifetime, and surviving evidence cannot establish that he personally proved it. The Pythagorean tradition nevertheless influenced Greek number theory, musical ratios and the search for mathematical order in nature.","year":-570,"words":59,"weight":"standard","imageUrl":"","wikiTitle":"Pythagoras","era":0,"death":-495,"endYear":-495,"lifespanApproximate":true},{"id":2,"name":"Hippocrates of Chios","sourceHeading":"Hippocrates of Chios","group":"Antiquity and the Hellenistic world","biography":"Hippocrates of Chios, a fifth-century BC geometer, investigated geometric areas and is remembered for demonstrating that certain curved regions, called lunes, have exactly computable areas. Ancient testimony also credits him with an early organized presentation of geometric knowledge. His work helped turn the problem of squaring curvilinear shapes into a subject of rigorous argument.","year":-470,"words":54,"weight":"standard","imageUrl":"","wikiTitle":"Hippocrates of Chios","era":0,"death":-410,"endYear":-410,"lifespanApproximate":true},{"id":3,"name":"Eudoxus of Cnidus","sourceHeading":"Eudoxus of Cnidus","group":"Antiquity and the Hellenistic world","biography":"Eudoxus developed a powerful theory of proportion applicable even to magnitudes without a common unit, overcoming difficulties posed by irrational quantities. He is associated with the method of exhaustion, which allows areas and volumes to be established through successively tighter geometric comparisons. Ideas preserved in Euclid's *Elements* became indispensable to Greek geometry and anticipate some reasoning later formalized in analysis.","year":-408,"words":60,"weight":"standard","imageUrl":"","wikiTitle":"Eudoxus of Cnidus","era":0,"death":-355,"endYear":-355,"lifespanApproximate":true},{"id":4,"name":"Euclid","sourceHeading":"Euclid","group":"Antiquity and the Hellenistic world","biography":"Euclid worked in Alexandria around 300 BC and is most closely associated with the thirteen books of the *Elements*. Rather than claiming to invent all its results, he assembled and reorganized generations of mathematics into a systematic progression from definitions and assumptions to carefully argued propositions. The work includes plane geometry, ratios, irrational magnitudes, number theory and solid geometry; among its enduring results are the infinitude of primes and the method now called the Euclidean algorithm. For more than two millennia the *Elements* influenced mathematical teaching and the ideal of a rigorous proof. Reliable information about Euclid's life is scarce, but his intellectual legacy is extraordinarily clear.","year":-325,"words":107,"weight":"landmark","imageUrl":"","wikiTitle":"Euclid","era":0,"death":-265,"endYear":-265,"lifespanApproximate":true},{"id":5,"name":"Archimedes","sourceHeading":"Archimedes","group":"Antiquity and the Hellenistic world","biography":"Archimedes of Syracuse was one of antiquity's most inventive mathematical thinkers. He calculated areas and volumes using extraordinarily refined geometric arguments, found the area of a parabolic segment, established relations between spheres and cylinders, and obtained rigorous bounds for π. His method of exhaustion controlled approximation rather than relying on guesswork. In *The Method*, he described how mechanical reasoning could suggest discoveries that then required mathematical proof. His studies of centers of gravity, levers, buoyancy and floating bodies made him a central figure in mathematical physics as well. Stories of ingenious machines and dramatic incidents have often overshadowed the depth of his surviving treatises, where creative intuition and exact demonstration work together.","year":-287,"words":112,"weight":"landmark","imageUrl":"","wikiTitle":"Archimedes","era":0,"death":-212,"endYear":-212,"lifespanApproximate":false},{"id":6,"name":"Apollonius of Perga","sourceHeading":"Apollonius of Perga","group":"Antiquity and the Hellenistic world","biography":"Apollonius transformed the study of conic sections in his monumental *Conics*. His systematic investigation of ellipses, parabolas and hyperbolas established a geometric language that would later become essential to astronomy, optics and analytic geometry. He showed how a single family of constructions could lead to many apparently different curves, a unifying achievement of Hellenistic mathematics.","year":-262,"words":55,"weight":"standard","imageUrl":"","wikiTitle":"Apollonius of Perga","era":0,"death":-190,"endYear":-190,"lifespanApproximate":true},{"id":7,"name":"Eratosthenes","sourceHeading":"Eratosthenes","group":"Antiquity and the Hellenistic world","biography":"Eratosthenes contributed to number theory, geography and mathematical astronomy. The sieve associated with his name gives a practical way to identify prime numbers, while his celebrated estimate of Earth's circumference used differences in solar angles and a measured distance. His work illustrates how geometric reasoning and numerical calculation could be combined to investigate the physical world.","year":-276,"words":56,"weight":"standard","imageUrl":"","wikiTitle":"Eratosthenes","era":0,"death":-194,"endYear":-194,"lifespanApproximate":false},{"id":8,"name":"Hipparchus","sourceHeading":"Hipparchus","group":"Antiquity and the Hellenistic world","biography":"Hipparchus used numerical tables and geometry to study celestial motions, helping to establish the foundations of trigonometry. Accounts associate him with tables of chords, the ancient predecessor of sine tables. He also worked on astronomical measurement and the prediction of eclipses, showing how quantitative mathematics could make observation more systematic.","year":-190,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Hipparchus","era":0,"death":-120,"endYear":-120,"lifespanApproximate":true},{"id":9,"name":"Heron of Alexandria","sourceHeading":"Heron of Alexandria","group":"Antiquity and the Hellenistic world","biography":"Heron wrote influential works on practical geometry, measurement and mechanical devices. He is best known mathematically for a formula that computes a triangle's area from the lengths of its three sides. His treatises connect theoretical results with surveying, engineering and calculation, and preserve valuable evidence about applied mathematics in antiquity.","year":10,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Hero of Alexandria","era":1,"death":75,"endYear":75,"lifespanApproximate":true},{"id":10,"name":"Menelaus of Alexandria","sourceHeading":"Menelaus of Alexandria","group":"Antiquity and the Hellenistic world","biography":"Menelaus developed geometry on the sphere, a subject of direct importance to astronomy. The theorem associated with his name connects ratios along a transversal cutting the sides of a triangle or its extensions, and has a spherical counterpart. His work formed part of the mathematical basis of later astronomical calculation.","year":70,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Menelaus of Alexandria","era":1,"death":140,"endYear":140,"lifespanApproximate":true},{"id":11,"name":"Ptolemy","sourceHeading":"Ptolemy","group":"Antiquity and the Hellenistic world","biography":"Ptolemy's *Almagest* organized ancient mathematical astronomy into a powerful predictive system using geometrical models and numerical tables. His chord table is an important landmark in trigonometry, and the theorem known by his name connects the sides and diagonals of cyclic quadrilaterals. Although his physical picture of the heavens was later superseded, the mathematical sophistication of his models shaped astronomical practice for centuries.","year":100,"words":62,"weight":"standard","imageUrl":"","wikiTitle":"Ptolemy","era":1,"death":170,"endYear":170,"lifespanApproximate":true},{"id":12,"name":"Diophantus of Alexandria","sourceHeading":"Diophantus of Alexandria","group":"Antiquity and the Hellenistic world","biography":"Diophantus wrote the *Arithmetica*, a collection of problems seeking numerical solutions to algebraic equations. His methods used specialized notation and ingenious substitutions, often pursuing rational solutions rather than unrestricted integer solutions. The book became an important source for early modern number theory, particularly through Fermat's annotations. The modern term “Diophantine equation” reflects his influence, although his exact dates remain uncertain.","year":200,"words":60,"weight":"standard","imageUrl":"","wikiTitle":"Diophantus","era":1,"death":284,"endYear":284,"lifespanApproximate":true},{"id":13,"name":"Pappus of Alexandria","sourceHeading":"Pappus of Alexandria","group":"Antiquity and the Hellenistic world","biography":"Pappus assembled and extended Greek geometric knowledge in his *Collection*, preserving work that might otherwise have disappeared. His writings discuss geometric analysis, loci and the theorem now called Pappus's hexagon theorem. He is particularly important as both a mathematician and a transmitter of techniques later rediscovered in projective and analytic geometry.","year":290,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Pappus of Alexandria","era":1,"death":350,"endYear":350,"lifespanApproximate":true},{"id":14,"name":"Hypatia of Alexandria","sourceHeading":"Hypatia of Alexandria","group":"Antiquity and the Hellenistic world","biography":"Hypatia taught mathematics, astronomy and philosophy in late antique Alexandria and was respected as a prominent intellectual. Ancient sources connect her with mathematical commentary and the scholarly tradition surrounding Diophantus and Apollonius, though the precise extent of her original writings is uncertain. Her life testifies to the continuity of Alexandrian mathematical culture, and her murder in 415 has made her a lasting symbol of the vulnerability of learning amid political and religious conflict.","year":355,"words":73,"weight":"notable","imageUrl":"","wikiTitle":"Hypatia","era":1,"death":415,"endYear":415,"lifespanApproximate":false},{"id":15,"name":"Liu Hui","sourceHeading":"Liu Hui","group":"Asian mathematical traditions, ancient to early modern","biography":"Liu Hui's commentary on *The Nine Chapters on the Mathematical Art* (263 AD) is one of the foundational works of Chinese mathematical reasoning. He explained why algorithms for areas, volumes, proportions and systems of equations worked, rather than merely presenting recipes. He approximated π by successively refining inscribed polygons and examined how solids could be decomposed and compared. His work reveals a sophisticated tradition of proof and mathematical explanation organized around practical problems.","year":220,"words":73,"weight":"notable","imageUrl":"","wikiTitle":"Liu Hui","era":1,"death":280,"endYear":280,"lifespanApproximate":true},{"id":16,"name":"Zu Chongzhi","sourceHeading":"Zu Chongzhi","group":"Asian mathematical traditions, ancient to early modern","biography":"Zu Chongzhi obtained remarkably accurate approximations of π, including the fraction 355/113, centuries before comparable precision became common elsewhere. He also contributed to astronomy and calendrical computation. Work attributed jointly to him and his son Zu Geng concerns the comparison of volumes, illustrating the depth of classical Chinese geometry.","year":429,"words":49,"weight":"standard","imageUrl":"","wikiTitle":"Zu Chongzhi","era":1,"death":500,"endYear":500,"lifespanApproximate":false},{"id":17,"name":"Aryabhata","sourceHeading":"Aryabhata","group":"Asian mathematical traditions, ancient to early modern","biography":"Aryabhata's *Aryabhatiya* of 499 united numerical methods, algebra, trigonometry and mathematical astronomy. It gave a notably accurate approximation of π, a table of sines and procedures for computational problems, including certain indeterminate equations. Its concise verses stimulated generations of commentary. Aryabhata demonstrates how astronomical questions fostered sophisticated mathematical technique in India.","year":476,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Aryabhata","era":1,"death":550,"endYear":550,"lifespanApproximate":true},{"id":18,"name":"Varahamihira","sourceHeading":"Varahamihira","group":"Asian mathematical traditions, ancient to early modern","biography":"Varahamihira synthesized mathematical astronomy and calendrical science in sixth-century India. His writings drew on several astronomical traditions and discussed computational methods used to predict celestial events. He was more of a synthesizer and astronomical scholar than an originator of a single major mathematical theory, but his work helped transmit and organize mathematical knowledge.","year":505,"words":53,"weight":"standard","imageUrl":"","wikiTitle":"Varahamihira","era":1,"death":587,"endYear":587,"lifespanApproximate":false},{"id":19,"name":"Brahmagupta","sourceHeading":"Brahmagupta","group":"Asian mathematical traditions, ancient to early modern","biography":"Brahmagupta's *Brahmasphutasiddhanta* (628) articulated influential rules for calculations involving zero, positive and negative numbers. He investigated quadratic and indeterminate equations, cyclic quadrilaterals and astronomical problems. Some rules, particularly division by zero, did not match modern arithmetic, but his systematic treatment of signed quantities and algebra contributed enormously to the history of computation. His work later circulated through Arabic-language scholarship.","year":598,"words":59,"weight":"standard","imageUrl":"","wikiTitle":"Brahmagupta","era":1,"death":668,"endYear":668,"lifespanApproximate":false},{"id":20,"name":"Bhaskara I","sourceHeading":"Bhaskara I","group":"Asian mathematical traditions, ancient to early modern","biography":"Bhaskara I explained and developed Aryabhata's mathematical astronomy. He is particularly remembered for an elegant rational approximation to the sine function and for lucid computational methods using place-value numeration. His commentaries helped make earlier mathematical ideas accessible to later Indian scholars.","year":600,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Bhaskara I","era":2,"death":680,"endYear":680,"lifespanApproximate":true},{"id":21,"name":"Mahavira","sourceHeading":"Mahavira","group":"Asian mathematical traditions, ancient to early modern","biography":"The ninth-century Indian mathematician Mahavira wrote the *Ganita Sara Samgraha*, a wide-ranging text on arithmetic, fractions, geometric measurement and combinatorial procedures. He organized problems and algorithms for teaching and practical computation. His work demonstrates the vitality of Indian mathematics beyond astronomical treatises.","year":800,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Mahavira","era":2,"death":870,"endYear":870,"lifespanApproximate":true},{"id":22,"name":"Sridhara","sourceHeading":"Sridhara","group":"Asian mathematical traditions, ancient to early modern","biography":"Sridhara contributed to Indian arithmetic and algebra, including rules for operations on numbers and methods for solving quadratic problems. His surviving and attributed works belong to a tradition that developed increasingly flexible computational procedures. The details of his life and the attribution of some texts remain uncertain.","year":870,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Sridhara","era":2,"death":930,"endYear":930,"lifespanApproximate":true},{"id":23,"name":"Bhaskara II (Bhaskaracharya)","sourceHeading":"Bhaskara II (Bhaskaracharya)","group":"Asian mathematical traditions, ancient to early modern","biography":"Bhaskara II wrote major works including *Lilavati* and *Bijaganita*, combining engaging problems with sophisticated arithmetic and algebra. He treated indeterminate equations through cyclic methods and investigated astronomical mathematics in the *Siddhanta Shiromani*. His work includes insights about changing quantities, but claims that he invented modern differential calculus should be avoided. He stands among the most influential mathematicians of medieval India.","year":1114,"words":60,"weight":"standard","imageUrl":"","wikiTitle":"Bhāskara II","era":3,"death":1185,"endYear":1185,"lifespanApproximate":false},{"id":24,"name":"Wang Xiaotong","sourceHeading":"Wang Xiaotong","group":"Asian mathematical traditions, ancient to early modern","biography":"Wang Xiaotong worked on practical geometry and numerical equations in seventh-century China. His *Jigu Suanjing* treated problems in surveying and construction that required solving cubic equations. It records an important stage in the development of Chinese numerical algebra.","year":580,"words":38,"weight":"standard","imageUrl":"","wikiTitle":"Wang Xiaotong","era":1,"death":626,"endYear":626,"lifespanApproximate":true},{"id":25,"name":"Jia Xian","sourceHeading":"Jia Xian","group":"Asian mathematical traditions, ancient to early modern","biography":"Jia Xian developed methods for extracting higher roots and manipulating polynomial coefficients. Later accounts preserve his use of a triangular arrangement of binomial coefficients and a procedure related to what is now called Horner's method. His contributions belong to the long history of Chinese polynomial computation.","year":1010,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Jia Xian","era":3,"death":1070,"endYear":1070,"lifespanApproximate":true},{"id":26,"name":"Qin Jiushao","sourceHeading":"Qin Jiushao","group":"Asian mathematical traditions, ancient to early modern","biography":"Qin Jiushao's *Mathematical Treatise in Nine Sections* (1247) contains advanced numerical methods for polynomial equations and problems involving simultaneous congruences. Its algorithms were capable of handling formidable calculations. He is a key figure in the history of Chinese algebra and computational number theory.","year":1202,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Qin Jiushao","era":3,"death":1261,"endYear":1261,"lifespanApproximate":false},{"id":27,"name":"Li Ye","sourceHeading":"Li Ye","group":"Asian mathematical traditions, ancient to early modern","biography":"Li Ye helped develop the *tian yuan shu*, a powerful method of representing an unknown and forming polynomial equations from geometric problems. His work shows how Chinese mathematicians expressed complex algebraic relationships in a systematic computational form.","year":1192,"words":37,"weight":"standard","imageUrl":"","wikiTitle":"Li Ye","era":3,"death":1279,"endYear":1279,"lifespanApproximate":false},{"id":28,"name":"Yang Hui","sourceHeading":"Yang Hui","group":"Asian mathematical traditions, ancient to early modern","biography":"Yang Hui wrote influential mathematical texts on calculation, geometry and combinatorics. He presented the triangular arrangement of binomial coefficients now widely associated with Pascal, as part of a much older tradition. He also investigated magic squares and methods for organizing numerical problems.","year":1238,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Yang Hui","era":3,"death":1298,"endYear":1298,"lifespanApproximate":true},{"id":29,"name":"Zhu Shijie","sourceHeading":"Zhu Shijie","group":"Asian mathematical traditions, ancient to early modern","biography":"Zhu Shijie's *Jade Mirror of the Four Unknowns* explored polynomial equations involving several unknown quantities. His methods reveal a remarkably sophisticated algebraic tradition in Yuan-era China. He also wrote a widely used introductory text that helped disseminate advanced mathematical calculation.","year":1260,"words":40,"weight":"standard","imageUrl":"","wikiTitle":"Zhu Shijie","era":3,"death":1320,"endYear":1320,"lifespanApproximate":true},{"id":30,"name":"Madhava of Sangamagrama","sourceHeading":"Madhava of Sangamagrama","group":"Asian mathematical traditions, ancient to early modern","biography":"Madhava is regarded as a founding figure of the Kerala school of mathematical astronomy. Results attributed to his tradition include infinite series for trigonometric functions and π, together with techniques for improving approximations. Much evidence survives through later writers rather than in manuscripts securely written by Madhava himself, so priority claims require care. Nonetheless, the Kerala tradition represents a major independent development in the history of infinite processes.","year":1340,"words":68,"weight":"notable","imageUrl":"","wikiTitle":"Madhava of Sangamagrama","era":3,"death":1425,"endYear":1425,"lifespanApproximate":true},{"id":31,"name":"Parameshvara","sourceHeading":"Parameshvara","group":"Asian mathematical traditions, ancient to early modern","biography":"Parameshvara, a scholar of the Kerala mathematical-astronomical tradition, made sustained observations and studied computational astronomy. His writings investigated astronomical constants and methods used in predicting planetary positions. He helped connect the mathematical innovations of Madhava's school to later authors.","year":1360,"words":39,"weight":"standard","imageUrl":"","wikiTitle":"Parameshvara","era":3,"death":1460,"endYear":1460,"lifespanApproximate":true},{"id":32,"name":"Nilakantha Somayaji","sourceHeading":"Nilakantha Somayaji","group":"Asian mathematical traditions, ancient to early modern","biography":"Nilakantha Somayaji's *Tantrasangraha* developed sophisticated mathematical astronomy within the Kerala school. He refined planetary models and participated in a tradition of trigonometric series and numerical analysis. His work reminds us that early modern advances in infinite series were not confined to Europe.","year":1444,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Nilakantha Somayaji","era":4,"death":1544,"endYear":1544,"lifespanApproximate":false},{"id":33,"name":"Seki Takakazu","sourceHeading":"Seki Takakazu","group":"Asian mathematical traditions, ancient to early modern","biography":"Seki Takakazu was a central figure in the Japanese *wasan* tradition. He investigated equations, elimination, determinants and numerical methods independently of contemporary European developments. He also studied Bernoulli numbers. His influence helped establish a distinctive and fertile school of Japanese mathematics.","year":1642,"words":41,"weight":"standard","imageUrl":"","wikiTitle":"Seki Takakazu","era":5,"death":1708,"endYear":1708,"lifespanApproximate":false},{"id":34,"name":"Takebe Katahiro","sourceHeading":"Takebe Katahiro","group":"Asian mathematical traditions, ancient to early modern","biography":"Takebe Katahiro extended Japanese computational mathematics and studied numerical approximations, including methods for finding π. As a successor to Seki Takakazu, he contributed to the development and teaching of *wasan*. His work illustrates how mathematical traditions evolve through collaboration and careful refinement of earlier methods.","year":1664,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Takebe Katahiro","era":5,"death":1739,"endYear":1739,"lifespanApproximate":false},{"id":35,"name":"Al-Khwarizmi","sourceHeading":"Al-Khwarizmi","group":"The medieval Islamic world and Central Asia","biography":"Al-Khwarizmi's treatise on algebra, written in ninth-century Baghdad, gave systematic procedures for solving linear and quadratic equations through operations such as restoration and balancing. He also contributed to the transmission and use of Hindu-Arabic numerals through arithmetical writings. The words *algebra* and *algorithm* reflect the extraordinary historical reach of his work. His methods belonged to a culture of exchange among Indian, Greek and Arabic-language mathematical traditions, while providing a distinct and durable framework for solving equations.","year":780,"words":76,"weight":"notable","imageUrl":"","wikiTitle":"Al-Khwarizmi","era":2,"death":850,"endYear":850,"lifespanApproximate":true},{"id":36,"name":"Thabit ibn Qurra","sourceHeading":"Thabit ibn Qurra","group":"The medieval Islamic world and Central Asia","biography":"Thabit ibn Qurra contributed to number theory, geometry and the translation and development of Greek mathematics. He found a rule for constructing certain pairs of amicable numbers and studied generalizations of classical geometric results. His scholarship helped make earlier mathematics available to new generations of researchers.","year":826,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Thabit ibn Qurra","era":2,"death":901,"endYear":901,"lifespanApproximate":false},{"id":37,"name":"Abu Kamil","sourceHeading":"Abu Kamil","group":"The medieval Islamic world and Central Asia","biography":"Abu Kamil extended the algebraic methods of al-Khwarizmi, working with more complicated equations and irrational quantities. His writings helped move algebra beyond a narrow set of numerical recipes toward a flexible discipline. They also influenced later Mediterranean mathematics, including work associated with Fibonacci.","year":850,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Abu Kamil","era":2,"death":930,"endYear":930,"lifespanApproximate":true},{"id":38,"name":"Abu al-Wafa al-Buzjani","sourceHeading":"Abu al-Wafa al-Buzjani","group":"The medieval Islamic world and Central Asia","biography":"Abu al-Wafa advanced trigonometric calculation and astronomical mathematics, including accurate tables and identities involving sine and tangent. His work illustrates the increasingly systematic and independent development of trigonometry within Islamic scientific traditions.","year":940,"words":32,"weight":"standard","imageUrl":"","wikiTitle":"Abu al-Wafa al-Buzjani","era":2,"death":998,"endYear":998,"lifespanApproximate":false},{"id":39,"name":"Al-Karaji","sourceHeading":"Al-Karaji","group":"The medieval Islamic world and Central Asia","biography":"Al-Karaji studied the arithmetic of powers and polynomials, helping separate algebraic operations from their earlier dependence on geometric illustrations. He investigated sums of powers and used forms of inductive reasoning. His work contributed to the maturation of algebra as a subject about general calculational structures.","year":953,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Al-Karaji","era":2,"death":1029,"endYear":1029,"lifespanApproximate":true},{"id":40,"name":"Ibn al-Haytham","sourceHeading":"Ibn al-Haytham","group":"The medieval Islamic world and Central Asia","biography":"Ibn al-Haytham is best known for optics, but mathematics was central to his investigations. He studied geometric problems involving reflection, developed sophisticated arguments about conics and sums of powers, and explored methods connected with optimization. His work shows how problems from the physical sciences can generate mathematical questions of independent importance. He was also an important critical reader of Greek geometry.","year":965,"words":61,"weight":"standard","imageUrl":"","wikiTitle":"Ibn al-Haytham","era":2,"death":1040,"endYear":1040,"lifespanApproximate":false},{"id":41,"name":"Al-Biruni","sourceHeading":"Al-Biruni","group":"The medieval Islamic world and Central Asia","biography":"Al-Biruni was a remarkably versatile scholar whose mathematics served astronomy, geodesy and geography. He used trigonometric arguments to estimate terrestrial distances and investigated methods of locating places on Earth. His work combined sophisticated calculations with a serious concern for measurement and evidence.","year":973,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Al-Biruni","era":2,"death":1048,"endYear":1048,"lifespanApproximate":false},{"id":42,"name":"Al-Samawal al-Maghribi","sourceHeading":"Al-Samawal al-Maghribi","group":"The medieval Islamic world and Central Asia","biography":"Al-Samawal developed polynomial techniques and methods for manipulating powers of unknown quantities. Building on al-Karaji, he worked toward increasingly general algebraic procedures. His writings offer important evidence of the gradual development of algebraic symbolism and operations.","year":1130,"words":36,"weight":"standard","imageUrl":"","wikiTitle":"Al-Samawal al-Maghribi","era":3,"death":1180,"endYear":1180,"lifespanApproximate":true},{"id":43,"name":"Omar Khayyam","sourceHeading":"Omar Khayyam","group":"The medieval Islamic world and Central Asia","biography":"Omar Khayyam classified cubic equations and investigated how their solutions could be constructed from intersections of conic sections. He also worked on Euclid's parallel postulate and mathematical astronomy. His geometrical treatment of algebraic problems was a remarkable achievement before general symbolic solutions to cubics became available.","year":1048,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Omar Khayyam","era":3,"death":1131,"endYear":1131,"lifespanApproximate":false},{"id":44,"name":"Sharaf al-Din al-Tusi","sourceHeading":"Sharaf al-Din al-Tusi","group":"The medieval Islamic world and Central Asia","biography":"Sharaf al-Din al-Tusi studied cubic equations and the conditions under which positive solutions exist. His investigations connected algebraic solving with the behavior and maxima of polynomial expressions, providing an important step toward a more qualitative study of equations.","year":1135,"words":38,"weight":"standard","imageUrl":"","wikiTitle":"Sharaf al-Din al-Tusi","era":3,"death":1213,"endYear":1213,"lifespanApproximate":true},{"id":45,"name":"Nasir al-Din al-Tusi","sourceHeading":"Nasir al-Din al-Tusi","group":"The medieval Islamic world and Central Asia","biography":"Nasir al-Din al-Tusi made substantial contributions to trigonometry and mathematical astronomy. His treatment of plane and spherical trigonometry helped establish the subject as a discipline that could be studied separately from astronomical applications. He also examined classical geometrical foundations, including the theory of parallels.","year":1201,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Nasir al-Din al-Tusi","era":3,"death":1274,"endYear":1274,"lifespanApproximate":false},{"id":46,"name":"Jamshid al-Kashi","sourceHeading":"Jamshid al-Kashi","group":"The medieval Islamic world and Central Asia","biography":"Al-Kashi was an exceptional numerical calculator and mathematical astronomer. He obtained highly accurate approximations of π and developed extensive methods involving decimal fractions, root extraction and trigonometric calculation. His writings display a sophisticated understanding of precision and numerical error, and document a high point of mathematics in fifteenth-century Central Asia.","year":1380,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Jamshid al-Kashi","era":3,"death":1429,"endYear":1429,"lifespanApproximate":true},{"id":47,"name":"Leonardo Fibonacci","sourceHeading":"Leonardo Fibonacci (c. 1170-c. 1250)","group":"Medieval Europe and the Renaissance","biography":"Leonardo of Pisa, commonly called Fibonacci, helped popularize Hindu-Arabic numerals and practical arithmetic in Latin Europe. His *Liber Abaci* (1202) explained methods useful for trade, currency exchange and calculation, alongside sophisticated recreational and algebraic problems. The rabbit-population example in that book eventually gave his name to the Fibonacci sequence, although related sequences were studied earlier in India. His importance lies especially in communicating mathematical methods across cultural boundaries.","year":1170,"words":68,"weight":"notable","imageUrl":"","wikiTitle":"Fibonacci","era":3,"death":1250,"endYear":1250,"lifespanApproximate":true},{"id":48,"name":"Jordanus de Nemore","sourceHeading":"Jordanus de Nemore","group":"Medieval Europe and the Renaissance","biography":"Jordanus de Nemore wrote influential medieval treatises on arithmetic, algebraic reasoning and mechanics. His works used systematic arguments to analyze numerical relations and problems involving weights. Much about his identity remains obscure, but the mathematical writings associated with his name influenced later scholastic traditions.","year":1225,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Jordanus de Nemore","era":3,"death":1260,"endYear":1260,"lifespanApproximate":true},{"id":49,"name":"Nicole Oresme","sourceHeading":"Nicole Oresme","group":"Medieval Europe and the Renaissance","biography":"Nicole Oresme investigated ratios, infinite series and the mathematical representation of changing quantities. His diagrams of varying intensities have often been compared with later coordinate graphs, and he offered an argument for the divergence of the harmonic series. He helped expand medieval mathematics beyond static figures into the analysis of variation.","year":1323,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Nicole Oresme","era":3,"death":1382,"endYear":1382,"lifespanApproximate":true},{"id":50,"name":"Regiomontanus","sourceHeading":"Regiomontanus","group":"Medieval Europe and the Renaissance","biography":"Regiomontanus was a leading fifteenth-century mathematical astronomer. His *De triangulis* provided a systematic treatment of plane and spherical trigonometry. Through research, teaching and printing, he helped make accurate mathematical methods available to Renaissance astronomers.","year":1436,"words":34,"weight":"standard","imageUrl":"","wikiTitle":"Regiomontanus","era":4,"death":1476,"endYear":1476,"lifespanApproximate":false},{"id":51,"name":"Luca Pacioli","sourceHeading":"Luca Pacioli","group":"Medieval Europe and the Renaissance","biography":"Luca Pacioli's *Summa de arithmetica* assembled and disseminated mathematical knowledge for merchants and students, including a famous exposition of double-entry bookkeeping. He also explored geometric proportion and its artistic applications. His historical importance is largely as a gifted organizer and communicator of mathematics rather than the sole originator of the techniques he described.","year":1447,"words":53,"weight":"standard","imageUrl":"","wikiTitle":"Luca Pacioli","era":4,"death":1517,"endYear":1517,"lifespanApproximate":false},{"id":52,"name":"Scipione del Ferro","sourceHeading":"Scipione del Ferro","group":"Medieval Europe and the Renaissance","biography":"Scipione del Ferro discovered a method for solving an important class of cubic equations in early sixteenth-century Italy. His result circulated privately rather than through a major publication, becoming part of the dramatic sequence of discoveries that led to Renaissance algebraic solutions of the cubic.","year":1465,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Scipione del Ferro","era":4,"death":1526,"endYear":1526,"lifespanApproximate":false},{"id":53,"name":"Niccolò Tartaglia","sourceHeading":"Niccolò Tartaglia","group":"Medieval Europe and the Renaissance","biography":"Niccolò Tartaglia independently developed methods for solving certain cubic equations and became a prominent teacher of practical mathematics. His disputes with Cardano over the disclosure and publication of the solution are an important episode in the history of mathematical priority. He also worked on arithmetic and ballistics.","year":1499,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Niccolò Tartaglia","era":4,"death":1557,"endYear":1557,"lifespanApproximate":false},{"id":54,"name":"Gerolamo Cardano","sourceHeading":"Gerolamo Cardano","group":"Medieval Europe and the Renaissance","biography":"Cardano's *Ars Magna* (1545) transformed European algebra by publishing methods for solving cubic and quartic equations. The work drew on discoveries by del Ferro, Tartaglia and Ferrari, whose roles must be acknowledged. Cardano's investigations also confronted expressions involving square roots of negative numbers, foreshadowing later work on complex numbers. His achievement was not simply a formula but a powerful synthesis that helped establish algebra as a field of systematic investigation.","year":1501,"words":70,"weight":"notable","imageUrl":"../../data/history/cardano.webp","wikiTitle":"Gerolamo Cardano","era":4,"death":1576,"endYear":1576,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Girolamo_Cardano._Stipple_engraving_by_R._Cooper._Wellcome_V0001004.jpg","imageLicense":"CC BY 4.0"},{"id":55,"name":"Lodovico Ferrari","sourceHeading":"Lodovico Ferrari","group":"Medieval Europe and the Renaissance","biography":"Lodovico Ferrari, a student of Cardano, discovered a general method for solving quartic equations by reducing them to cubic ones. His work completed a remarkable chapter in Renaissance algebra: the solution by radicals of polynomial equations through degree four. The methods were published in Cardano's *Ars Magna*.","year":1522,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Lodovico Ferrari","era":4,"death":1565,"endYear":1565,"lifespanApproximate":false},{"id":56,"name":"Rafael Bombelli","sourceHeading":"Rafael Bombelli","group":"Medieval Europe and the Renaissance","biography":"Rafael Bombelli gave unusually clear computational rules for expressions involving square roots of negative numbers in his *Algebra*. This was especially important because such expressions could arise as intermediate steps in the solution of cubic equations with real answers. His work made complex-number calculations more intelligible long before their modern geometric interpretation.","year":1526,"words":52,"weight":"standard","imageUrl":"","wikiTitle":"Rafael Bombelli","era":4,"death":1572,"endYear":1572,"lifespanApproximate":false},{"id":57,"name":"François Viète","sourceHeading":"François Viète","group":"Medieval Europe and the Renaissance","biography":"François Viète helped transform algebra into a general symbolic language. By using letters for known and unknown quantities, he made it easier to reason about equations as whole families rather than isolated numerical problems. His work on polynomial equations and trigonometry connected algebraic technique with geometry and astronomy. Although modern algebraic notation evolved gradually, Viète was a major architect of that transformation.","year":1540,"words":62,"weight":"standard","imageUrl":"","wikiTitle":"François Viète","era":4,"death":1603,"endYear":1603,"lifespanApproximate":false},{"id":58,"name":"Simon Stevin","sourceHeading":"Simon Stevin","group":"Medieval Europe and the Renaissance","biography":"Simon Stevin promoted decimal fractions and practical calculation at a time when they were not standard in European mathematics. His *De Thiende* explained how decimal arithmetic could simplify measurement and commerce. He also studied mechanics and mathematical applications, making numerical methods more accessible.","year":1548,"words":43,"weight":"standard","imageUrl":"","wikiTitle":"Simon Stevin","era":4,"death":1620,"endYear":1620,"lifespanApproximate":false},{"id":59,"name":"John Napier","sourceHeading":"John Napier","group":"Medieval Europe and the Renaissance","biography":"John Napier introduced logarithms as a method for turning difficult multiplications and divisions into simpler additions and subtractions. His tables transformed astronomical and navigational computation before electronic calculators. The concept was soon refined by others, but Napier's invention profoundly changed how large-scale numerical calculations were performed.","year":1550,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"John Napier","era":4,"death":1617,"endYear":1617,"lifespanApproximate":false},{"id":60,"name":"Johannes Kepler","sourceHeading":"Johannes Kepler","group":"Medieval Europe and the Renaissance","biography":"Kepler used mathematical models and precise astronomical observations to formulate the laws of planetary motion. He also investigated volumes of solids, packing questions and geometric patterns. His work was decisive for the emergence of mathematically formulated physical laws, even though his most famous discoveries belong jointly to astronomy and mathematical physics.","year":1571,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Johannes Kepler","era":4,"death":1630,"endYear":1630,"lifespanApproximate":false},{"id":61,"name":"Bonaventura Cavalieri","sourceHeading":"Bonaventura Cavalieri","group":"The seventeenth century","biography":"Cavalieri developed methods of comparing areas and volumes through collections of parallel sections, commonly called indivisibles. These arguments anticipated important aspects of integral calculus, although they lacked its later foundations. His work provided effective techniques for problems that resisted traditional geometric measurement.","year":1598,"words":42,"weight":"standard","imageUrl":"","wikiTitle":"Bonaventura Cavalieri","era":4,"death":1647,"endYear":1647,"lifespanApproximate":false},{"id":62,"name":"Girard Desargues","sourceHeading":"Girard Desargues","group":"The seventeenth century","biography":"Desargues was a pioneer of projective geometry. He investigated properties of configurations preserved under projection, helping mathematicians move beyond measurements of length and angle toward deeper relationships among lines and points. His influence was initially limited but became increasingly important in the nineteenth-century revival of projective geometry.","year":1591,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"Girard Desargues","era":4,"death":1661,"endYear":1661,"lifespanApproximate":false},{"id":63,"name":"René Descartes","sourceHeading":"René Descartes (1596-1650)","group":"The seventeenth century","biography":"Descartes's *La Géométrie* (1637) demonstrated how algebraic equations could be used to investigate geometric curves. This approach, alongside related independent work by Fermat, contributed to the development of analytic geometry. Descartes also developed influential methods for polynomial equations, signs of roots and the systematic manipulation of algebraic expressions. His broader philosophical program sought a reliable method of reasoning, but his lasting mathematical achievement was to help unite two previously distinct ways of studying space and number. The familiar modern Cartesian coordinate system was refined after his lifetime, so the historical credit belongs to a longer development.","year":1596,"words":96,"weight":"notable","imageUrl":"../../data/history/descartes.webp","wikiTitle":"René Descartes","era":4,"death":1650,"endYear":1650,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Frans_Hals_-_Portret_van_Ren%C3%A9_Descartes.jpg","imageLicense":"Public domain"},{"id":64,"name":"Pierre de Fermat","sourceHeading":"Pierre de Fermat (1601-1665)","group":"The seventeenth century","biography":"Fermat made foundational contributions to number theory, including work on sums of squares, properties of primes and the claim later known as Fermat's Last Theorem. He developed powerful techniques of infinite descent and communicated many results through correspondence rather than formal treatises. Alongside Pascal he helped initiate the mathematical study of probability; in geometry he independently developed methods connecting equations and curves, and approaches to tangents and extrema. The range and originality of his work made him one of the most influential mathematicians of the seventeenth century, despite the fragmentary form in which much of it survives.","year":1601,"words":97,"weight":"notable","imageUrl":"../../data/history/fermat.webp","wikiTitle":"Pierre de Fermat","era":5,"death":1665,"endYear":1665,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Pierre_de_Fermat.jpg","imageLicense":"Public domain"},{"id":65,"name":"Blaise Pascal","sourceHeading":"Blaise Pascal (1623-1662)","group":"The seventeenth century","biography":"Pascal was a precocious geometer whose work on conic sections included the celebrated theorem about a hexagon inscribed in a conic. He constructed a mechanical calculating machine and developed mathematical arguments about binomial coefficients and their triangular arrangement, known long before him in other cultures. His exchange of letters with Fermat about games of chance helped establish probability as a mathematical subject. Pascal also investigated problems related to what became integral calculus. His later philosophical and religious writings have sometimes overshadowed the extraordinary mathematical creativity of his relatively short scientific career.","year":1623,"words":91,"weight":"notable","imageUrl":"../../data/history/pascal.webp","wikiTitle":"Blaise Pascal","era":5,"death":1662,"endYear":1662,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Blaise_Pascal_Versailles,_circa_1690.JPG","imageLicense":"Public domain"},{"id":66,"name":"Christiaan Huygens","sourceHeading":"Christiaan Huygens (1629-1695)","group":"The seventeenth century","biography":"Huygens contributed to probability, geometry, mechanics and optics. His treatise on games of chance was an early systematic mathematical treatment of expected values, while his studies of pendulums led to profound results on cycloidal curves and isochronous motion. He also investigated evolutes and the geometry of curves. His work exemplifies the close relationship between mathematical theory and physical inquiry during the scientific revolution.","year":1629,"words":63,"weight":"standard","imageUrl":"../../data/history/huygens.webp","wikiTitle":"Christiaan Huygens","era":5,"death":1695,"endYear":1695,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Caspar_Netscher_-_Christiaan_Huygens,_the_astronomer,_1671.jpg","imageLicense":"Public domain"},{"id":67,"name":"John Wallis","sourceHeading":"John Wallis","group":"The seventeenth century","biography":"John Wallis contributed to infinite products and early calculus, including his famous product for π. He helped popularize the symbol ∞ for infinity and explored arithmetic and geometric techniques involving infinite processes. His writings influenced Newton and other mathematicians seeking systematic methods for quantities that vary continuously.","year":1616,"words":47,"weight":"standard","imageUrl":"","wikiTitle":"John Wallis","era":5,"death":1703,"endYear":1703,"lifespanApproximate":false},{"id":68,"name":"Isaac Newton","sourceHeading":"Isaac Newton (1642/43-1727)","group":"The seventeenth century","biography":"Newton developed one of the major independent forms of calculus, which he called the method of fluxions, to study changing quantities, tangents, areas and motion. His *Principia* (1687) combined rigorous mathematical argument with laws of motion and universal gravitation, showing that a common mathematical framework could explain both terrestrial and celestial phenomena. He also worked on the binomial theorem for general exponents, infinite series, numerical approximation and algebra. Newton's methods were not identical to those developed by Leibniz, and the bitter priority dispute between their supporters obscured the fact that both had made fundamental independent contributions. Together, Newton's mathematics and physics transformed the ambitions and methods of modern science.","year":1643,"words":109,"weight":"landmark","imageUrl":"../../data/history/newton.webp","wikiTitle":"Isaac Newton","era":5,"death":1727,"endYear":1727,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Portrait_of_Sir_Isaac_Newton,_1689_(brightened).jpg","imageLicense":"Public domain"},{"id":69,"name":"Gottfried Wilhelm Leibniz","sourceHeading":"Gottfried Wilhelm Leibniz (1646-1716)","group":"The seventeenth century","biography":"Leibniz independently developed differential and integral calculus and introduced much of the notation still used today, including the integral sign and differential symbols. His way of expressing infinitesimal change helped make calculus teachable, adaptable and widely applicable. Beyond analysis, he investigated binary arithmetic, combinatorics, logic and mechanical calculation. Leibniz viewed symbolic systems as tools for thought and imagined a general calculus of reasoning. Although the foundations of infinitesimals were clarified much later, his notation and conceptual approach became central to modern mathematics.","year":1646,"words":82,"weight":"notable","imageUrl":"../../data/history/leibniz.webp","wikiTitle":"Gottfried Wilhelm Leibniz","era":5,"death":1716,"endYear":1716,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Christoph_Bernhard_Francke_-_Bildnis_des_Philosophen_Leibniz_(ca._1695).jpg","imageLicense":"Public domain"},{"id":70,"name":"Jacob Bernoulli","sourceHeading":"Jacob Bernoulli (1655-1705)","group":"The seventeenth century","biography":"Jacob Bernoulli advanced calculus, infinite series and probability. His posthumously published *Ars Conjectandi* contained a fundamental form of the law of large numbers, linking theoretical probability to frequencies observed in repeated trials. He also investigated the curve later called the logarithmic spiral. Bernoulli's work helped turn the new calculus into a productive research discipline while developing probability beyond isolated games of chance.","year":1655,"words":62,"weight":"standard","imageUrl":"../../data/history/jacob-bernoulli.webp","wikiTitle":"Jacob Bernoulli","era":5,"death":1705,"endYear":1705,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Jakob_Bernoulli.jpg","imageLicense":"Public domain"},{"id":71,"name":"Johann Bernoulli","sourceHeading":"Johann Bernoulli (1667-1748)","group":"The seventeenth century","biography":"Johann Bernoulli was a gifted analyst and a powerful advocate of Leibnizian calculus. His famous brachistochrone challenge asked for the curve along which a particle descends in the shortest time and stimulated major advances toward the calculus of variations. His teaching and correspondence influenced Euler and several generations of European mathematicians.","year":1667,"words":51,"weight":"standard","imageUrl":"../../data/history/johann-bernoulli.webp","wikiTitle":"Johann Bernoulli","era":5,"death":1748,"endYear":1748,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Johann_Bernoulli2.jpg","imageLicense":"Public domain"},{"id":72,"name":"Guillaume de l'Hôpital","sourceHeading":"Guillaume de l'Hôpital","group":"The seventeenth century","biography":"L'Hôpital published the first widely circulated textbook of differential calculus in 1696. It presented techniques associated with Leibniz and Johann Bernoulli, including the rule that now bears l'Hôpital's name, which grew from Bernoulli's instruction. His chief historical contribution was to organize and communicate the new subject in a form readers could learn.","year":1661,"words":52,"weight":"standard","imageUrl":"","wikiTitle":"Guillaume de l'Hôpital","era":5,"death":1704,"endYear":1704,"lifespanApproximate":false},{"id":73,"name":"James Gregory","sourceHeading":"James Gregory","group":"The seventeenth century","biography":"James Gregory studied infinite series, geometry and methods related to calculus. He found series representations for inverse trigonometric functions and explored relationships between tangents and areas. His investigations contributed to the growing seventeenth-century toolkit for handling continuous change.","year":1638,"words":38,"weight":"standard","imageUrl":"","wikiTitle":"James Gregory","era":5,"death":1675,"endYear":1675,"lifespanApproximate":false},{"id":74,"name":"Isaac Barrow","sourceHeading":"Isaac Barrow","group":"The seventeenth century","biography":"Isaac Barrow investigated the geometry of curves and the connection between tangent problems and area problems. His lectures helped clarify ideas that soon became central to calculus, and he taught Newton at Cambridge. His work represents an important bridge between classical geometry and the analytic methods of the following generation.","year":1630,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Isaac Barrow","era":5,"death":1677,"endYear":1677,"lifespanApproximate":false},{"id":75,"name":"Brook Taylor","sourceHeading":"Brook Taylor","group":"The seventeenth century","biography":"Brook Taylor developed results on finite differences and series expansions, including the theorem now named after him. Taylor's formula became a fundamental tool for approximating functions near a chosen point, eventually acquiring a rigorous remainder theory. He also studied problems in mechanics and mathematical interpolation.","year":1685,"words":45,"weight":"standard","imageUrl":"","wikiTitle":"Brook Taylor","era":5,"death":1731,"endYear":1731,"lifespanApproximate":false},{"id":76,"name":"Abraham de Moivre","sourceHeading":"Abraham de Moivre","group":"The eighteenth century and the foundations of modern analysis","biography":"De Moivre was a major early contributor to probability and the mathematics of chance. His *Doctrine of Chances* studied games and approximation methods, including a normal approximation to the binomial distribution. The formula linking complex numbers and trigonometric functions that bears his name reflects his role in the development of complex analysis.","year":1667,"words":52,"weight":"standard","imageUrl":"","wikiTitle":"Abraham de Moivre","era":5,"death":1754,"endYear":1754,"lifespanApproximate":false},{"id":77,"name":"Thomas Bayes","sourceHeading":"Thomas Bayes","group":"The eighteenth century and the foundations of modern analysis","biography":"Thomas Bayes is associated with the theorem governing how conditional probabilities change when new evidence becomes available. His mathematical essay was published after his death through Richard Price, and later developments by Laplace and others greatly extended the subject. Reliable details of Bayes's mathematical life are limited, but the work became a starting point for a major tradition of statistical inference.","year":1701,"words":61,"weight":"standard","imageUrl":"","wikiTitle":"Thomas Bayes","era":6,"death":1761,"endYear":1761,"lifespanApproximate":false},{"id":78,"name":"Colin Maclaurin","sourceHeading":"Colin Maclaurin","group":"The eighteenth century and the foundations of modern analysis","biography":"Maclaurin made significant contributions to calculus, geometry and Newtonian mathematics. His *Treatise of Fluxions* gave a careful exposition of differential methods, while his studies of equilibrium figures and series developed important applications. The Maclaurin series is the Taylor expansion about zero, not a wholly separate invention.","year":1698,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Colin Maclaurin","era":5,"death":1746,"endYear":1746,"lifespanApproximate":false},{"id":79,"name":"Leonhard Euler","sourceHeading":"Leonhard Euler (1707-1783)","group":"The eighteenth century and the foundations of modern analysis","biography":"Euler was one of the most prolific and wide-ranging mathematicians in history. He made fundamental contributions to analysis, number theory, geometry, differential equations, mechanics and mathematical physics. His work clarified and popularized mathematical notation, including the modern function symbol and influential uses of constants and symbols. He established major results on infinite series, investigated the relationship between exponential and trigonometric functions, and transformed the study of ordinary differential equations. In number theory he extended Fermat's ideas, while his solution to the Königsberg bridges problem became a founding example of graph theory. Euler's polyhedron relation and his investigations of the calculus of variations show the extraordinary breadth of his imagination. More than isolated discoveries, he helped give eighteenth-century mathematics its language, methods and interconnected structure.","year":1707,"words":124,"weight":"landmark","imageUrl":"../../data/history/euler.webp","wikiTitle":"Leonhard Euler","era":6,"death":1783,"endYear":1783,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Leonhard_Euler_-_Jakob_Emanuel_Handmann_(Kunstmuseum_Basel).jpg","imageLicense":"Public domain"},{"id":80,"name":"Daniel Bernoulli","sourceHeading":"Daniel Bernoulli","group":"The eighteenth century and the foundations of modern analysis","biography":"Daniel Bernoulli applied mathematical reasoning to fluids, vibrating strings, probability and mechanics. His *Hydrodynamica* introduced influential ideas about fluid motion, while his work on expected utility addressed how people evaluate risk. His career exemplifies the productive interaction of analysis with physical and economic problems.","year":1700,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Daniel Bernoulli","era":6,"death":1782,"endYear":1782,"lifespanApproximate":false},{"id":81,"name":"Jean le Rond d'Alembert","sourceHeading":"Jean le Rond d'Alembert","group":"The eighteenth century and the foundations of modern analysis","biography":"D'Alembert was a central mathematician of the Enlightenment. He contributed to the theory of vibrating strings through the wave equation, investigated mechanics and worked on the foundations of calculus and algebra. The principle bearing his name recast problems of motion in a form suitable for mathematical analysis. His writings helped establish differential equations as a central language of mathematical physics.","year":1717,"words":60,"weight":"standard","imageUrl":"","wikiTitle":"Jean le Rond d'Alembert","era":6,"death":1783,"endYear":1783,"lifespanApproximate":false},{"id":82,"name":"Joseph-Louis Lagrange","sourceHeading":"Joseph-Louis Lagrange (1736-1813)","group":"The eighteenth century and the foundations of modern analysis","biography":"Lagrange profoundly reshaped mechanics and analysis. His *Mécanique analytique* expressed the laws of motion through a general mathematical framework rather than individual geometric diagrams, producing methods still fundamental in physics and engineering. He contributed to the calculus of variations, differential equations, number theory and the study of equations. His investigations of permutations of roots became an important precursor of group theory. Lagrange united abstract calculation with broad general principles, helping establish the power of analysis as a systematic mathematical language.","year":1736,"words":80,"weight":"notable","imageUrl":"../../data/history/lagrange.webp","wikiTitle":"Joseph-Louis Lagrange","era":6,"death":1813,"endYear":1813,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Lagrange_crop.jpg","imageLicense":"CC0"},{"id":83,"name":"Pierre-Simon Laplace","sourceHeading":"Pierre-Simon Laplace (1749-1827)","group":"The eighteenth century and the foundations of modern analysis","biography":"Laplace developed mathematical celestial mechanics and probability on an extraordinary scale. His *Mécanique céleste* applied analysis to the motions of planets and the stability of the solar system. He also investigated differential equations, potential theory, probability distributions and statistical inference, giving his name to the Laplace equation and the Laplace transform. His work illustrates how a mathematically precise model can connect scattered observations into a coherent predictive theory.","year":1749,"words":68,"weight":"notable","imageUrl":"","wikiTitle":"Pierre-Simon Laplace","era":6,"death":1827,"endYear":1827,"lifespanApproximate":false},{"id":84,"name":"Gaspard Monge","sourceHeading":"Gaspard Monge","group":"The eighteenth century and the foundations of modern analysis","biography":"Monge founded descriptive geometry as a systematic way to represent three-dimensional objects by planar projections. His teaching and work on differential geometry influenced engineering education and the study of surfaces. Through institutions he helped establish in revolutionary France, he also shaped the organization of mathematical instruction.","year":1746,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Gaspard Monge","era":6,"death":1818,"endYear":1818,"lifespanApproximate":false},{"id":85,"name":"Lazare Carnot","sourceHeading":"Lazare Carnot","group":"The eighteenth century and the foundations of modern analysis","biography":"Lazare Carnot contributed to geometry, mathematical mechanics and the theory of machines. His writings examined geometric transformations and the mathematical principles underlying mechanical systems. Better known for his political and military career during the French Revolution, he also took part in the broad effort to reorganize French scientific and engineering education.","year":1753,"words":51,"weight":"standard","imageUrl":"","wikiTitle":"Lazare Carnot","era":6,"death":1823,"endYear":1823,"lifespanApproximate":false},{"id":86,"name":"Adrien-Marie Legendre","sourceHeading":"Adrien-Marie Legendre","group":"The eighteenth century and the foundations of modern analysis","biography":"Legendre contributed to number theory, geometry, elliptic integrals and numerical mathematics. He published an influential geometry textbook, studied quadratic reciprocity and helped develop the method of least squares, also associated with Gauss. His investigations of prime numbers and special functions left enduring tools for later mathematicians.","year":1752,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"Adrien-Marie Legendre","era":6,"death":1833,"endYear":1833,"lifespanApproximate":false},{"id":87,"name":"Maria Gaetana Agnesi","sourceHeading":"Maria Gaetana Agnesi","group":"The eighteenth century and the foundations of modern analysis","biography":"Agnesi wrote an influential systematic exposition of calculus that helped make the rapidly developing subject accessible to students. Her *Instituzioni analitiche* combined algebraic and analytic methods in a major eighteenth-century textbook. The curve known as the “witch of Agnesi” became attached to her name through a translation mistake; her importance rests primarily on mathematical exposition and teaching.","year":1718,"words":57,"weight":"standard","imageUrl":"","wikiTitle":"Maria Gaetana Agnesi","era":6,"death":1799,"endYear":1799,"lifespanApproximate":false},{"id":88,"name":"Émilie du Châtelet","sourceHeading":"Émilie du Châtelet","group":"The eighteenth century and the foundations of modern analysis","biography":"Émilie du Châtelet studied mathematical physics and wrote a highly influential French translation and commentary on Newton's *Principia*. She worked to clarify the mathematical structure and philosophical implications of mechanics for eighteenth-century readers. Her place in a mathematicians' timeline is especially as an accomplished interpreter and transmitter of mathematical science.","year":1706,"words":50,"weight":"standard","imageUrl":"","wikiTitle":"Émilie du Châtelet","era":6,"death":1749,"endYear":1749,"lifespanApproximate":false},{"id":89,"name":"Sophie Germain","sourceHeading":"Sophie Germain (1776-1831)","group":"The eighteenth century and the foundations of modern analysis","biography":"Sophie Germain pursued advanced mathematics despite substantial barriers to women's participation in French scientific institutions. In number theory she contributed results relevant to Fermat's Last Theorem, particularly for a class of primes now bearing her name. Her work on the elasticity and vibration of plates developed mathematical methods in a difficult physical problem. She corresponded with Gauss and other major scholars, sometimes initially using a male pseudonym. Germain's achievements are valuable both for their mathematical content and for revealing how scientific institutions shaped whose work could be recognized.","year":1776,"words":88,"weight":"notable","imageUrl":"","wikiTitle":"Sophie Germain","era":6,"death":1831,"endYear":1831,"lifespanApproximate":false},{"id":90,"name":"Joseph Fourier","sourceHeading":"Joseph Fourier (1768-1830)","group":"The eighteenth century and the foundations of modern analysis","biography":"Fourier's study of heat conduction transformed analysis. His theory represented complicated temperature distributions through sums of sine and cosine waves and made partial differential equations into a powerful tool for describing physical processes. The method raised deep questions about what counts as a function and when an infinite series truly represents it-questions later generations were forced to clarify. Fourier series and transforms are now fundamental in signal processing, physics, engineering and mathematics. His legacy is a striking example of an applied problem opening an entirely new theoretical landscape.","year":1768,"words":88,"weight":"notable","imageUrl":"../../data/history/fourier.webp","wikiTitle":"Joseph Fourier","era":6,"death":1830,"endYear":1830,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Fourier2_-_restoration1.jpg","imageLicense":"Public domain"},{"id":91,"name":"Carl Friedrich Gauss","sourceHeading":"Carl Friedrich Gauss (1777-1855)","group":"The eighteenth century and the foundations of modern analysis","biography":"Gauss was a mathematician of exceptional depth whose work reshaped number theory, geometry, statistics, astronomy and mathematical physics. His *Disquisitiones Arithmeticae* (1801) organized number theory around congruences, quadratic reciprocity and systematic methods that became a foundation of the modern subject. He gave important treatments of polynomial equations, investigated complex numbers and helped establish rigorous approaches to geometry. His study of curved surfaces led to the *Theorema Egregium*, showing that Gaussian curvature can be determined from measurements made within the surface itself-a decisive result for differential geometry. In astronomy and geodesy, Gauss developed practical methods of estimation, computation and measurement, with work closely connected to least squares. He also contributed to probability, magnetism and potential theory. His private investigations touched ideas related to non-Euclidean geometry, although published priority belongs to those who developed and communicated the theory openly. What makes Gauss especially important is not merely the number of problems he solved, but the precision, generality and enduring fertility of the methods he introduced.","year":1777,"words":163,"weight":"landmark","imageUrl":"../../data/history/gauss.webp","wikiTitle":"Carl Friedrich Gauss","era":6,"death":1855,"endYear":1855,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Carl_Friedrich_Gauss_1840_by_Jensen.jpg","imageLicense":"Public domain"},{"id":92,"name":"Augustin-Louis Cauchy","sourceHeading":"Augustin-Louis Cauchy (1789-1857)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Cauchy was a key architect of modern mathematical analysis. He worked to make limits, continuity, convergence and differentiation more precise, replacing many informal calculations with explicit arguments. His contributions ranged from the theory of complex functions and contour integrals to differential equations, determinants and elasticity. The Cauchy integral theorem and related formulas became central results of complex analysis. Some of his definitions were still refined by later mathematicians, but his insistence on proof changed the standards of research and teaching across mathematics.","year":1789,"words":82,"weight":"notable","imageUrl":"../../data/history/cauchy.webp","wikiTitle":"Augustin-Louis Cauchy","era":6,"death":1857,"endYear":1857,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:French_School_-_Portrait_of_Augustin-Louis_Cauchy_(1789-1857).jpg","imageLicense":"Public domain"},{"id":93,"name":"Niels Henrik Abel","sourceHeading":"Niels Henrik Abel (1802-1829)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Abel proved that general polynomial equations of degree five cannot be solved by a formula involving only radicals, correcting earlier incomplete claims. He also made profound advances on elliptic functions and infinite series. Working under difficult circumstances and dying very young, he nevertheless helped reshape algebra and analysis. His results became foundational for later theories of equations and special functions.","year":1802,"words":60,"weight":"standard","imageUrl":"../../data/history/abel.webp","wikiTitle":"Niels Henrik Abel","era":7,"death":1829,"endYear":1829,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Niels_Henrik_Abel.jpg","imageLicense":"Public domain"},{"id":94,"name":"Carl Gustav Jacob Jacobi","sourceHeading":"Carl Gustav Jacob Jacobi","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Jacobi made fundamental advances in elliptic functions, differential equations and mechanics. His investigations of transformations and the mathematical formulation of motion produced methods used throughout analysis and physics. The Jacobi identity, Jacobian determinants and many other concepts reflect the remarkable range of his research.","year":1804,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Carl Gustav Jacob Jacobi","era":7,"death":1851,"endYear":1851,"lifespanApproximate":false},{"id":95,"name":"Peter Gustav Lejeune Dirichlet","sourceHeading":"Peter Gustav Lejeune Dirichlet","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Dirichlet established that any arithmetic progression with coprime initial term and difference contains infinitely many primes. His proof created a major new connection between number theory and analysis through what are now Dirichlet characters and L-functions. He also contributed to Fourier series, potential theory and the rigorous treatment of functions. His methods became central to analytic number theory.","year":1805,"words":58,"weight":"standard","imageUrl":"","wikiTitle":"Peter Gustav Lejeune Dirichlet","era":7,"death":1859,"endYear":1859,"lifespanApproximate":false},{"id":96,"name":"Évariste Galois","sourceHeading":"Évariste Galois (1811-1832)","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Galois changed the way mathematicians understand polynomial equations. Instead of seeking ever more elaborate formulas for roots, he studied the permutations of those roots that preserve algebraic relationships. This led to the theory of groups and to criteria for deciding when equations can be solved by radicals. His work, developed during a brief and turbulent life, was recognized fully only after his death. Galois theory became a model of a profound mathematical shift: solving a problem by uncovering the structure that governs it.","year":1811,"words":83,"weight":"notable","imageUrl":"../../data/history/galois.webp","wikiTitle":"Évariste Galois","era":7,"death":1832,"endYear":1832,"lifespanApproximate":false,"imageSource":"https://commons.wikimedia.org/wiki/File:Evariste_galois.jpg","imageLicense":"Public domain"},{"id":97,"name":"Nikolai Lobachevsky","sourceHeading":"Nikolai Lobachevsky","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Lobachevsky developed and published a consistent form of geometry in which Euclid's parallel postulate is replaced by a different assumption. His work showed that the familiar Euclidean description of space was not the only mathematically coherent geometry. This challenge transformed the foundations of geometry and prepared the way for modern investigations of curved spaces.","year":1792,"words":54,"weight":"standard","imageUrl":"","wikiTitle":"Nikolai Lobachevsky","era":6,"death":1856,"endYear":1856,"lifespanApproximate":false},{"id":98,"name":"János Bolyai","sourceHeading":"János Bolyai","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Bolyai independently developed non-Euclidean geometry and published his findings in an appendix to a work by his father. Together with Lobachevsky's independent research, his work demonstrated that the parallel postulate could be replaced without destroying a logical geometry. His achievement is a landmark in the recognition that mathematical spaces can obey different geometric laws.","year":1802,"words":54,"weight":"standard","imageUrl":"","wikiTitle":"János Bolyai","era":7,"death":1860,"endYear":1860,"lifespanApproximate":false},{"id":99,"name":"William Rowan Hamilton","sourceHeading":"William Rowan Hamilton","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Hamilton invented quaternions, a four-dimensional algebra that extends complex numbers and provides a powerful language for rotations. His research also transformed classical mechanics through Hamiltonian equations and variational principles. These ideas later became essential in mathematical physics, geometry and modern algebra. He stands out for connecting imaginative abstract structures with physical applications.","year":1805,"words":52,"weight":"standard","imageUrl":"","wikiTitle":"William Rowan Hamilton","era":7,"death":1865,"endYear":1865,"lifespanApproximate":false},{"id":100,"name":"George Green","sourceHeading":"George Green","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"George Green studied potential theory and introduced identities now fundamental to vector calculus and mathematical physics. His work helped turn problems involving electric and gravitational fields into questions about differential equations and boundary conditions. Despite limited formal mathematical education, he made contributions of lasting theoretical importance.","year":1793,"words":46,"weight":"standard","imageUrl":"","wikiTitle":"George Green","era":6,"death":1841,"endYear":1841,"lifespanApproximate":false},{"id":101,"name":"Joseph Liouville","sourceHeading":"Joseph Liouville","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Liouville contributed to differential equations, complex analysis, number theory and mechanics. Theorems bearing his name include a fundamental result about bounded entire functions and results on integrability. He also promoted and published earlier mathematical research, notably helping bring Galois's ideas to a wider audience.","year":1809,"words":44,"weight":"standard","imageUrl":"","wikiTitle":"Joseph Liouville","era":7,"death":1882,"endYear":1882,"lifespanApproximate":false},{"id":102,"name":"George Boole","sourceHeading":"George Boole","group":"The nineteenth century: rigor, algebra, geometry and new infinities","biography":"Boole developed an algebra of logic in which propositions could b
